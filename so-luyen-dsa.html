<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Sổ luyện DSA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: bàn làm việc 3 cột, nav dạng bài, danh sách theo nhóm kỹ thuật, phiếu bài đang làm. Trạng thái dùng ngôn ngữ verdict của online judge. */
:root{
  /* Tông sáng ấm theo mẫu: ba cột là ba thẻ trắng bo góc, cột danh sách màu kem, điểm nhấn cam. */
  --bg:#eef0f3;--panel:#ffffff;--sunk:#f3f4f6;--ink:#1f2328;--muted:#5f6672;--line:#e7e2d8;
  --accent:#b45309;--accent-soft:#fff1d6;--on-accent:#ffffff;
  --brand:#f59e0b;--brand-tint:#fff9ec;--brand-ink:#a14a0b;--rev:#1d4ed8;--rev-soft:#e6efff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06);
  --ac:#116b34;--ac-soft:#e3f6ea;--try:#b45309;--try-soft:#fff1d6;--re:#b42344;--re-soft:#f9dde4;
  --code-bg:#1f2328;--code-fg:#eef0f3;
  --sans:"Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif;--mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--panel:#181b21;--sunk:#20242c;--ink:#e8eaee;--muted:#a3a9b5;--line:#2c3038;
  --accent:#f5a524;--accent-soft:#3a2a0e;--on-accent:#1a1205;
  --brand:#f5a524;--brand-tint:#1d1a14;--brand-ink:#f7b955;--rev:#7aa7ff;--rev-soft:#17284a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --ac:#5ed3a0;--ac-soft:#12352a;--try:#f5a524;--try-soft:#3a2a0e;--re:#f48aa2;--re-soft:#3d1a24;
  --code-bg:#0b0d10;--code-fg:#e8eaee;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115;--panel:#181b21;--sunk:#20242c;--ink:#e8eaee;--muted:#a3a9b5;--line:#2c3038;
  --accent:#f5a524;--accent-soft:#3a2a0e;--on-accent:#1a1205;
  --brand:#f5a524;--brand-tint:#1d1a14;--brand-ink:#f7b955;--rev:#7aa7ff;--rev-soft:#17284a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --ac:#5ed3a0;--ac-soft:#12352a;--try:#f5a524;--try-soft:#3a2a0e;--re:#f48aa2;--re-soft:#3d1a24;
  --code-bg:#0b0d10;--code-fg:#e8eaee;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(300px,380px) minmax(0,1fr);height:100%}
.col{min-width:0;overflow-y:auto;padding-block:18px}
.nav{background:var(--panel);border-right:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px}
.list{border-right:1px solid var(--line);padding-inline:14px}
.detail{padding-left:28px;padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
.meter{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ac)}
.total{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px;font-variant-numeric:tabular-nums}
.navlabel{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
.navitem{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer}
.navitem:hover{background:var(--sunk)}
.navitem[aria-current="true"]{background:var(--accent-soft)}
.navitem b{font-weight:500;font-size:14px;line-height:1.35}
.navitem span{font-family:var(--mono);font-size:11.5px;color:var(--muted);align-self:center;font-variant-numeric:tabular-nums}
.navitem .meter{grid-column:1/-1;height:3px}
.source{font-size:12px;color:var(--muted);margin-top:18px}
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.tools input,.tools select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;font-size:14px}
.listhead{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.listhead h2{font-size:16px;margin:0;font-weight:700;text-wrap:balance}
.group{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px;cursor:pointer}
.row:hover{background:var(--sunk)}
.row[aria-current="true"]{background:var(--accent-soft)}
.row code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row b{font-weight:500;font-size:14px;line-height:1.35}
.dot{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;min-width:28px;text-align:center}
.st-none{color:var(--muted);background:var(--sunk)}
.st-try{color:var(--try);background:var(--try-soft)}
.st-ac{color:var(--ac);background:var(--ac-soft)}
.st-re{color:var(--re);background:var(--re-soft)}
.empty{color:var(--muted);font-size:14px;padding:18px 6px}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:12px}
.timer output{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;margin-right:auto}
.timer output.over{color:var(--re)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.sheet{max-width:760px}
.crumb{font-size:13px;color:var(--muted)}
.sheet h2{font-size:26px;line-height:1.2;margin:2px 0 8px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:16px}
.summary{font-size:16px;max-width:65ch;margin:0 0 14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed="true"].s-try{background:var(--try-soft);border-color:var(--try);color:var(--try);font-weight:600}
.seg button[aria-pressed="true"].s-ac{background:var(--ac-soft);border-color:var(--ac);color:var(--ac);font-weight:600}
.seg button[aria-pressed="true"].s-re{background:var(--re-soft);border-color:var(--re);color:var(--re);font-weight:600}
.seg button[aria-pressed="true"].s-none{background:var(--sunk);font-weight:600}
h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 13px;margin-bottom:20px;max-width:65ch}
summary{cursor:pointer;font-weight:500}
details p{margin:8px 0 2px}
.also{font-size:13.5px;color:var(--muted);margin:0 0 20px}
.also button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:13.5px}
textarea{display:block;width:100%;min-height:300px;resize:vertical;background:var(--code-bg);color:var(--code-fg);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:13px;line-height:1.5;tab-size:4}
.codebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.codebar h3{margin:0}
.codebar div{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.saved{font-size:12px;color:var(--muted)}
.spec{max-width:72ch;margin-bottom:22px}
.spec section{margin-bottom:18px}
.spec p{margin:0 0 7px;white-space:pre-wrap;overflow-wrap:anywhere}
.spec p.mono{font-family:var(--mono);font-size:13px;line-height:1.5;overflow-x:auto;white-space:pre}
.spec ul{margin:0;padding-left:20px;display:grid;gap:3px}
.spec sub,.spec sup{font-size:.72em;line-height:0}
.expanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:9px}
.expanes>div{min-width:0}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px}
.exhead h3{margin:0}
.excopy{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:12.5px;text-decoration:underline}
.expanes pre{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-family:var(--mono);font-size:13px;line-height:1.5;overflow:auto;max-height:340px}
.notebox{background:var(--try-soft);border-radius:8px;padding:9px 13px;font-size:14px}
.notebox p:last-child{margin-bottom:0}
.lesson section{max-width:72ch;margin-bottom:20px}
.lesson ul,.lesson ol{margin:0;padding-left:20px;display:grid;gap:4px}
.lesson li{overflow-wrap:anywhere}
.lesson sub,.lesson sup{font-size:.72em;line-height:0}
pre.code{margin:0 0 8px;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:12px;font-family:var(--mono);font-size:13px;line-height:1.5;overflow:auto;max-height:520px;tab-size:4}
.lcards{display:grid;gap:8px}
.lcard,.prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.lcard:hover,.prow:hover{background:var(--sunk)}
.lcard b{display:block;font-weight:600}
.lcard small{color:var(--muted);font-size:12.5px}
.plist{display:grid;gap:5px}
.prow{grid-template-columns:minmax(0,190px) minmax(0,1fr) auto;padding:7px 10px}
.prow b{font-weight:500;font-size:14px}
.pwhere{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;max-width:72ch;margin-top:8px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font:inherit}
.lrow b{font-weight:600}
.xrow{padding-left:18px}
.xrow code{color:var(--accent)}
details.sol{max-width:none}
@media (max-width:560px){.prow{grid-template-columns:1fr auto}.pwhere{grid-column:1/-1}}
.judge{margin-top:18px}
.judge-off{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 13px;font-size:14px;margin:0}
.judge-off code{font-family:var(--mono);font-size:13px}
.score{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.tcase{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 4px;font-family:var(--mono);font-size:11.5px;text-align:center;line-height:1.35;cursor:default}
.tcase b{display:block;font-size:12px}
.tcase span{color:var(--muted);font-variant-numeric:tabular-nums}
.tcase.v-AC{background:var(--ac-soft);border-color:var(--ac)}.tcase.v-AC b{color:var(--ac)}
.tcase.v-WA,.tcase.v-RE,.tcase.v-OLE,.tcase.v-CHK{background:var(--re-soft);border-color:var(--re);cursor:pointer}.tcase.v-WA b,.tcase.v-RE b,.tcase.v-OLE b,.tcase.v-CHK b{color:var(--re)}
.tcase.v-TLE{background:var(--try-soft);border-color:var(--try);cursor:pointer}.tcase.v-TLE b{color:var(--try)}
.tcase[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.jmsg{font-size:14px;margin:10px 0 0;overflow-wrap:anywhere}
.jpanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:10px}
.jpanes>div{min-width:0}
.jpanes h3{margin-bottom:3px}
.jlog,.jpanes pre{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-size:12px;line-height:1.45;overflow:auto;max-height:260px;white-space:pre}
.jlog{margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.back{display:none}
@media (max-width:980px){
  html,body{height:auto}
  .app{display:block;height:auto}
  .col{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .nav,.list{border-right:0;border-bottom:1px solid var(--line)}
  .navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 8px}
  .back{display:inline-block;margin-bottom:10px}
  body.reading .nav,body.reading .list{display:none}
  body:not(.reading) .detail{display:none}
}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .2s}}
/* Giao diện thẻ theo mẫu: đè lên các quy tắc phía trên. */
.app{gap:14px;padding:14px max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px))}
.col{background:var(--panel);border-radius:14px;box-shadow:var(--shadow)}
.nav,.list{border-right:0}
.nav{padding-left:16px;padding-right:12px}
.detail{padding-inline:26px}
.list{background:var(--brand-tint);padding-inline:12px}
h1{display:flex;align-items:center;gap:9px}
h1 svg,.navlabel svg{flex:none}
.navlabel{display:flex;align-items:center;gap:6px}
.navitem[aria-current="true"]{background:var(--accent-soft)}
.listhead h2{color:var(--brand-ink)}
.tools input,.tools select{border-radius:9px;border-color:var(--line);background:var(--panel)}
.group{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:13px;border-bottom-color:var(--line)}
.group::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none}
.row{border-radius:9px;border-left:4px solid transparent;padding:7px 8px}
.row:hover{background:var(--accent-soft)}
.row[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--brand)}
.row code{color:var(--ink)}
.st-re{color:var(--rev);background:var(--rev-soft)}
.meta{font-family:var(--sans);font-size:14px;gap:6px 18px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.seg{gap:8px}
.seg button{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:7px 14px;background:var(--panel);border:1px solid var(--line)}
.seg button:hover{background:var(--sunk)}
.seg button::before{content:"";width:9px;height:9px;border-radius:50%;flex:none}
.seg .s-none::before{width:5px;height:5px;background:var(--muted)}
.seg .s-try::before{background:var(--brand)}
.seg .s-re::before{background:var(--rev)}
.seg .s-ac::before{content:"✓";width:16px;height:16px;display:grid;place-items:center;background:var(--ac);color:var(--panel);font-size:11px;font-weight:700}
.seg button[aria-pressed="true"].s-try{background:var(--accent-soft);border-color:var(--brand);color:var(--ink)}
.seg button[aria-pressed="true"].s-re{background:var(--rev-soft);border-color:var(--rev);color:var(--ink)}
.seg button[aria-pressed="true"].s-ac{background:var(--ac-soft);border-color:var(--ac);color:var(--ac)}
.seg button[aria-pressed="true"].s-none{background:var(--sunk);border-color:var(--line)}
.btn{border-radius:9px}
.timer{border-radius:12px}
/* Tên tác giả ở góc phải trên cùng; dòng đường dẫn chừa chỗ để không bị đè. */
.author{position:fixed;top:calc(env(safe-area-inset-top,0px) + 24px);right:calc(env(safe-area-inset-right,0px) + 38px);z-index:5;background:var(--accent-soft);color:var(--brand-ink);border:1px solid var(--brand);border-radius:999px;padding:4px 13px;font-size:13px;font-weight:600;line-height:1.4;box-shadow:var(--shadow)}
.detail .crumb{padding-right:150px}
@media (max-width:980px){
  .author{position:static;display:block;width:fit-content;margin:10px max(10px,env(safe-area-inset-right,0px)) 0 auto}
  .detail .crumb{padding-right:0}
  .app{padding:10px}
  .col{margin-bottom:10px}
  .nav,.list{border-bottom:0}
}
</style>

<div class="author">Lê Đức Chính</div>
<div class="app">
  <nav class="col nav" aria-label="Các phần luyện tập">
    <h1><svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true"><path d="M1 3.2C4.6 1.6 8.7 1.6 12.3 3.4V21C8.7 19.3 4.6 19.3 1 20.9Z" fill="#f59e0b"/><path d="M25 3.2C21.4 1.6 17.3 1.6 13.7 3.4V21C17.3 19.3 21.4 19.3 25 20.9Z" fill="#fbbf24"/></svg>Sổ luyện DSA</h1>
    <p class="sub">Kho bài nhóm DSA PTIT, xếp theo dạng bài</p>

<script>
const GROUP="https://codeforces.com/group/TNf7raZKBu/contest/";
// [mã bài, tên, nhóm kỹ thuật, độ khó 1-3, time limit giây, tóm tắt, gợi ý]
const T=[
{k:"dq",name:"Đệ quy - Quay lui - Chia để trị",id:583176,p:[
["A","Liệt kê hoán vị","Sinh hoán vị & cấu hình",1,1,"In mọi hoán vị của 1..n có phần tử đầu là m, theo thứ tự từ điển.","Cố định m ở đầu, sinh hoán vị phần còn lại bằng quay lui hoặc next_permutation."],
["B","Xếp cuối hàng","Sinh hoán vị & cấu hình",1,1,"Cho n cái tên khác nhau và một người luôn đứng cuối. Liệt kê các cách xếp theo từ điển.","Bỏ người đó ra khỏi mảng, sắp xếp, hoán vị n-1 tên còn lại rồi in thêm tên đó ở cuối."],
["C","Chênh lệch hoán vị","Sinh hoán vị & cấu hình",1,1,"Trong các hoán vị của 1..n, in những hoán vị có tổng các hiệu số kề nhau (trước trừ sau) dương.","Tổng này rút gọn còn p[1] - p[n], nên chỉ cần kiểm tra p[1] > p[n]."],
["D","Liệt kê tập con","Sinh hoán vị & cấu hình",2,1,"Chọn đúng k số của mảng, giữ thứ tự, ghép thành xâu. In các xâu khác nhau theo từ điển.","Sinh tổ hợp chập k, ghép xâu rồi đưa vào set<string> để khử trùng và tự sắp xếp."],
["E","Tổng tập con","Sinh hoán vị & cấu hình",1,1,"Đếm số dãy con không rỗng có tổng đúng bằng S, với n ≤ 20.","Vét 2^n bằng quay lui hoặc bitmask. Chú ý S = 0 không được tính dãy rỗng."],
["H","Dãy ngoặc","Sinh hoán vị & cấu hình",1,1,"In số lượng và toàn bộ dãy ngoặc đúng độ dài 2n theo từ điển.","Quay lui với số ngoặc mở và đóng đã dùng. Thử '(' trước, chỉ đặt ')' khi đóng < mở."],
["M","Chia nhóm","Quay lui có cắt nhánh",2,1,"Chia mảng thành đúng k nhóm có tổng bằng nhau và in nhóm của từng phần tử.","Tổng phải chia hết cho k. Sắp giảm dần, gán từng phần tử vào nhóm chưa vượt tổng đích, bỏ qua các nhóm đang có cùng tổng."],
["N","Cân bằng","Quay lui có cắt nhánh",2,1,"Chia 12 người vào 4 góc, mỗi góc 3 người, để hiệu tổng khối lượng góc nặng nhất và nhẹ nhất nhỏ nhất.","Chỉ có 15400 cách chia khi bỏ thứ tự nhóm. Luôn lấy người chưa xếp đầu tiên làm thành viên đầu của nhóm mới để khỏi đếm trùng."],
["O","Chia kẹo","Quay lui có cắt nhánh",3,1,"Chia hết c kẹo cho n em, mỗi em có kẹo và số kẹo không tăng theo hàng. Đếm số cách và chỉ ra cách có chênh lệch nhỏ nhất.","Đây là phân hoạch c thành n phần dương không tăng. Quay lui với chặn trên là phần trước và phần còn lại phải đủ cho các em sau."],
["R","Tam giác ma thuật","Quay lui có cắt nhánh",3,3,"Xếp 1..n lên các vị trí của tam giác sao cho tổng mỗi cạnh bằng s. In mọi cấu hình theo từ điển rồi in số lượng, không có thì in -1.","Điền từng cạnh, khi điền xong một cạnh thì kiểm tra tổng ngay. Vị trí cuối của mỗi cạnh tính được từ s, nên bớt được một tầng thử."],
["F","Luỹ thừa ma trận","Chia để trị & luỹ thừa nhanh",2,1,"Tính ma trận a^k modulo 10^9+7 rồi in tổng hàng đầu tiên.","Nhân ma trận O(n³) kết hợp luỹ thừa nhị phân. Dùng long long khi nhân."],
["L1","Luỹ thừa (Ver. 1)","Chia để trị & luỹ thừa nhanh",1,2,"Tính a^b mod 10^9+7 cho nhiều test.","Luỹ thừa nhị phân O(log b). Lấy a mod trước để khỏi tràn."],
["L2","Luỹ thừa (Ver. 2)","Chia để trị & luỹ thừa nhanh",2,2,"Tính a^b mod c với a, b, c đến 10^18.","Tích hai số có thể vượt 64 bit, nên nhân qua __int128 hoặc phép nhân kiểu Ấn Độ."],
["L3","Luỹ thừa (Ver. 3)","Chia để trị & luỹ thừa nhanh",2,1,"Tính a^b; nếu kết quả hơn 6 chữ số thì chỉ in 6 chữ số cuối.","Làm việc mod 10^6 và giữ thêm cờ báo kết quả thật đã từng ≥ 10^6, để biết có phải in đủ số 0 ở đầu hay không."],
["P","Tổng cấp số nhân","Chia để trị & luỹ thừa nhanh",2,1,"Tính (a^0 + a^1 + … + a^n) mod m với m bất kỳ.","m không nguyên tố nên không dùng nghịch đảo được. Chia đôi tổng: S(2t+1) = S(t) · (1 + a^(t+1)), n chẵn thì tách một số hạng."],
["G","Xâu nhị phân","Đệ quy trên số & xâu",1,1,"Đổi số n sang hệ nhị phân cho nhiều test.","Đệ quy in n/2 rồi in n%2, xử lý riêng n = 0."],
["I","Bài toán tìm kiếm","Đệ quy trên số & xâu",1,1,"Cho j và k, tìm i ≤ j nhỏ nhất sao cho tổng a[i..j] ≤ k, không có thì -1.","Các số đều dương nên tổng đoạn giảm khi i tăng. Tìm kiếm nhị phân trên prefix sum."],
["J","Đếm ký tự a","Đệ quy trên số & xâu",2,1,"Dãy xâu kiểu Fibonacci, f0 = a, f1 = b. Đếm chữ a trong k ký tự đầu của f_n.","Lưu trước độ dài và số chữ a của từng f_i. Nếu k ≤ |f_{n-1}| thì đệ quy sang n-1, ngược lại cộng toàn bộ phần đó rồi đệ quy sang n-2."],
["K","Xâu LV","Đệ quy trên số & xâu",2,1,"f_i = f_{i-1} + (L hoặc V theo chẵn lẻ) + f_{i-2}. Tìm ký tự thứ k của f_n.","Lưu độ dài các f_i, xét k rơi vào nửa trái, ký tự giữa hay nửa phải rồi đệ quy."],
["Q","Xâu AB","Đệ quy trên số & xâu",2,2,"Xét các xâu có đúng a chữ a và b chữ b, tìm xâu nhỏ thứ k theo từ điển.","Số xâu bắt đầu bằng a là C(a-1+b, b). Nếu k không vượt quá số đó thì đặt a, ngược lại trừ đi rồi đặt b."]
]},
{k:"tl",name:"Tham lam - Vét cạn",id:583721,p:[
["A","Chọn lá bài","Sắp xếp rồi chọn",1,1,"Hai người lần lượt bốc bài. Tìm hiệu điểm lớn nhất có thể giữa hai người.","Người đi trước có nhiều nhất ⌈n/2⌉ lá. Sắp giảm dần, lấy tổng các lá lớn trừ tổng các lá còn lại."],
["C","Độ chênh lệch","Sắp xếp rồi chọn",1,1,"Chọn k phần tử để max - min nhỏ nhất.","Sau khi sắp xếp, k phần tử tốt nhất nằm liên tiếp. Trượt cửa sổ độ dài k."],
["E","Số dư lớn nhất","Sắp xếp rồi chọn",1,1,"Tìm giá trị lớn nhất của a_i % a_j với i ≠ j.","Với a_i < a_j thì a_i % a_j = a_i. Thử chứng minh đáp án là giá trị lớn thứ hai khác max, bằng 0 nếu mọi số bằng nhau."],
["F","Phân việc","Sắp xếp rồi chọn",1,1,"2n việc chia đều cho An và Bình, mỗi việc có thời gian riêng cho từng người. Tối thiểu tổng thời gian.","Sắp theo a_i - b_i. n việc có hiệu nhỏ nhất cho An, còn lại cho Bình."],
["I","Giá trị nhỏ nhất","Sắp xếp rồi chọn",2,1,"Được đổi chỗ tuỳ ý, tối thiểu tổng |a_i - a_{i+k}|, với k là ước thực sự của n.","Dãy tách thành k chuỗi độ dài n/k. Sau khi sắp xếp, mỗi chuỗi lấy một khối liên tiếp, chi phí mỗi chuỗi là đầu cuối của khối."],
["J","Khoảng cách nhỏ nhất","Sắp xếp rồi chọn",1,1,"Tìm điểm nguyên có tổng khoảng cách Manhattan tới n điểm nhỏ nhất.","Hai trục độc lập. Lấy trung vị của x và trung vị của y, dùng long long."],
["O","Túi xách du lịch","Sắp xếp rồi chọn",1,2,"Mỗi bạn xách tối đa 2 túi có tổng ≤ c. Tìm số bạn ít nhất.","Sắp xếp rồi dùng hai con trỏ: túi nặng nhất ghép với túi nhẹ nhất nếu được."],
["L","Bí kíp luyện rồng","Sắp xếp rồi chọn",3,1,"Có m phút. Lần đầu dùng kỹ năng i được s_i + e_i, các lần sau được e_i. Tối đa sức mạnh.","Chỉ lặp một kỹ năng có e lớn nhất. Sắp theo s+e giảm dần, với mỗi kỹ năng i làm kỹ năng lặp, tìm nhị phân số kỹ năng có s+e > e_i rồi ghép với phần lặp."],
["B","Ghép số","So sánh tuỳ biến & cấu trúc",1,1,"Ghép n số thành số lớn nhất.","Sắp bằng comparator so sánh hai cách ghép: a+b > b+a trên xâu."],
["P","Ba lá bài","So sánh tuỳ biến & cấu trúc",1,2,"Chọn 3 lá bất kỳ, ghép theo thứ tự tuỳ ý để được số lớn nhất.","Ba số lớn nhất cho nhiều chữ số nhất và không thua bộ cùng độ dài. Sắp 3 số đó bằng comparator ghép xâu."],
["D","Chặt gỗ","So sánh tuỳ biến & cấu trúc",2,1,"Chặt thanh dài L thành các miếng a_i, mỗi nhát tốn đúng độ dài thanh đang chặt. Tối thiểu chi phí.","Nghĩ ngược thành ghép miếng. Luôn ghép hai miếng nhỏ nhất bằng priority_queue, kiểu Huffman."],
["Q","Tinh thể","So sánh tuỳ biến & cấu trúc",2,2,"Đi qua dãy năng lượng, được lấy hoặc bỏ từng số, tổng hiện tại không được âm. Tối đa số phần tử lấy.","Lấy hết và đưa số âm vào min-heap. Khi tổng âm, bỏ số âm nhất đã lấy."],
["H","Trả lương cho lập trình viên","Vét cạn trên giá trị",2,1,"Chọn một mức lương chung. Mỗi người cho x, y hoặc z dòng code tuỳ lương so với [a_i, b_i]. Tối đa tổng.","Tổng chỉ đổi tại a_i và b_i + 1. Sắp sự kiện rồi quét, nhớ xét cả mức lương thấp hơn mọi a_i."],
["K","Tổng các chữ số","Vét cạn trên giá trị",2,2,"Tìm số lần +1 ít nhất để tổng chữ số của n ≤ s.","Chỉ cần thử làm tròn lên từng hàng 10^k. Với mỗi hàng, kiểm tra tổng chữ số của số mới, n tới 10^18 nên cẩn thận tràn."],
["G","Kích thước lớn nhất","Số dư & đếm",2,1,"Chọn tập con lớn nhất mà tổng hai phần tử bất kỳ không chia hết cho k.","Đếm theo số dư. Với cặp r và k-r chọn nhóm đông hơn, dư 0 và dư k/2 lấy tối đa 1 phần tử."],
["M","Biến đổi xâu","Xâu & trạng thái",2,2,"Được đổi A thành BB và BB thành A tuỳ ý. Tìm xâu nhỏ nhất theo từ điển.","C là vách ngăn. Trong mỗi đoạn, quy về số B (A = 2 B), rồi viết càng nhiều A càng tốt và thêm tối đa một B ở cuối."],
["N","Xâu ABC","Xâu & trạng thái",3,2,"Phân hoạch xâu thành ít dãy con nhất, mỗi dãy ghép lại là chuỗi các khối 3 ký tự chứa đủ A, B, C.","Đếm số A, B, C trên từng tiền tố. Đáp án là giá trị lớn nhất của (max - min) ba số đếm đó trên mọi tiền tố, và tối thiểu là 1. Công thức này khớp vét cạn với xâu ngắn nhưng chưa được chứng minh chặt."]
]},
{k:"ts",name:"Tìm kiếm nhị phân - Hai con trỏ",id:585374,p:[
["A","Tìm kiếm nhị phân","Tìm kiếm nhị phân cơ bản",1,2,"Trên mảng đã sắp: kiểm tra x có mặt, vị trí đầu, vị trí cuối của x.","Dùng lower_bound và upper_bound, hoặc tự viết để luyện tay."],
["K","Chuyện ăn kẹo","Tìm kiếm nhị phân cơ bản",1,1,"Mỗi truy vấn x: ăn ít nhất bao nhiêu viên để tổng đường ≥ x, không được thì -1.","Sắp giảm dần, lập prefix sum rồi lower_bound theo x."],
["L","Nhà máy sản xuất","Tìm kiếm nhị phân trên đáp án",1,1,"n máy, máy i mất a_i giây mỗi sản phẩm. Tối thiểu thời gian làm m sản phẩm.","Tìm nhị phân thời gian T, kiểm tra tổng T/a_i ≥ m. Dừng cộng sớm để không tràn."],
["M","Số chia hết thứ n","Tìm kiếm nhị phân trên đáp án",2,1,"Tìm số dương thứ n chia hết cho a hoặc b.","Số lượng ≤ x là x/a + x/b - x/lcm(a,b). Tìm nhị phân x."],
["N","Truy tìm ẩn số","Tìm kiếm nhị phân trên đáp án",2,1,"Tìm x nhỏ nhất để tổng số lẻ trong [1,x] lớn hơn hẳn tổng số chẵn trong [x+1,n].","Hai tổng có công thức O(1). Về trái tăng và về phải giảm theo x nên tìm nhị phân được."],
["O","Giải phương trình","Tìm kiếm nhị phân trên đáp án",1,1,"Tìm nghiệm của ax³ + bx = c, in 4 chữ số thập phân.","Hàm tăng đơn điệu khi a, b dương. Tìm nhị phân số thực khoảng 100 vòng trên đoạn [0, 100]."],
["P","Vị trí xuất phát","Tìm kiếm nhị phân trên đáp án",2,1,"Đặt m xe vào n vị trí để khoảng cách nhỏ nhất giữa hai xe là lớn nhất.","Sắp vị trí, tìm nhị phân khoảng cách d, kiểm tra bằng cách đặt xe tham lam từ trái."],
["Q","Phần tử trung vị","Tìm kiếm nhị phân trên đáp án",3,2,"Tìm bảng con r × c (r, c lẻ) có trung vị nhỏ nhất.","Tìm nhị phân giá trị v, đánh dấu ô ≤ v, dùng prefix sum 2D xem có bảng con nào chứa ít nhất (rc+1)/2 ô đánh dấu."],
["T","Trạm cứu hoả","Tìm kiếm nhị phân trên đáp án",2,2,"Đặt k trạm trên lưới n × m, tối thiểu khoảng cách Chebyshev d để phủ hết.","Mỗi trạm phủ hình vuông cạnh 2d+1. Tìm nhị phân d và kiểm tra ⌈n/(2d+1)⌉ · ⌈m/(2d+1)⌉ ≤ k."],
["R","Bảng số zig-zag","Tìm kiếm nhị phân trên đáp án",3,2,"Bảng vô hạn điền số theo từng đường chéo, mỗi đường đi từ cột 1 lên hàng 1 (xem hình trong đề gốc). Tìm giá trị tại (x,y) và vị trí của z.","Ô (x,y) nằm trên đường chéo d = x+y-1, có giá trị d(d-1)/2 + y. Chiều ngược lại: tìm nhị phân d nhỏ nhất có d(d+1)/2 ≥ z."],
["B","Merge Sort","Hai con trỏ trên hai mảng",1,2,"Trộn hai mảng đã sắp, số của a đứng trước khi bằng nhau, in mảng và xâu thứ tự trộn.","Hai con trỏ, ưu tiên a khi a[i] ≤ b[j]."],
["C","Số lượng nhỏ hơn","Hai con trỏ trên hai mảng",1,1,"Với mỗi b_i, đếm số phần tử a nhỏ hơn hẳn b_i. Hai mảng đã sắp.","Con trỏ trên a chỉ đi tới. Mảng tới 10^6 nên đọc nhập xuất nhanh."],
["D","Số cặp bằng nhau","Hai con trỏ trên hai mảng",1,1,"Đếm số cặp (i,j) có a_i = b_j trên hai mảng đã sắp.","Mỗi giá trị chung đóng góp tích độ dài hai nhóm bằng nhau. Dùng long long."],
["E","Đoạn con dài nhất có tổng nhỏ hơn hoặc bằng S","Cửa sổ trượt",1,1,"Tìm đoạn con dài nhất có tổng ≤ s.","Cửa sổ trượt: thêm phần tử bên phải, co trái khi tổng vượt s."],
["F","Số đoạn con có tổng nhỏ hơn hoặc bằng S","Cửa sổ trượt",1,1,"Đếm đoạn con có tổng ≤ s.","Mỗi r, sau khi co cửa sổ, có r-l+1 đoạn kết thúc tại r."],
["G","Đoạn con ngắn nhất có tổng lớn hơn hoặc bằng S","Cửa sổ trượt",1,1,"Tìm đoạn con ngắn nhất có tổng ≥ s, không có thì -1.","Mỗi r, co trái khi tổng còn ≥ s và cập nhật đáp án."],
["H","Số đoạn con có tổng lớn hơn hoặc bằng S","Cửa sổ trượt",1,1,"Đếm đoạn con có tổng ≥ s.","Lấy tổng số đoạn trừ số đoạn có tổng < s, hoặc đếm số vị trí l hợp lệ tại mỗi r."],
["I","Số đoạn con có không quá k phần tử khác nhau","Cửa sổ trượt",2,1,"Đếm đoạn con có tối đa k giá trị khác nhau.","Mảng đếm tần suất và số giá trị đang có. Mỗi r cộng r-l+1."],
["J","Số lượng đoạn con đặc biệt","Cửa sổ trượt",3,1,"Đếm đoạn con có max - min ≤ k.","Cửa sổ trượt với hai deque đơn điệu giữ max và min, hoặc multiset."],
["S","Xâu con đẹp","Cửa sổ trượt",2,2,"Đếm xâu con liên tiếp có đúng k ký tự khác nhau.","Đúng k = (tối đa k) - (tối đa k-1), dùng lại cách đếm của bài I."]
]},
{k:"qhd",name:"Quy hoạch động",id:583720,p:[
["A","Fibonacci","Nhập môn & mảng cộng dồn",1,1,"Tìm số Fibonacci thứ n với f0 = f1 = 1, n ≤ 92.","Tính trước một lần, kết quả vừa trong long long."],
["B","Tổng các thừa số","Nhập môn & mảng cộng dồn",2,1,"Tính tổng thừa số nguyên tố lớn nhất của mọi số trong [l,r].","Sàng lưu thừa số lớn nhất của từng số, rồi prefix sum để trả lời O(1)."],
["C","Giá trị nhị phân","Nhập môn & mảng cộng dồn",1,1,"Dãy bit ban đầu toàn 0, q lần đảo đoạn [l,r]. In dãy cuối cùng.","Mảng hiệu theo XOR: d[l] ^= 1, d[r+1] ^= 1, rồi cộng dồn."],
["D","Tung xúc xắc","Nhập môn & mảng cộng dồn",1,1,"Đếm số cách tạo tổng n từ các lần tung xúc xắc 6 mặt, có tính thứ tự.","dp[i] = tổng dp[i-1..i-6], modulo 10^9+7."],
["V","Đoạn con hoàn hảo","Nhập môn & mảng cộng dồn",2,2,"Đếm đoạn con có tổng bằng độ dài đoạn.","Thay a_i bằng a_i - 1, cần đoạn có tổng 0. Đếm cặp prefix bằng nhau bằng map."],
["T","Số cặp bạn tốt","Nhập môn & mảng cộng dồn",2,1,"Đếm cặp sinh viên cách nhau không quá k vị trí có tên cùng độ dài.","Cửa sổ trượt với mảng đếm theo độ dài tên. Mỗi người cộng số người cùng độ dài trong k vị trí trước."],
["K","Kỳ nghỉ mùa hè","QHD tuyến tính",1,1,"Mỗi ngày chọn 1 trong 3 hoạt động, không lặp hoạt động hai ngày liền. Tối đa độ hạnh phúc.","dp[i][hoạt động], lấy max từ hai hoạt động kia của ngày trước."],
["L","Nối cáp","QHD tuyến tính",2,1,"Nối các máy trên hàng để mỗi máy có ít nhất một dây. Tối thiểu độ dài.","Cạnh giữa i-1 và i: hoặc nối, hoặc bỏ nếu cạnh trước đã nối. dp[i] = min(dp[i-1], dp[i-2]) + d."],
["R","Xếp bò","QHD tuyến tính",2,1,"Đếm cách xếp n con bò sao cho giữa hai bò đực có ít nhất k bò cái, mod 20051608.","Vị trí i: bò cái thì f[i-1], bò đực thì f[i-k-1]. Chỉ số âm coi là 1."],
["Q","Dãy chia hết dài nhất","QHD tuyến tính",3,1,"Mảng là hoán vị của 1..n. Tìm dãy con dài nhất mà phần tử sau chia hết cho phần tử trước.","Duyệt theo vị trí, dp theo giá trị: khi xử lý v, cập nhật dp cho các bội của v. Tổng là chuỗi điều hoà O(n log n)."],
["I","Dãy con tăng dài nhất (Truy vết)","Dãy con & xâu con",1,1,"Tìm và in một dãy con tăng dài nhất.","dp O(n²) kèm mảng cha để truy vết với n = 5000."],
["E","Xâu con không giảm","Dãy con & xâu con",1,1,"Tìm độ dài dãy con không giảm dài nhất của xâu.","Chỉ có 26 chữ: best[c] = 1 + max(best[≤ c]), rất nhanh."],
["J","Xâu con chung dài nhất (Truy vết)","Dãy con & xâu con",1,1,"Tìm một xâu con chung dài nhất của hai xâu.","Bảng LCS 3000 × 3000, truy vết từ góc cuối."],
["W","Xâu con chung liên tiếp dài nhất","Dãy con & xâu con",1,1,"Tìm độ dài đoạn con liên tiếp chung dài nhất.","dp[i][j] = dp[i-1][j-1] + 1 nếu ký tự bằng, ngược lại 0. Dùng hai hàng cho nhẹ."],
["N","Số lượng xâu giống nhau","Dãy con & xâu con",3,1,"Đếm số cách xoá ký tự ở hai xâu để còn hai xâu khác rỗng giống nhau.","dp[i][j] = dp[i-1][j] + dp[i][j-1] - dp[i-1][j-1], cộng thêm dp[i-1][j-1] + 1 khi s[i] = t[j]."],
["Z","Xâu cha chung ngắn nhất (Truy vết)","Dãy con & xâu con",2,1,"Tìm xâu ngắn nhất chứa cả a và b như dãy con.","Lập bảng LCS, truy vết: ký tự chung in một lần, còn lại in từ xâu tương ứng."],
["F","Xâu nhị phân đối xứng","QHD trên đoạn",1,1,"Mỗi truy vấn kiểm tra đoạn [l,r] có đối xứng không, q tới 10^6.","pal[l][r] = s[l] == s[r] && pal[l+1][r-1], trả lời O(1)."],
["M","Số lượng xâu đối xứng","QHD trên đoạn",2,1,"Mỗi truy vấn đếm số xâu con đối xứng trong đoạn [l,r].","cnt[l][r] = cnt[l+1][r] + cnt[l][r-1] - cnt[l+1][r-1] + pal[l][r]."],
["X","Xâu con đối xứng dài nhất (Truy vết)","QHD trên đoạn",2,1,"Tìm một dãy con đối xứng dài nhất của xâu, không cần liên tiếp.","LCS của s với s đảo ngược, hoặc dp[l][r], rồi truy vết."],
["H","Giá trị lớn nhất","Cái túi & đồng xu",1,1,"Cái túi 0/1 cơ bản.","Mảng một chiều, duyệt sức chứa từ lớn về nhỏ."],
["Y","Bài toán cái túi (Truy vết)","Cái túi & đồng xu",2,2,"Cái túi 0/1, in thêm số món và chỉ số các món đã chọn.","Dùng bảng hai chiều (hoặc bitset đánh dấu đã lấy) rồi đi ngược từ món cuối."],
["O1","Chọn xu (Ver. 1)","Cái túi & đồng xu",1,1,"Đếm cách tạo tổng s, tính cả thứ tự.","Vòng ngoài theo tổng, vòng trong theo đồng xu."],
["O2","Chọn xu (Ver. 2)","Cái túi & đồng xu",1,1,"Đếm cách tạo tổng s, không tính thứ tự.","Đổi vòng: ngoài theo đồng xu, trong theo tổng tăng dần."],
["P","Tổng dãy con","Cái túi & đồng xu",1,1,"In tất cả tổng có thể của dãy con theo thứ tự tăng.","Bitset hoặc dp bool tới tổng 10^5: bs |= bs << a_i."],
["U","Thay đổi dãy số","Cái túi & đồng xu",3,2,"Mỗi thao tác a_i += ⌊a_i/x⌋, tối đa k thao tác. Được c_i xu nếu a_i đạt b_i. Tối đa xu.","Tính trước số bước ít nhất đổi 1 thành mỗi giá trị bằng BFS/dp, rồi cái túi với sức chứa min(k, tổng số bước)."],
["G","Đường đi trên lưới","QHD trên bảng",1,1,"Đếm đường từ (1,1) đến (n,n), chỉ đi xuống và sang phải, tránh bẫy.","dp[i][j] = dp[i-1][j] + dp[i][j-1], ô bẫy bằng 0, mod 10^9+7."],
["S","Hình vuông lớn nhất","QHD trên bảng",2,1,"Tìm cạnh hình vuông toàn số 1 lớn nhất và số hình vuông như vậy.","dp[i][j] = 1 + min(trên, trái, chéo) nếu ô là 1. Đếm số ô đạt max."]
]},
{k:"nx",name:"Ngăn xếp - Hàng đợi",id:583183,p:[
["A","Biểu thức Tiền tố","Biểu thức",1,1,"Tính giá trị biểu thức tiền tố.","Duyệt từ phải sang trái, toán hạng vào stack, gặp toán tử lấy hai số."],
["B","Biểu thức Hậu tố","Biểu thức",1,1,"Tính giá trị biểu thức hậu tố.","Duyệt từ trái sang phải với stack. Số lấy ra đầu tiên là vế phải."],
["C","Tiền tố và Hậu tố","Biểu thức",2,1,"Xâu có thể là tiền tố hoặc hậu tố, hãy tính giá trị. Toán hạng có thể âm, nhiều chữ số.","Token đầu là toán tử thì tiền tố. Phân biệt '-' với số âm như '-10' bằng độ dài token."],
["I","Hợp chất hữu cơ","Biểu thức",2,1,"Tính khối lượng phân tử từ công thức có ngoặc và hệ số (C, H, O).","Stack các tổng theo mức ngoặc. Gặp ')' đóng tổng, số ngay sau sẽ nhân tổng hoặc nguyên tử vừa rồi."],
["L","Giải mã","Biểu thức",2,2,"Mô phỏng gõ phím với backspace, trái, phải. In xâu cuối.","Hai stack quanh con trỏ, hoặc std::list với iterator. Thao tác O(1)."],
["E","Đánh số cặp ngoặc","Dãy ngoặc",1,1,"Đánh số các cặp ngoặc theo thứ tự xuất hiện của ngoặc mở.","Gặp '(' tăng bộ đếm và đẩy số. Gặp ')' lấy số trên đỉnh."],
["Q","Dãy ngoặc đúng và ký tự sao","Dãy ngoặc",1,2,"Đếm số cặp ngoặc tương ứng bao quanh dấu *.","Bỏ * rồi ghép ngoặc bằng stack. Đếm các cặp khớp nhau có ngoặc mở đứng trước * và ngoặc đóng đứng sau *."],
["R","Dãy ngoặc đúng bậc K","Dãy ngoặc",3,2,"Đếm xâu con liên tiếp là dãy ngoặc đúng bậc k. Xâu giống hệt nhau chỉ tính một lần.","Với mỗi l, mở rộng r, giữ cân bằng và độ sâu lớn nhất. Khi cân bằng 0 và độ sâu = k, đưa xâu vào set để khử trùng (ví dụ mẫu đang đếm theo nội dung)."],
["F","Thu gọn dãy số","Stack đơn điệu",1,1,"Được xoá hai số kề nhau có tổng chẵn. Tối thiểu số phần tử còn lại.","Stack: nếu cùng tính chẵn lẻ với đỉnh thì pop, ngược lại push."],
["M","Số bước nhảy","Stack đơn điệu",2,1,"Từ cột x, nhảy đến cột gần nhất bên phải cao hơn. Đếm số bước cho mỗi truy vấn.","Dùng stack tìm phần tử lớn hơn tiếp theo, rồi jump[i] = jump[next[i]] + 1 từ phải sang."],
["J","Dãy con liên tục","Stack đơn điệu",3,1,"Tính tổng giá trị lớn nhất của mọi dãy con liên tục.","Đóng góp của a_i = a_i · (số đoạn mà i là max). Tìm biên bằng stack đơn điệu, một bên nghiêm ngặt một bên không để khỏi đếm trùng."],
["O","Hình chữ nhật lớn nhất","Stack đơn điệu",3,1,"Tìm hình chữ nhật toàn số 1 có diện tích lớn nhất, in hai cạnh.","Với mỗi hàng, lập histogram chiều cao rồi dùng stack. Khi hoà diện tích, chọn hình có hai cạnh chênh nhau ít nhất và in cạnh nhỏ trước."],
["P","Tổng lớn nhất của dãy con","Stack đơn điệu",2,1,"Tìm dãy con liên tiếp có tổng lớn nhất với độ dài trong [u,v].","Prefix sum. Với r, cần min pre[l] trong cửa sổ độ dài v-u+1, giữ bằng deque đơn điệu."],
["D","Hai nút bấm","Hàng đợi & BFS trên số",1,1,"Biến n thành m bằng ×2 hoặc -1 với ít thao tác nhất.","BFS trên số, chặn giá trị tới khoảng 2·max(n,m). Cũng làm được bằng tham lam ngược từ m."],
["H","Số Thập Cẩm","Hàng đợi & BFS trên số",2,2,"Tìm số nhỏ thứ n có tổng chữ số bằng 10.","Sinh trước bằng queue, thêm chữ số vào cuối khi tổng còn ≤ 10. Thứ tự BFS là thứ tự tăng."],
["N","Số may mắn đặc biệt","Hàng đợi & BFS trên số",2,1,"Tìm số dạng 8…86…6 nhỏ nhất, tối đa 200 chữ số, chia hết cho n. Không có thì -1.","Vét số chữ số 8 và 6, tính dư bằng modulo trong khi xây. Ưu tiên độ dài ngắn, rồi ít chữ 8 hơn."],
["K","Phân tích số","Hàng đợi & BFS trên số",2,1,"Từ n, thay mọi phân tích u·v thành (u-1)(v+1) và lặp. In tất cả số gặp được.","Giá trị mới luôn nhỏ hơn n. BFS/DFS trên số với set đánh dấu, duyệt ước đến căn n."],
["G","Tính tổng chi phí","Hàng đợi & BFS trên số",2,1,"Mỗi bước gộp k số nhỏ nhất thành tổng của chúng, chi phí là max - min. In số cuối và tổng chi phí.","Mô phỏng bằng min-heap, dùng long long. Các số lấy ra đã theo thứ tự nên max là số lấy sau cùng."]
]},
{k:"dt",name:"Đồ thị - Đường đi ngắn nhất",id:583184,p:[
["A","Hồ nước","Duyệt & liên thông",1,1,"Trong k ô ngập trên lưới, tìm hồ liền cạnh có diện tích lớn nhất.","DFS/BFS loang trên lưới 4 hướng."],
["C","Bổ sung cạnh","Duyệt & liên thông",1,1,"Thêm đúng một cạnh để đỉnh 1 đi tới được nhiều đỉnh nhất.","Đáp án = kích thước thành phần của 1 cộng thành phần lớn nhất còn lại."],
["F","Thư viện thành phố","Duyệt & liên thông",1,1,"Xây thư viện để từ mọi thành phố đều đến được một thư viện. Tối thiểu chi phí.","Mỗi thành phần liên thông lấy thành phố rẻ nhất."],
["G","Lối thoát hiểm","Duyệt & liên thông",1,1,"Tìm thời gian ngắn nhất từ mọi phòng đến phòng thoát hiểm gần nhất.","BFS đa nguồn: đưa tất cả phòng thoát hiểm vào hàng đợi với d = 0."],
["D","Điểm nghẽn giao thông","Cầu, khớp & SCC",2,1,"Đếm các đỉnh z mà mọi đường từ x đến y đều đi qua z.","n ≤ 100 nên thử bỏ từng z khác x, y rồi BFS từ x xem còn tới y không."],
["B","Vương quốc ánh sáng","Cầu, khớp & SCC",2,1,"Đếm số cầu nối mà phá đi làm tăng số thành phần liên thông.","Đây là đếm cạnh cầu: Tarjan low-link, hoặc thử xoá từng cạnh vì n ≤ 100."],
["E","Số lần duyệt ít nhất","Cầu, khớp & SCC",3,1,"Đồ thị có hướng. Tìm số lần duyệt ít nhất, mỗi lần tự chọn đỉnh đầu, để qua hết mọi đỉnh.","Nén thành phần liên thông mạnh, đáp án là số thành phần có bậc vào 0 trên đồ thị nén."],
["H","Bình thông nhau","DSU",1,1,"Truy vấn mở van nối hai thùng và kiểm tra hai thùng có thông nhau.","DSU với nén đường đi."],
["R","Sắp xếp phòng thi","DSU",1,2,"Bạn bè có bắc cầu, không hai bạn nào cùng phòng. Tối thiểu số phòng.","Đáp án là kích thước nhóm bạn lớn nhất, tính bằng DSU."],
["J","Đường bộ và đường sắt","DSU",2,1,"Với mỗi thành phố, đếm số thành phố cùng liên thông bằng cả đường bộ và đường sắt.","Hai DSU. Đếm số thành phố theo cặp (gốc bộ, gốc sắt) bằng map."],
["I","Số lượng màu","DSU",3,1,"Thêm cạnh và hỏi số đỉnh màu y trong thành phần chứa x.","DSU với map màu → số lượng ở mỗi gốc, gộp map nhỏ vào map lớn (small to large)."],
["K","Cây khung nhỏ nhất","Cây khung",2,1,"Có sẵn m đoạn nối n điểm. Tối thiểu tổng độ dài cần thêm để liên thông, in 2 chữ số.","Gộp trước các đoạn có sẵn, rồi Kruskal hoặc Prim trên đồ thị đầy đủ theo khoảng cách Euclid."],
["T","Xoá cạnh trên đồ thị","Cây khung",3,2,"Xoá cạnh mà vẫn liên thông, xoá cạnh c_i được c_i điểm (âm là bị phạt). Tối đa điểm.","Không xoá cạnh âm. Kruskal theo trọng số tăng dần: cạnh âm giữ hết, cạnh dương không dùng thì xoá và ăn điểm."],
["L","Truyền tin trong mạng","Đường đi ngắn nhất",1,1,"Tìm chi phí truyền nhỏ nhất từ s đến t.","Dijkstra với priority_queue, dùng long long."],
["M","Đồ thị có trọng số","Đường đi ngắn nhất",2,1,"Với mỗi cặp (u,v), tối thiểu trọng số cạnh lớn nhất trên đường đi.","Floyd biến thể: d[i][j] = min(d[i][j], max(d[i][k], d[k][j])), n = 300."],
["N","Số bước di chuyển ít nhất","Đường đi ngắn nhất",2,1,"Từ (1,1) đến (n,m), mỗi bước đi xuống, phải hoặc chéo một số ô bằng hiệu giá trị hai ô kề theo hướng đó. Tối thiểu số bước.","BFS trên ô. Bỏ qua bước nhảy 0 ô và bước ra ngoài bảng."],
["S","Chuyến tàu","Đường đi ngắn nhất",2,2,"Tàu khởi hành ở các bội của k_i, đi mất t_i. Tìm thời điểm sớm nhất tới y.","Dijkstra theo thời gian. Đang ở thời điểm d, đến được lúc ⌈d/k⌉·k + t."],
["U","Khu phố đèn đỏ","Đường đi ngắn nhất",3,2,"Đạp xe vận tốc v, đi qua nút giao bậc x (x ≥ 3) phải đợi x-2 giây, trừ điểm đầu và cuối. Tối thiểu thời gian.","Dijkstra số thực: cạnh tốn w/v cộng thời gian chờ của đỉnh trung gian, in 6 chữ số."],

["P","Trò chơi trên cây","Trên cây",1,1,"Chọn k đỉnh khác nhau, điểm là tổng độ sâu. Tối đa điểm.","Tính độ sâu bằng BFS, sắp giảm dần, lấy k đỉnh đầu."],
["Q","Cây con cân bằng","Trên cây",1,1,"Đếm cây con có số đỉnh đen bằng số đỉnh trắng.","DFS tính tổng với đen = +1, trắng = -1. Đếm đỉnh có tổng bằng 0."]

["E","Phép duyệt RNL","Duyệt cây",2,1,"Cho cây dạng level order có N là NULL, in duyệt phải - gốc - trái.","Đọc token bằng stringstream, dựng cây bằng hàng đợi. Cây có thể sâu nên cân nhắc khử đệ quy."],

["B","Cặp node gần nhất","Cây nhị phân tìm kiếm",1,1,"Với mỗi x, in giá trị lớn nhất nhỏ hơn x, rồi giá trị nhỏ nhất lớn hơn x (theo thứ tự của ví dụ trong đề), không có thì 0.","Không cần dựng cây thật: sắp mảng rồi lower_bound và upper_bound."],

const MOCK=[{"k":"mh1","name":"Đề minh hoạ 1","min":75,"p":[["A",null,["Hoán vị chữ cái","Sinh / quay lui",1,"Liệt kê các hoán vị khác nhau của một xâu chữ cái có thể lặp lại.","Sắp xếp xâu rồi dùng next_permutation, hoặc quay lui đếm số lần còn lại của từng chữ cái để không sinh trùng.",1]],["B",null,["Dãy con chung không liền kề","Quy hoạch động",2,"Dãy con chung dài nhất mà các vị trí chọn không liền nhau ở cả hai dãy.","Giống LCS nhưng khi lấy a_i = b_j thì đi từ f[i-2][j-2], vì hai vị trí liền trước không được chọn.",1]],["C",null,["Thay ngoặc ba loại","Ngăn xếp / hàng đợi",1,"Thay ngoặc đúng bằng 0 và 1, ngoặc sai bằng -1 với ba loại ngoặc.","Ngăn xếp lưu vị trí ngoặc mở. Đánh dấu kết quả theo vị trí rồi in một lượt cuối.",1]],["D",null,["Hình chữ nhật diện tích nhỏ nhất","Đồ thị",2,"Tìm hình chữ nhật bao một thành phần liên thông có diện tích nhỏ nhất.","Tìm thành phần bằng DSU hoặc BFS, giữ min và max của x, y trong từng thành phần. Diện tích dùng long long.",1]],["E",null,["Chiều cao và hậu thứ tự của BST","Cây nhị phân",1,"Chèn vào BST rồi in chiều cao và duyệt hậu thứ tự.","Chèn từng phần tử theo quy tắc BST, chiều cao là số cạnh trên đường dài nhất từ gốc.",1]]]},{"k":"mh2","name":"Đề minh hoạ 2","min":75,"p":[["A",null,["Dãy bit có đoạn 1 dài","Sinh / quay lui",1,"Liệt kê xâu nhị phân độ dài n có một đoạn ít nhất k bit 1 liên tiếp.","Sinh mọi xâu nhị phân theo thứ tự từ điển (0 trước 1) và kiểm tra độ dài đoạn 1 dài nhất.",1]],["B",null,["Xâu con chia hết cho m","Quy hoạch động",2,"Đếm xâu con liên tiếp chia hết cho m.","cnt[r] là số xâu con kết thúc tại vị trí hiện tại có dư r. Thêm chữ số d thì dư r thành (10r + d) mod m, cộng thêm xâu con chỉ gồm d.",1]],["C",null,["Biểu thức trung tố","Ngăn xếp / hàng đợi",2,"Tính giá trị biểu thức trung tố có ngoặc.","Hai ngăn xếp số và phép toán. Gặp phép toán thì tính hết các phép trên đỉnh có độ ưu tiên lớn hơn hoặc bằng.",1]],["D",null,["Tô hai màu","Đồ thị",1,"Đếm thành phần liên thông tô được hai màu.","BFS tô màu từng thành phần, đánh dấu thành phần hỏng khi gặp cạnh nối hai đỉnh cùng màu.",1]],["E",null,["Cây gần đầy: tiền thứ tự và số lá","Cây nhị phân",1,"Cây gần đầy: in tiền thứ tự và số lá.","Con của chỉ số i là 2i+1 và 2i+2. Nút i là lá khi 2i+1 ≥ n.",1]]]},{"k":"mh3","name":"Đề minh hoạ 3","min":75,"p":[["A",null,["Tổ hợp tổng Fibonacci","Sinh / quay lui",2,"Liệt kê các tổ hợp k phần tử có tổng là số Fibonacci.","Sinh tổ hợp chập k theo chỉ số tăng dần, đánh dấu sẵn các số Fibonacci trong phạm vi tổng lớn nhất có thể.",1]],["B",null,["Quà trên vòng tròn","Quy hoạch động",2,"Chọn các hộp không kề nhau trên vòng tròn để tổng lớn nhất.","Vòng tròn tách thành hai bài trên đoạn thẳng: bỏ hộp 1 hoặc bỏ hộp n. Mỗi đoạn dùng dp chọn hoặc không chọn.",1]],["C",null,["Đếm đoạn ngoặc đúng","Ngăn xếp / hàng đợi",3,"Đếm đoạn con là biểu thức ngoặc đúng với bốn loại ngoặc.","Khi ngoặc đóng tại i khớp ngoặc mở tại j, số đoạn đúng kết thúc tại i bằng 1 cộng số đoạn đúng kết thúc tại j-1.",1]],["D",null,["Lưới chi phí","Đồ thị",2,"Chi phí nhỏ nhất đi trên lưới có ô chặn.","Dijkstra trên ô với priority_queue, khoảng cách bắt đầu bằng a_11. Dùng long long.",1]],["E",null,["Dựng cây từ tiền thứ tự và trung thứ tự","Cây nhị phân",2,"Dựng cây từ tiền thứ tự và trung thứ tự rồi in hậu thứ tự.","Phần tử đầu của tiền thứ tự là gốc, tìm vị trí của nó trong trung thứ tự bằng mảng vị trí. Cây có thể sâu nên cân nhắc khử đệ quy.",1]]]},{"k":"mh4","name":"Đề minh hoạ 4","min":75,"p":[["A",null,["Xâu nhị phân có k cặp 01","Sinh / quay lui",1,"Liệt kê xâu nhị phân độ dài n có đúng k cặp 01.","Sinh xâu nhị phân theo thứ tự từ điển, đếm cặp 01 khi đặt từng bit và cắt nhánh khi số cặp đã vượt k.",1]],["B",null,["Đường đi chia hết","Quy hoạch động",2,"Đếm đường đi trên lưới có tổng chia hết cho k.","dp[i][j][r] là số đường tới ô (i,j) với tổng dư r. Lấy dư của ô trước khi cộng để tránh tràn.",1]],["C",null,["Xếp hàng mua vé","Ngăn xếp / hàng đợi",1,"Mô phỏng hàng đợi mua vé, in thời điểm từng người rời hàng.","Mô phỏng bằng queue chỉ tốn tổng t_i bước, đủ nhanh với ràng buộc này.",1]],["D",null,["Về quê rồi quay lại","Đồ thị",1,"Đường ngắn nhất từ A đến B rồi quay về A trên đồ thị có hướng.","BFS hai lần: từ A để lấy khoảng cách tới B, từ B để lấy khoảng cách tới A.",1]],["E",null,["Duyệt zig-zag","Cây nhị phân",2,"Duyệt cây theo mức kiểu zig-zag.","Dựng cây từ level order bằng hàng đợi, duyệt BFS theo từng mức và đảo các mức lẻ khi in.",1]]]},{"k":"mh5","name":"Đề minh hoạ 5","min":75,"p":[["A",null,["Hoán vị không có hai số liên tiếp kề nhau","Sinh / quay lui",2,"Liệt kê hoán vị không có hai số liên tiếp đứng cạnh nhau.","Quay lui điền từng vị trí theo giá trị tăng dần, bỏ qua số chưa dùng mà chênh đúng 1 với số vừa đặt.",1]],["B",null,["Đổi tiền ít tờ nhất","Quy hoạch động",3,"Trả đúng S với số tờ ít nhất khi mỗi loại tiền có hạn.","Cái túi bị chặn: tách c_i tờ thành các gói 1, 2, 4, ... tờ rồi làm cái túi 0/1 với chi phí là số tờ.",2]],["C",null,["Tiền tố sang hậu tố","Ngăn xếp / hàng đợi",2,"Chuyển biểu thức tiền tố sang hậu tố.","Duyệt từ phải sang trái: toán hạng đẩy vào ngăn xếp, gặp phép toán thì lấy hai xâu a, b và đẩy a + b + phép toán.",1]],["D",null,["Thứ tự học môn","Đồ thị",2,"Thứ tự học môn có thứ tự từ điển nhỏ nhất.","Kahn với min-heap thay cho queue. Nếu lấy ra chưa đủ n đỉnh thì có chu trình.",1]],["E",null,["Kiểm tra tiền thứ tự BST","Cây nhị phân",3,"Kiểm tra dãy có phải tiền thứ tự của một BST.","Ngăn xếp giảm dần cùng cận dưới: khi gặp số lớn hơn đỉnh thì lấy ra và nâng cận dưới. Số nào nhỏ hơn cận dưới thì trả NO.",1]]]},{"k":"mh6","name":"Đề minh hoạ 6","min":75,"p":[["A",null,["Tổ hợp có tổng bằng S","Sinh / quay lui",1,"Liệt kê tổ hợp chập k của 1..n có tổng bằng S.","Quay lui chọn số tăng dần, cắt nhánh khi tổng đã vượt S hoặc không còn đủ số để chọn.",1]],["B",null,["Cắt thanh sắt","Quy hoạch động",1,"Cắt thanh sắt thành các đoạn để bán được nhiều tiền nhất.","f[i] = max(f[i - j] + p_j) với j từ 1 đến i. Dùng long long.",1]],["C",null,["Đảo ngoặc ít nhất","Ngăn xếp / hàng đợi",2,"Số lần đảo ngoặc ít nhất để thành dãy ngoặc đúng.","Ghép các cặp khớp bằng stack (hoặc bộ đếm). Còn lại dạng )))((( với a ngoặc đóng và b ngoặc mở, đáp án là ⌈a/2⌉ + ⌈b/2⌉.",1]],["D",null,["Số thành phần sau mỗi lần nối","Đồ thị",1,"Số thành phần liên thông sau mỗi lần thêm cạnh.","DSU: bắt đầu với n thành phần, mỗi lần hợp hai gốc khác nhau thì giảm 1.",1]],["E",null,["Đường kính cây nhị phân","Cây nhị phân",2,"Đường kính cây nhị phân.","Tính chiều cao từng nút theo thứ tự từ dưới lên; đường kính qua nút là chiều cao trái + chiều cao phải + 2.",1]]]},{"k":"mh7","name":"Đề minh hoạ 7","min":75,"p":[["A",null,["Xâu nhị phân đối xứng","Sinh / quay lui",1,"Liệt kê xâu nhị phân đối xứng có đúng k bit 1.","Chỉ cần sinh nửa đầu (kèm ký tự giữa khi n lẻ) rồi lật lại; đếm bit 1 của cả xâu để lọc.",1]],["B",null,["Khoảng cách sửa xâu","Quy hoạch động",2,"Số thao tác chèn, xoá, thay ít nhất để biến xâu a thành b.","f[i][j] cho tiền tố a[1..i] và b[1..j]; ký tự bằng nhau thì lấy f[i-1][j-1], khác thì 1 + min ba hướng. Hai hàng là đủ.",1]],["C",null,["Rút gọn đường dẫn","Ngăn xếp / hàng đợi",1,"Rút gọn đường dẫn kiểu Unix.","Tách theo dấu /, bỏ phần rỗng và \".\", gặp \"..\" thì pop nếu stack không rỗng, còn lại push. Ghép lại bằng /.",1]],["D",null,["Cây khung nhỏ nhất","Đồ thị",2,"Tổng trọng số cây khung nhỏ nhất.","Kruskal: sắp cạnh theo trọng số, dùng DSU để bỏ cạnh tạo chu trình. Đếm số cạnh đã lấy để biết có liên thông không.",1]],["E",null,["Xoá nút trên BST theo quy ước kế nhiệm","Cây nhị phân",2,"Xoá nút trên BST theo quy ước kế nhiệm, in duyệt theo mức.","Làm đúng ba trường hợp xoá, trường hợp hai con thì lấy giá trị nhỏ nhất của cây con phải rồi xoá nút đó.",1]]]},{"k":"mh8","name":"Đề minh hoạ 8","min":75,"p":[["A",null,["Hoán vị lên xuống","Sinh / quay lui",2,"Liệt kê hoán vị có dạng lên xuống xen kẽ.","Sắp dãy rồi quay lui điền từng vị trí, chỉ thử số chưa dùng thoả chiều tăng hoặc giảm so với số vừa đặt.",1]],["B",null,["Leo cầu thang có bậc hỏng","Quy hoạch động",1,"Đếm số cách leo cầu thang tránh bậc hỏng.","f[0] = 1, f[i] = 0 nếu bậc i hỏng, ngược lại f[i] = tổng f[i - s] với s trong tập bước.",1]],["C",null,["Đếm vòng loại","Ngăn xếp / hàng đợi",1,"Mô phỏng vòng loại bằng hàng đợi.","Mỗi lượt chỉ cần quay (k-1) mod (số người còn lại) lần để không bị chậm khi k lớn.",1]],["D",null,["Quân mã đi tuần","Đồ thị",1,"Số nước đi ít nhất của quân mã có ô cấm.","BFS trên ô với 8 hướng nhảy của quân mã, bỏ ô cấm và ô ra ngoài bàn.",1]],["E",null,["Tổ tiên chung gần nhất trên BST","Cây nhị phân",2,"Tổ tiên chung gần nhất trên BST.","Đi từ gốc: hai giá trị cùng nhỏ hơn thì sang trái, cùng lớn hơn thì sang phải, còn lại nút hiện tại là đáp án.",1]]]},{"k":"mh9","name":"Đề minh hoạ 9","min":75,"p":[["A",null,["Chọn đội không có người ghét nhau","Sinh / quay lui",2,"Chọn k người sao cho không có hai người ghét nhau.","Sắp tên, đổi tên thành chỉ số, quay lui chọn tổ hợp tăng dần và bỏ người ghét bất kỳ ai đã chọn.",1]],["B",null,["Nhân dãy ma trận","Quy hoạch động",3,"Đặt ngoặc tích dãy ma trận để ít phép nhân nhất.","QHĐ trên đoạn: f[i][j] = min(f[i][t] + f[t+1][j] + d_{i-1}·d_t·d_j). Duyệt theo độ dài đoạn tăng dần.",1]],["C",null,["Nhìn thấy bên phải","Ngăn xếp / hàng đợi",3,"Mỗi người nhìn thấy bao nhiêu người bên phải.","Duyệt từ phải sang với stack giảm dần: mỗi người thấp hơn bị pop là một người nhìn thấy, cộng thêm 1 nếu stack còn người cao hơn.",1]],["D",null,["Chu trình ngắn nhất","Đồ thị",3,"Độ dài chu trình ngắn nhất trong đồ thị có hướng.","BFS từ mỗi đỉnh s; mọi cung u → s với u đến được từ s cho chu trình dài d[u] + 1.",1]],["E",null,["Cây cân bằng chiều cao","Cây nhị phân",2,"Kiểm tra cây cân bằng chiều cao.","Tính chiều cao từ dưới lên và kiểm tra chênh lệch tại mọi nút. Cây có thể sâu nên duyệt bằng thứ tự BFS ngược thay vì đệ quy.",1]]]},{"k":"mh10","name":"Đề minh hoạ 10","min":75,"p":[["A",null,["Mã Gray","Sinh / quay lui",1,"In các xâu nhị phân độ dài n theo thứ tự mã Gray.","Sinh đệ quy đúng theo định nghĩa phản xạ, hoặc dùng công thức i XOR (i >> 1) rồi in n bit.",1]],["B",null,["Dãy con dài nhất có tổng chia hết cho k","Quy hoạch động",2,"Dãy con dài nhất có tổng chia hết cho k.","best[r] là độ dài lớn nhất của dãy con có tổng dư r. Mỗi phần tử cập nhật từ bản sao của mảng cũ, nhớ lấy dư không âm.",1]],["C",null,["Giải nén xâu","Ngăn xếp / hàng đợi",2,"Giải nén xâu dạng k[...] lồng nhau.","Hai stack: một giữ số lặp, một giữ xâu đang dựng trước dấu [. Gặp ] thì lặp xâu hiện tại rồi nối vào xâu trên đỉnh.",1]],["D",null,["Đếm đường đi ngắn nhất","Đồ thị",2,"Độ dài và số đường đi ngắn nhất từ 1 đến n.","Dijkstra kèm mảng đếm: tìm được đường ngắn hơn thì gán số cách, bằng thì cộng số cách.",1]],["E",null,["Đường gốc tới lá có tổng S","Cây nhị phân",2,"Đếm đường từ gốc tới lá có tổng bằng S.","Truyền tổng từ gốc xuống theo thứ tự BFS, khi gặp lá thì so với S. Dùng long long.",1]]]}];

const GUIDE=[{"id":"L01","chapter":1,"chapterName":"Sinh và quay lui","title":"Sinh xâu nhị phân","intro":"Dạng bài liệt kê mọi xâu 0/1 độ dài n, thường kèm một điều kiện phụ (số bit 1, đối xứng, không có hai bit 1 kề nhau...). Đây là dạng nền: hiểu nó thì quay lui các dạng sau chỉ là thay tập giá trị và điều kiện.","recognize":["Đề yêu cầu \"liệt kê\", \"in tất cả\" các xâu nhị phân, dãy bit, hoặc dãy chỉ gồm hai loại ký tự (0/1, 6/8, a/b) có độ dài n.","Cận n nhỏ, thường n ≤ 15 đến 20 (n lớn nhất khoảng 25 nếu điều kiện cắt mạnh), vì số xâu là 2^n.","Yêu cầu in theo thứ tự từ điển, hoặc theo một thứ tự đặc biệt như mã Gray.","Output là danh sách nhiều dòng, mỗi dòng một cấu hình; đôi khi thêm dòng cuối là số lượng."],"idea":["Coi xâu là mảng x[0..n-1], mỗi ô nhận 0 hoặc 1. Quay lui điền từng ô từ trái sang phải.","Tại ô pos, thử bit 0 trước rồi bit 1. Thứ tự thử này cho ra thứ tự từ điển, không cần sắp xếp lại.","Khi pos == n thì đã có một xâu hoàn chỉnh: kiểm tra điều kiện cuối (nếu có) rồi in hoặc đếm.","Điều kiện phụ chỉ phụ thuộc phần đã điền (không có hai bit 1 kề nhau, số bit 1 không vượt k...) thì kiểm ngay lúc điền để bỏ nhánh sớm, đừng sinh hết rồi mới lọc.","Cách thứ hai: coi xâu là số nhị phân và cộng thêm 1 để ra xâu kế tiếp (hàm sinhKeTiep). Cách này gọn khi không cần cắt nhánh.","Khi cần xâu có cấu trúc đặc biệt, hãy sinh ít biến độc lập hơn: xâu đối xứng chỉ cần sinh nửa đầu rồi lấy đối xứng. Khi đề đòi thứ tự không phải từ điển (như mã Gray), thứ tự thử bit ở mỗi mức có thể phụ thuộc trạng thái: thêm tham số cho sinh để chọn thử 0 trước hay 1 trước."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n;\nvector<int> x;   // x[0..n-1]: xâu đang xây, mỗi phần tử là 0 hoặc 1\nstring out;      // gom kết quả rồi in một lần cho nhanh\n\n// Điều kiện phụ của đề. Trả về true nếu đặt x[pos] = bit vẫn còn có thể thành xâu hợp lệ.\n// Mặc định không ràng buộc. Thay bằng điều kiện của đề, ví dụ: không cho hai bit 1 kề nhau\n// thì viết: return !(bit == 1 && pos > 0 && x[pos - 1] == 1);\nbool hopLe(int pos, int bit) {\n    return true;\n}\n\n// Gọi khi đã điền đủ n bit. Thay bằng việc đề cần: kiểm tra điều kiện cuối, đếm, in kiểu khác...\nvoid xuLyCauHinh() {\n    for (int i = 0; i < n; i++) out += char('0' + x[i]);\n    out += '\\n';\n}\n\n// Cách 1: quay lui. Gọi sinh(0).\nvoid sinh(int pos) {\n    if (pos == n) { xuLyCauHinh(); return; }\n    for (int bit = 0; bit <= 1; bit++) {   // thử 0 trước 1 => thứ tự từ điển\n        if (!hopLe(pos, bit)) continue;\n        x[pos] = bit;\n        sinh(pos + 1);\n    }\n}\n\n// Cách 2: sinh kế tiếp (cộng 1 nhị phân). Biến x thành xâu liền sau, trả false nếu x đang là 11...1.\nbool sinhKeTiep() {\n    int i = n - 1;\n    while (i >= 0 && x[i] == 1) { x[i] = 0; i--; }   // các bit 1 ở cuối đổi thành 0\n    if (i < 0) return false;\n    x[i] = 1;                                          // bit 0 gần cuối nhất đổi thành 1\n    return true;\n}\n\nint main() {\n    cin >> n;                // đọc thêm các tham số khác của đề ở đây\n    x.assign(n, 0);\n    sinh(0);\n    // Cách 2 thay cho dòng trên: do { xuLyCauHinh(); } while (sinhKeTiep());\n    fputs(out.c_str(), stdout);\n    return 0;\n}\n","skeletonNotes":["x và n là trạng thái chung. Các hàm nhỏ đọc x để quyết định, nên bạn thêm biến phụ (đếm số bit 1, bit trước đó...) thì khai báo cạnh x.","hopLe(pos, bit) là chỗ gắn điều kiện cắt nhánh. Hàm chỉ được nhìn x[0..pos-1] vì phần sau chưa điền.","xuLyCauHinh() là chỗ đổi theo yêu cầu cuối: in xâu, đếm, kiểm tra thêm điều kiện chỉ xét được khi xâu đầy đủ (ví dụ đối xứng) rồi mới in.","sinh(pos) luôn thử 0 trước 1. Nếu đề muốn thứ tự giảm dần hoặc bảng chữ cái khác, đổi vòng lặp và ký tự in ra.","Dùng chuỗi out và in một lần ở cuối; in từng dòng bằng cout với endl có thể quá chậm khi có hàng chục nghìn dòng.","sinhKeTiep() dùng độc lập: khởi tạo x toàn 0, lặp xử lý rồi gọi sinhKeTiep cho đến khi trả false."],"complexity":["Thời gian O(2^n · n) cho n ≤ 15..20 nếu in hết; có cắt nhánh tốt thì chỉ tỉ lệ với số kết quả nhân n.","Bộ nhớ O(n) cho đệ quy, không tính bộ đệm kết quả."],"pitfalls":["Thử bit 1 trước bit 0 sẽ in ngược thứ tự từ điển. Đề nói \"từ điển tăng dần\" thì phải thử 0 trước.","Sinh hết 2^n xâu rồi lọc thì với n ≈ 25 sẽ chậm quá: nếu điều kiện kiểm được trên tiền tố hãy đặt vào hopLe.","Quên đặt lại biến phụ khi quay lui (ví dụ đã tăng biến đếm số bit 1 khi đặt bit, quên giảm lại khi thử bit khác). Cách an toàn là tính lại từ x, hoặc truyền biến phụ qua tham số của sinh.","Đọc n rồi dùng x[n] khi x chưa được cấp phát (phải assign sau khi đọc n).","In bằng cout << endl cho hàng chục nghìn dòng dễ quá thời gian; dùng dấu xuống dòng thường hoặc gom vào string.","Đề có dòng cuối \"số lượng\" thì phải in sau cùng, và in 0 khi không có xâu nào; đừng quên trường hợp này."],"practice":["mh2-A","clc-A","mh10-A","mh4-A","dq-H","mh7-A"],"examples":[{"key":"hd01-1","title":"Xâu nhị phân theo thứ tự từ điển","tl":1,"sol":"// Sinh mọi xâu nhị phân độ dài n theo thứ tự từ điển bằng quay lui.\n#include <bits/stdc++.h>\nusing namespace std;\n\nint n;\nvector<int> x;   // x[0..n-1]: xâu đang xây\nstring out;      // gom kết quả rồi in một lần cho nhanh\n\n// Bài này không có điều kiện phụ: vị trí nào đặt bit nào cũng được.\nbool hopLe(int pos, int bit) {\n    return true;\n}\n\n// Điền đủ n bit: ghi xâu ra bộ đệm.\nvoid xuLyCauHinh() {\n    for (int i = 0; i < n; i++) out += char('0' + x[i]);\n    out += '\\n';\n}\n\nvoid sinh(int pos) {\n    if (pos == n) { xuLyCauHinh(); return; }\n    for (int bit = 0; bit <= 1; bit++) {   // thử 0 trước 1 để ra đúng thứ tự từ điển\n        if (!hopLe(pos, bit)) continue;\n        x[pos] = bit;\n        sinh(pos + 1);\n    }\n}\n\nint main() {\n    cin >> n;\n    x.assign(n, 0);\n    sinh(0);\n    fputs(out.c_str(), stdout);\n    return 0;\n}\n"}]},{"id":"L02","chapter":1,"chapterName":"Sinh và quay lui","title":"Sinh tổ hợp","intro":"Dạng bài liệt kê mọi cách chọn k phần tử từ n phần tử (không phân biệt thứ tự), thường theo thứ tự từ điển, có khi kèm điều kiện về tổng hoặc về cặp xung đột. Số kết quả là C(n, k) nên đề luôn giới hạn n nhỏ.","recognize":["Đề dùng các từ \"chọn k\", \"tổ hợp chập k\", \"tập con có đúng k phần tử\", \"đội gồm k người\".","Thứ tự chọn không quan trọng, mỗi phần tử dùng tối đa một lần, kết quả viết theo chỉ số tăng dần.","n ≤ 15..20, và đề thường cam kết số kết quả không quá lớn (10^5 hoặc hơn).","Có điều kiện phụ: tổng các phần tử bằng S hoặc thuộc một tập, hai phần tử không được cùng xuất hiện."],"idea":["Biểu diễn một tổ hợp bằng mảng x[0..k-1] tăng ngặt: x[0] < x[1] < ... < x[k-1].","Quay lui chọn x[pos]: giá trị chạy từ x[pos-1] + 1 (hoặc 1 nếu pos = 0) đến n - (k - pos) + 1. Cận trên đó đảm bảo còn đủ số cho các vị trí sau.","Vì luôn chọn giá trị nhỏ trước và chỉ tăng, các tổ hợp tự ra theo thứ tự từ điển.","Có điều kiện phụ thì kiểm trong hopLe: cộng dần tổng và cắt nếu đã vượt, kiểm xung đột với các phần tử đã chọn.","Khi đề cho mảng a (có thể trùng giá trị) thì chọn theo chỉ số rồi mới ghép giá trị; nếu cần bỏ trùng thì gom kết quả rồi sắp và unique.","Cách khác khi n ≤ 20: duyệt mask từ 0 đến 2^n - 1 và lấy những mask có đúng k bit 1. Dễ viết nhưng thứ tự in phải tự xử lý."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n, k;\nvector<int> x;   // x[0..k-1]: tổ hợp đang xây (chỉ số hoặc giá trị), tăng ngặt\nstring out;\n\n// Điều kiện phụ của đề: đặt x[pos] = v có còn hợp lệ không? (chỉ được nhìn x[0..pos-1])\n// Mặc định không ràng buộc. Ví dụ ràng buộc \"không chọn hai số hơn kém nhau 1\":\n//   return pos == 0 || v - x[pos - 1] != 1;\nbool hopLe(int pos, int v) {\n    return true;\n}\n\n// Gọi khi đã chọn đủ k phần tử. Thay bằng việc đề cần: kiểm tra điều kiện cuối, in, đếm...\nvoid xuLyCauHinh() {\n    for (int i = 0; i < k; i++) {\n        if (i) out += ' ';\n        out += to_string(x[i]);\n    }\n    out += '\\n';\n}\n\n// Cách 1: quay lui. Chọn x[pos], giá trị v từ 'tu' trở lên. Gọi sinh(0, 1).\nvoid sinh(int pos, int tu) {\n    if (pos == k) { xuLyCauHinh(); return; }\n    // còn phải chọn k - pos số (kể cả x[pos]) nên v lớn nhất là n - (k - pos) + 1\n    for (int v = tu; v <= n - (k - pos) + 1; v++) {\n        if (!hopLe(pos, v)) continue;\n        x[pos] = v;\n        sinh(pos + 1, v + 1);\n    }\n}\n\n// Cách 2: sinh kế tiếp. Biến x thành tổ hợp liền sau, trả false nếu x đã là tổ hợp cuối.\nbool sinhKeTiep() {\n    int i = k - 1;\n    while (i >= 0 && x[i] == n - k + i + 1) i--;   // tìm vị trí còn tăng được\n    if (i < 0) return false;\n    x[i]++;\n    for (int j = i + 1; j < k; j++) x[j] = x[j - 1] + 1;   // các vị trí sau dồn về sát nhất\n    return true;\n}\n\nint main() {\n    cin >> n >> k;           // đọc thêm các tham số khác của đề ở đây\n    x.assign(k, 0);\n    sinh(0, 1);\n    // Cách 2 thay cho dòng trên: đặt x[i] = i + 1 rồi\n    //   do { xuLyCauHinh(); } while (sinhKeTiep());\n    fputs(out.c_str(), stdout);\n    return 0;\n}\n","skeletonNotes":["x lưu giá trị đã chọn. Nếu đề cho mảng a, để x lưu chỉ số và đổi xuLyCauHinh để in a[x[i]].","Cận trên n - (k - pos) + 1 là cắt nhánh quan trọng nhất: thiếu nó chương trình vẫn đúng nhưng đi vào nhiều nhánh cụt.","Tham số tu của sinh là giá trị nhỏ nhất được chọn tiếp. Truyền v + 1 để bảo đảm tăng ngặt.","hopLe nhận pos và v để bạn kiểm tra quan hệ giữa v và các x[0..pos-1] đã chọn.","sinhKeTiep() là cách sinh không đệ quy: tìm vị trí cuối còn tăng được, tăng 1, rồi đặt các vị trí sau thành dãy liên tiếp.","Điều kiện tổng: giữ biến toàn cục tong, cộng v trước khi gọi sinh và trừ v sau khi gọi, để hopLe có thể cắt khi vượt."],"complexity":["Số tổ hợp C(n, k), mỗi tổ hợp tốn O(k) để in: tổng O(C(n, k) · k). Với n = 15 lớn nhất là C(15, 7) = 6435.","Bộ nhớ O(k) cho đệ quy; bộ đệm kết quả tỉ lệ với số dòng in ra."],"pitfalls":["Cận vòng lặp sai: viết v <= n khiến sinh cả nhánh không đủ phần tử, hoặc v < n làm mất tổ hợp chứa n.","Lệch chỉ số 0 và 1: đề cho {1..n} mà bạn dùng chỉ số 0..n-1 thì in thiếu cộng 1.","Chọn theo chỉ số trên mảng có giá trị trùng rồi in giá trị sẽ ra kết quả lặp; đề bảo \"các xâu khác nhau\" thì phải bỏ trùng.","So sánh \"từ điển\" trên giá trị số và trên xâu khác nhau (12 và 2): đọc kỹ đề xem so sánh kiểu nào rồi mới chọn cách sắp.","Quên giảm biến tổng khi quay lui hoặc quên reset kết quả giữa nhiều bộ test.","Dùng 2^n mask với n = 20 rồi đẩy từng mask vào mảng để sắp: tốn thời gian và bộ nhớ hơn quay lui."],"practice":["mh6-A","mh3-A","mh9-A","dq-D"],"examples":[{"key":"hd02-1","title":"Tổ hợp chập k theo thứ tự từ điển","tl":1,"sol":"// Liệt kê tổ hợp chập k của {1..n} theo thứ tự từ điển bằng quay lui.\n#include <bits/stdc++.h>\nusing namespace std;\n\nint n, k;\nvector<int> x;   // x[0..k-1]: tổ hợp đang xây, tăng ngặt\nstring out;\n\n// Bài này không có điều kiện phụ ngoài \"tăng ngặt\" (đã nằm trong cận của vòng lặp).\nbool hopLe(int pos, int v) {\n    return true;\n}\n\n// Đã chọn đủ k số: ghi ra bộ đệm.\nvoid xuLyCauHinh() {\n    for (int i = 0; i < k; i++) {\n        if (i) out += ' ';\n        out += to_string(x[i]);\n    }\n    out += '\\n';\n}\n\nvoid sinh(int pos, int tu) {   // chọn x[pos], giá trị từ 'tu' trở lên\n    if (pos == k) { xuLyCauHinh(); return; }\n    // Còn phải chọn k-pos số nên v <= n-(k-pos)+1, vượt quá thì không đủ số cho phần sau.\n    for (int v = tu; v <= n - (k - pos) + 1; v++) {\n        if (!hopLe(pos, v)) continue;\n        x[pos] = v;\n        sinh(pos + 1, v + 1);\n    }\n}\n\nint main() {\n    cin >> n >> k;\n    x.assign(k, 0);\n    sinh(0, 1);\n    fputs(out.c_str(), stdout);\n    return 0;\n}\n"}]},{"id":"L03","chapter":1,"chapterName":"Sinh và quay lui","title":"Sinh hoán vị và chỉnh hợp","intro":"Dạng bài liệt kê mọi cách xếp các phần tử thành dãy (hoán vị), hoặc chọn k phần tử rồi xếp (chỉnh hợp chập k), thường theo thứ tự từ điển và có điều kiện phụ như xen kẽ lên xuống, một người cố định ở cuối, không có hai số liên tiếp kề nhau. Số kết quả cỡ n! nên n chỉ đến 8..10.","recognize":["Đề nói \"hoán vị\", \"mọi cách xếp hàng\", \"xếp n người/số/ký tự thành dãy\".","Mỗi phần tử dùng đúng một lần, thứ tự quan trọng.","Chọn k trong n phần tử rồi xếp có thứ tự (chỉnh hợp chập k) cũng làm theo dạng này, chỉ khác điểm dừng.","n ≤ 8..10 (9! = 362880, 10! = 3628800).","Có điều kiện trên các vị trí kề nhau hoặc trên vị trí đặc biệt (phần tử đầu/cuối cố định).","Nếu đề có phần tử trùng nhau và muốn bỏ trùng thì đó là hoán vị có lặp, cần xử lý riêng."],"idea":["Chuẩn bị mảng a gồm các phần tử, sắp tăng dần. Tạo mảng used[i] cho biết a[i] đã dùng chưa.","Quay lui điền x[0..k-1] (hoán vị đủ thì k = n): tại vị trí pos duyệt i từ 0 đến n-1, chỉ lấy a[i] chưa dùng. Duyệt theo thứ tự đã sắp nên các dãy ra theo thứ tự từ điển.","Điều kiện phụ (|x[pos-1] - a[i]| ≠ 1, tăng/giảm xen kẽ, a[i] không được ở vị trí cuối...) kiểm trong hopLe ngay khi đặt để cắt nhánh.","Cách khác: sắp a rồi dùng do { ... } while (next_permutation(a.begin(), a.end())). Chỉ dùng được khi k = n. Ngắn và nhanh, lọc điều kiện ở xuLyCauHinh. next_permutation tự bỏ qua hoán vị trùng khi có phần tử bằng nhau, nên dùng cho hoán vị có lặp.","Chọn cách quay lui khi có điều kiện cắt nhánh mạnh, chọn next_permutation khi chỉ cần lọc đơn giản hoặc có phần tử lặp."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n, k;              // k = số vị trí cần xếp (hoán vị đủ thì k = n)\nvector<long long> a;   // các phần tử cần xếp, đã sắp tăng dần\nvector<long long> x;   // x[0..k-1]: dãy đang xây\nvector<bool> used;     // used[i] = true nếu a[i] đã nằm trong x\nstring out;\n\n// Điều kiện phụ của đề: đặt a[i] vào vị trí pos có còn hợp lệ không? (nhìn được x[0..pos-1])\n// Mặc định không ràng buộc. Ví dụ \"hai số kề nhau không chênh đúng 1\":\n//   return pos == 0 || llabs(x[pos - 1] - a[i]) != 1;\nbool hopLe(int pos, int i) {\n    return true;\n}\n\n// Gọi khi đã xếp đủ k phần tử. Thay bằng việc đề cần: kiểm tra điều kiện cuối, in, đếm...\nvoid xuLyCauHinh() {\n    for (int i = 0; i < k; i++) {\n        if (i) out += ' ';\n        out += to_string(x[i]);\n    }\n    out += '\\n';\n}\n\n// Cách 1: quay lui với mảng đánh dấu. Gọi sinh(0).\nvoid sinh(int pos) {\n    if (pos == k) { xuLyCauHinh(); return; }\n    for (int i = 0; i < n; i++) {            // a đã sắp tăng => thứ tự từ điển\n        if (used[i] || !hopLe(pos, i)) continue;\n        used[i] = true;                       // đánh dấu đã dùng\n        x[pos] = a[i];\n        sinh(pos + 1);\n        used[i] = false;                      // quay lui: bỏ đánh dấu\n    }\n}\n\n// Cách 2: next_permutation (chỉ khi k = n). Bắt đầu từ a đã sắp, lặp đến hoán vị cuối.\nvoid sinhBangNextPermutation() {\n    do {\n        x = a;                                // x là hoán vị hiện tại của a\n        xuLyCauHinh();                        // lọc điều kiện (nếu có) trong hàm này\n    } while (next_permutation(a.begin(), a.end()));\n}\n\nint main() {\n    cin >> n;                // đọc thêm các tham số khác của đề ở đây\n    k = n;                   // chỉnh hợp chập k thì đọc k từ input thay cho dòng này\n    a.resize(n);\n    for (auto &v : a) cin >> v;\n    sort(a.begin(), a.end());\n    x.assign(k, 0);\n    used.assign(n, false);\n    sinh(0);\n    // Cách 2 thay cho dòng trên: sinhBangNextPermutation();\n    fputs(out.c_str(), stdout);\n    return 0;\n}\n","skeletonNotes":["Sắp a trước khi sinh là bước bắt buộc để có thứ tự từ điển, kể cả khi đề cho 1..n (khi đó a = 1..n).","used[i] đánh dấu theo chỉ số trong a, không theo giá trị, nên giá trị âm hoặc lớn vẫn dùng được.","k là số vị trí cần xếp. Hoán vị đủ thì k = n; chỉnh hợp chập k thì đọc k, vòng lặp theo i vẫn chạy hết n phần tử còn đệ quy dừng ở pos == k.","Đặt used[i] = true trước khi gọi đệ quy và false ngay sau.","hopLe(pos, i) là chỗ gắn mọi ràng buộc: so với x[pos-1] cho điều kiện kề nhau, so với pos cho điều kiện vị trí (ví dụ vị trí cuối chỉ nhận một giá trị).","Cách 2 dùng khi không cần cắt nhánh: xuLyCauHinh tự lọc. Hàm này làm thay đổi a nên chỉ gọi một lần.","Hoán vị có phần tử lặp: ở cách 1, thêm điều kiện bỏ qua a[i] nếu i > 0, a[i] == a[i-1] và a[i-1] chưa used; ở cách 2 không phải làm gì thêm."],"complexity":["Số dãy n!/(n-k)! (bằng n! khi k = n), mỗi dãy tốn O(k) để in: tổng O(n!/(n-k)! · k). n = 8 khoảng 3·10^5 thao tác, n = 10 khoảng 4·10^7.","Bộ nhớ O(n) cho đệ quy, không tính bộ đệm kết quả."],"pitfalls":["Quên sắp a nên thứ tự in không phải từ điển.","Chỉnh hợp chập k mà đệ quy dừng ở pos == n thì sinh dư; phải dừng ở pos == k.","Quên bỏ đánh dấu khi quay lui (used[i] = false) làm các hoán vị sau bị thiếu.","Hiệu hai số lớn tính bằng int có thể tràn; dùng long long.","Điều kiện chỉ kiểm khi pos == n sẽ đúng nhưng chậm: n = 9 hoặc 10 có thể quá thời gian, hãy kiểm sớm trong hopLe.","Dùng next_permutation trên mảng chưa sắp sẽ bỏ sót mọi hoán vị nhỏ hơn mảng ban đầu.","Output hàng trăm nghìn dòng mà dùng cout << endl hoặc nối chuỗi chậm: gom vào string và in một lần.","Đề có tên người hoặc xâu: so sánh từ điển theo xâu (sắp chuỗi), không theo thứ tự nhập."],"practice":["dq-A","dq-B","dq-C","mh8-A","mh5-A","mh1-A"],"examples":[{"key":"hd03-1","title":"Chỉnh hợp chập k theo thứ tự từ điển","tl":1,"sol":"// Liệt kê mọi chỉnh hợp chập k của n giá trị khác nhau theo thứ tự từ điển (quay lui + mảng đánh dấu).\n#include <bits/stdc++.h>\nusing namespace std;\n\nint n, k;\nvector<long long> a;   // các giá trị, đã sắp tăng dần\nvector<long long> x;   // x[0..k-1]: dãy đang xây\nvector<bool> used;     // used[i] = true nếu a[i] đã nằm trong x\nstring out;\n\n// Bài này không có điều kiện phụ: giá trị chưa dùng thì đặt được.\nbool hopLe(int pos, int i) {\n    return true;\n}\n\n// Đã xếp đủ k số: ghi ra bộ đệm.\nvoid xuLyCauHinh() {\n    for (int i = 0; i < k; i++) {\n        if (i) out += ' ';\n        out += to_string(x[i]);\n    }\n    out += '\\n';\n}\n\nvoid sinh(int pos) {\n    if (pos == k) { xuLyCauHinh(); return; }\n    for (int i = 0; i < n; i++) {            // a đã sắp tăng => thứ tự từ điển\n        if (used[i] || !hopLe(pos, i)) continue;\n        used[i] = true;                       // đánh dấu\n        x[pos] = a[i];\n        sinh(pos + 1);\n        used[i] = false;                      // bỏ đánh dấu khi quay lui\n    }\n}\n\nint main() {\n    cin >> n >> k;\n    a.resize(n);\n    for (auto &v : a) cin >> v;\n    sort(a.begin(), a.end());\n    x.assign(k, 0);\n    used.assign(n, false);\n    sinh(0);\n    fputs(out.c_str(), stdout);\n    return 0;\n}\n"}]},{"id":"L04","chapter":1,"chapterName":"Sinh và quay lui","title":"Quay lui có cắt nhánh","intro":"Dạng bài tìm, đếm hoặc liệt kê các cấu hình thoả điều kiện bằng cách thử từng lựa chọn, bỏ nhánh ngay khi chắc chắn không còn dẫn tới nghiệm. Cắt nhánh tốt biến thuật toán từ không chạy nổi thành chạy trong thời gian thi.","recognize":["Đề hỏi \"có bao nhiêu cách\", \"in mọi cấu hình\", \"tồn tại cách nào\" trên không gian lựa chọn lớn và có ràng buộc giữa các lựa chọn (không ăn nhau, tổng bằng S, chia đều).","Cận nhỏ nhưng mũ: n ≤ 12 với n^n khả năng, n ≤ 20 với 2^n tập con, 12 người chia 4 nhóm...","Không có công thức hay quy hoạch động gọn, hoặc đề cố ý bắt thử mọi nghiệm (liệt kê, in lần lượt).","Ràng buộc kiểm được trên cấu hình dở (đã chọn một phần), tức có thể phát hiện sai sớm."],"idea":["Xác định \"bước\": mỗi bước đưa ra một quyết định (đặt quân hậu ở hàng pos, chọn thêm một phần tử vào tập). Gọi pos là số bước đã đi.","Xác định ứng viên của bước đó và điều kiện hợp lệ (hopLe) dựa trên trạng thái đã chọn. Giữ trạng thái bằng mảng đánh dấu hoặc biến tổng để kiểm trong O(1).","Mỗi lần chọn: cập nhật trạng thái (chon), đệ quy sang bước sau, rồi hoàn lại (bo). Đây là nguyên tắc \"làm rồi hoàn tác\".","Cắt nhánh mạnh: (1) loại ứng viên vi phạm ngay (hopLe), (2) cận: nếu dù lấy hết phần còn lại cũng không đạt mục tiêu thì bỏ nhánh (catNhanh), (3) sắp thứ tự ứng viên để cận chặt hơn.","Muốn tránh sinh trùng (tập con, tổ hợp), cho ứng viên ở bước sau chỉ gồm chỉ số lớn hơn chỉ số vừa chọn (tuTiep).","Khi đề bảo in theo thứ tự từ điển thì thử ứng viên từ nhỏ đến lớn; bài tối ưu thì lưu nghiệm tốt nhất và dùng nó để cắt (nhánh đã tệ hơn thì bỏ)."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n, m;\nlong long cnt = 0;\nstring out;\n\n// ---- Các hàm phụ thuộc đề. Thay thân hàm theo bài, giữ nguyên chữ ký. ----\n\n// Số ứng viên ở mỗi bước (ứng viên đánh số 0..soUngVien()-1).\n// Ví dụ: n quân hậu -> n cột; chọn phần tử vào tập con -> n phần tử.\nint soUngVien() { return m; }\n\n// Đã dựng xong một cấu hình hoàn chỉnh chưa? Ví dụ: pos == n, hoặc tổng đã đúng bằng mục tiêu.\nbool xong(int pos) { return pos == n; }\n\n// Chọn ứng viên c ở bước pos có vi phạm điều kiện không? Chỉ dùng trạng thái đã chọn trước đó.\n// Cần O(1): dùng mảng đánh dấu cột/đường chéo, biến tổng, bảng đếm...\nbool hopLe(int pos, int c) { return true; }\n\n// Ghi nhận lựa chọn: cập nhật mảng đánh dấu, biến tổng, danh sách đã chọn.\nvoid chon(int pos, int c) {}\n\n// Hoàn tác đúng những gì chon đã làm.\nvoid bo(int pos, int c) {}\n\n// Ứng viên nhỏ nhất của bước sau, sau khi vừa chọn c.\n// Hoán vị/đặt hậu: return 0 (mỗi bước thử lại từ đầu). Tập con/tổ hợp: return c + 1 (tránh trùng).\nint tuTiep(int c) { return 0; }\n\n// Cận: ở trạng thái này chắc chắn không còn nghiệm thì return true để bỏ cả nhánh.\n// Ví dụ: tong + tongConLai(tu) < S, hoặc số bước còn lại nhiều hơn số ứng viên còn lại.\nbool catNhanh(int pos, int tu) { return false; }\n\n// Xử lý một cấu hình hoàn chỉnh: đếm, ghi vào out, cập nhật nghiệm tốt nhất.\nvoid xuLyCauHinh() { cnt++; }\n\n// ---- Phần thân giữ nguyên cho mọi bài ----\nvoid thu(int pos, int tu) {              // gọi thu(0, 0)\n    if (xong(pos)) { xuLyCauHinh(); return; }\n    if (catNhanh(pos, tu)) return;\n    for (int c = tu; c < soUngVien(); c++) {\n        if (!hopLe(pos, c)) continue;     // cắt nhánh: loại ứng viên sai ngay\n        chon(pos, c);\n        thu(pos + 1, tuTiep(c));\n        bo(pos, c);                       // hoàn tác để thử ứng viên khác\n    }\n}\n\nint main() {\n    cin >> n >> m;               // đọc dữ liệu của đề ở đây và khởi tạo mảng đánh dấu\n    thu(0, 0);\n    fputs(out.c_str(), stdout);\n    printf(\"%lld\\n\", cnt);\n    return 0;\n}\n","skeletonNotes":["Thân thu() không đổi giữa các bài; chỉ viết lại 7 hàm nhỏ phía trên. Mỗi bài mới là trả lời bảy câu hỏi ứng với bảy hàm.","xong(pos) có thể dựa vào pos (đặt đủ n hàng) hoặc vào trạng thái (tổng bằng mục tiêu). Khi phần tử dương, đạt mục tiêu rồi thì chọn thêm chỉ làm vượt, nên dừng ngay.","Nếu phần tử có thể bằng 0 thì \"đạt mục tiêu là dừng\" sai (chọn thêm số 0 vẫn đạt). Khi đó đừng dùng tổng làm điều kiện xong: để mỗi bước quyết định lấy hay không lấy phần tử thứ pos (soUngVien() = 2), xong khi pos == n, và kiểm tổng trong xuLyCauHinh.","hopLe phải chạy O(1). Nếu phải duyệt lại cả cấu hình để kiểm thì thêm mảng đánh dấu.","chon và bo phải đối xứng. Hay gặp lỗi chon cập nhật 3 mảng mà bo hoàn tác thiếu 1 mảng.","tuTiep tách riêng để cùng một khung chạy cho cả dạng hoán vị/đặt quân (tự do chọn lại) lẫn dạng tập con (chỉ chọn chỉ số lớn hơn).","catNhanh dùng để dừng sớm. Muốn cận chặt hơn, tính trước tổng hậu tố, sắp mảng, hoặc lưu nghiệm tốt nhất tạm thời.","Hoán vị cần mảng đánh dấu giá trị đã dùng nên nằm trong hopLe/chon/bo; khung cho L03 viết sẵn dạng đó."],"complexity":["Chặn trên là kích thước không gian tìm kiếm (n! hoặc 2^n), nhưng cắt nhánh tốt thường chỉ duyệt số nút xấp xỉ số nghiệm nhân độ sâu.","Ví dụ n quân hậu: n = 12 chỉ duyệt vài triệu nút dù không gian là 12^12. Tập con có tổng S với cận suffix: n = 20 vẫn chạy nhanh.","Bộ nhớ O(độ sâu) cho đệ quy và mảng đánh dấu."],"pitfalls":["Quên hoàn tác (bo) hoặc hoàn tác không đủ làm trạng thái bẩn, đáp án sai theo kiểu khó thấy.","Kiểm hopLe chạy O(n) mỗi lần làm mất tác dụng cắt nhánh: dùng mảng đánh dấu để kiểm O(1).","Đường chéo đặt quân hậu: dùng chỉ số r - c (cần cộng n để không âm) và r + c, mảng kích thước 2n.","Dừng ngay khi tổng đạt S chỉ đúng khi mọi phần tử dương; có phần tử 0 thì còn các cấu hình dài hơn cũng đạt.","Cắt nhánh bằng điều kiện sai: bỏ nhánh nhầm khi giá trị có thể âm hoặc bằng 0. Chỉ dùng \"tổng vượt S thì bỏ\" khi mọi phần tử dương.","Quên rằng một cấu hình chỉ nên đếm một lần: tập con cần tuTiep = c + 1, nếu để 0 sẽ đếm cả các thứ tự khác nhau.","Tràn số: tổng nhiều phần tử đến 10^9 phải dùng long long; số cách đếm có thể vượt 32 bit.","Đệ quy sâu cỡ vài nghìn trở lên có thể tràn stack; bài quay lui thông thường chỉ sâu vài chục nên ổn.","Đề nhiều bộ test mà quên đặt lại cnt, mảng đánh dấu, bộ đệm out giữa các bộ."],"practice":["dq-E","dq-H","dq-N","mh9-A","dq-R","dq-O","dq-M"],"examples":[{"key":"hd04-1","title":"Đếm cách đặt n quân hậu","tl":1,"sol":"// Đếm số cách đặt n quân hậu: quay lui từng hàng, cắt nhánh bằng mảng cột và hai đường chéo.\n#include <bits/stdc++.h>\nusing namespace std;\n\nint n;\nlong long cnt = 0;\nvector<bool> cot, cheo1, cheo2;   // cột, đường chéo r-c, đường chéo r+c đã có quân hậu chưa\n\nint soUngVien() { return n; }                  // mỗi hàng có n cột để thử\nbool xong(int pos) { return pos == n; }    // đã đặt đủ n hàng\n\n// Hợp lệ nếu cột và hai đường chéo của ô (pos, c) còn trống.\nbool hopLe(int pos, int c) {\n    return !cot[c] && !cheo1[pos - c + n] && !cheo2[pos + c];\n}\nvoid chon(int pos, int c) { cot[c] = cheo1[pos - c + n] = cheo2[pos + c] = true; }\nvoid bo(int pos, int c)   { cot[c] = cheo1[pos - c + n] = cheo2[pos + c] = false; }\nint tuTiep(int c) { return 0; }                // hàng sau thử lại từ cột 0\nbool catNhanh(int pos, int tu) { return false; }\n\nvoid xuLyCauHinh() { cnt++; }\n\nvoid thu(int pos, int tu) {\n    if (xong(pos)) { xuLyCauHinh(); return; }\n    if (catNhanh(pos, tu)) return;\n    for (int c = tu; c < soUngVien(); c++) {\n        if (!hopLe(pos, c)) continue;\n        chon(pos, c);\n        thu(pos + 1, tuTiep(c));\n        bo(pos, c);\n    }\n}\n\nint main() {\n    cin >> n;\n    cot.assign(n, false);\n    cheo1.ass
