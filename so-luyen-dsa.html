ign(2 * n + 1, false);\n    cheo2.assign(2 * n + 1, false);\n    thu(0, 0);\n    printf(\"%lld\\n\", cnt);\n    return 0;\n}\n"},{"key":"hd04-2","title":"Liệt kê tập con có tổng S","tl":1,"sol":"// Liệt kê tập con (theo chỉ số tăng) có tổng đúng S: quay lui chọn dần, cắt nhánh bằng tổng còn lại.\n#include <bits/stdc++.h>\nusing namespace std;\n\nint n;\nlong long S, tong = 0;          // tong = tổng các phần tử đã chọn\nvector<long long> a, con;       // con[i] = a[i] + ... + a[n-1]\nvector<int> x;                  // chỉ số (đánh số từ 1) đã chọn, x[0..sz-1]\nint sz = 0;\nlong long cnt = 0;\nstring out;\n\nint soUngVien() { return n; }\nbool xong(int pos) { return tong == S; }     // a_i dương nên chọn thêm chỉ làm tổng lớn hơn\n\n// Thêm a[c] mà không vượt S thì mới thử tiếp.\nbool hopLe(int pos, int c) { return tong + a[c] <= S; }\nvoid chon(int pos, int c) { tong += a[c]; x[sz++] = c + 1; }\nvoid bo(int pos, int c)   { tong -= a[c]; sz--; }\nint tuTiep(int c) { return c + 1; }            // chỉ số sau phải lớn hơn chỉ số vừa chọn\n\n// Dù lấy hết phần còn lại cũng không đủ S thì bỏ cả nhánh.\nbool catNhanh(int pos, int tu) { return tong + con[tu] < S; }\n\nvoid xuLyCauHinh() {\n    cnt++;\n    for (int i = 0; i < sz; i++) {\n        if (i) out += ' ';\n        out += to_string(x[i]);\n    }\n    out += '\\n';\n}\n\nvoid thu(int pos, int tu) {\n    if (xong(pos)) { xuLyCauHinh(); return; }\n    if (catNhanh(pos, tu)) return;\n    for (int c = tu; c < soUngVien(); c++) {\n        if (!hopLe(pos, c)) continue;\n        chon(pos, c);\n        thu(pos + 1, tuTiep(c));\n        bo(pos, c);\n    }\n}\n\nint main() {\n    cin >> n >> S;\n    a.resize(n);\n    for (auto &v : a) cin >> v;\n    con.assign(n + 1, 0);\n    for (int i = n - 1; i >= 0; i--) con[i] = con[i + 1] + a[i];\n    x.assign(n, 0);\n    thu(0, 0);\n    fputs(out.c_str(), stdout);\n    printf(\"%lld\\n\", cnt);\n    return 0;\n}\n"}]},{"id":"L05","chapter":2,"chapterName":"Đệ quy và chia để trị","title":"Luỹ thừa nhanh và nhân modulo","intro":"Tính a^b mod m khi b lên tới 10^18 hoặc dài hàng trăm chữ số. Lặp b lần là bất khả thi, nhưng chia đôi số mũ chỉ cần khoảng log2(b) phép nhân. Cùng một kỹ thuật dùng được cho ma trận, số Fibonacci thứ n và tổng cấp số nhân.","recognize":["Đề cần a^b mod m với b cỡ 10^9 đến 10^18, hoặc cho b ở dạng xâu chữ số dài. Lặp b lần sẽ quá giờ.","Modulo m lên tới 10^18: tích hai số nhỏ hơn m có thể tới 10^36, vượt xa kiểu 64 bit. Đây là dấu hiệu cần __int128 để nhân.","Đề hỏi \"luỹ thừa ma trận a^k\", \"số Fibonacci thứ n mod m\" với n rất lớn, hoặc mọi dãy cho bởi truy hồi tuyến tính với n cỡ 10^18.","Đề hỏi tổng 1 + a + a^2 + ... + a^n mod m với m bất kỳ (không cho là số nguyên tố, nên không chia được cho a - 1).","Đề chỉ hỏi vài chữ số cuối (mod 10^6) hoặc so sánh kết quả với một ngưỡng, kèm số mũ rất lớn."],"idea":["Chia đôi số mũ: a^b = (a^(b/2))^2 nếu b chẵn, và a · (a^(b/2))^2 nếu b lẻ. Mỗi bước số mũ giảm một nửa nên chỉ cần khoảng 60 bước cho b ≤ 10^18.","Cài đặt lặp theo bit của b: giữ kết quả r = 1 và a. Khi bit thấp nhất của b là 1 thì r = r · a. Sau mỗi bước a = a · a rồi b >>= 1. Cách này không đệ quy nên không lo sâu.","Lấy modulo sau MỌI phép nhân. Phần tử đơn vị là 1 % m chứ không phải 1, để m = 1 cho ra 0. Nhớ rút gọn a % m ngay từ đầu.","Chọn cách nhân an toàn theo cỡ m: nếu m ≤ 3·10^9 thì tích nằm gọn trong long long; nếu m tới 10^18 thì ép sang unsigned __int128 rồi chia lấy dư.","Mọi phép nhân có tính kết hợp đều dùng được cùng vòng lặp: chỉ cần đổi phần tử đơn vị và hàm nhan. Với ma trận, đơn vị là ma trận đơn vị. Số Fibonacci F(n) nằm trong ma trận [[1,1],[1,0]] luỹ thừa n.","Số mũ cho dạng xâu chữ số: duyệt từng chữ số d từ trái sang phải. Nếu r = a^x thì a^(10x + d) = r^10 · a^d, mỗi vế tính bằng chính hàm luỹ thừa nhanh.","Tổng cấp số nhân với m bất kỳ: gọi T(k) = 1 + a + ... + a^(k-1). Khi đó T(2k) = T(k) · (1 + a^k) và T(2k+1) = T(2k) + a^(2k). Đệ quy chia đôi k, mỗi bước dùng một luỹ thừa nhanh."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef unsigned long long ull;\ntypedef unsigned __int128 u128;\n\n// Nhân a*b mod m không tràn. Tích hai số < 10^18 tới 10^36 nên dùng 128 bit.\n// Nếu m <= 3·10^9 thì (a % m) * (b % m) vẫn nằm trong long long, không cần u128.\null nhanMod(ull a, ull b, ull m) { return (u128)a * b % m; }\n\n// Luỹ thừa nhanh cho PHÉP NHÂN BẤT KỲ có tính kết hợp:\n// a: phần tử cơ sở, b: số mũ, donVi: phần tử đơn vị (với số là 1 % m, với ma trận là ma trận đơn vị),\n// nhan(x, y): cách nhân hai phần tử. Thay cặp (donVi, nhan) là dùng được cho số, ma trận, ...\ntemplate <class T, class Nhan>\nT luyThua(T a, ull b, T donVi, Nhan nhan) {\n    T r = donVi;\n    while (b > 0) {\n        if (b & 1) r = nhan(r, a);   // bit hiện tại của b là 1: nhân phần đang giữ vào kết quả\n        a = nhan(a, a);              // bình phương: a, a^2, a^4, a^8, ...\n        b >>= 1;\n    }\n    return r;\n}\n\n// Ví dụ phép nhân ma trận 2x2 modulo m (thay kích thước và phép nhân theo đề).\nstruct Matran { ull v[2][2]; };\nMatran nhanMatran(const Matran& x, const Matran& y, ull m) {\n    Matran z = {{{0, 0}, {0, 0}}};\n    for (int i = 0; i < 2; i++)\n        for (int j = 0; j < 2; j++)\n            for (int k = 0; k < 2; k++)\n                z.v[i][j] = (z.v[i][j] + nhanMod(x.v[i][k], y.v[k][j], m)) % m;\n    return z;\n}\n\nint main() {\n    // Minh hoạ: số Fibonacci thứ n modulo m bằng luỹ thừa ma trận [[1,1],[1,0]].\n    ull n, m;\n    cin >> n >> m;\n    Matran q = {{{1 % m, 1 % m}, {1 % m, 0}}};\n    Matran I = {{{1 % m, 0}, {0, 1 % m}}};\n    Matran r = luyThua<Matran>(q, n, I, [&](const Matran& x, const Matran& y) { return nhanMatran(x, y, m); });\n    cout << r.v[0][1] << \"\\n\";   // F(0) = 0, F(1) = 1, F(2) = 1, ...\n    return 0;\n}\n","skeletonNotes":["nhanMod: nhân hai số modulo m bằng 128 bit. Nếu m nhỏ (≤ 3·10^9) có thể viết (a * b) % m với long long cho nhanh.","luyThua: vòng lặp theo bit của b. Chỉ cần thay donVi và hàm nhan là đổi được kiểu phần tử (số, ma trận, ...). Ví dụ với số: luyThua<ull>(a % m, b, 1 % m, [&](ull x, ull y) { return nhanMod(x, y, m); }).","Matran và nhanMatran: minh hoạ cho phần tử không phải số. Đổi kích thước 2 thành k và các vòng lặp tương ứng khi đề cho ma trận k × k. Phần tử đơn vị là ma trận có 1 % m trên đường chéo.","main minh hoạ Fibonacci F(n) mod m. Với bài khác, thay phần đọc đề và cách dựng ma trận cơ sở; phần luyThua giữ nguyên."],"complexity":["Luỹ thừa số: O(log b) phép nhân modulo. Với b ≤ 10^18 chỉ khoảng 120 phép nhân.","Luỹ thừa ma trận k × k: O(k^3 log b). Với k ≤ 10 và b ≤ 10^9 chạy rất nhanh.","Số mũ ở dạng xâu L chữ số: O(L · log 10), tức vài chục phép nhân cho mỗi chữ số.","Bộ nhớ O(1) với số, O(k^2) với ma trận."],"pitfalls":["Nhân hai số cỡ 10^18 bằng long long rồi mới %: tràn số âm thầm, kết quả sai mà không báo lỗi. Với m lớn phải dùng __int128.","Quên rút gọn a % m trước khi nhân khi a ≥ m. Quên 1 % m cho phần tử đơn vị: với m = 1 kết quả phải là 0 chứ không phải 1.","In unsigned __int128 trực tiếp bằng cout không biên dịch được. Ép về unsigned long long (kết quả đã nhỏ hơn m ≤ 10^18) rồi mới in.","Trừ modulo ra số âm: dùng (x - y % m + m) % m. Phép chia modulo không có sẵn, phải đổi sang cách khác (chia để trị như tổng cấp số nhân).","Khi đề hỏi \"nếu kết quả vượt ngưỡng thì in vài chữ số cuối\": phần dư mất thông tin về độ lớn, nên phải theo dõi riêng xem giá trị thật đã vượt ngưỡng chưa (nhân có chặn trên).","Đọc số mũ 10^18 vào int, hoặc viết 1 << 60 thay vì 1LL << 60. Dùng long long hoặc unsigned long long cho mọi biến liên quan."],"practice":["dq-L1","dq-L2","dq-L3","dq-F","dq-P"],"examples":[{"key":"hd05-1","title":"Luỹ thừa với số mũ khổng lồ","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef unsigned long long ull;\ntypedef unsigned __int128 u128;\n\n// Nhân a*b mod m không tràn: tích có thể tới 10^36, nên tính bằng 128 bit.\null nhanMod(ull a, ull b, ull m) { return (u128)a * b % m; }\n\n// Luỹ thừa nhanh: tính a^b theo phép nhân tuỳ ý (ở đây là nhân modulo).\ntemplate <class T, class Nhan>\nT luyThua(T a, ull b, T donVi, Nhan nhan) {\n    T r = donVi;\n    while (b > 0) {\n        if (b & 1) r = nhan(r, a);\n        a = nhan(a, a);\n        b >>= 1;\n    }\n    return r;\n}\n\n// a^b mod m khi b là xâu chữ số thập phân.\n// Đọc từng chữ số d của b: a^(10x + d) = (a^x)^10 * a^d.\null luyThuaXau(ull a, const string& b, ull m) {\n    auto nhan = [&](ull x, ull y) { return nhanMod(x, y, m); };\n    ull r = 1 % m;                       // 1 % m để đúng khi m = 1\n    for (char c : b) {\n        r = luyThua<ull>(r, 10, 1 % m, nhan);                // r = r^10\n        ull ad = luyThua<ull>(a % m, c - '0', 1 % m, nhan);  // a^d\n        r = nhan(r, ad);\n    }\n    return r;\n}\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        ull a, m;\n        string b;\n        cin >> a >> b >> m;\n        cout << luyThuaXau(a, b, m) << \"\\n\";\n    }\n    return 0;\n}\n"}]},{"id":"L06","chapter":2,"chapterName":"Đệ quy và chia để trị","title":"Đệ quy chia trường hợp","intro":"Đệ quy đưa một bài về các bài con cùng dạng nhưng nhỏ hơn, cộng thêm trường hợp cơ sở để dừng. Dạng này dạy cách đặt hàm đệ quy cho đúng, cách tìm phần tử thứ k của một đối tượng khổng lồ mà không dựng ra nó, và cách in một quy trình có cấu trúc lặp lại.","recognize":["Đề định nghĩa đối tượng cấp n bằng cách ghép các đối tượng cấp nhỏ hơn (f_n = f_{n-1} + f_{n-2}, có thể xen một phần tử đơn ở giữa). Cận n chỉ vài chục nhưng độ dài tăng theo cấp số nhân.","Đề hỏi \"ký tự thứ k\", \"đếm ký tự trong k ký tự đầu\", hoặc \"xâu thứ k theo thứ tự từ điển\" của đối tượng quá lớn để dựng ra.","Đề bảo in dãy thao tác của một quy trình lặp lại ở nhiều cỡ (chuyển n đĩa, chia đôi bài toán), số bước tăng như 2^n với n khoảng 20 trở xuống.","Cách giải tự nhiên là xét phần tử đầu rồi chia trường hợp: chọn hay không chọn, ký tự đầu là a hay b, rồi quy về bài nhỏ hơn.","Lời giải mô tả được bằng câu \"giả sử đã làm được bài nhỏ hơn thì làm bài này thế nào\", còn vét cạn trực tiếp thì không khả thi."],"idea":["Đặt tên và nói rõ hàm làm gì: giai(n, ...) làm gì, tham số nào chỉ kích thước, tham số nào là ngữ cảnh đi kèm (cột nguồn, vị trí...).","Viết trường hợp cơ sở TRƯỚC (thường n = 0 hoặc n = 1). Mỗi lời gọi con phải làm kích thước giảm thật sự, nếu không sẽ lặp vô hạn.","Chia: liệt kê các bài con và phần việc riêng của mức hiện tại. Thứ tự gọi chính là thứ tự thực hiện, nên cũng là thứ tự in.","Ngữ cảnh có thể đổi vai trò giữa các lời gọi (nguồn, đích, trung gian hoán đổi). Hãy tự hỏi \"bài con này muốn đích là gì\" cho từng lời gọi và kiểm tra với n = 1, 2 bằng tay.","Tìm phần tử thứ k: tính trước dai[n] là độ dài của cấp n. Tại mỗi mức, so k với độ dài phần con đầu. Nếu k nằm trong phần đó thì đi xuống nó, nếu không thì trừ k đi độ dài phần đó rồi xét phần kế. Không bao giờ dựng xâu.","Đếm hoặc tìm theo thứ tự từ điển: chia theo ký tự đầu. Số đối tượng bắt đầu bằng ký tự nhỏ nhất đếm được bằng công thức hoặc bảng nhỏ. So k với số đó để biết ký tự đầu, rồi đệ quy với phần còn lại.","Nếu cùng một bài con bị gọi lặp lại nhiều lần (cùng tham số) thì thêm bảng nhớ (memo). Nếu mỗi bài con khác nhau thì không cần."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\n// ===== Phần A: đệ quy \"làm việc ở mức này + gọi các bài con\" (in/đếm các bước) =====\nstruct NguCanh { int tu, den, qua; };   // thông tin đi kèm bài toán, thay theo đề (vai trò, vị trí, ...)\nll soBuoc = 0;                          // kết quả tích luỹ: đếm, tổng, hoặc nối vào một string để in\n\nbool laCoSo(int n) { return n <= 0; }   // bài nhỏ nhất: trả lời thẳng, không chia nữa\n\n// Phần việc riêng của mức n, làm giữa hai nhóm bài con. Thay thân hàm theo đề.\nvoid xuLyBuocGhep(int n, const NguCanh& c) { soBuoc++; }\n\n// Ngữ cảnh truyền cho bài con thứ lanGoi (0 hoặc 1). Mặc định giữ nguyên; nhiều bài phải đổi vai trò ở đây.\nNguCanh doiVaiTro(const NguCanh& c, int lanGoi) { return c; }\n\nvoid giai(int n, const NguCanh& c) {\n    if (laCoSo(n)) return;\n    giai(n - 1, doiVaiTro(c, 0));   // bài con 1 (kích thước nhỏ hơn)\n    xuLyBuocGhep(n, c);             // việc của mức hiện tại\n    giai(n - 1, doiVaiTro(c, 1));   // bài con 2\n}\n\n// ===== Phần B: đối tượng cấp n được ghép từ các đối tượng cấp nhỏ hơn; hỏi \"phần tử thứ k\" =====\nconst int MAXN = 90;\nll dai[MAXN];                            // dai[n] = độ dài (số phần tử) của đối tượng cấp n\n\n// Các cấp con ghép lại theo thứ tự để tạo cấp n. Thay theo định nghĩa của đề\n// (nếu có phần tử đơn xen giữa thì xử lý thêm ở hai hàm dưới).\nvector<int> chia(int n) { return {n - 1, n - 2}; }\nchar kyTuCoSo(int n) { return n == 0 ? 'a' : 'b'; }   // đối tượng cấp cơ sở\n\nvoid tinhTruoc() {\n    dai[0] = dai[1] = 1;\n    for (int n = 2; n < MAXN; n++) {\n        dai[n] = 0;\n        for (int c : chia(n)) dai[n] += dai[c];\n    }\n}\n\n// Ký tự thứ k (đánh số từ 1) của đối tượng cấp n, không dựng cả đối tượng.\nchar timKyTu(int n, ll k) {\n    if (n <= 1) return kyTuCoSo(n);\n    for (int c : chia(n)) {\n        if (k <= dai[c]) return timKyTu(c, k);   // k rơi vào phần con này\n        k -= dai[c];                              // bỏ qua phần con này, sang phần kế\n    }\n    return '?';   // không xảy ra nếu 1 <= k <= dai[n]\n}\n\nint main() {\n    int n;\n    ll k;\n    cin >> n >> k;\n    if (n <= 20) {                       // phần A chạy 2^n lần nên chỉ dùng khi n nhỏ\n        giai(n, {1, 3, 2});\n        cout << soBuoc << \"\\n\";\n    }\n    tinhTruoc();\n    cout << timKyTu(n, k) << \"\\n\";\n    return 0;\n}\n","skeletonNotes":["Phần A (NguCanh, laCoSo, xuLyBuocGhep, doiVaiTro, giai): bộ khung đệ quy \"bài con - việc ở mức này - bài con\". Thay xuLyBuocGhep để đếm, cộng dồn hay nối vào một string để in; thay doiVaiTro khi ngữ cảnh đổi giữa các lần gọi; thêm lời gọi con nếu đề chia thành nhiều bài con.","Phần B (chia, kyTuCoSo, dai, tinhTruoc, timKyTu): dành cho \"phần tử thứ k\". chia(n) liệt kê các cấp con theo thứ tự ghép. Nếu định nghĩa có phần tử đơn xen giữa (ví dụ một ký tự cố định), cộng 1 vào dai[n] và xử lý riêng trong timKyTu.","MAXN và kiểu long long: chọn MAXN theo cận n của đề và kiểm tra dai[MAXN - 1] còn vừa 64 bit.","main chỉ minh hoạ cách gọi. Điều kiện n ≤ 20 dành cho phần A vì nó chạy 2^n lần."],"complexity":["Quy trình in từng bước (kiểu tháp Hà Nội): O(2^n) thời gian và độ sâu đệ quy O(n). Chỉ dùng được khi n ≤ khoảng 20 hoặc đề chỉ yêu cầu in ít bước.","Tìm phần tử thứ k bằng độ dài tính trước: O(n) tính trước, O(n) cho mỗi truy vấn, bộ nhớ O(n). Dựng xâu thật sẽ tốn O(độ dài) và không thể với độ dài 10^18.","Có bảng nhớ: số trạng thái nhân thời gian xử lý một trạng thái."],"pitfalls":["Thiếu hoặc sai trường hợp cơ sở: đệ quy không bao giờ dừng, chương trình tràn ngăn xếp. Kiểm tra n nhỏ nhất đề cho phép (n = 0, n = 1).","Độ dài dai[n] tăng rất nhanh, tính quá n đề cho sẽ tràn long long. Chỉ tính tới n tối đa của đề, hoặc chặn trên bằng một hằng lớn như 2·10^18.","Sai chỉ số khi rẽ sang phần sau: phải k -= dai[phần đầu]. Thống nhất đánh số từ 1 hay từ 0 xuyên suốt, đề thường cho từ 1.","Quên một phần tử đơn xen giữa trong định nghĩa (f_i = f_{i-1} + c + f_{i-2}) nên độ dài tính thiếu 1 ở mỗi cấp.","In hàng chục nghìn dòng bằng cout kèm endl rất chậm. Gom vào một string rồi in một lần, hoặc dùng \"\\n\" thay endl.","Đệ quy sâu cỡ 10^5 trở lên (ví dụ đệ quy theo từng phần tử mảng) có thể tràn ngăn xếp. Khi độ sâu không phải log n thì đổi sang vòng lặp.","Dùng bảng nhớ toàn cục nhưng quên đặt lại giữa các bộ test, nên giá trị của bộ test trước còn sót lại."],"practice":["dq-G","dq-J","dq-K","dq-Q"],"examples":[{"key":"hd06-1","title":"Tháp Hà Nội","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nstring ketQua;   // các nước đi, mỗi nước một dòng \"x y\"\n\n// Bài cơ sở: không còn đĩa nào thì không phải làm gì.\nbool laCoSo(int n) { return n == 0; }\n\n// Việc làm ở mức này: chuyển đĩa lớn nhất của n đĩa từ cột tu sang cột den.\nvoid xuLyBuocGhep(int tu, int den) {\n    ketQua += char('0' + tu);\n    ketQua += ' ';\n    ketQua += char('0' + den);\n    ketQua += '\\n';\n}\n\n// Chuyển n đĩa trên cùng của cột tu sang cột den, dùng cột qua làm trung gian.\nvoid giai(int n, int tu, int den, int qua) {\n    if (laCoSo(n)) return;\n    giai(n - 1, tu, qua, den);   // bài con 1: n-1 đĩa nhỏ nhường chỗ sang cột trung gian\n    xuLyBuocGhep(tu, den);       // đĩa lớn nhất đi thẳng tới đích\n    giai(n - 1, qua, den, tu);   // bài con 2: n-1 đĩa nhỏ từ trung gian sang đích\n}\n\nint main() {\n    int n;\n    cin >> n;\n    giai(n, 1, 3, 2);\n    cout << (1LL << n) - 1 << \"\\n\" << ketQua;   // số nước đi là 2^n - 1\n    return 0;\n}\n"}]},{"id":"L07","chapter":3,"chapterName":"Tham lam","title":"Tham lam: sắp xếp, đếm và quét","intro":"Nhiều bài tối ưu giải được bằng một quy tắc chọn đúng rồi làm một lượt, không quay lại. Quy tắc đó thường đến từ ba việc: sắp xếp phần tử theo tiêu chí đúng rồi duyệt, đếm số phần tử theo nhóm rồi quyết định từng nhóm, hoặc sắp các mốc rồi quét với một bộ đếm. Khó khăn duy nhất là tìm quy tắc đúng và tin chắc nó đúng.","recognize":["Đề hỏi số phần tử nhiều nhất hoặc ít nhất, hoặc giá trị lớn nhất/nhỏ nhất, dưới một điều kiện cục bộ giữa các phần tử (không chồng nhau, tổng hai phần tử không quá c, ...), với n từ 10^5 trở lên. Vét cạn và quy hoạch động O(n^2) không đủ.","Mỗi phần tử chỉ có một hai con số (thời điểm bắt đầu và kết thúc, trọng lượng, hai thời gian cho hai người) và có một thứ tự tự nhiên để xét. Đề cho phép đổi chỗ hoặc ghép tuỳ ý nên thứ tự ban đầu không quan trọng.","Từ khoá: \"nhiều nhất không chồng nhau\", \"ít người nhất\", \"ghép thành số lớn nhất\", \"chênh lệch nhỏ nhất\", \"chia cho hai người sao cho tổng nhỏ nhất\".","Điều kiện chỉ phụ thuộc phần dư hoặc nhóm của phần tử (tổng hai phần tử không chia hết cho k, ...): đếm số phần tử mỗi nhóm rồi chọn nhóm nào lấy, nhóm nào bỏ.","Có phép biến đổi qua lại giữa các ký tự, hoặc xâu bị ngăn bởi ký tự cố định, và hỏi xâu nhỏ nhất theo từ điển: tìm đại lượng không đổi của mỗi đoạn rồi dựng đáp án tốt nhất từ đại lượng đó.","Chọn một giá trị chung để tối đa tổng, mỗi phần tử có khoảng giá trị \"tốt\" của riêng nó: sắp các đầu mút rồi quét, chỉ thử những điểm mà kết quả có thể đổi.","Cho n hoặc một số rất lớn (tới 10^18) và hỏi cần tăng ít nhất bao nhiêu để thoả điều kiện trên chữ số: thử đích đến là các số \"tròn\" ở từng hàng, từ hàng thấp lên cao.","Hỏi số nhóm ít nhất khi chia dãy thành các dãy con có cấu trúc đều (mỗi ký tự xuất hiện bằng nhau): thường chỉ cần quét một lượt, giữ bộ đếm từng ký tự.","Thử vài ví dụ nhỏ bằng tay thì thấy một phần tử đặc biệt (nhỏ nhất, kết thúc sớm nhất, lớn nhất, lớn thứ hai) luôn có mặt trong một đáp án tốt."],"idea":["Xác định thứ tự xét. Thử các ứng viên (kết thúc sớm nhất, nhỏ nhất, lớn nhất, hiệu a - b, so sánh a+b với b+a) trên ví dụ nhỏ và tìm phản ví dụ cho từng cái. Tiêu chí nào còn lại sau khi loại là ứng viên.","Thuyết phục bản thân bằng lập luận trao đổi: giả sử có đáp án tối ưu không chứa lựa chọn đầu tiên theo thứ tự tham lam. Thay phần tử đầu tiên của đáp án đó bằng lựa chọn tham lam thì đáp án không xấu đi. Vậy luôn có đáp án tối ưu chứa lựa chọn tham lam.","Kiểu 1, sắp xếp rồi duyệt: sắp theo tiêu chí đó với comparator chặt (hoà nhau thì dùng khoá phụ). Duyệt một lượt, giữ trạng thái nhỏ nhất đủ để quyết định (mốc kết thúc của phần tử chọn gần nhất, tổng đang giữ...). Phần tử nào chọn được thì chọn ngay. Có bài sau khi sắp chỉ cần nhìn một đoạn liên tiếp hoặc một vị trí đặc biệt của mảng.","Kiểu 2, đếm theo nhóm: nếu điều kiện chỉ phụ thuộc nhóm của phần tử (phần dư, loại ký tự, độ dài), hãy đếm số phần tử mỗi nhóm. Với từng nhóm hoặc từng cặp nhóm xung đột, quyết định riêng: lấy hết, lấy bên có nhiều phần tử hơn, hoặc lấy tối đa một. Các quyết định độc lập nên cộng lại là xong.","Kiểu 3, quét: biến mỗi phần tử thành các sự kiện (điểm, +1 hoặc -1) hoặc các mốc đáng thử, sắp theo điểm, đi một lượt và giữ bộ đếm. Chỉ cần ghi nhận giá trị tốt nhất tại các mốc có thể làm hàm đánh giá đổi.","Với số cho theo chữ số, tham lam là chọn đích đến \"gần nhất mà vẫn thoả\": đích thường có dạng làm tròn lên một số hàng thấp thành 0. Thử lần lượt từng số hàng bị làm tròn, từ ít đến nhiều, và dừng ở lần đầu thoả điều kiện.","Kiểm tra bằng vét cạn với n ≤ 10 trên nhiều test ngẫu nhiên. Tham lam sai gần như luôn sai ngay trên bộ nhỏ.","Nếu mọi tiêu chí đều có phản ví dụ (cái túi 0/1, đổi tiền với mệnh giá bất kỳ) thì bài cần quy hoạch động chứ không tham lam."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\n// ===== Phần A: sắp xếp theo tiêu chí tham lam rồi duyệt một lượt =====\nstruct Muc { ll x, y; };   // một phần tử cần xét; đổi tên, thêm trường theo đề (chỉ số gốc, trọng lượng, ...)\nstruct TrangThai {         // mọi thứ cần nhớ về các phần tử đã chọn\n    int daChon = 0;\n    ll moc = LLONG_MIN;    // ví dụ: giá trị của phần tử chọn gần nhất\n};\n\n// Tiêu chí sắp xếp: phần tử đứng trước sẽ được xét trước. Đây là chỗ quan trọng nhất của tham lam.\n// Phải là thứ tự chặt (dùng <, không dùng <=); hoà nhau thì thêm khoá phụ.\nbool truoc(const Muc& p, const Muc& q) { return p.y < q.y; }\n\n// Phần tử m có thể chọn thêm vào các phần tử đã chọn không?\nbool chonDuoc(const Muc& m, const TrangThai& st) { return true; }\n\n// Ghi nhận đã chọn m: cập nhật số lượng, tổng, mốc...\nvoid chon(const Muc& m, TrangThai& st) {\n    st.daChon++;\n    st.moc = m.y;\n}\n\nint giaiSapXep(vector<Muc> v) {\n    sort(v.begin(), v.end(), truoc);          // 1. sắp xếp theo tiêu chí tham lam\n    TrangThai st;\n    for (const Muc& m : v)                    // 2. duyệt một lượt, chọn là chọn luôn, không quay lại\n        if (chonDuoc(m, st)) chon(m, st);\n    return st.daChon;\n}\n\n// ===== Phần B: đếm số phần tử theo nhóm, rồi quyết định từng nhóm (hoặc từng cặp nhóm) =====\nconst int SO_NHOM = 10;                       // số nhóm; thay theo đề (ví dụ k nhóm theo phần dư)\nint nhom(ll x) { return (int)(((x % SO_NHOM) + SO_NHOM) % SO_NHOM); }   // phần tử x thuộc nhóm nào\n\n// Từ bảng đếm dem[g], tính số phần tử chọn được. Mặc định lấy hết mọi nhóm.\n// Thay theo đề: nhóm nào xung đột với nhóm nào thì chỉ lấy một bên, nhóm tự xung đột thì lấy tối đa một phần tử.\nll gopNhom(const vector<ll>& dem) {\n    ll kq = 0;\n    for (ll c : dem) kq += c;\n    return kq;\n}\n\nll giaiDem(const vector<ll>& a) {\n    vector<ll> dem(SO_NHOM, 0);\n    for (ll x : a) dem[nhom(x)]++;\n    return gopNhom(dem);\n}\n\n// ===== Phần C: quét các mốc theo thứ tự, giữ một bộ đếm đang hiệu lực =====\nstruct SuKien { ll diem; int delta; };        // tại 'diem', số phần tử đang hiệu lực thay đổi delta (+1 bắt đầu, -1 kết thúc)\n\n// Giá trị của trạng thái \"có dangCo phần tử đang hiệu lực\". Thay theo đề.\nll danhGia(ll dangCo) { return dangCo; }\n\nll giaiQuet(vector<SuKien> sk) {\n    // Cùng một điểm thì xử lý +1 trước (đầu mút chạm nhau vẫn tính chung); muốn không tính chung thì xử lý -1 trước.\n    sort(sk.begin(), sk.end(), [](const SuKien& a, const SuKien& b) {\n        return a.diem != b.diem ? a.diem < b.diem : a.delta > b.delta;\n    });\n    ll dang = 0, tot = LLONG_MIN;\n    for (const SuKien& e : sk) {\n        dang += e.delta;\n        tot = max(tot, danhGia(dang));        // ghi nhận giá trị tốt nhất sau mỗi mốc\n    }\n    return tot;\n}\n\nint main() {\n    // main minh hoạ Phần A. Phần B và C được gọi tương tự: đọc đề, dựng vector tương ứng, gọi hàm, in kết quả.\n    int n;\n    scanf(\"%d\", &n);\n    vector<Muc> v(n);\n    for (auto& m : v) scanf(\"%lld %lld\", &m.x, &m.y);\n    printf(\"%d\\n\", giaiSapXep(v));\n    return 0;\n}\n","skeletonNotes":["Phần A, Muc: phần tử cần xét. Đổi tên trường và thêm trường theo đề; nếu cần in chỉ số gốc thì lưu thêm id.","truoc: tiêu chí sắp xếp, là chỗ quyết định bài đúng hay sai. Mặc định sắp theo y tăng dần. Dùng thứ tự chặt và thêm khoá phụ khi hoà.","TrangThai, chonDuoc, chon: tối thiểu thông tin cần nhớ về phần đã chọn, điều kiện để chọn thêm m, và cách cập nhật sau khi chọn. Mặc định chonDuoc luôn đúng nên khung chưa cho đáp án có ý nghĩa cho tới khi bạn thay. Nếu đáp án không phải số lượng (tổng, hiệu...) thì cộng dồn trong chon rồi trả về trường tương ứng.","Phần B, nhom và gopNhom: nhom(x) cho biết x thuộc nhóm nào (mặc định theo phần dư, thay SO_NHOM và công thức theo đề). gopNhom nhận bảng đếm và tính đáp án; mặc định lấy hết, bạn thay bằng quy tắc xung đột của đề.","Phần C, SuKien, danhGia, giaiQuet: mỗi phần tử đổi thành một hoặc hai sự kiện. danhGia nhận số phần tử đang hiệu lực và trả giá trị cần tối ưu; nếu giá trị còn phụ thuộc loại sự kiện thì thêm trường vào SuKien. Mặc định trả về chính bộ đếm. Thứ tự xử lý +1 và -1 ở cùng một điểm quyết định đầu mút có tính chung hay không.","main chỉ minh hoạ Phần A. Với bài khác, đọc đề, dựng vector tương ứng rồi gọi giaiDem hoặc giaiQuet; bài chỉ cần quan sát sau khi sắp thì dùng sort rồi đọc đáp án ở vị trí cần thiết."],"complexity":["Sắp xếp O(n log n) chiếm phần lớn, duyệt hoặc quét O(n). Bộ nhớ O(n).","Đếm theo nhóm không cần sắp xếp: O(n + số nhóm). Bài làm tròn chữ số chỉ thử khoảng 19 đích đến, mỗi đích tính trong O(số chữ số).","Với n = 2·10^5 hoặc 10^6 chạy trong chưa đến 1 giây. Giá trị tới 10^9 thì tổng nên dùng long long."],"pitfalls":["Chọn nhầm tiêu chí sắp xếp. Với bài chọn hoạt động, sắp theo thời điểm bắt đầu hay theo độ dài đều sai; phải sắp theo thời điểm kết thúc. Luôn tìm phản ví dụ trước khi cài.","Comparator dùng <= hoặc không nhất quán gây lỗi chạy hoặc sắp sai ngẫu nhiên. Phải là thứ tự chặt: hoà nhau thì trả false.","Sai biên của điều kiện chọn: hai khoảng chạm đầu mút (f_i = s_j) có chồng nhau không? Đọc đề rồi chọn >= hay >. Khi quét, thứ tự xử lý +1 và -1 ở cùng một điểm cũng là câu hỏi này.","Tràn int khi cộng tổng hay lấy hiệu cỡ 10^9, hoặc khi nhân số lượng với giá trị. Dùng long long từ đầu cho mọi đại lượng cộng dồn.","Ghép chuỗi số: so sánh a + b với b + a trên xâu, không so sánh theo giá trị số. So theo giá trị cho kết quả sai với 9 và 91.","Sắp xếp làm mất thứ tự gốc trong khi đề cần in chỉ số hoặc vị trí ban đầu. Lưu chỉ số trong phần tử trước khi sort.","Đề cho dãy nhưng không cho phép đổi chỗ (phần tử phải giữ thứ tự): sắp xếp bị cấm. Đọc kỹ đề để phân biệt \"tập\" và \"dãy\".","Đếm theo nhóm: một nhóm có thể xung đột với chính nó (hai phần tử cùng nhóm đã vi phạm), và mỗi cặp nhóm xung đột chỉ được tính một lần. Quên hai ca này làm đáp án dư hoặc thiếu. Phần dư phải đưa về khoảng [0, k) nếu có số âm.","Quét giá trị chung: không thể thử mọi giá trị tới 10^9. Chỉ thử các điểm mà đáp án có thể đổi (đầu mút và các điểm liền kề đầu mút), và nhớ thử cả một điểm ngoài mọi khoảng nếu đề cho phép.","Đáp án đoán sau khi quan sát ví dụ mà chưa chứng minh: nhiều quy tắc \"đẹp\" sai khi có phần tử trùng nhau, n nhỏ (n = 2) hoặc mọi phần tử bằng nhau. Luôn thử các ca biên này và so với vét cạn."],"practice":["tl-C","tl-A","tl-E","tl-M","tl-J","tl-B","tl-P","tl-O","tl-G","tl-I","tl-F","tl-K","tl-H","tl-N","tl-L"],"examples":[{"key":"hd07-1","title":"Chọn nhiều hoạt động nhất","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\nstruct Muc { ll batDau, ketThuc; };            // một hoạt động [batDau, ketThuc)\nstruct TrangThai { int daChon = 0; ll moc = LLONG_MIN; };  // moc: thời điểm kết thúc của hoạt động chọn gần nhất\n\n// Tiêu chí sắp xếp: hoạt động kết thúc sớm đứng trước.\nbool truoc(const Muc& p, const Muc& q) { return p.ketThuc < q.ketThuc; }\n\n// Chọn được nếu bắt đầu không sớm hơn lúc hoạt động đã chọn gần nhất kết thúc.\nbool chonDuoc(const Muc& m, const TrangThai& st) { return m.batDau >= st.moc; }\n\nvoid chon(const Muc& m, TrangThai& st) {\n    st.daChon++;\n    st.moc = m.ketThuc;\n}\n\n// Sắp theo thời điểm kết thúc rồi duyệt một lượt, chọn ngay khi chọn được.\nint giaiSapXep(vector<Muc> v) {\n    sort(v.begin(), v.end(), truoc);\n    TrangThai st;\n    for (const Muc& m : v)\n        if (chonDuoc(m, st)) chon(m, st);\n    return st.daChon;\n}\n\nint main() {\n    int n;\n    scanf(\"%d\", &n);\n    vector<Muc> v(n);\n    for (auto& m : v) scanf(\"%lld %lld\", &m.batDau, &m.ketThuc);\n    printf(\"%d\\n\", giaiSapXep(v));\n    return 0;\n}\n"}]},{"id":"L08","chapter":3,"chapterName":"Tham lam","title":"Tham lam với hàng đợi ưu tiên","intro":"Khi tập ứng viên thay đổi liên tục (thêm phần tử mới, bỏ phần tử tệ nhất) thì sắp xếp một lần là chưa đủ. Hàng đợi ưu tiên cho phép lấy phần tử nhỏ nhất hoặc lớn nhất trong O(log n), nên ta chọn tạm tất cả rồi bỏ dần phần tử tệ nhất mỗi khi vi phạm điều kiện.","recognize":["Mỗi bước phải lấy phần tử nhỏ nhất (hoặc lớn nhất) của một tập vừa được thêm vừa bị bớt phần tử. Nếu tập thay đổi qua các bước thì sắp xếp một lần không đủ.","Có hạn chót, giới hạn chỗ, hoặc ràng buộc kiểu \"tổng đang giữ không được âm\", và n tới 10^5 hoặc 10^6.","Đề cho phép chọn hoặc bỏ từng phần tử, muốn giữ nhiều hoặc giá trị lớn nhất, nhưng khi quá tải thì phải bỏ bớt.","Hoặc đề lặp lại thao tác \"gộp hai phần tử nhỏ nhất\" (nối dây, ghép đống, cắt thanh) và hỏi tổng chi phí nhỏ nhất.","Lời giải mong đợi dùng priority_queue hoặc multiset, thời gian O(n log n)."],"idea":["Chọn trục để quét (hạn chót tăng dần, vị trí tăng dần) và sắp phần tử theo trục đó.","Giữ một min-heap chứa các phần tử \"đang giữ tạm\". Đỉnh heap là phần tử tệ nhất trong số đó.","Với mỗi phần tử mới: đẩy vào heap, cộng vào tổng, giả sử chọn nó.","Nếu điều kiện bị vi phạm (nhiều phần tử hơn số chỗ tới hạn, tổng đang âm...), bỏ phần tử tệ nhất khỏi heap (lấy top, trừ khỏi tổng, pop). Có thể bỏ chính phần tử vừa thêm. Lặp lại đến khi hết vi phạm.","Khi quét xong, nội dung heap chính là tập tối ưu: đáp án là tổng hoặc kích thước heap.","Vì sao đúng: bỏ phần tử tệ nhất mỗi lần quá tải không bao giờ làm tập giữ lại xấu đi. Quét theo hạn chót tăng dần nên khi xét tới x, chỉ x và các phần tử trước nó cạnh tranh các chỗ tới hạn của x.","Biến thể gộp: lấy hai phần tử nhỏ nhất, đẩy tổng của chúng trở lại và cộng tổng đó vào chi phí, lặp tới khi còn một phần tử. Phần tử nhỏ nhất được gộp sớm nhất nên nằm sâu nhất trong cây gộp."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\nstruct Viec { ll khoa, giaTri; };   // khoa: trục để quét (hạn chót, vị trí, ...); giaTri: số đưa vào heap\n\n// Thứ tự quét. Thường tăng dần theo khoa.\nbool truoc(const Viec& a, const Viec& b) { return a.khoa < b.khoa; }\n\n// Sau khi đã đẩy v vào heap (heap có soDangGiu phần tử, tổng đang giữ là tong), điều kiện của đề có bị vi phạm không?\n// Nếu có, phải bỏ đi một phần tử. Thay điều kiện theo đề (quá số chỗ, tổng đang âm, ...).\nbool vuotGioiHan(size_t soDangGiu, ll tong, const Viec& v) { return false; }\n\nint main() {\n    int n;\n    scanf(\"%d\", &n);\n    vector<Viec> v(n);\n    for (auto& x : v) scanf(\"%lld %lld\", &x.khoa, &x.giaTri);\n    sort(v.begin(), v.end(), truoc);\n\n    priority_queue<ll, vector<ll>, greater<ll>> pq;   // min-heap: đỉnh là phần tử \"tệ nhất\" đang giữ\n    ll tong = 0;                                      // tổng giá trị các phần tử đang giữ\n    for (const Viec& x : v) {\n        pq.push(x.giaTri);                // 1. cứ giả sử chọn x\n        tong += x.giaTri;\n        while (vuotGioiHan(pq.size(), tong, x)) {   // 2. nếu vi phạm điều kiện thì \"hối hận\":\n            tong -= pq.top();                 //    bỏ phần tử tệ nhất (có thể chính là x)\n            pq.pop();\n        }\n    }\n    printf(\"%lld %zu\\n\", tong, pq.size());    // 3. đáp án là tổng, hoặc số phần tử còn trong heap\n    return 0;\n}\n","skeletonNotes":["Viec: khoa là trục quét (hạn chót, vị trí), giaTri là số đưa vào heap (lợi nhuận, giá trị...). Thêm trường nếu cần.","truoc: thứ tự quét. Mặc định khoa tăng dần.","vuotGioiHan(soDangGiu, tong, v): điều kiện vi phạm sau khi đã thêm v. Mặc định luôn false nên khung giữ lại hết phần tử. Với bài có hạn chót, điều kiện là kích thước heap lớn hơn hạn chót của v. Với bài \"tổng không được âm\", điều kiện là tong < 0.","priority_queue<ll, vector<ll>, greater<ll>> là min-heap. Muốn bỏ phần tử lớn nhất thì dùng max-heap mặc định. Bài gộp hai phần tử nhỏ nhất không quét mà lặp: lấy hai top, push tổng.","Dòng in cuối in cả tổng lẫn số phần tử để bạn chọn đại lượng đề hỏi."],"complexity":["Sắp xếp O(n log n), mỗi phần tử vào và ra heap tối đa một lần: O(n log n) cho toàn bộ. Bộ nhớ O(n).","Với n = 2·10^5 chạy dưới 0,2 giây. Tổng lợi nhuận tới n · 10^9 nên cần long long."],"pitfalls":["priority_queue mặc định là max-heap. Quên greater<> khi cần min-heap sẽ bỏ nhầm phần tử tốt nhất.","Không sắp xếp theo hạn chót hoặc theo trục quét trước khi duyệt: heap bỏ nhầm và đáp án thấp hơn tối ưu.","Tổng lợi nhuận vượt 32 bit: n = 2·10^5 phần tử giá trị 10^9 cho 2·10^14. Dùng long long cho tong và mọi giá trị trong heap.","So sánh kích thước heap (size_t, không dấu) với số âm hoặc ll: ép kiểu rõ ràng để không có kết quả bất ngờ.","Gọi top() hoặc pop() khi heap rỗng (ví dụ biến thể gộp khi n = 1). Kiểm tra kích thước trước.","Hạn chót rất lớn (10^9) nên không tạo mảng chỗ theo thời gian. Chỉ cần so sánh với kích thước heap.","Biến thể gộp: quên đẩy tổng trở lại heap, hoặc cộng chi phí sai (chi phí là tổng hai phần tử vừa lấy chứ không phải tổng hiện tại)."],"practice":["tl-Q","tl-D","nx-G"],"examples":[{"key":"hd08-1","title":"Xếp việc có hạn chót","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\nstruct Viec { ll han, loi; };   // hạn chót và lợi nhuận\n\n// Xét các việc theo hạn chót tăng dần.\nbool truoc(const Viec& a, const Viec& b) { return a.han < b.han; }\n\n// Heap đang giữ soDangGiu việc (đã tính cả v). Nếu nhiều hơn số đơn vị thời gian\n// tới hạn của v thì không thể làm kịp hết: phải bỏ bớt một việc.\nbool vuotGioiHan(size_t soDangGiu, ll tong, const Viec& v) { (void)tong; return (ll)soDangGiu > v.han; }\n\nint main() {\n    int n;\n    scanf(\"%d\", &n);\n    vector<Viec> v(n);\n    for (auto& x : v) scanf(\"%lld %lld\", &x.han, &x.loi);\n    sort(v.begin(), v.end(), truoc);\n\n    priority_queue<ll, vector<ll>, greater<ll>> pq;   // min-heap lợi nhuận các việc đang giữ\n    ll tong = 0;\n    for (const Viec& x : v) {\n        pq.push(x.loi);\n        tong += x.loi;\n        while (vuotGioiHan(pq.size(), tong, x)) {   // quá tải: bỏ việc lợi nhuận nhỏ nhất\n            tong -= pq.top();\n            pq.pop();\n        }\n    }\n    printf(\"%lld\\n\", tong);\n    return 0;\n}\n"}]},{"id":"L09","chapter":4,"chapterName":"Tìm kiếm nhị phân và hai con trỏ","title":"Tìm kiếm nhị phân trên mảng đã sắp","intro":"Trên mảng đã sắp, tìm một giá trị chỉ mất O(log n) thay vì O(n). Dạng này hay gặp khi đề có hàng trăm nghìn truy vấn kiểu \"có bao nhiêu phần tử nhỏ hơn x\", \"vị trí đầu tiên không nhỏ hơn x\".","recognize":["Đề cho mảng đã sắp (hoặc cho phép sắp mà không đổi đáp án) và có nhiều truy vấn, q cỡ 10^5 trở lên. Duyệt O(n) cho mỗi truy vấn sẽ thành O(nq), quá chậm.","Câu hỏi có dạng \"x có mặt không\", \"vị trí đầu / cuối của x\", \"có bao nhiêu phần tử nhỏ hơn, không lớn hơn, hoặc nằm trong [l, r]\".","Cận n khoảng 10^5 đến 10^6 và giới hạn thời gian 1 giây: mỗi truy vấn phải xong trong O(log n).","Dãy tổng tiền tố của các số không âm cũng không giảm. Câu hỏi \"ít nhất bao nhiêu phần tử để tổng đạt ≥ x\" tìm nhị phân được trên dãy tổng tiền tố (sau khi sắp các phần tử theo thứ tự cần chọn)."],"idea":["Quy bài về một điều kiện đơn điệu theo chỉ số i: sai, sai, ..., sai, đúng, ..., đúng. Ví dụ \"a[i] >= x\" trên mảng không giảm.","Viết một hàm duy nhất tìm chỉ số đầu tiên mà điều kiện đúng, trong đoạn [0, n]. Trả về n nghĩa là không có phần tử nào thoả, nhờ vậy các bước sau không phải xử lý riêng.","Mọi câu hỏi còn lại là hiệu của hai lần gọi hàm đó. Số phần tử nhỏ hơn x là vitriDau(x). Với số nguyên, số phần tử không lớn hơn x là vitriDau(x + 1). Số phần tử trong [l, r] là vitriDau(r + 1) - vitriDau(l).","x có mặt không: p = vitriDau(x), có mặt khi p < n và a[p] == x. Vị trí cuối của x là vitriDau(x + 1) - 1.","Khi tính tổng tiền tố rồi hỏi \"ít nhất bao nhiêu phần tử\", điều kiện là \"tienTo[i] >= x\" và đáp án là chỉ số tìm được. Nếu hàm trả về ngoài mảng thì không có cách nào, in -1.","Thư viện có sẵn lower_bound (phần tử đầu tiên ≥ x) và upper_bound (phần tử đầu tiên > x). Hãy viết tay được để dùng khi điều kiện không phải so sánh trực tiếp."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n, q;\nvector<long long> a;  // mảng đã sắp không giảm\n\n// Điều kiện đơn điệu theo i: sai ... sai đúng ... đúng.\n// Đổi thân hàm theo đề (ví dụ a[i] > x, hoặc so sánh theo khoá khác).\nbool dieuKien(int i, long long x) {\n    return a[i] >= x;\n}\n\n// Chỉ số nhỏ nhất i trong [0, n] mà dieuKien(i, x) đúng; bằng n nếu không có.\n// Đoạn đang xét luôn là [lo, hi], đáp án nằm trong đó.\nint vitriDau(long long x) {\n    int lo = 0, hi = n;\n    while (lo < hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (dieuKien(mid, x)) hi = mid;  // mid có thể là đáp án, giữ lại\n        else lo = mid + 1;               // mid chắc chắn không phải\n    }\n    return lo;\n}\n\n// Trả lời một truy vấn. Thay bằng cách ghép các lời gọi vitriDau theo đề:\n// vị trí đầu của x là vitriDau(x), vị trí đầu của giá trị lớn hơn x là vitriDau(x + 1)\n// (với số nguyên), hiệu hai vị trí là số phần tử nằm giữa.\nlong long giaiTruyVan(long long x) {\n    return vitriDau(x);\n}\n\nint main() {\n    scanf(\"%d %d\", &n, &q);\n    a.resize(n);\n    for (auto& v : a) scanf(\"%lld\", &v);\n    // Nếu mảng chưa sắp: sort(a.begin(), a.end()); trước khi trả lời truy vấn.\n    while (q--) {\n        long long x;\n        scanf(\"%lld\", &x);\n        printf(\"%lld\\n\", giaiTruyVan(x));\n    }\n    return 0;\n}\n","skeletonNotes":["dieuKien(i, x): phần phụ thuộc đề. Chỉ cần giữ tính đơn điệu theo i. Đổi >= thành > để được vị trí đầu tiên lớn hơn x.","vitriDau: vòng lặp chuẩn. lo và hi là hai đầu của đoạn chắc chắn chứa đáp án, hi = n để trường hợp \"không có\" tự nhiên có mặt. Quy tắc hi = mid hoặc lo = mid + 1 đảm bảo đoạn luôn thu hẹp, không lặp vô hạn.","giaiTruyVan: nơi ghép các lời gọi vitriDau theo yêu cầu của đề. Khung chỉ trả về vị trí đầu; bài cụ thể sẽ lấy hiệu hai vị trí hoặc kiểm tra a[p] == x.","main: đọc mảng bằng long long để khớp với x và các tổng. Nếu đề không đảm bảo đã sắp thì sort trước khi trả lời."],"complexity":["Mỗi truy vấn O(log n). Tổng O(n + q log n); thêm O(n log n) nếu phải sắp mảng. Bộ nhớ O(n)."],"pitfalls":["Tìm nhị phân trên mảng chưa sắp không báo lỗi mà trả kết quả sai. Đọc kỹ đề: mảng \"đã sắp không giảm\" hay phải tự sắp.","Lẫn lower_bound (>= x) với upper_bound (> x). Thử ngay trên mảng có giá trị lặp như 3 3 3 và x = 3: số phần tử ≤ 3 là 3, số phần tử < 3 là 0.","Vòng lặp vô hạn khi viết hi = mid - 1 hoặc lo = mid cùng lúc với mid làm tròn xuống. Giữ đúng cặp lo = mid + 1 / hi = mid như khung.","Tràn số: (lo + hi) / 2 với int lớn có thể tràn, dùng lo + (hi - lo) / 2. Giá trị cỡ 10^9 cộng thêm 1 hay cộng dồn thì dùng long long.","Đề đánh số từ 1 mà code đánh số từ 0: đáp án lệch 1. Khi không có phần tử thoả mà đề bắt in -1, nhớ xử lý riêng p == n.","Nhiều bộ test mà quên xoá vector hoặc mảng tổng tiền tố của bộ trước."],"practice":["ts-A","ts-C","ts-K","dq-I"],"examples":[{"key":"hd09-1","title":"Đếm số trong khoảng giá trị","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n, q;\nvector<long long> a;  // mảng đã sắp không giảm\n\n// Điều kiện đơn điệu khi i tăng: sai ... sai đúng ... đúng.\nbool dieuKien(int i, long long x) { return a[i] >= x; }\n\n// Chỉ số nhỏ nhất i trong [0, n] mà dieuKien(i, x) đúng; bằng n nếu không có.\nint vitriDau(long long x) {\n    int lo = 0, hi = n;                // đáp án luôn nằm trong [lo, hi]\n    while (lo < hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (dieuKien(mid, x)) hi = mid;  // mid có thể là đáp án, giữ lại\n        else lo = mid + 1;               // mid chắc chắn không phải\n    }\n    return lo;\n}\n\n// Số phần tử có giá trị trong [l, r]: các phần tử >= l nhưng chưa vượt r.\n// Giá trị nguyên nên \"<= r\" tương đương \"< r + 1\".\nlong long giaiTruyVan(long long l, long long r) {\n    return vitriDau(r + 1) - vitriDau(l);\n}\n\nint main() {\n    scanf(\"%d %d\", &n, &q);\n    a.resize(n);\n    for (auto& x : a) scanf(\"%lld\", &x);\n    while (q--) {\n        long long l, r;\n        scanf(\"%lld %lld\", &l, &r);\n        printf(\"%lld\\n\", giaiTruyVan(l, r));\n    }\n    return 0;\n}\n"}]},{"id":"L10","chapter":4,"chapterName":"Tìm kiếm nhị phân và hai con trỏ","title":"Tìm kiếm nhị phân trên đáp án","intro":"Khi đáp án là một con số và việc kiểm tra \"đáp án X có đạt được không\" dễ hơn nhiều so với tìm thẳng đáp án, ta tìm nhị phân ngay trên giá trị đáp án. Đây là dạng cho bài \"nhỏ nhất của lớn nhất\" hay \"lớn nhất của nhỏ nhất\".","recognize":["Đề hỏi giá trị nhỏ nhất của giá trị lớn nhất, hoặc lớn nhất của nhỏ nhất: chia dãy thành k đoạn để tổng lớn nhất là nhỏ nhất, đặt m vật để khoảng cách nhỏ nhất là lớn nhất.","Đề hỏi \"ít nhất bao nhiêu thời gian để làm xong m việc\" với nhiều máy, nhiều người.","Đáp án có thể rất lớn (10^9, 10^14, 10^18) nên không thử tuần tự được, nhưng với một giá trị X cho trước thì kiểm tra X có đủ không chỉ cần một lượt duyệt.","Tìm số thứ n thoả một tính chất đếm được (số thứ n chia hết cho a hoặc b): đếm có bao nhiêu số ≤ x thì dễ.","Tìm nghiệm của phương trình với hàm tăng, hoặc đáp án thực in vài chữ số thập phân."],"idea":["Xác định đáp án là gì và đoạn [lo, hi] chắc chắn chứa nó. lo là cận dưới hiển nhiên (ví dụ phần tử lớn nhất khi chia đoạn), hi là giá trị chắc chắn khả thi (ví dụ tổng cả dãy).","Viết kiemTra(mid): với đáp án mid, yêu cầu đề có thoả được không. Thường là một lượt tham lam: gom phần tử vào nhóm hiện tại, vượt giới hạn thì mở nhóm mới, cuối cùng so số nhóm với giới hạn.","Kiểm tra tính đơn điệu: nếu mid khả thi thì mọi giá trị dễ hơn cũng khả thi. Nếu không đơn điệu thì không tìm nhị phân được; thường chỉ cần đổi \"đúng bằng k\" thành \"không quá k\".","Chọn mẫu theo đề: tìm giá trị nhỏ nhất khả thi (sai ... sai đúng ... đúng) dùng hi = mid; tìm giá trị lớn nhất khả thi (đúng ... đúng sai ... sai) dùng lo = mid và mid làm tròn lên.","Đáp án thực: lặp cố định khoảng 100 lần rồi in với số chữ số đề yêu cầu.","Bài kiểu \"số thứ n\": hàm kiểm tra là \"đếm số thoả ≤ x có ít nhất n không\", tìm x nhỏ nhất như vậy."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n;\nvector<long long> a;\n\n// Đáp án mid có khả thi không?\n// Phải đơn điệu: khả thi với mid thì khả thi với mọi giá trị \"dễ hơn\" mid.\n// Thân hàm là phần phụ thuộc đề: thường là mô phỏng tham lam duyệt mảng một lần.\nbool kiemTra(long long mid) {\n    return mid >= a[n - 1];   // ví dụ tối thiểu, thay bằng mô phỏng theo đề\n}\n\n// Giá trị NHỎ NHẤT trong [lo, hi] mà kiemTra đúng (kiemTra(hi) phải đúng).\n// Dạng đơn điệu: sai ... sai đúng ... đúng.\nlong long timNhoNhat(long long lo, long long hi) {\n    while (lo < hi) {\n        long long mid = lo + (hi - lo) / 2;\n        if (kiemTra(mid)) hi = mid;   // mid khả thi, thử nhỏ hơn\n        else lo = mid + 1;            // mid không khả thi\n    }\n    return lo;\n}\n\n// Giá trị LỚN NHẤT trong [lo, hi] mà kiemTra đúng (kiemTra(lo) phải đúng).\n// Dạng đơn điệu: đúng ... đúng sai ... sai. Chú ý mid làm tròn lên để không lặp vô hạn.\nlong long timLonNhat(long long lo, long long hi) {\n    while (lo < hi) {\n        long long mid = lo + (hi - lo + 1) / 2;\n        if (kiemTra(mid)) lo = mid;   // mid khả thi, thử lớn hơn\n        else hi = mid - 1;            // mid không khả thi\n    }\n    return lo;\n}\n\n// Đáp án thực: kiểm tra trên số thực, lặp số lần cố định thay vì so sánh lo, hi.\nbool kiemTraThuc(double mid) {\n    return mid * mid >= 2.0;   // ví dụ tối thiểu, thay bằng điều kiện đơn điệu theo đề\n}\n\ndouble timThuc(double lo, double hi) {\n    for (int it = 0; it < 100; it++) {\n        double mid = (lo + hi) / 2;\n        if (kiemTraThuc(mid)) hi = mid;\n        else lo = mid;\n    }\n    return hi;\n}\n\nint main() {\n    scanf(\"%d\", &n);\n    a.resize(n);\n    long long tong = 0;\n    for (auto& x : a) {\n        scanf(\"%lld\", &x);\n        tong += x;\n    }\n    // Chọn cận từ ý nghĩa của đề: đáp án nhỏ nhất có thể, và một giá trị chắc chắn khả thi.\n    long long lo = 0, hi = tong;\n    printf(\"%lld\\n\", timNhoNhat(lo, hi));\n    return 0;\n}\n","skeletonNotes":["kiemTra(mid): phần phụ thuộc đề, thường chiếm hầu hết code của bài. Thân hàm trong khung chỉ là ví dụ tối thiểu, hãy thay bằng mô phỏng tham lam hoặc phép đếm theo đề.","timNhoNhat(lo, hi): mẫu cho \"nhỏ nhất khả thi\". hi được giả định khả thi nên đáp án luôn tồn tại trong [lo, hi].","timLonNhat(lo, hi): mẫu cho \"lớn nhất khả thi\". Dùng mid = lo + (hi - lo + 1) / 2 để làm tròn lên, nếu không sẽ lặp vô hạn khi hi = lo + 1.","kiemTraThuc và timThuc: mẫu cho đáp án thực, lặp 100 lần thay vì so sánh lo, hi.","main: chọn lo, hi từ ý nghĩa của đề và dùng long long cho mọi giá trị đáp án."],"complexity":["O((số vòng nhị phân) × chi phí kiemTra). Số vòng là log2(hi - lo), khoảng 47 vòng khi hi cỡ 10^14.","Ví dụ n = 10^5 với kiemTra O(n): khoảng 5·10^6 phép tính. Bộ nhớ O(n)."],"pitfalls":["Tràn số: tổng, hi và các tích kiểu mid × số lượng có thể vượt 2^63. Dùng long long, và __int128 hoặc chặn sớm khi tích đã vượt n hay m.","Cận dưới sai. Ví dụ chia đoạn mà lo = 0 thì kiemTra không xử lý được phần tử lớn hơn mid, đếm sai số đoạn. lo phải ít nhất bằng phần tử lớn nhất.","Dùng nhầm mẫu: tìm giá trị lớn nhất mà viết mid = (lo + hi) / 2 và lo = mid sẽ lặp vô hạn khi hi = lo + 1.","kiemTra không đơn điệu. Hãy thử viết ra dãy kết quả của kiemTra trên vài giá trị nhỏ để xác nhận là sai...sai đúng...đúng.","Số thực: vòng while (hi - lo > eps) có thể lặp mãi do sai số, dùng số vòng cố định. Nhớ in bằng printf(\"%.4f\") theo số chữ số đề cho.","Quên trường hợp vô nghiệm (đề cho in -1): cần kiểm tra hi có khả thi trước khi chạy nhị phân.","Viết kiemTra có sắp xếp hoặc cấp phát bên trong làm mỗi vòng tốn O(n log n). Sắp xếp một lần trước vòng nhị phân."],"practice":["ts-L","ts-P","ts-M","ts-O","ts-N","ts-R","ts-T","ts-Q"],"examples":[{"key":"hd10-1","title":"Chia dãy thành k đoạn","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n, k;\nvector<long long> a;\n\n// Với giới hạn \"mỗi đoạn có tổng <= mid\", có chia được thành không quá k đoạn không?\n// Đơn điệu: mid càng lớn càng dễ, nên kết quả có dạng sai ... sai đúng ... đúng.\nbool kiemTra(long long mid) {\n    int soDoan = 1;\n    long long tong = 0;\n    for (int i = 0; i < n; i++) {\n        if (tong + a[i] > mid) {   // không nhét thêm được, mở đoạn mới (tham lam)\n            soDoan++;\n            tong = 0;\n        }\n        tong += a[i];\n    }\n    return soDoan <= k;\n}\n\n// Giá trị nhỏ nhất trong [lo, hi] mà kiemTra đúng (biết kiemTra(hi) đúng).\nlong long timNhoNhat(long long lo, long long hi) {\n    while (lo < hi) {\n        long long mid = lo + (hi - lo) / 2;\n        if (kiemTra(mid)) hi = mid;   // mid khả thi, thử nhỏ hơn\n        else lo = mid + 1;            // mid không khả thi, đáp án lớn hơn\n    }\n    return lo;\n}\n\nint main() {\n    scanf(\"%d %d\", &n, &k);\n    a.resize(n);\n    long long lo = 0, hi = 0;\n    for (auto& x : a) {\n        scanf(\"%lld\", &x);\n        lo = max(lo, x);   // mỗi đoạn chứa ít nhất một phần tử\n        hi += x;           // một đoạn duy nhất luôn hợp lệ\n    }\n    printf(\"%lld\\n\", timNhoNhat(lo, hi));\n    return 0;\n}\n"}]},{"id":"L11","chapter":4,"chapterName":"Tìm kiếm nhị phân và hai con trỏ","title":"Hai con trỏ và cửa sổ trượt","intro":"Hai con trỏ đi theo một chiều xác định thay cho hai vòng for lồng nhau, đưa O(n^2) xuống O(n). Có hai mẫu chính: hai đầu của mảng đã sắp tiến vào nhau, và cửa sổ [l, r] trượt sang phải trên các đoạn liên tiếp.","recognize":["Mảng đã sắp (hoặc sắp được) và đề hỏi về cặp phần tử có tổng hoặc hiệu cho trước, hoặc cần trộn, so sánh hai mảng đã sắp.","Đề hỏi đoạn con liên tiếp dài nhất, ngắn nhất hoặc số đoạn con thoả điều kiện như tổng ≤ s, không quá k giá trị khác nhau, max - min ≤ k.","Tính chất của đoạn có tính \"đóng\": đoạn hợp lệ bị bớt phần tử ở hai đầu vẫn hợp lệ (hoặc ngược lại). Với tổng thì cần các phần tử dương.","n cỡ 10^6, duyệt mọi cặp (l, r) với O(n^2) không kịp."],"idea":["Hai đầu: đặt l = 0, r = n - 1. Nếu a[l] + a[r] nhỏ hơn đích thì l++ (với a[r] hiện tại, mọi a[l] nhỏ hơn đều không đủ nên bỏ a[l] đi), lớn hơn thì r-- (lý lẽ tương tự), bằng thì ghi nhận.","Có giá trị lặp: khi bằng đích, đếm cl phần tử bằng a[l] ở bên trái và cr phần tử bằng a[r] ở bên phải. Nếu a[l] khác a[r] thì có cl × cr cặp, rồi nhảy qua cả hai khối. Nếu a[l] == a[r] thì mọi phần tử trong đoạn bằng nhau, có c(c-1)/2 cặp với c là số phần tử, rồi dừng.","Hai mảng đã sắp: mỗi mảng một con trỏ, luôn tiến con trỏ ở phần tử nhỏ hơn. Cách này dùng cho trộn, đếm số phần tử nhỏ hơn, đếm cặp bằng nhau.","Cửa sổ trượt: với mỗi r, giữ l nhỏ nhất sao cho [l, r] còn hợp lệ. Khi r tăng, l chỉ có thể đi sang phải, nên tổng số bước của hai con trỏ là O(n).","Ghi nhận kết quả sau khi chỉnh l: đếm đoạn kết thúc tại r hợp lệ (khi điều kiện là \"không vượt\") thì cộng r - l + 1; tìm dài nhất thì cập nhật max(r - l + 1).","Điều kiện kiểu \"≥ s\" ngược chiều: thu hẹp l chừng nào đoạn còn hợp lệ, đoạn ngắn nhất ghi nhận ngay trước khi hết hợp lệ. Điều kiện \"đúng k\" thì đếm theo \"không quá k\" trừ \"không quá k - 1\".","Trạng thái cửa sổ tuỳ đề: tổng thì một biến, số giá trị khác nhau thì mảng đếm tần suất kèm biến đếm, max và min thì deque đơn điệu hoặc multiset."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n;\nlong long dich;           // giá trị đích của đề (tổng cần đạt, giới hạn...)\nvector<long long> a;\nlong long ketQua = 0;\n\n// ---------- Mẫu A: hai con trỏ từ hai đầu (mảng đã sắp) ----------\n\n// So sánh tổng hai đầu với đích: -1 nếu nhỏ hơn, 0 nếu bằng, 1 nếu lớn hơn.\nint soSanh(int l, int r) {\n    long long s = a[l] + a[r];\n    return s < dich ? -1 : (s > dich ? 1 : 0);\n}\n\n// Gặp một cặp khớp: ghi nhận rồi dịch con trỏ qua cả khối giá trị trùng.\n// Phần đếm (ketQua += ...) là chỗ phụ thuộc đề, đổi theo yêu cầu (đếm cặp, in cặp, kiểm tra tồn tại...).\nvoid xuLyKhop(int& l, int& r) {\n    if (a[l] == a[r]) {                  // mọi phần tử trong [l, r] bằng nhau\n        long long c = r - l + 1;\n        ketQua += c * (c - 1) / 2;       // chọn 2 trong c phần tử\n        l = r;                           // kết thúc vòng lặp\n        return;\n    }\n    long long cl = 0, cr = 0;\n    int x = l, y = r;\n    while (a[x] == a[l]) x++, cl++;      // khối giá trị bằng a[l]\n    while (a[y] == a[r]) y--, cr++;      // khối giá trị bằng a[r]\n    ketQua += cl * cr;\n    l = x;\n    r = y;\n}\n\nvoid haiDau() {\n    int l = 0, r = n - 1;\n    while (l < r) {\n        int c = soSanh(l, r);\n        if (c < 0) l++;          // tổng nhỏ: tăng phần tử trái\n        else if (c > 0) r--;     // tổng lớn: giảm phần tử phải\n        else xuLyKhop(l, r);\n    }\n}\n\n// ---------- Mẫu B: cửa sổ trượt [l, r], hai con trỏ cùng đi sang phải ----------\n\nlong long tong = 0;   // trạng thái của cửa sổ; đổi kiểu nếu cần (đếm tần suất, deque...)\n\nvoid themPhai(int r) { tong += a[r]; }   // đưa a[r] vào cửa sổ\nvoid boTrai(int l) { tong -= a[l]; }     // lấy a[l] ra khỏi cửa sổ\n\n// Cửa sổ hiện tại còn thoả điều kiện của đề không?\n// Điều kiện phải \"đóng\": bỏ bớt phần tử thì không làm hỏng, thêm phần tử có thể làm hỏng.\nbool hopLe() { return true; }\n\n// Ghi nhận kết quả khi cửa sổ [l, r] hợp lệ.\n// Ví dụ: đếm đoạn kết thúc tại r thì cộng r - l + 1; tìm đoạn dài nhất thì lấy max(r - l + 1).\nvoid ghiNhan(int l, int r) { ketQua += r - l + 1; }\n\nvoid cuaSo() {\n    int l = 0;\n    for (int r = 0; r < n; r++) {\n        themPhai(r);\n        while (l <= r && !hopLe()) {   // thu hẹp từ trái đến khi hợp lệ\n            boTrai(l);\n            l++;\n        }\n        ghiNhan(l, r);\n    }\n}\n\nint main() {\n    scanf(\"%d %lld\", &n, &dich);\n    a.resize(n);\n    for (auto& x : a) scanf(\"%lld\", &x);\n    haiDau();    // hoặc cuaSo(), tuỳ dạng đề\n    printf(\"%lld\\n\", ketQua);\n    return 0;\n}\n","skeletonNotes":["soSanh(l, r): phần phụ thuộc đề của mẫu hai đầu. Trả -1/0/1 để vòng lặp quyết định đi con trỏ nào.","xuLyKhop(l, r): ghi nhận kết quả khi khớp và dịch con trỏ qua cả khối giá trị trùng (nếu a[l] == a[r] thì đếm c(c-1)/2 rồi dừng). Dòng cộng vào ketQua là chỗ đổi theo đề.","haiDau: vòng lặp cố định của mẫu, ít khi phải sửa.","themPhai, boTrai, hopLe: ba hàm trạng thái của mẫu cửa sổ. Thay thân theo đề. hopLe trong khung luôn đúng nên chưa thu hẹp gì.","ghiNhan(l, r): chọn cách cộng dồn hay lấy max theo yêu cầu. cuaSo: vòng ngoài duyệt r, vòng trong thu hẹp l, hầu như không đổi giữa các bài.","main chọn một trong hai mẫu: haiDau() hoặc cuaSo()."],"complexity":["O(n) cho cả hai mẫu, vì mỗi con trỏ chỉ đi tới và đi tối đa n bước. Cộng O(n log n) nếu phải sắp mảng trước, hoặc O(n log n) khi trạng thái dùng multiset.","Bộ nhớ O(n)."],"pitfalls":["Dùng hai đầu trên mảng chưa sắp thì sai. Cửa sổ trượt theo tổng với phần tử âm cũng sai vì tổng không còn đơn điệu khi thêm phần tử.","Đếm cặp có giá trị lặp mà dịch từng bước một sẽ bỏ sót cặp hoặc đếm lặp. Kết quả đến n^2 / 2, cỡ 2·10^10 khi n = 2·10^5, cần long long; tổng hai phần tử cũng đã vượt int.","Sau khi thu hẹp, l có thể bằng r + 1 (cửa sổ rỗng) khi một phần tử đã vi phạm. Vòng thu hẹp phải có điều kiện l <= r và ghi nhận r - l + 1 = 0 là đúng.","Nhầm hướng ghi nhận khi đếm đoạn \"tổng ≥ s\": khi [l, r] vừa hợp lệ thì mọi đoạn bắt đầu tại l và kết thúc từ r trở đi đều hợp lệ, cộng n - r (đánh số từ 0), không phải r - l + 1.","Đếm đoạn có đúng k giá trị khác nhau bằng một cửa sổ duy nhất thì sai vì điều kiện không đóng. Tính atMost(k) - atMost(k - 1).","Quên giảm tần suất khi bỏ phần tử ra, hoặc quên xoá mảng đếm giữa các bộ test.","Dùng giá trị lớn nhất của kiểu làm sentinel rồi cộng hai lần gây tràn; dùng long long cho tổng."],"practice":["ts-D","ts-C","ts-B","tl-O","tl-C","ts-E","dq-I","ts-G","ts-F","qhd-T","ts-H","ts-I","ts-J","ts-S"],"examples":[{"key":"hd11-1","title":"Đếm cặp có tổng cho trước","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n;\nlong long dich;           // tổng cần đạt\nvector<long long> a;      // mảng đã sắp không giảm\nlong long ketQua = 0;\n\n// So sánh tổng hai đầu với đích: -1 nếu nhỏ hơn, 0 nếu bằng, 1 nếu lớn hơn.\nint soSanh(int l, int r) {\n    long long s = a[l] + a[r];\n    return s < dich ? -1 : (s > dich ? 1 : 0);\n}\n\n// Gặp một cặp khớp: ghi nhận kết quả rồi di chuyển cả hai con trỏ qua các giá trị trùng.\nvoid xuLyKhop(int& l, int& r) {\n    if (a[l] == a[r]) {                      // mọi phần tử trong [l, r] bằng nhau\n        long long c = r - l + 1;\n        ketQua += c * (c - 1) / 2;           // chọn 2 trong c phần tử\n        l = r;                               // kết thúc vòng lặp\n        return;\n    }\n    long long cl = 0, cr = 0;\n    int x = l, y = r;\n    while (a[x] == a[l]) x++, cl++;          // số phần tử bằng a[l]\n    while (a[y] == a[r]) y--, cr++;          // số phần tử bằng a[r]\n    ketQua += cl * cr;\n    l = x;\n    r = y;\n}\n\nint main() {\n    scanf(\"%d %lld\", &n, &dich);\n    a.resize(n);\n    for (auto& x : a) scanf(\"%lld\", &x);\n    int l = 0, r = n - 1;\n    while (l < r) {\n        int c = soSanh(l, r);\n        if (c < 0) l++;           // tổng nhỏ: cần phần tử trái lớn hơn\n        else if (c > 0) r--;      // tổng lớn: cần phần tử phải nhỏ hơn\n        else xuLyKhop(l, r);\n    }\n    printf(\"%lld\\n\", ketQua);\n    return 0;\n}\n"}]},{"id":"L12","chapter":5,"chapterName":"Quy hoạch động","title":"Mảng cộng dồn 1 và 2 chiều","intro":"Mảng cộng dồn (prefix sum) cho phép trả lời mỗi truy vấn tổng trên một đoạn hoặc một hình chữ nhật con trong O(1), sau khi dựng bảng một lần. Đây là công cụ nền của rất nhiều bài đếm đoạn con và thường là bước đầu tiên của các bài quy hoạch động.","recognize":["Đề có nhiều truy vấn (q từ 10^5 trở lên), mỗi truy vấn hỏi tổng, số lượng hay XOR trên đoạn [l, r] hoặc trên hình chữ nhật con của bảng, và dữ liệu không đổi giữa các truy vấn.","Đề cộng thêm một giá trị, hoặc đảo bit, trên cả đoạn [l, r] rất nhiều lần rồi chỉ hỏi trạng thái cuối cùng. Đây là chỗ dùng mảng hiệu (đảo bit là cộng rồi lấy dư 2).","Đề hỏi đếm số đoạn con liên tiếp có tổng bằng một giá trị cho trước. Tổng đoạn bằng hiệu của hai phần tử cộng dồn, nên bài quy về việc đếm các cặp chỉ số.","Cận n, q lớn khiến cách duyệt lại từng đoạn, O(n·q) hay O(n^2), chắc chắn quá giờ; đại lượng cần hỏi cộng được và có phép ngược (trừ)."],"idea":["Đánh số phần tử từ 1 và đặt S[0] = 0. Định nghĩa S[i] = a[1] + ... + a[i]; dựng một lần bằng S[i] = S[i-1] + a[i].","Tổng đoạn [l, r] là S[r] - S[l-1]. Phần tử S[0] = 0 là thứ cho phép đoạn bắt đầu từ vị trí 1 dùng cùng một công thức.","Với bảng hai chiều, P[i][j] là tổng hình chữ nhật từ ô (1,1) đến ô (i,j), dựng bằng P[i][j] = a[i][j] + P[i-1][j] + P[i][j-1] - P[i-1][j-1] (trừ phần giao bị cộng hai lần).","Tổng hình chữ nhật (r1,c1)-(r2,c2) là P[r2][c2] - P[r1-1][c2] - P[r2][c1-1] + P[r1-1][c1-1]: lấy hình lớn, trừ dải phía trên và dải bên trái, cộng lại góc bị trừ hai lần.","Khi cần cộng v vào mọi phần tử của [l, r] nhiều lần, giữ mảng hiệu d: d[l] += v và d[r+1] -= v. Cuối cùng cộng dồn d sẽ ra mảng thật.","Khi cần đếm đoạn có tổng bằng K: duyệt r từ 0 đến n, trước khi ghi S[r] vào bảng đếm thì cộng vào đáp án số lần đã gặp giá trị S[r] - K. Nhớ ghi S[0] vào bảng đếm trước vòng lặp.","Đổi phép cộng thành phép khác có phép ngược (XOR, đếm số ký tự thoả điều kiện) khi đề hỏi đại lượng tương ứng; ý tưởng không đổi. Nếu điều kiện có dạng \"tổng bằng độ dài đoạn\", trừ 1 khỏi mỗi phần tử để quy về đếm đoạn có tổng bằng 0."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\nint n, m;                       // 1 chiều: n phần tử; 2 chiều: n hàng, m cột\nvector<ll> S;                   // S[i] = a[1] + ... + a[i], S[0] = 0\nvector<vector<ll>> P;           // P[i][j] = tổng hình chữ nhật (1,1)-(i,j)\nvector<ll> d;                   // mảng hiệu, kích thước n + 2\n\n// ---- 1 chiều ----\n// Dựng S từ a[1..n]. Nếu đề hỏi đại lượng khác (XOR, số phần tử thoả điều kiện...)\n// thì thay \"+ a[i]\" bằng đóng góp tương ứng của phần tử i.\nvoid dungCongDon1D(const vector<ll>& a) {\n    S.assign(n + 1, 0);\n    for (int i = 1; i <= n; i++) S[i] = S[i - 1] + a[i];\n}\n\n// Tổng đoạn [l, r], 1 <= l <= r <= n.\nll tongDoan(int l, int r) { return S[r] - S[l - 1]; }\n\n// ---- 2 chiều ----\nvoid dungCongDon2D(const vector<vector<ll>>& a) {\n    P.assign(n + 1, vector<ll>(m + 1, 0));\n    for (int i = 1; i <= n; i++)\n        for (int j = 1; j <= m; j++)\n            P[i][j] = a[i][j] + P[i - 1][j] + P[i][j - 1] - P[i - 1][j - 1];\n}\n\nll tongHinhChuNhat(int r1, int c1, int r2, int c2) {\n    return P[r2][c2] - P[r1 - 1][c2] - P[r2][c1 - 1] + P[r1 - 1][c1 - 1];\n}\n\n// ---- mảng hiệu: cộng v vào mọi phần tử a[l..r] trong O(1) ----\nvoid congVaoDoan(int l, int r, ll v) {\n    d[l] += v;\n    d[r + 1] -= v;\n}\n\n// Sau mọi lần cộng, cộng dồn d để ra mảng a thật.\nvoid khoiPhucTuMangHieu(vector<ll>& a) {\n    ll cur = 0;\n    for (int i = 1; i <= n; i++) {\n        cur += d[i];\n        a[i] = cur;\n    }\n}\n\nint main() {\n    // Ví dụ dùng: đọc mảng, trả lời q truy vấn tổng đoạn.\n    scanf(\"%d\", &n);\n    vector<ll> a(n + 1, 0);\n    for (int i = 1; i <= n; i++) scanf(\"%lld\", &a[i]);\n    d.assign(n + 2, 0);\n    dungCongDon1D(a);\n    int q;\n    scanf(\"%d\", &q);\n    while (q--) {\n        int l, r;\n        scanf(\"%d %d\", &l, &r);\n        printf(\"%lld\\n\", tongDoan(l, r));\n    }\n    return 0;\n}\n","skeletonNotes":["S, P, d đều đánh số từ 1 và để dư một ô ở đầu (chỉ số 0). Đừng dùng chỉ số từ 0 nếu không muốn xử lý riêng trường hợp l = 1.","dungCongDon1D và dungCongDon2D là chỗ thay theo đề: đổi cách tính đóng góp của từng phần tử (tổng, XOR, 1 nếu thoả điều kiện, 0 nếu không).","tongDoan và tongHinhChuNhat chỉ là phép trừ các giá trị đã dựng. Với XOR, phép trừ chính là XOR.","congVaoDoan và khoiPhucTuMangHieu dùng khi đề cộng nhiều lần rồi hỏi một lần. Mảng d có n + 2 phần tử vì r + 1 có thể bằng n + 1.","main chỉ là ví dụ minh hoạ (truy vấn tổng đoạn); bài thật thay phần đọc dữ liệu và in kết quả theo đề."],"complexity":["Dựng bảng: O(n) với 1 chiều, O(n·m) với 2 chiều. Mỗi truy vấn O(1). Tổng O(n + q) hoặc O(n·m + q).","Bộ nhớ O(n) hoặc O(n·m). Bảng hai chiều 1000 × 1000 kiểu long long chiếm 8 MB, vẫn ổn."],"pitfalls":["Tổng có thể vượt 32 bit ngay cả khi từng phần tử nhỏ (10^5 phần tử, mỗi phần tử 10^9). Dùng long long cho S và P.","Quên S[0] = 0 hay P[0][*] = P[*][0] = 0, hoặc dùng chỉ số từ 0 nên truy vấn l = 1 truy cập S[-1].","Công thức hình chữ nhật: sai dấu hoặc quên cộng lại P[r1-1][c1-1]. Hãy thử tay trên bảng 2 × 2.","Mảng hiệu: quên d[r+1] -= v, hoặc cấp mảng d chỉ n phần tử nên d[n+1] ghi ra ngoài.","Đếm đoạn có tổng K: ghi S[r] vào bảng đếm trước khi tra S[r] - K sẽ đếm nhầm đoạn rỗng khi K = 0; quên ghi S[0] sẽ bỏ sót mọi đoạn bắt đầu từ vị trí 1.","Nhiều truy vấn thì đọc và in chậm sẽ quá giờ: dùng scanf/printf hoặc ios::sync_with_stdio(false), và không dùng endl."],"practice":["qhd-C","qhd-B","qhd-V"],"examples":[{"key":"hd12-1","title":"Tổng hình chữ nhật","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\nint n, m;\nvector<vector<ll>> P;  // P[i][j] = tổng các ô trong hình chữ nhật (1,1)-(i,j)\n\n// Dựng mảng cộng dồn 2 chiều từ bảng a (đánh số từ 1).\nvoid dungCongDon2D(const vector<vector<ll>>& a) {\n    P.assign(n + 1, vector<ll>(m + 1, 0));\n    for (int i = 1; i <= n; i++)\n        for (int j = 1; j <= m; j++)\n            P[i][j] = a[i][j] + P[i - 1][j] + P[i][j - 1] - P[i - 1][j - 1];\n}\n\n// Tổng hình chữ nhật góc trên trái (r1,c1), góc dưới phải (r2,c2).\nll tongHinhChuNhat(int r1, int c1, int r2, int c2) {\n    return P[r2][c2] - P[r1 - 1][c2] - P[r2][c1 - 1] + P[r1 - 1][c1 - 1];\n}\n\nint main() {\n    scanf(\"%d %d\", &n, &m);\n    vector<vector<ll>> a(n + 1, vector<ll>(m + 1, 0));\n    for (int i = 1; i <= n; i++)\n        for (int j = 1; j <= m; j++) scanf(\"%lld\", &a[i][j]);\n    dungCongDon2D(a);\n    int q;\n    scanf(\"%d\", &q);\n    while (q--) {\n        int r1, c1, r2, c2;\n        scanf(\"%d %d %d %d\", &r1, &c1, &r2, &c2);\n        printf(\"%lld\\n\", tongHinhChuNhat(r1, c1, r2, c2));\n    }\n    return 0;\n}\n"}]},{"id":"L13","chapter":5,"chapterName":"Quy hoạch động","title":"QHĐ một chiều","intro":"Quy hoạch động một chiều giải bài trên một dãy hay một hàng bằng cách tính dần đáp án của các bài toán con theo chỉ số tăng dần. Mỗi bước chỉ nhìn lại vài giá trị đã tính, nên thay cho vét cạn 2^n ta chỉ mất O(n).","recognize":["Đề cho dãy hoặc hàng n phần tử (n tới 10^5, 10^6) và hỏi số cách, giá trị lớn nhất hoặc nhỏ nhất của một cách chọn, đi, xếp. Vét cạn 2^n chắc chắn quá giờ.","Ràng buộc chỉ liên quan các phần tử gần nhau: không chọn hai phần tử kề nhau, không lặp một loại hai ngày liền, mỗi bước nhảy từ 1 đến k bậc, giữa hai vị trí phải cách ít nhất k.","Đề yêu cầu \"đoạn liên tiếp tối ưu\" hoặc \"số cách\" kèm lấy dư modulo.","Đáp án của dãy n phần tử suy ra được từ đáp án của dãy ngắn hơn (n-1, n-2 phần tử, hoặc dãy kết thúc ở trạng thái khác)."],"idea":["Chọn nghĩa của dp[i] bằng một câu rõ ràng: đáp án cho i phần tử đầu, hoặc đáp án của cách chọn kết thúc đúng tại i. Hai cách định nghĩa cho hai công thức khác nhau, đừng lẫn.","Nếu ràng buộc cần nhớ thêm điều gì đó (hoạt động hôm qua, đang ở trạng thái nào, số dư hiện tại), thêm một chỉ số: dp[i][s], với số trạng thái s nhỏ.","Viết công thức chuyển bằng cách hỏi: \"lựa chọn cuối cùng của cách tối ưu là gì?\". Mỗi lựa chọn dẫn về một dp nhỏ hơn; lấy max, min, hoặc cộng tuỳ đề.","Đặt giá trị cơ sở (dp[0], dp[1]) và giá trị \"không thể\": rất nhỏ khi tìm max, rất lớn khi tìm min, 0 khi đếm cách.","Duyệt i tăng dần để mọi dp cần dùng đã có sẵn. Đáp án là dp[n], hoặc max/min/tổng các dp[i] nếu dp[i] định nghĩa là \"kết thúc tại i\".","Nếu công thức chỉ dùng k giá trị ngay trước, giữ k biến thay cho cả mảng. Chỉ làm bước này sau khi bản đầy đủ đã đúng.","Kiểm tra bằng một dãy ngắn tính tay, đặc biệt n = 1 và n = 2."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\nconst ll VO_CUC = LLONG_MIN / 4;   // \"không thể\" khi tìm max; cộng thêm số nhỏ vẫn không tràn\nint n;\nvector<ll> a;                      // dữ liệu đề cho, a[1..n]\nvector<ll> dp;                     // dp[i] = <ghi định nghĩa bằng lời ở đây>\n\n// Giá trị của dp[0] khi chưa có phần tử nào.\n// Bài cần thêm dp[1], dp[2] riêng thì xử lý trong main trước vòng lặp.\nll giaTriCoSo() { return 0; }\n\n// Tính dp[i] từ các dp[j] với j < i. Thay công thức theo đề. Các dạng hay gặp:\n//   một hướng:           dp[i] = dp[i-1] + (đóng góp của i)\n//   chọn hay không chọn: dp[i] = max(dp[i-1], dp[i-2] + (giá trị của i))\n//   đếm cách:            dp[i] = dp[i-1] + dp[i-2] + ... (lấy dư nếu đề yêu cầu)\nll chuyenTrangThai(int i) { return dp[i - 1] + a[i]; }\n\n// Lấy đáp án từ bảng dp: thường là dp[n], hoặc max/min/tổng các dp[i].\nll layDapAn() { return dp[n]; }\n\nint main() {\n    scanf(\"%d\", &n);\n    a.assign(n + 1, 0);\n    for (int i = 1; i <= n; i++) scanf(\"%lld\", &a[i]);\n    dp.assign(n + 1, VO_CUC);\n    dp[0] = giaTriCoSo();\n    for (int i = 1; i <= n; i++) dp[i] = chuyenTrangThai(i);\n    printf(\"%lld\\n\", layDapAn());\n    return 0;\n}\n","skeletonNotes":["Ghi định nghĩa dp[i] vào chú thích trước khi viết công thức. Mọi lỗi logic trong QHĐ đều bắt đầu từ định nghĩa mơ hồ.","giaTriCoSo là chỗ đặt trường hợp nhỏ nhất. Khi công thức dùng dp[i-2], nhớ rằng tại i = 1 chỉ số i-2 không tồn tại: xử lý riêng hoặc đặt thêm giá trị đệm.","chuyenTrangThai là trái tim của bài. Với trạng thái hai chiều dp[i][s], đổi hàm thành chuyenTrangThai(i, s) và bảng dp thành vector hai chiều.","layDapAn tách riêng để bạn nhớ hỏi: đáp án nằm ở dp[n] hay phải gộp nhiều dp[i].","Khung dùng long long. Bài đếm modulo thì mỗi phép cộng và nhân đều lấy dư ngay."],"complexity":["Số trạng thái nhân với chi phí mỗi chuyển. Dãy n phần tử, chuyển O(1): O(n) thời gian, O(n) bộ nhớ (hoặc O(1) nếu giữ vài biến cuối).","Chuyển nhìn lại k bước (k ≤ 10): O(n·k). Thêm chỉ số trạng thái s: O(n·s·chi phí chuyển)."],"pitfalls":["Định nghĩa dp mơ hồ (kết thúc tại i hay trong i phần tử đầu), dẫn tới lấy sai đáp án cuối: dp[n] khác max các dp[i].","Khởi tạo dp bằng 0 khi tìm max trên dãy có số âm, làm \"không chọn gì\" thắng cách chọn hợp lệ. Dùng giá trị rất nhỏ cho trạng thái không thể.","Giá trị \"không thể\" tràn khi cộng: đừng dùng LLONG_MIN, dùng LLONG_MIN / 4 hoặc bỏ qua trạng thái không thể.","Đếm modulo: phép trừ có thể ra số âm, phải cộng thêm MOD rồi lấy dư. Quên lấy dư ở một phép nhân làm tràn long long.","Quên các trường hợp nhỏ n = 1, n = 2 khiến truy cập dp[-1].","Dãy vòng tròn: phần tử đầu và cuối kề nhau nên không thể dùng một bảng dp tuyến tính duy nhất; xét riêng các trường hợp đầu có chọn hay không."],"practice":["qhd-A","qhd-D","mh8-B","qhd-K","qhd-R","qhd-L","mh3-B","mh2-B","mh10-B"],"examples":[{"key":"hd13-1","title":"Đoạn liên tiếp có tổng lớn nhất","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\nconst ll VO_CUC = LLONG_MIN / 4;\nint n;\nvector<ll> a;   // a[1..n]\nvector<ll> dp;  // dp[i] = tổng lớn nhất của đoạn liên tiếp KẾT THÚC tại vị trí i (không rỗng)\n\n// dp[0]: chưa có phần tử nào, coi như phần kéo thêm từ bên trái là 0.\nll giaTriCoSo() { return 0; }\n\n// Đoạn kết thúc tại i: hoặc chỉ gồm a[i], hoặc nối thêm đoạn tốt nhất kết thúc tại i-1.\n// Nối chỉ có lợi khi dp[i-1] > 0, nên cộng max(0, dp[i-1]).\nll chuyenTrangThai(int i) { return a[i] + max(0LL, dp[i - 1]); }\n\n// Đoạn tối ưu kết thúc ở một vị trí nào đó, nên lấy max các dp[i], i >= 1.\nll layDapAn() {\n    ll best = VO_CUC;\n    for (int i = 1; i <= n; i++) best = max(best, dp[i]);\n    return best;\n}\n\nint main() {\n    scanf(\"%d\", &n);\n    a.assign(n + 1, 0);\n    for (int i = 1; i <= n; i++) scanf(\"%lld\", &a[i]);\n    dp.assign(n + 1, VO_CUC);\n    dp[0] = giaTriCoSo();\n    for (int i = 1; i <= n; i++) dp[i] = chuyenTrangThai(i);\n    printf(\"%lld\\n\", layDapAn());\n    return 0;\n}\n"}]},{"id":"L14","chapter":5,"chapterName":"Quy hoạch động","title":"Dãy con tăng dài nhất","intro":"Dãy con tăng dài nhất (LIS) là dạng kinh điển của QHĐ trên dãy: tìm dãy con, không cần liên tiếp, thoả một quan hệ giữa hai phần tử kề nhau trong dãy con. Có hai cách làm: O(n^2) linh hoạt và O(n log n) bằng tìm kiếm nhị phân.","recognize":["Đề tìm \"dãy con\" (không cần liền nhau, giữ thứ tự) dài nhất mà mỗi phần tử so với phần tử đứng ngay trước theo một quan hệ: tăng ngặt, không giảm, chia hết...","Các từ khoá: \"dãy con tăng\", \"không giảm\", \"ít phần tử cần xoá để dãy tăng\" (bằng n trừ độ dài LIS), \"dãy lồng nhau\", \"xếp chồng hộp\".","Đối tượng có hai thuộc tính (phong bì rộng và cao, cặp số) và đề yêu cầu chuỗi mà CẢ HAI thuộc tính đều tăng ngặt: sắp theo thuộc tính thứ nhất rồi quy về LIS trên thuộc tính thứ hai.","Cận n quyết định cách làm: n ≤ 5000 cho phép O(n^2), n từ 10^5 trở lên cần O(n log n).","Quan hệ giữa hai phần tử kề trong dãy con không phải thứ tự số (ví dụ b chia hết cho a): vẫn dùng dp[i] kết thúc tại i, nhưng không nhị phân trực tiếp được, cần khai thác cấu trúc của quan hệ."],"idea":["Cách O(n^2): dp[i] = độ dài dãy con tốt nhất kết thúc tại i. Khởi tạo dp[i] = 1, rồi với mọi j < i thoả noiDuoc(a[j], a[i]) thì dp[i] = max(dp[i], dp[j] + 1). Đáp án là max các dp[i].","Cách O(n log n): giữ mảng tails, trong đó tails[k] là giá trị cuối nhỏ nhất của một dãy con tăng độ dài k+1 đã tìm được. Mảng này luôn tăng ngặt.","Với mỗi phần tử x: tìm bằng nhị phân vị trí đầu tiên trong tails có giá trị ≥ x. Nếu không có thì thêm x vào cuối (kéo dài), nếu có thì ghi đè (hạ giá trị cuối của dãy độ dài đó xuống x).","Độ dài LIS là kích thước của tails. Cẩn thận: tails không phải là dãy con cụ thể; nó chỉ lưu các giá trị cuối tốt nhất.","Dãy không giảm (cho phép bằng nhau): đổi lower_bound thành upper_bound, vì x được đặt sau mọi giá trị bằng nó.","Cần in chính dãy con: với cách O(n^2) lưu thêm cha[i] là j đã cho dp[i]; với O(n log n) lưu thêm vị trí của từng phần tử trong tails và phần tử đứng trước nó.","Hai thuộc tính (ví dụ phong bì w, h cùng phải tăng ngặt): sắp theo w tăng; khi w bằng nhau thì sắp h GIẢM dần. Sau đó tìm LIS tăng ngặt trên dãy h. Sắp h giảm khi w bằng nhau để hai phần tử cùng w không thể nằm chung một dãy tăng ngặt.","Dãy giảm: đổi dấu các phần tử hoặc đảo chiều dãy rồi dùng lại cùng khung."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\n// ---- Cách O(n^2): linh hoạt, thay được quan hệ giữa hai phần tử kề nhau ----\n// Phần tử \"sau\" có nối được vào ngay sau phần tử \"truoc\" trong dãy con hay không.\n// Tăng ngặt: truoc < sau. Không giảm: truoc <= sau. Chia hết: sau % truoc == 0...\nbool noiDuoc(ll truoc, ll sau) { return truoc < sau; }\n\n// ketThuc[i] = độ dài dãy con dài nhất kết thúc tại phần tử i.\nvector<int> ketThucTaiBinhPhuong(const vector<ll>& a) {\n    int n = a.size();\n    vector<int> ketThuc(n, 1);\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < i; j++)\n            if (noiDuoc(a[j], a[i])) ketThuc[i] = max(ketThuc[i], ketThuc[j] + 1);\n    return ketThuc;\n}\n\n// ---- Cách O(n log n): chỉ dùng được khi quan hệ là thứ tự số ----\n// tails[k] = giá trị cuối nhỏ nhất của một dãy con tăng có độ dài k + 1 (tails tăng ngặt).\n// Dãy tăng ngặt: lấy vị trí đầu tiên có giá trị >= x (lower_bound).\n// Dãy không giảm: đổi sang upper_bound.\nint viTriDat(const vector<ll>& tails, ll x) {\n    return lower_bound(tails.begin(), tails.end(), x) - tails.begin();\n}\n\n// f[i] = độ dài dãy con tăng dài nhất của tiền tố a[0..i].\nvector<int> doDaiTheoTienTo(const vector<ll>& a) {\n    vector<ll> tails;\n    vector<int> f;\n    for (ll x : a) {\n        int p = viTriDat(tails, x);\n        if (p == (int)tails.size()) tails.push_back(x);   // kéo dài dãy dài nhất\n        else tails[p] = x;                                // hạ giá trị cuối xuống\n        f.push_back(tails.size());\n    }\n    return f;\n}\n\nint main() {\n    // Ví dụ dùng: in độ dài LIS của từng tiền tố.\n    int n;\n    scanf(\"%d\", &n);\n    vector<ll> a(n);\n    for (auto& x : a) scanf(\"%lld\", &x);\n    vector<int> f = doDaiTheoTienTo(a);\n    for (int i = 0; i < n; i++) printf(\"%d%c\", f[i], i + 1 < n ? ' ' : '\\n');\n    return 0;\n}\n","skeletonNotes":["noiDuoc là chỗ thay theo đề khi dùng cách O(n^2): bất kỳ quan hệ nào giữa phần tử trước và phần tử sau trong dãy con.","ketThucTaiBinhPhuong trả về dp[i] kết thúc tại i; đáp án là max của mảng này. Có thể lưu thêm cha[i] để truy vết.","viTriDat là điểm khác nhau giữa ngặt và không ngặt: lower_bound cho tăng ngặt, upper_bound cho không giảm.","doDaiTheoTienTo trả về độ dài LIS của mọi tiền tố; đáp án cả dãy là phần tử cuối. Nếu chỉ cần độ dài toàn dãy thì tails.size() là đủ.","main chỉ là ví dụ minh hoạ (in LIS của từng tiền tố); bài thật thay phần đọc và in theo đề."],"complexity":["Cách đầu: O(n^2) thời gian, O(n) bộ nhớ, dùng được đến n khoảng 5000 đến 10^4.","Cách nhị phân: O(n log n) thời gian, O(n) bộ nhớ, dùng được đến n khoảng 10^6."],"pitfalls":["Nhầm ngặt và không ngặt: \"tăng\" trong đề có thể là tăng ngặt hoặc không giảm. Đọc kỹ rồi chọn lower_bound hay upper_bound; thử trên dãy toàn phần tử bằng nhau (đáp án 1 hay n).","Coi mảng tails là chính dãy con. Nó chỉ đúng về độ dài; muốn in dãy phải lưu thêm vết.","Khởi tạo dp[i] = 0 thay vì 1, làm đáp án lệch một.","Dùng O(n^2) khi n ≥ 10^5 sẽ quá giờ. Ngược lại, dùng nhị phân khi quan hệ không phải thứ tự (chia hết) cho kết quả sai.","Quên rằng đáp án là max các ketThuc[i], không phải ketThuc[n-1].","Giá trị âm hoặc lớn tới 10^9: đừng dùng giá trị phần tử làm chỉ số mảng nếu chưa nén toạ độ.","Bài hai thuộc tính: sắp h tăng khi w bằng nhau sẽ cho phép hai phần tử cùng w vào chung chuỗi, đáp án lớn hơn đúng. Thử bằng ví dụ (1,1), (2,2), (2,3), (3,4): đáp án đúng là 3, còn sắp sai ra 4."],"practice":["qhd-E","qhd-I","qhd-Q"],"examples":[{"key":"hd14-1","title":"Xếp phong bì lồng nhau","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\n// tails[k] = chiều cao nhỏ nhất của phong bì ngoài cùng trong một chuỗi lồng nhau độ dài k+1.\n// tails luôn tăng ngặt nên tìm nhị phân được.\n// Lồng ngặt theo chiều cao: lấy vị trí đầu tiên có giá trị >= x (lower_bound).\nint viTriDat(const vector<ll>& tails, ll x) {\n    return lower_bound(tails.begin(), tails.end(), x) - tails.begin();\n}\n\n// f[i] = độ dài dãy con tăng ngặt dài nhất của tiền tố h[0..i].\nvector<int> doDaiTheoTienTo(const vector<ll>& h) {\n    vector<ll> tails;\n    vector<int> f;\n    for (ll x : h) {\n        int p = viTriDat(tails, x);\n        if (p == (int)tails.size()) tails.push_back(x);  // kéo dài chuỗi dài nhất\n        else tails[p] = x;                               // hạ chiều cao ngoài cùng xuống\n        f.push_back(tails.size());\n    }\n    return f;\n}\n\nint main() {\n    int n;\n    scanf(\"%d\", &n);\n    vector<pair<ll, ll>> e(n);\n    for (auto& p : e) scanf(\"%lld %lld\", &p.first, &p.second);\n    // Rộng tăng dần; cùng rộng thì cao GIẢM dần để hai phong bì cùng rộng không bị xếp chung chuỗi.\n    sort(e.begin(), e.end(), [](const pair<ll, ll>& x, const pair<ll, ll>& y) {\n        if (x.first != y.first) return x.first < y.first;\n        return x.second > y.second;\n    });\n    vector<ll> h;\n    for (auto& p : e) h.push_back(p.second);\n    vector<int> f = doDaiTheoTienTo(h);\n    printf(\"%d\\n\", f.back());\n    return 0;\n}\n"}]},{"id":"L15","chapter":5,"chapterName":"Quy hoạch động","title":"Xâu con chung dài nhất","intro":"Xâu con chung dài nhất (LCS) là mẫu QHĐ hai chiều trên hai dãy: bảng dp[i][j] xét i phần tử đầu của dãy thứ nhất và j phần tử đầu của dãy thứ hai. Cùng khuôn bảng này giải nhiều bài tương tự như khoảng cách chỉnh sửa, xâu cha chung ngắn nhất, đếm cách xoá.","recognize":["Đề cho hai xâu (hoặc hai dãy) và hỏi phần chung, phần giống nhau, hoặc số thao tác để biến xâu này thành xâu kia.","Các từ khoá: \"xâu con chung\", \"dãy con chung\", \"xâu cha chung\", \"khoảng cách chỉnh sửa\", \"chèn, xoá, thay\", \"số cách xoá ký tự để hai xâu bằng nhau\".","Cận độ dài hai xâu cỡ vài nghìn (1000 đến 5000): bảng n × m phù hợp, còn vét cạn mọi dãy con 2^n thì không.","Phân biệt với đoạn con liên tiếp chung: nếu đề đòi các ký tự phải liền nhau thì khi hai ký tự khác nhau, dp bằng 0 chứ không lấy max."],"idea":["Đánh số ký tự từ 1. Định nghĩa dp[i][j] là độ dài LCS của a[1..i] và b[1..j]. Hàng 0 và cột 0 bằng 0 (xâu rỗng).","Xét hai ký tự cuối a[i] và b[j]. Nếu khớp, tối ưu luôn ghép cặp chúng: dp[i][j] = dp[i-1][j-1] + 1.","Nếu không khớp, ít nhất một trong hai ký tự không thuộc dãy chung: dp[i][j] = max(dp[i-1][j], dp[i][j-1]), tức bỏ a[i] hoặc bỏ b[j].","Duyệt i tăng, trong đó j tăng, vì dp[i][j] chỉ dùng ba ô trên, trái, chéo trên trái. Đáp án là dp[n][m].","Muốn in chính xâu: đi ngược từ (n, m). Nếu a[i] = b[j] thì lấy ký tự đó rồi lùi chéo; nếu không thì lùi sang ô lớn hơn trong dp[i-1][j] và dp[i][j-1]. Đảo ngược kết quả ở cuối.","Đổi dạng bằng cách đổi hàm khớp và công thức: khoảng cách chỉnh sửa thêm một nhánh thay thế và đặt cơ sở dp[i][0] = i, dp[0][j] = j; xâu cha chung có độ dài n + m trừ LCS; đếm cách thì cộng dồn các nhánh.","Bài xoá ký tự (chỉ xoá, hai xâu cuối cùng phải giống hệt): phần giữ lại là một xâu con chung, giữ càng dài thì xoá càng ít. Số lần xoá ít nhất là |a| + |b| - 2·LCS.","Khi chỉ cần độ dài, mỗi hàng chỉ phụ thuộc hàng trước nên giữ hai hàng là đủ; khi cần truy vết phải giữ cả bảng."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nconst int MAXN = 3005;             // chỉnh theo cận của đề\nstring a, b;                       // a[1..n], b[1..m] (thêm ký tự đệm ở đầu để đánh số từ 1)\nint n, m;\nstatic int dp[MAXN][MAXN];         // dp[i][j] = LCS của a[1..i] và b[1..j]\n\n// Hai phần tử a[i], b[j] có \"khớp\" với nhau không.\n// Với xâu: a[i] == b[j]. Với dãy khác: thay bằng điều kiện theo đề.\nbool khop(int i, int j) { return a[i] == b[j]; }\n\n// Điền bảng. Hàng 0 và cột 0 mặc định bằng 0.\n// Bài khác (khoảng cách chỉnh sửa, đếm cách...) thay hai nhánh bên trong và giá trị cơ sở.\nvoid dungBang() {\n    for (int i = 1; i <= n; i++)\n        for (int j = 1; j <= m; j++) {\n            if (khop(i, j)) dp[i][j] = dp[i - 1][j - 1] + 1;    // ghép cặp (i, j)\n            else dp[i][j] = max(dp[i - 1][j], dp[i][j - 1]);    // bỏ a[i] hoặc bỏ b[j]\n        }\n}\n\nint main() {\n    // Ví dụ dùng: in LCS của a với từng tiền tố của b.\n    cin >> a >> b;\n    n = a.size();\n    m = b.size();\n    a = \" \" + a;\n    b = \" \" + b;\n    dungBang();\n    for (int j = 0; j <= m; j++) printf(\"%d%c\", dp[n][j], j < m ? ' ' : '\\n');\n    return 0;\n}\n","skeletonNotes":["khop là chỗ thay khi đề định nghĩa \"giống nhau\" khác ký tự bằng nhau (ví dụ hai số có cùng dư).","dungBang chứa hai nhánh: nhánh khớp lấy ô chéo cộng 1, nhánh không khớp lấy max hai ô kề. Các bài cùng khuôn đổi hai nhánh này và hàng, cột cơ sở.","Hàng 0 và cột 0 mặc định 0 vì dp là biến toàn cục static. Bài cần cơ sở khác 0 (khoảng cách chỉnh sửa) phải gán rõ trước khi điền.","MAXN chỉnh theo cận đề. Bảng int 3005 × 3005 chiếm khoảng 36 MB; với cận lớn hơn dùng hai hàng hoặc kiểu nhỏ hơn.","main chỉ là ví dụ minh hoạ (in một hàng của bảng); bài thật in dp[n][m] hoặc truy vết theo đề."],"complexity":["O(n·m) thời gian và bộ nhớ. Với n, m = 3000 là 9·10^6 ô, chạy nhanh. Với n, m = 10^5 thì không dùng được.","Chỉ cần độ dài, không truy vết: giảm bộ nhớ xuống O(min(n, m)) bằng hai hàng luân phiên."],"pitfalls":["Quên đệm ký tự đầu nên a[0] bị dùng như ký tự thật
