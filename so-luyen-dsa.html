 thêm cạnh thì quá chậm.","recognize":["Các cạnh, quan hệ hoặc thao tác \"nối\" xuất hiện dần theo thứ tự, và giữa chừng có truy vấn \"hai phần tử có thông nhau không\", \"hiện có bao nhiêu nhóm\".","Quan hệ có tính bắc cầu (\"bạn của bạn là bạn\", \"cùng thành phần\"): mỗi nhóm là một lớp tương đương.","Đề hỏi cạnh nào là cạnh đầu tiên khép chu trình, hay cạnh nào làm hai nhóm hợp lại.","Mỗi nhóm cần thống kê (kích thước, số đỉnh màu y, tổng) và thống kê đó gộp được khi hợp nhóm.","Cận n, q cỡ 10^5 đến 2·10^5 và cần xử lý online từng thao tác: BFS lại mỗi lần là O(q·(n + m)), quá chậm."],"idea":["Mỗi phần tử có một cha; gốc của cây là đại diện của nhóm. Lúc đầu mỗi phần tử là gốc của chính nó.","tim(x) đi lên theo cha cho tới gốc, nén đường đi trên đường về để lần sau nhanh hơn.","hop(a, b): tìm gốc của a và b. Nếu trùng thì hai phần tử đã cùng nhóm, trả về false. Nếu khác thì gắn gốc nhóm nhỏ vào gốc nhóm lớn rồi trả về true.","Hai kỹ thuật nén đường đi và gắn nhóm nhỏ vào nhóm lớn làm mỗi thao tác gần như O(1).","hop trả về false chính là tín hiệu \"cạnh này khép chu trình\" hoặc \"hai phần tử đã thông nhau\". Bài tìm chu trình đầu tiên chỉ cần bắt tín hiệu này.","Thống kê theo nhóm (kích thước, tổng, số lượng theo màu) lưu ở gốc và cộng dồn khi hợp. Số thành phần giảm đi 1 mỗi lần hợp thành công.","Có thể xử lý offline theo thứ tự đảo ngược khi đề cho thao tác xoá: xoá cạnh theo thứ tự ngược chính là thêm cạnh."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nstruct DSU {\n    vector<int> cha, kichThuoc;\n    int soTP;                              // số tập hiện có\n\n    DSU(int n) : cha(n + 1), kichThuoc(n + 1, 1), soTP(n) {\n        iota(cha.begin(), cha.end(), 0);   // lúc đầu mỗi phần tử là một tập riêng\n    }\n    int tim(int x) {                       // tìm gốc, nén đường đi\n        while (cha[x] != x) {\n            cha[x] = cha[cha[x]];\n            x = cha[x];\n        }\n        return x;\n    }\n    // Hợp hai tập chứa a và b. Trả về false nếu a, b đã cùng một tập.\n    bool hop(int a, int b) {\n        a = tim(a);\n        b = tim(b);\n        if (a == b) return false;\n        if (kichThuoc[a] < kichThuoc[b]) swap(a, b);   // gắn tập nhỏ vào tập lớn\n        cha[b] = a;\n        kichThuoc[a] += kichThuoc[b];\n        soTP--;\n        return true;\n    }\n};\n\n// Gọi khi cạnh thứ i nối hai tập khác nhau (vừa được hợp lại).\n// Thay theo đề: cộng trọng số, đếm cạnh, in số thành phần mới...\nvoid xuLyHopNhat(int i, int u, int v, DSU &d) {}\n\n// Gọi khi cạnh thứ i có hai đầu đã cùng tập (cạnh thừa, khép chu trình).\nvoid xuLyCanhThua(int i, int u, int v, DSU &d) {}\n\nint main() {\n    int n, m;\n    scanf(\"%d %d\", &n, &m);\n    DSU d(n);\n    for (int i = 1; i <= m; i++) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        if (d.hop(u, v)) xuLyHopNhat(i, u, v, d);\n        else xuLyCanhThua(i, u, v, d);\n    }\n    printf(\"%d\\n\", d.soTP);                // đổi thành thứ đề yêu cầu in\n}\n","skeletonNotes":["struct DSU gói toàn bộ: cha, kichThuoc, soTP. Dùng lại nguyên văn cho mọi bài; chỉ thêm trường thống kê khi đề cần.","tim dùng vòng lặp thay đệ quy để không tràn stack khi cây còn cao. Nén đường đi kiểu \"trỏ lên ông\" (cha[x] = cha[cha[x]]) đủ nhanh.","hop gắn nhóm nhỏ vào nhóm lớn rồi cộng kichThuoc. Muốn gộp thống kê khác (tổng, max, số màu) thì cộng vào chính dòng cộng kichThuoc đó.","xuLyHopNhat được gọi khi hop thành công: ghi nhận cạnh hữu ích (cộng trọng số, đếm cạnh cây, in số thành phần mới...).","xuLyCanhThua được gọi khi hop thất bại: ghi nhận cạnh khép chu trình (chỉ số cạnh đầu tiên, đếm cạnh thừa...).","Thống kê dạng \"đếm theo màu\" không cộng thẳng được vào một số. Giữ map<int,int> ở mỗi gốc; khi hợp thì đổ map của nhóm nhỏ vào map của nhóm lớn rồi swap (gộp nhỏ vào lớn), tổng thời gian O(n log n) lần cập nhật map.","Phần tử không phải số nguyên (tên, toạ độ) thì ánh xạ về chỉ số 1..n bằng map hoặc sắp xếp trước, rồi dùng DSU như thường."],"complexity":["Mỗi thao tác tim hoặc hop mất O(α(n)) khấu hao, coi như hằng số (α là hàm Ackermann ngược, không vượt 5 với mọi n thực tế).","Tổng thời gian O((n + q)·α(n)); bộ nhớ O(n).","DSU chỉ gộp, không tách nhóm. Bài cần tách (xoá cạnh) phải xử lý offline theo chiều ngược."],"pitfalls":["Quên tim gốc trước khi so sánh: so sánh trực tiếp a với b thay vì tim(a) với tim(b) cho kết quả sai.","Cài tim bằng đệ quy mà không có nén đường đi và gắn theo kích thước: cây thành đường dài, vừa chậm vừa tràn stack.","Khi gộp thống kê, cộng nhầm vào phần tử không phải gốc. Thống kê luôn nằm ở gốc, sau tim().","Quên reset DSU giữa các bộ test, hoặc khởi tạo cha[i] = i chỉ tới n - 1.","Khuyên (u = v) và cạnh trùng: hop(u, u) trả về false nên chúng tự động bị coi là cạnh khép chu trình; đọc kỹ đề xem có tính chúng là chu trình hay không.","In đáp án theo chỉ số cạnh cuối cùng thay vì cạnh đầu tiên: nhớ ghi nhận chỉ một lần (if (dapAn == 0)).","Đọc 2·10^5 dòng bằng cin không tắt đồng bộ hoặc cout với endl gây chậm; dùng scanf/printf hoặc ios::sync_with_stdio(false)."],"practice":["dt-R","dt-H","mh6-D","dt-I","dt-J"],"examples":[{"key":"hd26-1","title":"Cạnh đầu tiên tạo chu trình","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nstruct DSU {\n    vector<int> cha, kichThuoc;\n    int soTP;                              // số tập (thành phần) hiện có\n\n    DSU(int n) : cha(n + 1), kichThuoc(n + 1, 1), soTP(n) {\n        iota(cha.begin(), cha.end(), 0);   // lúc đầu mỗi phần tử là một tập\n    }\n    int tim(int x) {                       // tìm gốc, nén đường đi\n        while (cha[x] != x) {\n            cha[x] = cha[cha[x]];\n            x = cha[x];\n        }\n        return x;\n    }\n    // Hợp hai tập chứa a và b. Trả về false nếu đã cùng một tập.\n    bool hop(int a, int b) {\n        a = tim(a);\n        b = tim(b);\n        if (a == b) return false;\n        if (kichThuoc[a] < kichThuoc[b]) swap(a, b);   // gắn tập nhỏ vào tập lớn\n        cha[b] = a;\n        kichThuoc[a] += kichThuoc[b];\n        soTP--;\n        return true;\n    }\n};\n\nint dapAn = 0;                             // chỉ số cạnh đầu tiên tạo chu trình\n\n// Gọi khi cạnh thứ i nối hai đỉnh đã cùng thành phần: cạnh này khép một chu trình.\nvoid xuLyCanhThua(int i, int u, int v, DSU &d) {\n    if (dapAn == 0) dapAn = i;             // chỉ ghi lần đầu\n}\n\nint main() {\n    int n, m;\n    scanf(\"%d %d\", &n, &m);\n    DSU d(n);\n    for (int i = 1; i <= m; i++) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        if (!d.hop(u, v)) xuLyCanhThua(i, u, v, d);   // khuyên u = v cũng rơi vào đây\n    }\n    printf(\"%d\\n\", dapAn);\n}\n"}]},{"id":"L27","chapter":7,"chapterName":"Đồ thị","title":"Đường đi ngắn nhất Dijkstra","intro":"Khi các cạnh có trọng số không âm, BFS không còn đúng và ta dùng Dijkstra: luôn mở rộng đỉnh có khoảng cách tạm nhỏ nhất, lấy ra bằng hàng đợi ưu tiên. Dạng này gồm đường đi rẻ nhất trên đồ thị, trên lưới có chi phí ô, và các biến thể có phí hoặc thời gian chờ.","recognize":["Cạnh hoặc ô có chi phí khác nhau (độ dài, thời gian, giá vé) và đề hỏi tổng chi phí nhỏ nhất.","Trọng số không âm (kể cả 0). Có trọng số âm thì Dijkstra sai, phải dùng Bellman-Ford.","Một nguồn, hỏi khoảng cách tới một đỉnh hoặc tới mọi đỉnh. n, m cỡ 10^5: O((n + m) log n) là mức cần.","Chi phí phụ thuộc đỉnh hoặc thời điểm: chờ ở nút giao, tàu chạy theo bội của k. Vẫn là Dijkstra, chỉ đổi cách tính chi phí khi đi qua một cạnh.","Cần số đường đi ngắn nhất hoặc đếm theo khoảng cách: Dijkstra kèm mảng đếm cộng dồn.","Kết quả lớn quá 2^31 (tổng nhiều cạnh 10^9): phải dùng long long."],"idea":["dist[u] là khoảng cách tốt nhất tìm được tới u, khởi tạo vô cực, dist[nguồn] = 0.","Dùng hàng đợi ưu tiên chứa cặp (khoảng cách, đỉnh), lấy cặp nhỏ nhất ra trước.","Lấy (d, u). Nếu d lớn hơn dist[u] thì đây là bản ghi cũ, bỏ qua. Ngược lại với mỗi cạnh u → v trọng số w, tính nd = d + w; nếu nd < dist[v] thì cập nhật dist[v] và đẩy (nd, v).","Lý do đúng: khi (d, u) được lấy ra lần đầu, mọi đường qua đỉnh chưa chốt đều dài hơn hoặc bằng d (vì trọng số không âm), nên d là khoảng cách thật.","Đỉnh vẫn có dist = vô cực khi kết thúc là đỉnh không tới được; in -1.","Lưới có chi phí ô: đỉnh là ô, đi vào ô nào thì cộng chi phí ô đó. Chi phí tính ở đỉnh đích của bước đi.","Biến thể có chờ hoặc phí: sửa hàm chiPhi sao cho nó trả về thời điểm đến v. Chỉ cần thời điểm đến không bao giờ nhỏ hơn d."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\ntypedef long long ll;\nconst ll INF = LLONG_MAX / 4;              // lớn hơn mọi khoảng cách thật, cộng thêm không tràn\n\nint n, m;\nvector<vector<pair<int, ll>>> adj;         // adj[u] = các cặp (v, w)\nvector<ll> dist;                           // dist[u] = khoảng cách ngắn nhất từ nguồn\n\nvoid docDoThi() {\n    scanf(\"%d %d\", &n, &m);\n    adj.assign(n + 1, {});\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        ll w;\n        scanf(\"%d %d %lld\", &u, &v, &w);\n        adj[u].push_back({v, w});\n        adj[v].push_back({u, w});          // đồ thị có hướng thì bỏ dòng này\n    }\n}\n\n// Chi phí để tới v khi đang ở u với khoảng cách d, đi cạnh trọng số w.\n// Mặc định là d + w. Đề có thêm phí tại đỉnh, thời gian chờ... thì sửa ở đây\n// (kết quả không được nhỏ hơn d, tức chi phí mỗi bước không âm).\nll chiPhi(int u, int v, ll d, ll w) { return d + w; }\n\nvoid dijkstra(int s) {\n    dist.assign(n + 1, INF);\n    priority_queue<pair<ll, int>, vector<pair<ll, int>>, greater<>> pq;   // heap nhỏ nhất\n    dist[s] = 0;\n    pq.push({0, s});\n    while (!pq.empty()) {\n        auto [d, u] = pq.top();\n        pq.pop();\n        if (d > dist[u]) continue;         // bản ghi cũ, đã có khoảng cách tốt hơn\n        for (auto [v, w] : adj[u]) {\n            ll nd = chiPhi(u, v, d, w);\n            if (nd < dist[v]) {\n                dist[v] = nd;\n                pq.push({nd, v});\n            }\n        }\n    }\n}\n\n// In kết quả từ dist: khoảng cách tới một đỉnh đích, tới mọi đỉnh, đỉnh xa nhất...\n// Khung in khoảng cách lớn nhất trong các đỉnh tới được; đổi theo đề.\nvoid xuatKetQua() {\n    ll mx = 0;\n    for (int u = 1; u <= n; u++)\n        if (dist[u] != INF) mx = max(mx, dist[u]);\n    printf(\"%lld\\n\", mx);\n}\n\nint main() {\n    docDoThi();\n    int s = 1;                             // lấy nguồn theo đề\n    dijkstra(s);\n    xuatKetQua();\n}\n","skeletonNotes":["INF = LLONG_MAX / 4 để cộng thêm trọng số không tràn. Đừng dùng INT_MAX cho khoảng cách.","adj[u] lưu cặp (v, w). Đồ thị có hướng thì chỉ thêm một chiều ở docDoThi. Nhiều cạnh nối cùng cặp đỉnh không cần xử lý riêng.","chiPhi là chỗ đổi theo đề. Mặc định d + w. Phí tại đỉnh, thời gian chờ tàu hay chi phí phụ thuộc thời điểm đều viết ở đây.","Điều kiện if (d > dist[u]) continue; loại bản ghi cũ trong hàng đợi, nhờ đó mỗi đỉnh được mở rộng tối đa một lần.","xuatKetQua đổi theo đề: in dist ở một đỉnh đích (nhớ đổi INF thành -1), in mọi dist, hay tìm đỉnh xa nhất. Khung chỉ in khoảng cách lớn nhất làm ví dụ.","Cạnh có nhiều thuộc tính (ví dụ thời gian đi t và chu kỳ tàu k) thì đổi cặp (v, w) thành struct Canh {int v; ll t, k;} và đọc chúng trong chiPhi. Trên lưới, thay adj bằng dist[r][c] và hàng đợi chứa bộ ba (khoảng cách, r, c); chi phí cộng ở ô đến.","Muốn dựng đường đi: lưu cha[v] = u mỗi lần cập nhật dist[v], rồi lần ngược từ đích.","Muốn đếm số đường ngắn nhất: thêm mảng dem; khi nd < dist[v] thì dem[v] = dem[u]; khi nd == dist[v] thì dem[v] += dem[u]."],"complexity":["Thời gian O((n + m) log n) với hàng đợi ưu tiên: mỗi cạnh đẩy tối đa một bản ghi.","Bộ nhớ O(n + m).","Trên lưới n × m ô: O(n·m·log(n·m)). Với trọng số chỉ 0 hoặc 1 có thể dùng deque (0-1 BFS) cho O(n + m)."],"pitfalls":["Trọng số âm làm Dijkstra sai. Kiểm tra lại cận w trong đề trước khi chọn thuật toán.","Khoảng cách dùng int bị tràn: n cạnh nối tiếp trọng số 10^9 đã cho 10^14. Dùng long long cho dist, cho INF và cả biến tạm nd.","Dùng priority_queue mặc định (heap lớn nhất) mà không đảo dấu hay greater<>: lấy ra đỉnh xa nhất, kết quả sai.","Không bỏ qua bản ghi cũ (thiếu if (d > dist[u]) continue;): đúng nhưng có thể chậm tới O(n·m).","In INF thay vì -1 cho đỉnh không tới được, hoặc kiểm tra dist == INF sau khi đã cộng thêm vào INF.","Nhầm đồ thị có hướng với vô hướng khi dựng danh sách kề, đặc biệt khi cạnh \"một chiều\" bị thêm hai chiều.","Dùng Dijkstra khi mọi bước chi phí 1: không sai nhưng chậm hơn BFS; ngược lại dùng BFS khi có trọng số khác nhau là sai."],"practice":["dt-L","mh3-D","dt-S","dt-U","mh10-D"],"examples":[{"key":"hd27-1","title":"Khoảng cách từ đỉnh 1 trên đồ thị có hướng","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\ntypedef long long ll;\nconst ll INF = LLONG_MAX / 4;              // lớn hơn mọi khoảng cách thật, cộng thêm không tràn\n\nint n, m;\nvector<vector<pair<int, ll>>> adj;         // adj[u] = danh sách (v, w) của cung u -> v\nvector<ll> dist;                           // dist[u] = khoảng cách ngắn nhất từ nguồn\n\nvoid docDoThi() {\n    scanf(\"%d %d\", &n, &m);\n    adj.assign(n + 1, {});\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        ll w;\n        scanf(\"%d %d %lld\", &u, &v, &w);\n        adj[u].push_back({v, w});          // có hướng: chỉ thêm một chiều\n    }\n}\n\n// Khoảng cách mới tới v khi đang ở u với khoảng cách d và đi cung có trọng số w.\nll chiPhi(int u, int v, ll d, ll w) { return d + w; }\n\nvoid dijkstra(int s) {\n    dist.assign(n + 1, INF);\n    priority_queue<pair<ll, int>, vector<pair<ll, int>>, greater<>> pq;   // heap nhỏ nhất\n    dist[s] = 0;\n    pq.push({0, s});\n    while (!pq.empty()) {\n        auto [d, u] = pq.top();\n        pq.pop();\n        if (d > dist[u]) continue;         // bản ghi cũ, đã có khoảng cách tốt hơn\n        for (auto [v, w] : adj[u]) {\n            ll nd = chiPhi(u, v, d, w);\n            if (nd < dist[v]) {\n                dist[v] = nd;\n                pq.push({nd, v});\n            }\n        }\n    }\n}\n\n// In khoảng cách tới mọi đỉnh; đỉnh không tới được in -1.\nvoid xuatKetQua() {\n    for (int u = 1; u <= n; u++)\n        printf(\"%lld%c\", dist[u] == INF ? -1 : dist[u], u == n ? '\\n' : ' ');\n}\n\nint main() {\n    docDoThi();\n    dijkstra(1);\n    xuatKetQua();\n}\n"}]},{"id":"L28","chapter":7,"chapterName":"Đồ thị","title":"Cây khung (Kruskal)","intro":"Cây khung là tập n-1 cạnh nối n đỉnh thành một cây. Đề thường hỏi tổng trọng số nhỏ nhất hoặc lớn nhất, hoặc cần chọn cạnh sao cho đồ thị vẫn liên thông. Thuật toán Kruskal gồm sắp xếp cạnh và DSU, cài đặt chưa đến 40 dòng.","recognize":["Đề nói \"cây khung\", \"nối tất cả các điểm với chi phí nhỏ nhất\", \"mạng liên thông tốn ít dây nhất\", hoặc có các cạnh kèm trọng số và yêu cầu giữ liên thông.","Đồ thị có thể có cạnh bội và khuyên; đáp án là một tổng (hoặc một đại lượng suy ra từ tổng) chứ không phải một đường đi.","Có sẵn một số cạnh cần \"thêm tối thiểu\" để liên thông: coi cạnh có sẵn có chi phí 0 (hoặc gộp nhóm trước), rồi thêm cạnh mới theo Kruskal.","Đề cho phép xoá bớt cạnh nhưng đồ thị phải còn liên thông (xoá cạnh được thưởng hoặc bị phạt theo trọng số): phần giữ lại phải chứa một cây khung, nên bài quy về Kruskal trên tập cạnh phải giữ.","n tới 10^5, m tới 2·10^5: dùng Kruskal O(m log m). Khi đồ thị đầy đủ nhỏ (n ≤ 10^3, cạnh sinh từ toạ độ) vẫn tạo hết n(n-1)/2 cạnh rồi sắp xếp được."],"idea":["Sắp xếp mọi cạnh theo trọng số tăng dần (muốn cây khung lớn nhất thì giảm dần).","Mỗi đỉnh bắt đầu là một nhóm riêng trong DSU. Duyệt cạnh theo thứ tự đã sắp.","Với cạnh (u, v): nếu u và v khác nhóm thì chọn cạnh, gộp hai nhóm và cộng trọng số. Nếu cùng nhóm thì chọn cạnh sẽ tạo chu trình, bỏ qua. Khuyên (u = v) tự bị bỏ vì luôn cùng nhóm.","Dừng khi đã chọn đủ n-1 cạnh. Nếu duyệt hết mà chọn được ít hơn n-1 cạnh thì đồ thị không liên thông và không tồn tại cây khung (một số đề yêu cầu in -1, số khác tính rừng khung từng thành phần).","Tính đúng vì: cạnh nhẹ nhất nối hai nhóm khác nhau luôn thuộc một cây khung nhỏ nhất nào đó. Cây khung lớn nhất chỉ là đảo thứ tự sắp xếp.","Khi đề cần \"giữ liên thông, xoá được nhiều nhất\" hay \"thêm tối thiểu\": xác định tập cạnh bắt buộc phải có (cạnh cây khung), phần còn lại tính riêng theo yêu cầu của đề."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nstruct Canh { int u, v; long long w; };\n\nvector<int> cha;  // DSU: cha[x] là cha của x, gốc có cha[x] == x\n\nint timGoc(int x) {  // tìm gốc của nhóm, nén đường đi\n    while (cha[x] != x) { cha[x] = cha[cha[x]]; x = cha[x]; }\n    return x;\n}\n\nbool hopNhat(int a, int b) {  // gộp hai nhóm; trả về false nếu đã cùng nhóm\n    a = timGoc(a); b = timGoc(b);\n    if (a == b) return false;\n    cha[a] = b;\n    return true;\n}\n\n// Thứ tự duyệt cạnh. Cây khung NHỎ nhất: trọng số tăng dần (a.w < b.w).\n// Cây khung LỚN nhất: đổi thành a.w > b.w. Bài có khoá phụ thì so thêm ở đây.\nbool truocNhau(const Canh& a, const Canh& b) { return a.w < b.w; }\n\n// Cạnh này có được đưa vào xét không? Mặc định xét mọi cạnh.\n// Thay nếu đề loại bớt cạnh (vd. chỉ dùng cạnh thoả một điều kiện).\nbool duocXet(const Canh& c) { (void)c; return true; }\n\n// Phần đóng góp của một cạnh được chọn vào đáp án (thường là trọng số).\n// Thay nếu đề tính khác (vd. đếm số cạnh, tính độ dài từ toạ độ).\nlong long giaTri(const Canh& c) { return c.w; }\n\nint main() {\n    int n, m;\n    scanf(\"%d %d\", &n, &m);\n    vector<Canh> e(m);\n    for (auto& c : e) scanf(\"%d %d %lld\", &c.u, &c.v, &c.w);\n\n    sort(e.begin(), e.end(), truocNhau);\n    cha.resize(n + 1);\n    iota(cha.begin(), cha.end(), 0);  // mỗi đỉnh là một nhóm riêng\n\n    long long tong = 0;\n    int soCanh = 0;  // số cạnh đã vào cây khung\n    for (const Canh& c : e) {\n        if (!duocXet(c)) continue;\n        if (hopNhat(c.u, c.v)) {  // nối hai nhóm khác nhau thì chọn, cùng nhóm thì bỏ\n            tong += giaTri(c);\n            soCanh++;\n        }\n    }\n    if (soCanh != n - 1) puts(\"-1\");  // không liên thông: in theo quy ước của đề\n    else printf(\"%lld\\n\", tong);\n    return 0;\n}\n","skeletonNotes":["timGoc và hopNhat là DSU chuẩn. Đoạn này giữ nguyên ở mọi bài Kruskal; mảng cha cần cỡ n+1 (đỉnh đánh số từ 1).","truocNhau quyết định thứ tự duyệt: đổi dấu so sánh để chuyển giữa cây khung nhỏ nhất và lớn nhất. Trọng số bằng nhau không ảnh hưởng tổng.","duocXet dùng khi đề loại bớt một số cạnh. giaTri dùng khi cạnh được chọn đóng góp thứ khác trọng số, ví dụ độ dài tính từ toạ độ (khi đó Canh cần w kiểu double và hàm hopNhat vẫn giữ nguyên).","Khi cạnh sinh từ toạ độ: tạo mọi cặp i < j với w là khoảng cách Euclid, và nếu đề có cạnh sẵn thì gọi hopNhat cho chúng trước khi duyệt cạnh mới.","Biến soCanh dùng để biết đồ thị có liên thông không. Dòng in -1 là quy ước tạm: sửa theo đề.","Một số bài cần sửa thân vòng duyệt: nhánh hopNhat trả false (cùng nhóm) không phải lúc nào cũng bỏ qua, xem mục lỗi hay gặp về cạnh âm."],"complexity":["Thời gian O(m log m) cho bước sắp xếp, phần DSU gần như O(m). Bộ nhớ O(n + m).","Dùng được với n, m cỡ 10^5 đến vài 10^5 trong 1 giây."],"pitfalls":["Tổng trọng số vượt 32 bit (n-1 cạnh, mỗi cạnh tới 10^9) hoặc âm: dùng long long cho tổng và cho trọng số.","Cây khung lớn nhất không có nghĩa là bỏ cạnh âm: cây khung vẫn phải đủ n-1 cạnh. Đừng thêm điều kiện \"chỉ lấy cạnh dương\".","Quên DSU nén đường đi: đồ thị dạng đường thẳng làm timGoc chậm O(n) mỗi lần. Hoặc dùng hợp theo kích thước.","Viết đệ quy trong timGoc với n = 10^5 có thể tràn ngăn xếp trên cây suy biến; bản vòng lặp ở khung an toàn hơn.","Cạnh bội và khuyên là bình thường, không cần xử lý riêng; nhưng lỗi hay gặp là dùng ma trận kề n × n khi n lớn, hoặc ghi đè cạnh bội thay vì lấy cạnh tốt hơn.","Đếm số thành phần liên thông ở cuối: nó bằng n trừ soCanh. Đề đồ thị không liên thông hay hỏi rừng khung chứ không phải -1, đọc kỹ đề.","Bài xoá cạnh có trọng số âm (xoá bị phạt): phần giữ lại không chỉ là cây khung. Mọi cạnh âm nằm ngoài cây khung cũng nên giữ, vì giữ lại thì lợi hơn xoá. Trong vòng duyệt cạnh, nhánh cùng nhóm cần cộng thêm cạnh nếu w < 0; đáp án là tổng tất cả trừ tổng phần giữ."],"practice":["mh7-D","dt-K","dt-T"],"examples":[{"key":"hd28-1","title":"Cây khung lớn nhất","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nstruct Canh { int u, v; long long w; };\n\nvector<int> cha;  // DSU: cha[x] là cha của x, gốc có cha[x] == x\n\nint timGoc(int x) {  // tìm gốc, nén đường đi\n    while (cha[x] != x) { cha[x] = cha[cha[x]]; x = cha[x]; }\n    return x;\n}\n\nbool hopNhat(int a, int b) {  // gộp hai nhóm; false nếu đã cùng nhóm\n    a = timGoc(a); b = timGoc(b);\n    if (a == b) return false;\n    cha[a] = b;\n    return true;\n}\n\n// Thứ tự duyệt cạnh: cây khung LỚN nhất nên duyệt trọng số giảm dần.\nbool truocNhau(const Canh& a, const Canh& b) { return a.w > b.w; }\n\nint main() {\n    int n, m;\n    scanf(\"%d %d\", &n, &m);\n    vector<Canh> e(m);\n    for (auto& c : e) scanf(\"%d %d %lld\", &c.u, &c.v, &c.w);\n\n    sort(e.begin(), e.end(), truocNhau);\n    cha.resize(n + 1);\n    iota(cha.begin(), cha.end(), 0);\n\n    long long tong = 0;  // tổng có thể vượt 32 bit và có thể âm\n    for (const Canh& c : e)\n        if (hopNhat(c.u, c.v)) tong += c.w;  // khuyên (u == v) tự bị loại\n\n    printf(\"%lld\\n\", tong);  // đề đảm bảo đồ thị liên thông nên đủ n-1 cạnh\n    return 0;\n}\n"}]},{"id":"L29","chapter":7,"chapterName":"Đồ thị","title":"Sắp xếp tô pô, thành phần liên thông mạnh và cầu","intro":"Nhóm này gồm các câu hỏi về cấu trúc của đồ thị. Đồ thị có hướng có thứ tự \"cái nào trước cái nào\" không (sắp xếp tô pô), nó chia thành những cụm đi lại hai chiều nào (thành phần liên thông mạnh), và đồ thị vô hướng có cạnh nào mà bỏ đi thì tách đôi (cầu). Cả ba cùng xoay quanh một lần duyệt DFS hoặc một hàng đợi bậc vào.","recognize":["\"Môn A phải học trước môn B\", \"việc nào làm trước\", \"thứ tự thực hiện\", \"có thể hoàn thành hết không\", \"số bước tối thiểu theo từng tầng\": sắp xếp tô pô. Cạnh có hướng, câu hỏi dạng \"có chu trình không / xếp được không\".","Yêu cầu thứ tự từ điển nhỏ nhất của một thứ tự hợp lệ: Kahn với hàng đợi ưu tiên.","Đồ thị có hướng, \"đi qua mọi đỉnh với số lần duyệt ít nhất\", \"nhóm đỉnh đi lại được cho nhau\", \"chu trình\": thành phần liên thông mạnh, rồi xét đồ thị rút gọn các thành phần (đồ thị này không có chu trình).","Đồ thị vô hướng, \"cầu\", \"cạnh mà phá đi làm tăng số thành phần liên thông\", \"điểm nghẽn\", \"đỉnh khớp\": low-link của Tarjan. Cận nhỏ (n ≤ 100) thì có thể thử xoá từng cạnh hoặc đỉnh rồi duyệt lại.","Cận lớn (n, m tới 10^5): cần O(n + m). Cận nhỏ cho phép làm ngây thơ nhưng đề vẫn cùng dạng."],"idea":["Sắp xếp tô pô (Kahn): tính bậc vào của mọi đỉnh, đưa các đỉnh bậc vào 0 vào hàng đợi. Lấy một đỉnh ra, với mỗi cạnh u -> v thì giảm bậc vào của v, về 0 thì đưa vào hàng đợi. Số đỉnh lấy ra nhỏ hơn n tức là có chu trình.","Kahn tính thêm được tầng (đường dài nhất tới mỗi đỉnh): khi lấy u ra, cập nhật tang[v] = max(tang[v], tang[u] + 1). Mọi bài kiểu \"quy hoạch động trên đồ thị không chu trình\" dùng thứ tự lấy ra này.","Thành phần liên thông mạnh (Tarjan): DFS đánh số num[u] theo thời điểm thăm, low[u] là num nhỏ nhất đạt được từ cây con của u nhờ nhiều nhất một cạnh ngược về đỉnh còn trong stack. Khi low[u] == num[u], u là gốc của một thành phần: lấy từ stack đến u ra, đó là một thành phần.","Sau khi gán scc[], đồ thị rút gọn là đồ thị không chu trình. Câu hỏi như \"thành phần nào không có cạnh vào\", \"cần bao nhiêu điểm xuất phát để phủ mọi đỉnh\" quy về đếm bậc vào của đồ thị rút gọn.","Cầu (vô hướng): DFS với num và low như trên, nhưng cạnh ngược chỉ bị bỏ đúng cạnh vừa đi xuống. Cạnh cha - con (u, v) là cầu khi low[v] > num[u], nghĩa là cây con của v không có đường nào quay lên u hoặc tổ tiên.","Điểm nghẽn / đỉnh khớp: tương tự với điều kiện low[v] >= num[u] (có xử lý riêng cho gốc DFS). Với n nhỏ có thể xoá đỉnh rồi kiểm tra lại bằng BFS."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nconst int N = 100005;\nvector<int> ke[N];             // đồ thị CÓ HƯỚNG: u -> v\nvector<pair<int,int>> keV[N];  // đồ thị VÔ HƯỚNG: (đỉnh kề, số hiệu cạnh), dùng cho tìm cầu\n\n// ---------- 1. Sắp xếp tô pô (Kahn) ----------\nint bacVao[N];   // số cạnh đi vào mỗi đỉnh\nint tang[N];     // tầng của đỉnh: 1 + tầng lớn nhất của các đỉnh đứng trước nó\n\n// Trả về số đỉnh lấy ra được; nhỏ hơn n nghĩa là đồ thị có chu trình.\n// thuTu chứa một thứ tự tô pô hợp lệ. Muốn thứ tự từ điển nhỏ nhất:\n// đổi queue thành priority_queue<int, vector<int>, greater<int>>.\nint sapXepToPo(int n, vector<int>& thuTu) {\n    queue<int> q;\n    for (int i = 1; i <= n; i++)\n        if (bacVao[i] == 0) { q.push(i); tang[i] = 1; }\n    while (!q.empty()) {\n        int u = q.front(); q.pop();\n        thuTu.push_back(u);\n        for (int v : ke[u]) {\n            tang[v] = max(tang[v], tang[u] + 1);  // cập nhật giá trị theo cạnh u -> v\n            if (--bacVao[v] == 0) q.push(v);\n        }\n    }\n    return (int)thuTu.size();\n}\n\n// ---------- 2. Thành phần liên thông mạnh (Tarjan) ----------\nint thoiGian, num[N], low[N], scc[N], soScc;\nbool trongStack[N];\nvector<int> stk;\n\nvoid tarjan(int u) {\n    num[u] = low[u] = ++thoiGian;\n    stk.push_back(u); trongStack[u] = true;\n    for (int v : ke[u]) {\n        if (!num[v]) { tarjan(v); low[u] = min(low[u], low[v]); }\n        else if (trongStack[v]) low[u] = min(low[u], num[v]);\n    }\n    if (low[u] == num[u]) {  // u là gốc của một thành phần: lấy cả thành phần ra khỏi stack\n        soScc++;\n        while (true) {\n            int x = stk.back(); stk.pop_back();\n            trongStack[x] = false; scc[x] = soScc;\n            if (x == u) break;\n        }\n    }\n}\n\n// ---------- 3. Cầu của đồ thị vô hướng ----------\nint numV[N], lowV[N], dem, soCau;\n\nvoid timCau(int u, int canhCha) {\n    numV[u] = lowV[u] = ++dem;\n    for (auto [v, id] : keV[u]) {\n        if (id == canhCha) continue;  // bỏ đúng cạnh vừa đi xuống (không bỏ theo đỉnh, vì có cạnh bội)\n        if (!numV[v]) {\n            timCau(v, id);\n            lowV[u] = min(lowV[u], lowV[v]);\n            if (lowV[v] > numV[u]) soCau++;  // cạnh id là cầu; cần danh sách cầu thì ghi id lại\n        } else lowV[u] = min(lowV[u], numV[v]);\n    }\n}\n\nint main() {\n    int n, m;\n    scanf(\"%d %d\", &n, &m);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        ke[u].push_back(v); bacVao[v]++;                    // dùng cho phần 1 và 2\n        keV[u].push_back({v, i}); keV[v].push_back({u, i}); // dùng cho phần 3\n    }\n    // Mỗi bài chỉ cần một trong ba phần: giữ phần cần dùng, xoá phần còn lại.\n    vector<int> thuTu;\n    bool coChuTrinh = sapXepToPo(n, thuTu) < n;\n    for (int i = 1; i <= n; i++) if (!num[i]) tarjan(i);\n    for (int i = 1; i <= n; i++) if (!numV[i]) timCau(i, -1);\n    printf(\"%d %d %d\\n\", (int)coChuTrinh, soScc, soCau);\n    return 0;\n}\n","skeletonNotes":["Phần 1: bacVao và tang được cập nhật trong sapXepToPo. Hàm trả về số đỉnh lấy ra để so với n; thuTu là thứ tự tô pô. Dòng cập nhật tang là chỗ thay bằng giá trị đề cần (độ dài đường dài nhất, số đường đi, ...).","Muốn thứ tự từ điển nhỏ nhất: đổi queue thành priority_queue với greater<int>. Muốn in -1 khi có chu trình: kiểm tra giá trị trả về.","Phần 2: scc[x] là số hiệu thành phần của x, soScc là số thành phần. Số hiệu do Tarjan gán theo thứ tự ngược tô pô của đồ thị rút gọn. Với đồ thị lớn mà đệ quy sâu, hãy cài bằng vòng lặp hoặc tăng ngăn xếp.","Phần 3: keV chứa cặp (đỉnh kề, số hiệu cạnh) để phân biệt cạnh bội. canhCha = -1 cho gốc DFS. Đếm soCau hoặc ghi id ra mảng nếu đề cần liệt kê cầu.","main đọc cạnh một lần vào cả hai cấu trúc để khung chạy thử được. Khi làm bài thật, giữ phần cần dùng; nếu đề cho đồ thị vô hướng mà làm phần 1 thì phải đổi cách thêm cạnh theo đề."],"complexity":["Cả ba đều O(n + m) thời gian, O(n + m) bộ nhớ.","Kahn và Tarjan dùng được với n, m tới 10^5 đến 10^6. Cách thử xoá từng cạnh hay đỉnh rồi duyệt lại là O(n·(n + m)), chỉ dùng khi n cỡ vài trăm."],"pitfalls":["Quên rằng Kahn chỉ lấy hết đỉnh khi không có chu trình. Khuyên (u -> u) cũng là chu trình: đỉnh đó có bậc vào không bao giờ về 0 nên sapXepToPo tự phát hiện, không cần xử lý riêng.","Cạnh bội: bacVao đếm theo số cạnh nên phải trừ đúng số lần. Nếu dùng ma trận kề hoặc set để khử trùng lặp thì khử ở cả hai nơi.","Nhiều bộ test: xoá ke, bacVao, tang, num, low, stk, thoiGian và các biến đếm giữa các bộ.","Tìm cầu mà bỏ qua theo đỉnh cha thay vì theo số hiệu cạnh sẽ sai khi có hai cạnh bội nối cùng một cặp đỉnh: chúng không phải cầu.","DFS đệ quy với đường thẳng 10^5 đỉnh có thể tràn ngăn xếp. Cài bằng ngăn xếp tường minh hoặc kiểm tra giới hạn trước khi làm.","Tarjan phải duyệt từ mọi đỉnh chưa thăm, không chỉ từ đỉnh 1: đồ thị có thể không liên thông.","Đỉnh nghẽn / khớp: gốc DFS là khớp khi có từ hai con DFS; công thức low[v] >= num[u] áp dụng cho các đỉnh còn lại."],"practice":["mh5-D","dt-E","dt-B","dt-D"],"examples":[{"key":"hd29-1","title":"Số học kỳ ít nhất","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nconst int N = 100005;\nvector<int> ke[N];   // ke[u]: các môn v phải học sau u\nint bacVao[N];       // số môn tiên quyết chưa học xong của mỗi môn\nint tang[N];         // tang[v]: học kỳ sớm nhất của môn v (kỳ 1, 2, ...)\n\n// Kahn: lấy dần các đỉnh bậc vào 0. Trả về số đỉnh lấy ra được;\n// nhỏ hơn n nghĩa là còn đỉnh nằm trên hoặc sau chu trình.\nint sapXepToPo(int n) {\n    queue<int> q;\n    for (int i = 1; i <= n; i++)\n        if (bacVao[i] == 0) { q.push(i); tang[i] = 1; }\n    int daLay = 0;\n    while (!q.empty()) {\n        int u = q.front(); q.pop();\n        daLay++;\n        for (int v : ke[u]) {\n            tang[v] = max(tang[v], tang[u] + 1);  // v phải học sau u ít nhất một kỳ\n            if (--bacVao[v] == 0) q.push(v);\n        }\n    }\n    return daLay;\n}\n\nint main() {\n    int n, m;\n    scanf(\"%d %d\", &n, &m);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        ke[u].push_back(v);   // cạnh trùng hay khuyên đều xử lý đúng:\n        bacVao[v]++;          // khuyên u->u làm bacVao[u] không bao giờ về 0\n    }\n    if (sapXepToPo(n) < n) { puts(\"-1\"); return 0; }  // có chu trình\n    int dapAn = 0;\n    for (int i = 1; i <= n; i++) dapAn = max(dapAn, tang[i]);\n    printf(\"%d\\n\", dapAn);\n    return 0;\n}\n"}]},{"id":"L30","chapter":7,"chapterName":"Đồ thị","title":"Floyd–Warshall","intro":"Khi đề hỏi khoảng cách giữa mọi cặp đỉnh (hoặc nhiều truy vấn trên đồ thị nhỏ), Floyd-Warshall cho ta một bảng d[i][j] chỉ với ba vòng for lồng nhau. Ý tưởng cũng dùng được cho nhiều đại lượng khác ngoài tổng độ dài.","recognize":["Nhiều truy vấn (u, v) hỏi đường đi tốt nhất giữa hai đỉnh bất kỳ, hoặc hỏi một đại lượng cho mọi cặp đỉnh.","Cận n nhỏ: n ≤ 300 đến 500 (n^3 vài chục triệu đến 10^8). Số cạnh có thể đến n^2, số truy vấn có thể lên đến 10^5.","Đề kiểu \"cạnh lớn nhất trên đường đi nhỏ nhất có thể\", \"u có tới được v không\" cho mọi cặp, \"chu trình ngắn nhất qua mọi đỉnh\": cùng khung Floyd, chỉ đổi cách ghép hai đoạn.","Có cạnh trọng số âm nhưng không có chu trình âm: Floyd vẫn đúng. Một đỉnh nguồn và n lớn: dùng Dijkstra, không phải Floyd."],"idea":["Gọi d[i][j] là độ dài đường đi ngắn nhất từ i đến j chỉ dùng các đỉnh trung gian trong tập đã xét. Ban đầu d[i][i] = 0, d[i][j] bằng trọng số cạnh nhỏ nhất (nếu có), còn lại là vô cùng.","Lần lượt cho phép thêm đỉnh k làm trung gian, k = 1..n. Với mỗi cặp (i, j): d[i][j] = min(d[i][j], d[i][k] + d[k][j]).","Sau khi cho phép đủ n đỉnh, d[i][j] là khoảng cách thật. Mỗi truy vấn trả lời O(1) bằng tra bảng.","Cạnh bội: giữ cạnh nhỏ nhất. Khuyên: bỏ qua, vì d[i][i] = 0 đã tốt hơn. Đồ thị vô hướng: gán cả d[u][v] và d[v][u].","Floyd tổng quát: thay phép cộng bằng phép ghép khác và min bằng phép chọn khác (ví dụ ghép bằng max khi đề xét cạnh nặng nhất trên đường đi). Chỉ cần phép ghép và phép chọn giữ được tính chất \"đường qua k được ghép từ hai đoạn nhỏ hơn\"."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nconst int N = 305;                      // n tối đa, cộng dư\nconst long long VO_CUC = (long long)1e18; // \"chưa có đường\"; đủ lớn nhưng cộng hai lần vẫn không tràn\nlong long d[N][N];                      // d[i][j]: giá trị tốt nhất của đường đi i -> j\n\n// Cách ghép hai đoạn đường i -> k và k -> j. Đường ngắn nhất: cộng.\n// Đổi thành max(a, b) nếu đề tính theo cạnh lớn nhất trên đường đi.\nlong long ghep(long long a, long long b) { return a + b; }\n\n// Hai giá trị, giá trị nào \"tốt hơn\". Đường ngắn nhất: lấy min.\nlong long chon(long long a, long long b) { return min(a, b); }\n\n// Floyd-Warshall. Thứ tự vòng lặp bắt buộc: k (đỉnh trung gian) ngoài cùng.\nvoid floyd(int n) {\n    for (int k = 1; k <= n; k++)\n        for (int i = 1; i <= n; i++) {\n            if (d[i][k] >= VO_CUC) continue;           // chưa có đường i -> k\n            for (int j = 1; j <= n; j++)\n                if (d[k][j] < VO_CUC)                   // chỉ ghép khi cả hai đoạn tồn tại\n                    d[i][j] = chon(d[i][j], ghep(d[i][k], d[k][j]));\n        }\n}\n\nint main() {\n    int n, m, q;\n    scanf(\"%d %d %d\", &n, &m, &q);\n    for (int i = 1; i <= n; i++)\n        for (int j = 1; j <= n; j++) d[i][j] = (i == j ? 0 : VO_CUC);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        long long w;\n        scanf(\"%d %d %lld\", &u, &v, &w);\n        d[u][v] = chon(d[u][v], w);   // cạnh bội: giữ cạnh tốt nhất\n        // đồ thị vô hướng: thêm d[v][u] = chon(d[v][u], w) tương tự\n    }\n    floyd(n);\n    while (q--) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        if (d[u][v] >= VO_CUC) puts(\"-1\");      // không có đường: in theo quy ước của đề\n        else printf(\"%lld\\n\", d[u][v]);\n    }\n    return 0;\n}\n","skeletonNotes":["VO_CUC = 10^18 chứ không phải LLONG_MAX, để cộng hai giá trị vẫn không tràn. Khung còn kiểm tra d[i][k] và d[k][j] hữu hạn trước khi ghép, nên phép ghép khác cũng không nhầm VO_CUC với một đường thật.","ghep và chon là hai chỗ đổi theo đề. Đường ngắn nhất: a + b và min. Phép khác chọn sao cho đúng ý nghĩa \"đi từ i qua k đến j\".","Vòng k phải ở ngoài cùng; đổi thứ tự i, j, k cho kết quả sai.","Đọc cạnh: nếu đề cho đồ thị vô hướng thì gán cả hai chiều; cạnh bội thì giữ cạnh tốt nhất bằng chon.","Trả lời truy vấn: d[u][v] còn bằng VO_CUC nghĩa là không có đường, in theo quy ước của đề (thường là -1)."],"complexity":["Thời gian O(n^3), bộ nhớ O(n^2). Với n = 300 là 2,7·10^7 phép, rất nhanh; n = 500 là 1,25·10^8, vẫn kịp trong 1 giây nếu code gọn.","Mỗi truy vấn O(1) sau khi tính xong, nên q lên tới 10^5 hay hơn cũng không vấn đề."],"pitfalls":["Tổng độ dài vượt 32 bit: n - 1 cạnh, mỗi cạnh 10^9 cho 3·10^11. Dùng long long cho cả d.","Đặt VO_CUC quá lớn (LLONG_MAX hoặc 4e18) rồi cộng hai VO_CUC bị tràn thành số âm, làm mọi đáp án sai. Hãy dùng 10^18 và kiểm tra hữu hạn như khung.","Vòng for k đặt trong cùng: đáp án sai ở các đồ thị có đường dài nhiều đoạn.","Quên đặt d[i][i] = 0: truy vấn (u, u) trả -1 hoặc một số dương nếu có khuyên hay chu trình.","Dùng scanf/printf với q lớn; cin/cout không tắt đồng bộ hoá có thể chậm.","Dùng Floyd khi n = 10^5: n^3 không thể chạy. Đây là dấu hiệu cần Dijkstra hoặc BFS từ một nguồn."],"practice":["dt-M"],"examples":[{"key":"hd30-1","title":"Khoảng cách giữa mọi cặp đỉnh","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nconst int N = 305;\nconst long long VO_CUC = (long long)1e18;  // nhỏ hơn giới hạn long long để cộng hai VO_CUC không tràn\nlong long d[N][N];\n\n// Floyd-Warshall: d[i][j] = khoảng cách ngắn nhất từ i đến j (VO_CUC nếu không tới được).\n// Thứ tự k ngoài cùng là bắt buộc: k là đỉnh trung gian được phép dùng.\nvoid floyd(int n) {\n    for (int k = 1; k <= n; k++)\n        for (int i = 1; i <= n; i++) {\n            if (d[i][k] >= VO_CUC) continue;          // chưa có đường i -> k\n            for (int j = 1; j <= n; j++)\n                if (d[k][j] < VO_CUC)                  // chỉ cộng khi cả hai vế hữu hạn\n                    d[i][j] = min(d[i][j], d[i][k] + d[k][j]);\n        }\n}\n\nint main() {\n    int n, m, q;\n    scanf(\"%d %d %d\", &n, &m, &q);\n    for (int i = 1; i <= n; i++)\n        for (int j = 1; j <= n; j++) d[i][j] = (i == j ? 0 : VO_CUC);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        long long w;\n        scanf(\"%d %d %lld\", &u, &v, &w);\n        d[u][v] = min(d[u][v], w);  // cạnh bội: giữ cạnh nhẹ nhất; khuyên không làm d[u][u] > 0\n    }\n    floyd(n);\n    while (q--) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        if (d[u][v] >= VO_CUC) puts(\"-1\");\n        else printf(\"%lld\\n\", d[u][v]);\n    }\n    return 0;\n}\n"}]},{"id":"L31","chapter":7,"chapterName":"Đồ thị","title":"Duyệt cây tổng quát","intro":"Cây là đồ thị liên thông không có chu trình. Chọn một đỉnh làm gốc thì mỗi đỉnh có một cha, một độ sâu và một cây con. Phần lớn bài về cây đều là: duyệt một lần để biết cha và độ sâu, rồi gom thông tin từ lá lên gốc.","recognize":["Đề cho n đỉnh và n-1 cạnh (hoặc cho mảng cha a_i < i), nói \"cây gốc 1\".","Hỏi theo từng đỉnh: độ sâu, cha, kích thước cây con, số đỉnh trắng/đen trong cây con, tổng giá trị trong cây con.","Hỏi toàn cây: chiều cao, đường kính, tổng độ sâu, chọn k đỉnh để tối đa điểm dựa trên độ sâu hoặc kích thước cây con.","n tới 10^5 hoặc hơn: cây có thể suy biến thành đường thẳng, nên đệ quy sâu n tầng là nguy hiểm."],"idea":["Lưu cây bằng danh sách kề, cạnh cho vô hướng nên thêm cả hai chiều.","Duyệt từ gốc bằng ngăn xếp (hoặc hàng đợi BFS). Mỗi đỉnh v lấy từ u: cha[v] = u, sau[v] = sau[u] + 1. Bỏ qua hàng xóm chính là cha để khỏi quay lui.","Ghi lại thứ tự thăm. Trong thứ tự này cha luôn đứng trước con.","Muốn gom thông tin cây con: duyệt thứ tự đó từ cuối về đầu, mỗi đỉnh đẩy thông tin của nó vào cha. Khi gặp đỉnh v, mọi con của v đã được gom xong.","Bài chọn đỉnh theo độ sâu hay kích thước cây con: tính mảng cần thiết như trên rồi sắp xếp hoặc cộng các phần tử lớn nhất.","Cây cho bằng mảng cha a_i < i thì không cần duyệt gốc xuống: chạy i từ n về 2, gộp thông tin của i vào a_i; độ sâu thì chạy i từ 2 lên n, sau[i] = sau[a_i] + 1."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nconst int N = 100005;\nvector<int> ke[N];     // danh sách kề (cạnh vô hướng thì thêm cả hai chiều)\nint cha[N], sau[N];    // cha[v]: đỉnh cha (gốc có cha 0), sau[v]: độ sâu (gốc có độ sâu 0)\nlong long gt[N];       // thông tin cần gom từ cây con (vd. kích thước, tổng giá trị)\nvector<int> thuTu;     // thứ tự duyệt: cha luôn đứng trước con của nó\n\n// Giá trị ban đầu của đỉnh v trước khi gom từ các con.\n// Thay theo đề (vd. 1 để đếm đỉnh, a[v] để cộng giá trị).\nlong long khoiTao(int v) { (void)v; return 0; }\n\n// Gom thông tin của con vào cha. Thay theo đề (cộng, max, đếm ...).\nvoid gopTuCon(int con, int bo) { gt[bo] += gt[con]; }\n\n// Duyệt cây từ gốc bằng ngăn xếp tường minh, không đệ quy.\n// Gán cha, độ sâu và ghi thứ tự duyệt.\nvoid duyetCay(int goc) {\n    vector<int> st = {goc};\n    cha[goc] = 0; sau[goc] = 0;\n    while (!st.empty()) {\n        int u = st.back(); st.pop_back();\n        thuTu.push_back(u);\n        for (int v : ke[u]) {\n            if (v == cha[u]) continue;   // không quay lại cha\n            cha[v] = u;\n            sau[v] = sau[u] + 1;         // việc cần làm khi đi từ cha xuống con\n            st.push_back(v);\n        }\n    }\n}\n\nint main() {\n    int n;\n    scanf(\"%d\", &n);\n    for (int i = 0; i < n - 1; i++) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        ke[u].push_back(v);\n        ke[v].push_back(u);\n    }\n    duyetCay(1);\n    for (int v = 1; v <= n; v++) gt[v] = khoiTao(v);\n    for (int i = n - 1; i >= 1; i--) {        // duyệt ngược: con luôn được xử lý trước cha\n        int v = thuTu[i];\n        gopTuCon(v, cha[v]);\n    }\n    for (int v = 1; v <= n; v++) printf(\"%d %d %lld\\n\", sau[v], cha[v], gt[v]);  // in theo đề\n    return 0;\n}\n","skeletonNotes":["duyetCay là phần cố định của dạng: kết quả là cha[], sau[] và thuTu. Dùng vector làm ngăn xếp nên không lo tràn khi cây là đường thẳng.","khoiTao và gopTuCon là hai chỗ đổi theo đề. Đếm đỉnh: khoiTao trả 1, gopTuCon cộng. Số đỉnh đen trừ đỉnh trắng: khoiTao trả +1 hoặc -1. Giá trị lớn nhất cây con: gopTuCon lấy max.","Vòng gom chạy từ cuối thuTu về đầu và bỏ đỉnh gốc (vị trí 0). Vì thuTu là thứ tự cha trước con nên thông tin của con đã đầy đủ khi gom vào cha.","Dòng in là ví dụ: sửa theo đề.","Nhiều bộ test: xoá ke, thuTu và gán lại cha, sau, gt giữa các bộ."],"complexity":["Thời gian O(n), bộ nhớ O(n).","Chạy được với n tới 10^6 nếu đọc nhanh."],"pitfalls":["Đệ quy DFS trên cây dạng đường thẳng 10^5 đỉnh có thể tràn ngăn xếp (tuỳ máy chấm). Dùng ngăn xếp tường minh hoặc BFS như khung.","Cạnh trong input không theo thứ tự cha trước con: \"u v\" không có nghĩa u là cha của v. Phải duyệt từ gốc mới biết hướng.","Gốc có cha 0, độ sâu 0 (đếm theo số cạnh). Đọc kỹ đề xem độ sâu tính theo cạnh hay theo đỉnh (khác nhau 1).","Tổng độ sâu hay tổng giá trị cây con của n = 10^5 đỉnh có thể vượt 32 bit: dùng long long.","Quên bỏ cha khi duyệt hàng xóm: duyệt quay lại cha và lặp vô hạn.","Quên xoá dữ liệu giữa các bộ test khi đề nhiều bộ."],"practice":["dt-O","dt-Q","dt-P"],"examples":[{"key":"hd31-1","title":"Độ sâu và cha trong cây","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nconst int N = 100005;\nvector<int> ke[N];     // danh sách kề (cạnh vô hướng nên thêm cả hai chiều)\nint cha[N], sau[N];    // cha[v]: đỉnh cha, sau[v]: độ sâu (gốc có độ sâu 0)\nvector<int> thuTu;     // thứ tự duyệt tiền thứ tự: cha luôn đứng trước con\n\n// Duyệt cây từ gốc bằng ngăn xếp tường minh (không đệ quy, cây dạng đường thẳng\n// 10^5 đỉnh không làm tràn ngăn xếp). Gán cha, độ sâu và ghi thứ tự duyệt.\nvoid duyetCay(int goc) {\n    vector<int> st = {goc};\n    cha[goc] = 0; sau[goc] = 0;\n    while (!st.empty()) {\n        int u = st.back(); st.pop_back();\n        thuTu.push_back(u);\n        for (int v : ke[u]) {\n            if (v == cha[u]) continue;   // không quay lại cha\n            cha[v] = u;\n            sau[v] = sau[u] + 1;         // việc cần làm khi đi từ cha xuống con\n            st.push_back(v);\n        }\n    }\n}\n\nint main() {\n    int n;\n    scanf(\"%d\", &n);\n    for (int i = 0; i < n - 1; i++) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        ke[u].push_back(v);\n        ke[v].push_back(u);\n    }\n    duyetCay(1);\n    for (int i = 1; i <= n; i++) printf(\"%d %d\\n\", sau[i], cha[i]);\n    return 0;\n}\n"}]},{"id":"L32","chapter":8,"chapterName":"Cây nhị phân","title":"Duyệt cây nhị phân và dựng từ level order có N","intro":"Phần lớn bài về cây nhị phân bắt đầu bằng việc đọc cây từ input rồi duyệt nó. Cây hay được cho dưới dạng dãy theo mức có chữ N đánh dấu chỗ trống, hoặc danh sách cạnh. Nắm chắc ba phép duyệt và cách dựng cây là nền cho mọi bài sau.","recognize":["Đề cho cây bằng một dòng token như \"1 2 3 N N 4\", trong đó N là chỗ không có nút. Đó là level order có N.","Đề cho danh sách cạnh \"u v L/R\" (u là cha của v, L hoặc R là hướng) và hỏi về đường từ gốc tới lá.","Đề yêu cầu in tiền thứ tự, trung thứ tự, hậu thứ tự hoặc biến thể (phải trước trái, theo mức, zig-zag).","Đề hỏi về mỗi nút so với các nút trên đường từ gốc tới nó: độ sâu, tổng đường đi, giá trị lớn nhất hay nhỏ nhất trên đường. Thông tin này phải truyền từ trên xuống.","Đề hỏi một đại lượng tính từ cây con: chiều cao, đường kính, cây có cân bằng không, đếm đường đi có tổng S.","Cận lớn (tổng token tới 10^5 hay 2·10^5) và cây có thể lệch thành đường thẳng, nên phải để ý độ sâu đệ quy."],"idea":["Đọc cả dòng bằng getline rồi tách token. Không đọc bằng cin >> khi số token mỗi cây không biết trước.","Dựng cây bằng một hàng đợi các nút đang chờ con. Lấy nút ở đầu hàng đợi, đọc hai token kế tiếp: token đầu là con trái, token sau là con phải. Token N bỏ qua và không đọc thêm gì cho nó; token số tạo nút mới, gắn vào cha và đẩy vào hàng đợi. Hết token thì dừng, các con còn lại coi như trống.","Thứ tự các nút được tạo ra chính là thứ tự duyệt theo mức. Nhiều bài về mức (zig-zag, độ sâu từng mức) chỉ cần dùng thứ tự này.","Ba phép duyệt chỉ khác vị trí của việc thăm nút so với hai lời gọi đệ quy: trước hai lời gọi (tiền), giữa (trung), sau (hậu). Muốn đổi thứ tự trái phải thì đổi thứ tự hai lời gọi.","Khi cần thông tin từ gốc xuống nút (độ sâu, tổng, lớn nhất trên đường), thêm một tham số cho hàm duyệt. Nút u nhận tham số của mình, xử lý, rồi tính tham số cho hai con từ tham số đó và giá trị của u. Tại gốc, tham số mang nghĩa \"phía trên chưa có nút nào\", nên phải chọn giá trị khởi đầu không làm sai kết quả (với lớn nhất thì dùng giá trị nhỏ hơn mọi giá trị có thể).","Các đại lượng của cây (chiều cao, số lá, tổng đường) đều có dạng: tính cho hai cây con, rồi ghép với nút hiện tại. Quy ước cây rỗng trả về giá trị gì (-1 hay 0 cho chiều cao) là phần phải đọc kỹ trong đề.","Khi đề cho danh sách cạnh thì điền thẳng con[u][0], con[u][1]; gốc là nút không bao giờ xuất hiện như con."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nconst int MAXN = 200005;\nint giaTri[MAXN];       // giá trị của nút u (nút đánh số từ 1)\nint con[MAXN][2];       // con[u][0] = con trái, con[u][1] = con phải, 0 = không có\nint soNut;\nvector<int> kq;         // các giá trị theo thứ tự duyệt\n\n// Dựng cây từ dãy token theo mức (N = không có nút). Trả về gốc.\n// Nếu đề cho cây bằng danh sách cạnh thì bỏ hàm này, điền thẳng giaTri[], con[][].\nint dungCay(const vector<string>& tk) {\n    soNut = 0;\n    vector<int> hang;                       // hàng đợi các nút đang chờ nhận con\n    int goc = ++soNut;\n    giaTri[goc] = stoi(tk[0]);\n    con[goc][0] = con[goc][1] = 0;\n    hang.push_back(goc);\n    size_t pos = 1;                         // token kế tiếp chưa dùng\n    for (size_t h = 0; h < hang.size(); h++) {\n        int u = hang[h];\n        for (int s = 0; s < 2 && pos < tk.size(); s++) {   // s = 0: con trái, s = 1: con phải\n            const string& x = tk[pos++];\n            if (x == \"N\") continue;         // N: không tạo nút, không đọc thêm gì cho nó\n            int v = ++soNut;\n            giaTri[v] = stoi(x);\n            con[v][0] = con[v][1] = 0;\n            con[u][s] = v;\n            hang.push_back(v);\n        }\n    }\n    return goc;\n}\n\n// Thông tin đi từ gốc xuống: tổng hợp từ các nút nằm trên đường từ gốc tới u (không tính u).\n// Ở khung là độ sâu (gốc 0, mỗi bước xuống cộng 1). Đề cần đại lượng khác\n// (tổng, lớn nhất, nhỏ nhất, số nút thoả điều kiện trên đường đi...) thì đổi hai chỗ này.\nconst int INFO_GOC = 0;                     // thông tin tại gốc: phía trên gốc chưa có nút nào\nint xuongCon(int info, int u) { return info + 1; }   // thông tin truyền cho con của u\n\n// Việc làm khi thăm một nút. Thay nếu đề cần tính gì khác ngoài việc ghi giá trị.\nvoid tham(int u, int info = 0) { kq.push_back(giaTri[u]); }\n\nvoid duyetTien(int u, int info) {           // nút, trái, phải\n    if (!u) return;\n    tham(u, info);\n    int cho = xuongCon(info, u);\n    duyetTien(con[u][0], cho);\n    duyetTien(con[u][1], cho);\n}\nvoid duyetTrung(int u) {                    // trái, nút, phải\n    if (!u) return;\n    duyetTrung(con[u][0]);\n    tham(u);\n    duyetTrung(con[u][1]);\n}\nvoid duyetHau(int u) {                      // trái, phải, nút\n    if (!u) return;\n    duyetHau(con[u][0]);\n    duyetHau(con[u][1]);\n    tham(u);\n}\n\nvoid inKetQua() {\n    for (size_t i = 0; i < kq.size(); i++) printf(\"%d%c\", kq[i], i + 1 == kq.size() ? '\\n' : ' ');\n    kq.clear();\n}\n\n// Việc cần làm với mỗi cây theo đề. Ở đây chỉ in tiền thứ tự để minh hoạ;\n// thay bằng phép duyệt, phép đếm hay phép tính mà đề yêu cầu.\nvoid xuLyCay(int goc) {\n    duyetTien(goc, INFO_GOC);\n    inKetQua();\n}\n\nint main() {\n    int t;\n    string dong;\n    getline(cin, dong);\n    t = stoi(dong);\n    while (t--) {\n        getline(cin, dong);                 // mỗi cây nằm trên một dòng\n        istringstream is(dong);\n        vector<string> tk;\n        string s;\n        while (is >> s) tk.push_back(s);\n        xuLyCay(dungCay(tk));\n    }\n    return 0;\n}\n","skeletonNotes":["giaTri[] và con[][] lưu cây bằng chỉ số nút từ 1; 0 là \"không có nút\", nên điều kiện dừng đệ quy là if (!u) return.","dungCay chạy theo đúng luật đề: hàng đợi hang giữ các nút chờ nhận con, pos là token kế tiếp chưa đọc. Chữ N chỉ làm pos tăng.","tham() là chỗ duy nhất quyết định việc làm khi thăm một nút. Bài chỉ cần in giá trị thì giữ nguyên; bài đếm hay cộng thì thay thân hàm, tham số info cho biết thông tin từ gốc xuống u.","INFO_GOC và xuongCon() định nghĩa thông tin truyền xuống. Khung dùng độ sâu; muốn đại lượng khác thì đổi hai chỗ này (ví dụ info là tổng thì xuongCon cộng giá trị của u). Chỉ duyệt tiền thứ tự mới mang tham số này vì thông tin đi từ cha xuống con.","xuLyCay là chỗ phụ thuộc đề bài. Khung chỉ in tiền thứ tự để minh hoạ; bạn thay bằng thao tác đề yêu cầu (gọi nhiều phép duyệt, đếm nút thoả điều kiện, tính chiều cao...).","Với bài tính trên cây con, đổi các hàm void thành hàm trả về giá trị, ví dụ int chieuCao(int u) trả về -1 khi u = 0 và 1 + max của hai con ở nơi khác."],"complexity":["Dựng cây và mỗi phép duyệt đều O(số token), bộ nhớ O(số nút). Cận 2·10^5 token dùng thoải mái.","Độ sâu đệ quy bằng chiều cao cây, có thể tới số nút khi cây là đường thẳng."],"pitfalls":["Đọc nhầm luật của N: N không tạo nút nên không nhận hai token con. Nếu coi N cũng có hai con N thì mọi token phía sau bị lệch.","Quên trường hợp dãy bị cắt bớt chữ N ở cuối: vòng đọc phải kiểm tra pos < tk.size() trước mỗi lần lấy token.","Đệ quy quá sâu: cây đường thẳng 10^5 nút có thể làm tràn ngăn xếp trên máy chấm có ngăn xếp nhỏ. Nếu nghi ngờ, viết duyệt bằng ngăn xếp tường minh hoặc tính theo thứ tự ngược của danh sách nút.","Quên reset giữa các bộ test: soNut về 0 và gán lại con[v][0], con[v][1] khi tạo nút, nếu không còn rác của cây trước.","Hai dòng in trộn nhau: mỗi phép duyệt phải kết thúc bằng xuống dòng và không in dấu cách thừa ở đầu dòng nếu đề so sánh chặt.","Dùng stoi cho giá trị tới 10^9 là đủ, nhưng tổng đường đi hay tích có thể vượt 32 bit, hãy dùng long long cho các đại lượng cộng dồn.","Khởi tạo thông tin ở gốc sai. Ví dụ theo dõi giá trị lớn nhất trên đường mà bắt đầu từ 0 thì gốc âm bị xử lý sai. Hãy dùng INT_MIN (hoặc LLONG_MIN) cho \"chưa có nút nào\", và đọc kỹ đề xem so sánh là > hay >=."],"practice":["cnp-E","mh4-E","mh10-E","cnp-A","mh9-E","mh6-E"],"examples":[{"key":"hd32-1","title":"Đếm nút nổi bật","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nconst int MAXN = 200005;\nint giaTri[MAXN];       // giá trị của nút\nint con[MAXN][2];       // con[u][0] = con trái, con[u][1] = con phải, 0 = không có\nint soNut;\nint dem;                // số nút nổi bật\n\n// Dựng cây từ dãy token theo mức. Nút đánh số 1, 2, ... theo thứ tự được tạo ra.\n// Trả về gốc (luôn là 1).\nint dungCay(const vector<string>& tk) {\n    soNut = 0;\n    vector<int> hang;                       // hàng đợi các nút đang chờ nhận con\n    int goc = ++soNut;\n    giaTri[goc] = stoi(tk[0]);\n    con[goc][0] = con[goc][1] = 0;\n    hang.push_back(goc);\n    size_t pos = 1;                         // token kế tiếp chưa dùng\n    for (size_t h = 0; h < hang.size(); h++) {\n        int u = hang[h];\n        for (int s = 0; s < 2 && pos < tk.size(); s++) {   // s = 0: con trái, s = 1: con phải\n            const string& x = tk[pos++];\n            if (x == \"N\") continue;         // N: không có nút, không đọc thêm gì cho nó\n            int v = ++soNut;\n            giaTri[v] = stoi(x);\n            con[v][0] = con[v][1] = 0;\n            con[u][s] = v;\n            hang.push_back(v);\n        }\n    }\n    return goc;\n}\n\n// Thông tin đi từ gốc xuống: ở đây là giá trị lớn nhất trên đường từ gốc tới cha của nút.\nconst int INFO_GOC = INT_MIN;               // gốc chưa có nút nào ở trên\nint xuongCon(int info, int u) { return max(info, giaTri[u]); }\n\n// Việc làm khi thăm nút u: nút nổi bật nếu giá trị >= mọi nút trên đường từ gốc.\nvoid tham(int u, int info) {\n    if (giaTri[u] >= info) dem++;\n}\n\nvoid duyetTien(int u, int info) {           // nút, trái, phải\n    if (!u) return;\n    tham(u, info);\n    int cho = xuongCon(info, u);\n    duyetTien(con[u][0], cho);\n    duyetTien(con[u][1], cho);\n}\n\nvoid xuLyCay(int goc) {\n    dem = 0;\n    duyetTien(goc, INFO_GOC);\n    printf(\"%d\\n\", dem);\n}\n\nint main() {\n    int t;\n    string dong;\n    getline(cin, dong);\n    t = stoi(dong);\n    while (t--) {\n        getline(cin, dong);\n        istringstream is(dong);\n        vector<string> tk;\n        string s;\n        while (is >> s) tk.push_back(s);\n        xuLyCay(dungCay(tk));\n    }\n    return 0;\n}\n"}]},{"id":"L33","chapter":8,"chapterName":"Cây nhị phân","title":"Cây theo chỉ số mảng (heap)","intro":"Cây nhị phân gần đầy không cần con trỏ: cất các nút theo từng mức vào một mảng, quan hệ cha con suy ra từ chỉ số. Đây là cách lưu của heap và là dạng cây dễ viết nhất.","recognize":["Đề cho một mảng và nói \"cây lưu theo từng mức\", \"con trái ở 2i+1, con phải ở 2i+2\" hoặc \"A[i] ≥ A[2i+1], A[2i+2]\".","Đề hỏi mảng có phải heap không, hoặc yêu cầu duyệt, đếm lá, đếm nút của cây dựng từ mảng.","Đề nói \"cây gần đầy\" hay \"các mức đầy đủ, mức cuối thiếu về bên phải\".","Đề yêu cầu dựng heap, lấy phần tử lớn nhất, hoặc sắp xếp bằng heap."],"idea":["Chốt quy ước chỉ số trước: từ 0 thì con trái 2i+1, con phải 2i+2, cha (i-1)/2; từ 1 thì con 2i, 2i+1, cha i/2.","Nút i tồn tại khi chỉ số nằm trong [0, n). Nút là lá khi con trái 2i+1 ≥ n. Với chỉ số từ 0, nút trong là các i < n/2 nên có n/2 nút trong và n - n/2 lá.","Kiểm tra tính chất heap là kiểm tra cục bộ: với mọi nút i và mỗi con j còn trong mảng, cặp (i, j) phải thoả quan hệ. Vi phạm ở một cặp là đủ để kết luận không phải heap.","Duyệt cây theo chỉ số là đệ quy y như cây con trỏ, chỉ đổi \"con trái\" thành 2i+1. Duyệt theo mức chính là đọc mảng từ trái sang phải.","Muốn dựng heap từ mảng bất kỳ thì vun từ nút trong cuối cùng (n/2 - 1) ngược về gốc, mỗi nút đẩy xuống bằng siftDown. Tổng chi phí O(n)."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n;\nvector<long long> A;   // cây lưu trong mảng, chỉ số từ 0: gốc A[0]\n\n// Với chỉ số từ 0. Nếu đề đánh số từ 1 thì đổi thành 2i và 2i+1, cha là i/2.\nint chaCua(int i) { return (i - 1) / 2; }    // chỉ dùng khi i >= 1\nint conTrai(int i) { return 2 * i + 1; }\nint conPhai(int i) { return 2 * i + 2; }\nbool coNut(int i) { return i >= 0 && i < n; }   // chỉ số còn nằm trong cây?\nbool laLa(int i) { return !coNut(conTrai(i)); } // không có con trái thì cũng không có con phải\n\n// Quan hệ bắt buộc giữa cha i và con j. Với max-heap là A[i] >= A[j];\n// với min-heap đổi thành <=; với bài khác thay bằng điều kiện của đề.\nbool hopLe(int i, int j) { return A[i] >= A[j]; }\n\n// Việc làm khi thăm nút i. Thay nếu đề cần tính gì khác.\nvoid tham(int i) { printf(\"%lld \", A[i]); }\n\nvoid duyetTien(int i) {                     // nút, trái, phải\n    if (!coNut(i)) return;\n    tham(i);\n    duyetTien(conTrai(i));\n    duyetTien(conPhai(i));\n}\nvoid duyetTrung(int i) {                    // trái, nút, phải\n    if (!coNut(i)) return;\n    duyetTrung(conTrai(i));\n    tham(i);\n    duyetTrung(conPhai(i));\n}\n\n// Vun lại max-heap trên A[0..m-1] khi chỉ nút i có thể nhỏ hơn con của nó.\nvoid siftDown(int i, int m) {\n    while (conTrai(i) < m) {\n        int j = conTrai(i);\n        if (j + 1 < m && A[j + 1] > A[j]) j++;   // chọn con lớn hơn\n        if (hopLe(i, j)) break;                  // cha đã không nhỏ hơn con: dừng\n        swap(A[i], A[j]);\n        i = j;\n    }\n}\n// Dựng heap từ mảng bất kỳ trong O(n): vun từ nút trong cuối cùng ngược về gốc.\nvoid xayHeap() {\n    for (int i = n / 2 - 1; i >= 0; i--) siftDown(i, n);\n}\n\n// Việc cần làm với mỗi mảng theo đề. Ở đây chỉ in tiền thứ tự để minh hoạ;\n// thay bằng phép kiểm tra, phép đếm hay phép duyệt mà đề yêu cầu.\nvoid xuLy() {\n    duyetTien(0);\n    printf(\"\\n\");\n}\n\nint main() {\n    int t;\n    scanf(\"%d\", &t);\n    while (t--) {\n        scanf(\"%d\", &n);\n        A.assign(n, 0);\n        for (auto& x : A) scanf(\"%lld\", &x);\n        xuLy();\n    }\n    return 0;\n}\n","skeletonNotes":["chaCua, conTrai, conPhai gói quy ước chỉ số vào một chỗ. Đề đánh số từ 1 thì chỉ sửa ba hàm này (và cho mảng thêm một phần tử đệm).","coNut và laLa cho điều kiện biên: luôn kiểm tra chỉ số con nhỏ hơn n trước khi đọc A[con].","hopLe(i, j) là quan hệ cha con của đề. Max-heap dùng >=, min-heap dùng <=, bài khác thay bằng điều kiện riêng.","siftDown và xayHeap là công cụ chuẩn của heap. Trong siftDown, chọn con lớn hơn trong hai con rồi mới so với cha, nếu không heap bị hỏng.","xuLy là chỗ phụ thuộc đề; khung chỉ in tiền thứ tự minh hoạ. Giá trị dùng long long để đỡ tràn khi bài cộng dồn."],"complexity":["Kiểm tra mọi cặp cha con, duyệt, đếm lá: O(n) thời gian, O(1) bộ nhớ phụ (duyệt đệ quy sâu O(log n)).","siftDown một nút O(log n); dựng heap O(n); sắp xếp bằng heap O(n log n)."],"pitfalls":["Nhầm quy ước chỉ số 0 hay 1: dùng 2i+1 cho mảng đánh số từ 1 sẽ lệch toàn bộ cây.","Đọc A[2i+2] mà không kiểm tra 2i+2 < n: nút cuối của mức có thể chỉ có con trái.","Quan hệ có dấu bằng hay không: max-heap thường cho phép bằng (≥). Dùng > sẽ trả NO sai cho mảng toàn số bằng nhau.","Khi chỉ duyệt các nút trong (để vun heap hay đếm), nút trong cuối cùng là n/2 - 1, không phải n/2.","Giá trị âm hoặc lớn: dùng so sánh trực tiếp, đừng dùng phép trừ A[i] - A[j] để so sánh vì có thể tràn số."],"practice":["cnp-C","mh2-E"],"examples":[{"key":"hd33-1","title":"Kiểm tra max-heap","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n;\nvector<int> A;   // mảng chứa cây theo chỉ số từ 0\n\nint conTrai(int i) { return 2 * i + 1; }\nint conPhai(int i) { return 2 * i + 2; }\n\n// Quan hệ bắt buộc giữa nút cha và nút con của max-heap (cho phép bằng nhau).\nbool hopLe(int cha, int con) { return A[cha] >= A[con]; }\n\n// Duyệt mọi nút làm cha, kiểm tra các con còn nằm trong mảng.\nbool kiemTraHeap() {\n    for (int i = 0; i < n; i++) {\n        int c1 = conTrai(i), c2 = conPhai(i);\n        if (c1 < n && !hopLe(i, c1)) return false;\n        if (c2 < n && !hopLe(i, c2)) return false;\n    }\n    return true;\n}\n\nint main() {\n    int t;\n    scanf(\"%d\", &t);\n    while (t--) {\n        scanf(\"%d\", &n);\n        A.assign(n, 0);\n        for (auto& x : A) scanf(\"%d\", &x);\n        puts(kiemTraHeap() ? \"YES\" : \"NO\");\n    }\n    return 0;\n}\n"}]},{"id":"L34","chapter":8,"chapterName":"Cây nhị phân","title":"Cây nhị phân tìm kiếm","intro":"BST giữ mọi giá trị ở cây con trái nhỏ hơn nút và ở cây con phải lớn hơn nút. Nhờ đó tìm, chèn, xoá chỉ đi một đường từ gốc xuống, và duyệt trung thứ tự cho dãy tăng dần.","recognize":["Đề nói \"cây nhị phân tìm kiếm\", \"chèn lần lượt vào BST\", hoặc mô tả luật rẽ trái nếu nhỏ hơn, rẽ phải nếu lớn hơn.","Đề có lệnh chèn, xoá, tìm theo giá trị, hoặc hỏi nút kế trước, kế sau, tổ tiên chung, số nút trong khoảng.","Đề cho dãy tiền thứ tự hay level order của BST và hỏi dãy đó có hợp lệ không hoặc dựng lại cây.","Hình dạng cây phụ thuộc thứ tự chèn, nên input có thể làm cây lệch thành đường thẳng."],"idea":["Mọi thao tác theo cùng một mẫu: tại nút u so x với u->gt, nhỏ hơn thì sang trái, lớn hơn thì sang phải, bằng thì dừng hoặc xử lý trùng.","Chèn: đi tới chỗ trống rồi gắn nút mới. Viết đệ quy trả về gốc cây con để việc gắn con tự nhiên.","Xoá có ba trường hợp: nút là lá thì bỏ; nút một con thì con thế vào chỗ; nút hai con thì lấy giá trị nhỏ nhất của cây con phải (hoặc lớn nhất của cây con trái, theo đề) ghi đè lên nút, rồi xoá nút đó khỏi cây con tương ứng.","Kế trước và kế sau của x: đi từ gốc, mỗi lần gặp nút nhỏ hơn x thì ghi nhận làm ứng viên kế trước rồi sang phải; gặp nút lớn hơn x thì ghi nhận ứng viên kế sau rồi sang trái.","Muốn đếm hay xếp hạng theo giá trị, thêm vào mỗi nút kích thước cây con sz. Số nút có giá trị ≤ x tính bằng một đường đi: gặp nút ≤ x thì cộng sz của con trái + 1 rồi sang phải, ngược lại sang trái. Số nút trong [L, R] là f(R) - f(L-1).","Cây từ dãy tiền thứ tự: phần tử đầu là gốc, phần tử đầu tiên lớn hơn gốc chia dãy thành cây con trái và cây con phải; kiểm tra phần sau đều lớn hơn gốc."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nstruct Nut {\n    int gt;               // giá trị (đổi sang long long nếu đề cho lớn)\n    int sz;               // số nút trong cây con gốc nó; bỏ nếu đề không cần đếm\n    Nut *tr, *ph;         // con trái, con phải\n};\n\nint kichThuoc(Nut* u) { return u ? u->sz : 0; }\nvoid capNhat(Nut* u) { u->sz = 1 + kichThuoc(u->tr) + kichThuoc(u->ph); }\n\n// Chèn x, trả về gốc cây sau khi chèn. Nhỏ hơn thì sang trái, lớn hơn thì sang phải.\n// Đề cho phép giá trị trùng thì phải quy ước trùng đi trái hay phải (hoặc bỏ qua).\nNut* chen(Nut* u, int x) {\n    if (!u) return new Nut{x, 1, nullptr, nullptr};\n    if (x < u->gt) u->tr = chen(u->tr, x);\n    else if (x > u->gt) u->ph = chen(u->ph, x);\n    capNhat(u);\n    return u;\n}\n\n// Tìm nút có giá trị x, không có thì trả về nullptr.\nNut* tim(Nut* u, int x) {\n    while (u && u->gt != x) u = (x < u->gt) ? u->tr : u->ph;\n    return u;\n}\n\nNut* nhoNhat(Nut* u) {              // nút trái nhất của cây con u (u khác nullptr)\n    while (u->tr) u = u->tr;\n    return u;\n}\n\n// Xoá nút có giá trị x khỏi cây gốc u, trả về gốc mới. Ba trường hợp:\nNut* xoa(Nut* u, int x) {\n    if (!u) return nullptr;\n    if (x < u->gt) u->tr = xoa(u->tr, x);\n    else if (x > u->gt) u->ph = xoa(u->ph, x);\n    else {\n        if (!u->tr && !u->ph) {                 // 1. là lá: bỏ đi\n            delete u;\n            return nullptr;\n        }\n        if (!u->tr || !u->ph) {                 // 2. một con: con thế vào chỗ nút\n            Nut* c = u->tr ? u->tr : u->ph;\n            delete u;\n            return c;\n        }\n        // 3. hai con: lấy giá trị nhỏ nhất của cây con phải (kế nhiệm) ghi đè lên u,\n        // rồi xoá nút kế nhiệm. Đề có thể quy ước dùng giá trị lớn nhất của cây con trái.\n        u->gt = nhoNhat(u->ph)->gt;\n        u->ph = xoa(u->ph, u->gt);\n    }\n    capNhat(u);\n    return u;\n}\n\nvoid duyetTrung(Nut* u) {            // với BST, trung thứ tự cho dãy tăng dần\n    if (!u) return;\n    duyetTrung(u->tr);\n    printf(\"%d \", u->gt);\n    duyetTrung(u->ph);\n}\n\n// Trả lời một truy vấn theo đề. Ở đây chỉ kiểm tra x có trong cây không;\n// thay bằng phép tính mà đề yêu cầu.\nvoid xuLyTruyVan(Nut* goc, int x) {\n    puts(tim(goc, x) ? \"YES\" : \"NO\");\n}\n\nint main() {\n    int n, q;\n    scanf(\"%d %d\", &n, &q);\n    Nut* goc = nullptr;\n    for (int i = 0; i < n; i++) {\n        int x;\n        scanf(\"%d\", &x);\n        goc = chen(goc, x);\n    }\n    while (q--) {\n        int x;\n        scanf(\"%d\", &x);\n        xuLyTruyVan(goc, x);\n    }\n    return 0;\n}\n","skeletonNotes":["Nut có gt, sz và hai con trỏ. sz chỉ cần khi đề đếm hay xếp hạng; capNhat tính lại sz sau mỗi lần cây con đổi.","chen và xoa đều trả về gốc cây con sau thay đổi, nên chỗ gọi viết u->tr = chen(u->tr, x). Đề cho giá trị trùng thì sửa nhánh else if (x > u->gt) theo quy ước của đề.","xoa có ba trường hợp tách bạch; trường hợp hai con dùng nhoNhat của cây con phải. Đề dùng quy ước khác (lớn nhất bên trái) thì đổi đúng chỗ đó.","tim đi theo một đường, dùng vòng lặp cho gọn. duyetTrung minh hoạ rằng BST cho dãy tăng.","xuLyTruyVan là chỗ phụ thuộc đề; khung chỉ kiểm tra x có mặt. Thay bằng thao tác mà đề yêu cầu (kế trước, kế sau, đếm theo khoảng...)."],"complexity":["Mỗi thao tác O(h) với h là chiều cao. Cây ngẫu nhiên h ≈ log n, nhưng chèn dãy đã sắp thì h = n, cả quá trình thành O(n^2).","Vì vậy khi đề cho n ≤ 5000 hay 10^4 thì BST thường chưa cân bằng là đủ; n tới 10^5 trở lên với dãy bất kỳ thì cần cấu trúc khác (set, cây cân bằng)."],"pitfalls":["Cây lệch: đệ quy sâu bằng n. Với n tới 10^5 cần cân nhắc vòng lặp thay đệ quy.","Xoá nút hai con mà quên xoá nút kế nhiệm khỏi cây con phải, khiến giá trị bị nhân đôi.","Quên cập nhật sz sau khi xoá hoặc chèn, nên các truy vấn đếm sai dần.","Quy ước xoá khác nhau giữa các đề (kế nhiệm bên phải hay tiền nhiệm bên trái): đọc kỹ vì ảnh hưởng hình dạng cây, mà đề thường in theo mức hay tiền thứ tự.","Truy vấn khoảng [L, R]: tính f(R) - f(L-1), đừng quên L = 1 khiến f(0) = 0, và dùng giá trị int nếu cận tới 10^9 thì L-1 vẫn trong int.","Nhầm hướng rẽ khi bằng nhau: đề nói giá trị đôi một khác nhau thì không cần xét, nếu không phải theo đúng quy ước của đề."],"practice":["cnp-D","mh1-E","cnp-B","mh8-E","mh5-E","cnp-F","mh7-E"],"examples":[{"key":"hd34-1","title":"Độ sâu trong cây tìm kiếm","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nstruct Nut {\n    int gt;               // giá trị của nút\n    Nut *tr, *ph;         // con trái, con phải\n};\n\n// Chèn x vào cây gốc u, trả về gốc sau khi chèn.\n// Nhỏ hơn thì sang trái, lớn hơn thì sang phải, gặp chỗ trống thì đặt nút mới.\nNut* chen(Nut* u, int x) {\n    if (!u) return new Nut{x, nullptr, nullptr};\n    if (x < u->gt) u->tr = chen(u->tr, x);\n    else if (x > u->gt) u->ph = chen(u->ph, x);\n    return u;\n}\n\n// Truy vấn: đi từ gốc xuống theo quy tắc BST, đếm số cạnh đã đi.\n// Gặp x thì dừng và in độ sâu; hết đường mà chưa gặp thì x không có trong cây.\nvoid xuLyTruyVan(Nut* goc, int x) {\n    int doSau = 0;\n    Nut* u = goc;\n    while (u && u->gt != x) {\n        u = (x < u->gt) ? u->tr : u->ph;\n        doSau++;\n    }\n    printf(\"%d\\n\", u ? doSau : -1);\n}\n\nint main() {\n    int n, q;\n    scanf(\"%d %d\", &n, &q);\n    Nut* goc = nullptr;\n    for (int i = 0; i < n; i++) {\n        int x;\n        scanf(\"%d\", &x);\n        goc = chen(goc, x);        // phải chèn đúng thứ tự đề cho\n    }\n    while (q--) {\n        int x;\n        scanf(\"%d\", &x);\n        xuLyTruyVan(goc, x);\n    }\n    return 0;\n}\n"}]},{"id":"L35","chapter":8,"chapterName":"Cây nhị phân","title":"Dựng cây từ hai phép duyệt","intro":"Một phép duyệt không đủ xác định cây, nhưng tiền thứ tự, hậu thứ tự hoặc thứ tự theo mức, kết hợp với trung thứ tự, thì xác định duy nhất khi giá trị khác nhau. Dãy thứ nhất cho biết gốc, trung thứ tự cho biết cây con nào nằm bên nào.","recognize":["Đề cho hai dãy duyệt của cùng một cây (tiền + trung, hậu + trung, hoặc theo mức + trung) với giá trị đôi một khác nhau, rồi hỏi dãy duyệt thứ ba, chiều cao hoặc cấu trúc cây.","Đề nói \"cây được xác định duy nhất\" hoặc \"khôi phục cây từ kết quả duyệt\".","Cận n lớn (10^5 hay 2·10^5) và cây có thể là đường thẳng, nên tìm gốc trong trung thứ tự bằng duyệt tuyến tính sẽ O(n^2). Với dãy theo mức thì cận n thường nhỏ hơn (vài nghìn) vì cách dựng chuẩn tốn O(n · độ sâu)."],"idea":["Gốc của đoạn: phần tử đầu đoạn của tiền thứ tự, hoặc phần tử cuối đoạn của hậu thứ tự.","Tìm gốc trong trung thứ tự tại vị trí k. Mọi phần tử bên trái k thuộc cây con trái, bên phải k thuộc cây con phải. Số nút cây con trái là sz = k - c với c là đầu đoạn trung thứ tự.","Dùng sz để cắt đoạn của tiền (hoặc hậu) thứ tự: tiền thứ tự là gốc, sz phần tử trái, phần còn lại phải; hậu thứ tự là sz phần tử trái, phần phải, gốc.","Đệ quy cho hai nửa với bốn biên của hai đoạn. Đoạn rỗng (a > b) trả về 0.","Để tìm k trong O(1), lập bảng vtTrung[giá trị] = vị trí trước khi đệ quy.","Với dãy theo mức, gốc là phần tử đầu dãy, nhưng các nút của một cây con không còn chiếm một đoạn liên tiếp. Thay vào đó, lọc các phần tử còn lại thành hai dãy giữ nguyên thứ tự: nút có vị trí trung thứ tự nhỏ hơn k sang dãy trái, còn lại sang dãy phải. Dãy lọc ra chính là thứ tự theo mức của cây con tương ứng, nên đệ quy tiếp trên hai dãy đó. Đổi sẵn giá trị thành vị trí trung thứ tự để so sánh nhanh.","Nhiều bài không cần dựng cây hẳn: chỉ cần in thứ tự mong muốn ngay trong đệ quy, nhưng dựng rồi duyệt giúp code dễ đúng."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\n// true: dãy thứ nhất là tiền thứ tự (gốc đứng đầu đoạn).\n// false: dãy thứ nhất là hậu thứ tự (gốc đứng cuối đoạn).\nconst bool GOC_O_DAU = true;\n\nconst int MAXN = 200005;\nint n;\nint dayGoc[MAXN], trung[MAXN];   // dãy tiền/hậu thứ tự và dãy trung thứ tự (chỉ số từ 0)\nunordered_map<int, int> vtTrung; // vtTrung[v] = vị trí của v trong dãy trung thứ tự\nint giaTri[MAXN], con[MAXN][2];  // con[u][0] = trái, con[u][1] = phải, 0 = không có\nint soNut;\nvector<int> kq;\n\n// Dựng cây cho đoạn dayGoc[a..b] và trung[c..d] (hai đoạn cùng độ dài, cùng tập giá trị).\n// Trả về nút gốc, 0 nếu đoạn rỗng.\nint dung(int a, int b, int c, int d) {\n    if (a > b) return 0;\n    int g = GOC_O_DAU ? a : b;       // vị trí gốc trong dayGoc\n    int k = vtTrung[dayGoc[g]];      // gốc chia đoạn trung thứ tự thành hai phần\n    int sz = k - c;                  // số nút của cây con trái\n    int u = ++soNut;\n    giaTri[u] = dayGoc[g];\n    if (GOC_O_DAU) {                 // gốc, [trái: sz nút], [phải]\n        con[u][0] = dung(a + 1, a + sz, c, k - 1);\n        con[u][1] = dung(a + sz + 1, b, k + 1, d);\n    } else {                         // [trái: sz nút], [phải], gốc\n        con[u][0] = dung(a, a + sz - 1, c, k - 1);\n        con[u][1] = dung(a + sz, b - 1, k + 1, d);\n    }\n    return u;\n}\n\nvoid tham(int u) { kq.push_back(giaTri[u]); }\n\nvoid duyetTien(int u) {              // nút, trái, phải\n    if (!u) return;\n    tham(u);\n    duyetTien(con[u][0]);\n    duyetTien(con[u][1]);\n}\nvoid duyetTrung(int u) {             // trái, nút, phải\n    if (!u) return;\n    duyetTrung(con[u][0]);\n    tham(u);\n    duyetTrung(con[u][1]);\n}\nvoid duyetHau(int u) {               // trái, phải, nút\n    if (!u) return;\n    duyetHau(con[u][0]);\n    duyetHau(con[u][1]);\n    tham(u);\n}\n\n// Việc cần làm với cây đã dựng theo đề. Ở đây in lại trung thứ tự\n// (phải trùng dãy nhập, dùng để tự kiểm tra); thay bằng phép duyệt đề yêu cầu.\nvoid xuLyCay(int goc) {\n    duyetTrung(goc);\n    for (size_t i = 0; i < kq.size(); i++) printf(\"%d%c\", kq[i], i + 1 == kq.size() ? '\\n' : ' ');\n    kq.clear();\n}\n\nint main() {\n    int t;\n    scanf(\"%d\", &t);\n    while (t--) {\n        scanf(\"%d\", &n);\n        for (int i = 0; i < n; i++) scanf(\"%d\", &dayGoc[i]);\n        vtTrung.clear();\n        vtTrung.reserve(n * 2);\n        for (int i = 0; i < n; i++) {\n            scanf(\"%d\", &trung[i]);\n            vtTrung[trung[i]] = i;\n        }\n        soNut = 0;\n        xuLyCay(dung(0, n - 1, 0, n - 1));\n    }\n    return 0;\n}\n","skeletonNotes":["GOC_O_DAU chọn dạng dãy thứ nhất. true: tiền thứ tự, gốc ở đầu đoạn. false: hậu thứ tự, gốc ở cuối đoạn. Hai nhánh trong dung() cắt đoạn khác nhau.","dung(a, b, c, d) làm việc trên đoạn dayGoc[a..b] và trung[c..d]. Bốn lần truyền biên là chỗ dễ sai nhất; sz phần tử đầu thuộc cây con trái.","vtTrung là bảng vị trí để tra O(1). Mỗi bộ test phải clear trước khi nạp.","ba hàm duyệt có sẵn. xuLyCay là chỗ phụ thuộc đề: khung in lại trung thứ tự để tự kiểm tra, bạn thay bằng phép duyệt mà đề yêu cầu.","Biến thể theo mức: bỏ bốn biên a, b, c, d. Hàm nhận một vector dayGoc, gốc là dayGoc[0], rồi lọc các phần tử còn lại thành hai vector trái và phải theo vị trí trung thứ tự so với k, đệ quy trên hai vector đó. Khung ở trên giữ cách cắt đoạn vì nó chạy O(n) cho tiền và hậu thứ tự."],"complexity":["O(n) thời gian khi tra vị trí bằng bảng, O(n) bộ nhớ. Tìm gốc bằng duyệt tuyến tính làm tệ nhất O(n^2).","Độ sâu đệ quy tới n khi cây lệch.","Biến thể theo mức: mỗi nút lọc cả cây con của nó nên tốn O(n · độ sâu), tệ nhất O(n^2) với cây đường thẳng. Dùng được khi n cỡ vài nghìn; n lớn hơn cần cách khác."],"pitfalls":["Cắt đoạn lệch một phần tử: nhớ gốc chiếm một vị trí, nên với tiền thứ tự cây con trái bắt đầu ở a + 1, với hậu thứ tự cây con phải kết thúc ở b - 1.","Dùng sz = k - c (số phần tử cây con trái) thay vì k: k là vị trí tuyệt đối trong cả mảng, chỉ đúng khi c = 0.","Tìm gốc bằng find trong mỗi lần đệ quy sẽ quá thời gian với cây đường thẳng.","Quên clear bảng vị trí giữa các bộ test, hoặc không reset soNut.","Đệ quy sâu tới 2·10^5 trên cây đường thẳng; cân nhắc ngăn xếp tường minh nếu máy chấm có ngăn xếp nhỏ.","Chỉ đúng khi giá trị đôi một khác nhau; nếu có giá trị trùng thì hai dãy không xác định duy nhất cây.","Với dãy theo mức, cắt đoạn liền nhau như tiền thứ tự sẽ sai: cây con trái và cây con phải đan xen nhau trong dãy. Phải lọc từng phần tử theo vị trí trung thứ tự và giữ nguyên thứ tự xuất hiện."],"practice":["mh3-E"],"examples":[{"key":"hd35-1","title":"Dựng cây từ level order và trung thứ tự","tl":3,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nconst int MAXN = 2005;\nint n;\nint trung[MAXN];                 // dãy trung thứ tự (chỉ số từ 0)\nunordered_map<int, int> vtTrung; // vtTrung[v] = vị trí của v trong dãy trung thứ tự\nint giaTri[MAXN], con[MAXN][2];  // con[u][0] = trái, con[u][1] = phải, 0 = không có\nint soNut;\nvector<int> kq;\n\n// Dựng cây từ dayGoc: các nút của cây con, giữ nguyên thứ tự theo mức,\n// mỗi nút được thay bằng VỊ TRÍ của nó trong trung thứ tự (tra bảng một lần ở main).\n// Trả về nút gốc, 0 nếu dãy rỗng.\nint dung(const vector<int>& dayGoc) {\n    if (dayGoc.empty()) return 0;\n    int k = dayGoc[0];               // level order: gốc đứng đầu dãy; k chia trung thứ tự làm hai phần\n    vector<int> trai, phai;          // lọc các nút còn lại, giữ nguyên thứ tự theo mức\n    for (size_t i = 1; i < dayGoc.size(); i++)\n        (dayGoc[i] < k ? trai : phai).push_back(dayGoc[i]);\n    int u = ++soNut;\n    giaTri[u] = trung[k];\n    con[u][0] = dung(trai);          // cây con trái\n    con[u][1] = dung(phai);          // cây con phải\n    return u;\n}\n\nvoid duyetHau(int u) {               // trái, phải, nút\n    if (!u) return;\n    duyetHau(con[u][0]);\n    duyetHau(con[u][1]);\n    kq.push_back(giaTri[u]);\n}\n\n// Việc cần làm với cây đã dựng: in hậu thứ tự.\nvoid xuLyCay(int goc) {\n    duyetHau(goc);\n    for (size_t i = 0; i < kq.size(); i++) printf(\"%d%c\", kq[i], i + 1 == kq.size() ? '\\n' : ' ');\n    kq.clear();\n}\n\nint main() {\n    int t;\n    scanf(\"%d\", &t);\n    while (t--) {\n        scanf(\"%d\", &n);\n        vector<int> muc(n);\n        for (int i = 0; i < n; i++) scanf(\"%d\", &muc[i]);\n        vtTrung.clear();\n        vtTrung.reserve(n * 2);\n        for (int i = 0; i < n; i++) {\n            scanf(\"%d\", &trung[i]);\n            vtTrung[trung[i]] = i;\n        }\n        for (int& x : muc) x = vtTrung[x];   // đổi giá trị thành vị trí trong trung thứ tự\n        soNut = 0;\n        xuLyCay(dung(muc));\n    }\n    return 0;\n}\n"}]}];

const SPEC={"clc-A":{"statement":["Một số tự nhiên được gọi là số Lộc Phát nếu mọi chữ số của nó đều là 6 hoặc 8. Cho số tự nhiên n, hãy liệt kê mọi số Lộc Phát có không quá n chữ số."],"input":["Dòng 1: số bộ test t.","Mỗi bộ test là một dòng chứa số nguyên dương n."],"output":["Với mỗi bộ test in hai dòng: dòng đầu là số lượng số Lộc Phát tìm được; dòng sau là các số đó theo thứ tự tăng dần, cách nhau bởi dấu cách."],"constraints":["1 ≤ t ≤ 10","1 ≤ n ≤ 16"],"example":{"in":"2\n1\n2\n","out":"2\n6 8 \n6\n6 8 66 68 86 88 \n","explain":["n = 1: có hai số một chữ số là 6 và 8, nên dòng đầu là 2.","n = 2: thêm bốn số hai chữ số 66, 68, 86, 88, tổng 6 số. Liệt kê tăng dần: 6 8 66 68 86 88 (mọi số một chữ số nhỏ hơn mọi số hai chữ số)."]}},"clc-C":{"statement":["Một đồ thị vô hướng có n đỉnh và m cạnh, được liệt kê từng cạnh một. Dùng BFS để tìm đường đi ngắn nhất từ đỉnh u tới đỉnh v; độ dài đường đi chính là số cạnh nó đi qua.","Nếu không có đường đi từ u đến v thì in -1."],"input":["Dòng 1: số bộ test t.","Mỗi bộ test gồm: một dòng bốn số n, m, u, v; sau đó m dòng, mỗi dòng hai số x, y là một cạnh vô hướng nối x và y."],"output":["Với mỗi bộ test in một dòng: số cạnh trên đường đi ngắn nhất từ u đến v, hoặc -1 nếu không có."],"constraints":["1 ≤ t ≤ 10^2","1 ≤ n ≤ 10^3","1 ≤ m ≤ n(n-1)/2","1 ≤ u, v ≤ n, u ≠ v","1 ≤ x, y ≤ n, x ≠ y"],"example":{"in":"2\n5 5 1 5\n2 1\n2 3\n3 4\n4 5\n3 1\n4 2 1 4\n1 2\n3 4\n","explain":["Bộ 1: đường 1→2→3→4→5 có 4 cạnh, nhưng cạnh 3-1 cho lối tắt 1→3→4→5 chỉ có 3 cạnh. Đáp án 3.","Bộ 2: đỉnh 1 chỉ nối với 2, đỉnh 4 chỉ nối với 3, hai nhóm không thông nhau. Đáp án -1."],"out":"3\n-1\n"}},"cnp-A":{"statement":["Cho một cây nhị phân qua danh sách các cạnh. Mỗi nút mang một giá trị nguyên, các giá trị đôi một khác nhau.","Xét mọi đường đi từ nút gốc xuống một nút lá (nút không có con nào). Với mỗi đường đi, đếm xem có bao nhiêu nút trên đó (kể cả gốc và lá) có giá trị là số nguyên tố. Hãy tìm đường đi có số nút nguyên tố nhiều nhất và in ra số đó.","Nút gốc không được cho trực tiếp: đó là nút duy nhất không bao giờ xuất hiện như nút con trong danh sách cạnh. Số 1 không phải số nguyên tố.","Hình trong đề gốc vẽ một cây có một đường đi duy nhất 6 → 7 → 3 → 1. Chỉ cần dùng mô tả cạnh trong input là đủ."],"input":["Dòng 1: số bộ test t.","Mỗi bộ test gồm hai dòng. Dòng đầu là số nguyên n, số cạnh của cây.","Dòng sau chứa n bộ ba u v c viết cách nhau bởi dấu cách. Bộ ba nghĩa là u là cha của v; c = L nếu v là con trái, c = R nếu v là con phải."],"output":["In t dòng. Dòng thứ i là số nút nguyên tố lớn nhất trên một đường đi từ gốc tới lá của bộ test thứ i."],"constraints":["1 ≤ t ≤ 10^2","1 ≤ n ≤ 10^3","1 ≤ u, v ≤ 10^9","Các giá trị nút khác nhau đôi một."],"example":{"in":"3\n5\n2 5 L 2 6 R 5 7 R 7 11 L 6 13 L\n1\n8 9 R\n3\n20 1 L 20 14 R 1 17 R\n","out":"4\n0\n1\n","explain":["Test 1: gốc là 2. Cây: 2 có con trái 5, con phải 6; 5 có con phải 7; 7 có con trái 11; 6 có con trái 13.","Đường 2 → 5 → 7 → 11 có 4 nút nguyên tố. Đường 2 → 6 → 13 có 2 và 13, tức 2 nút nguyên tố (6 là hợp số). Lớn nhất là 4.","Test 2: chỉ có đường 8 → 9, không nút nào nguyên tố nên đáp án 0.","Test 3: gốc là 20. Đường 20 → 1 → 17 chỉ có 17 là nguyên tố (1 không tính) nên được 1. Đường 20 → 14 được 0. Đáp án 1."]}},"cnp-B":{"statement":["Cho dãy a gồm n số đôi một khác nhau, là kết quả duyệt theo mức (từ trên xuống, mỗi mức từ trái sang phải) của một cây nhị phân tìm kiếm. Cây này được xác định duy nhất bởi dãy, và tập giá trị trong cây chính là các phần tử của a.","Có q truy vấn, mỗi truy vấn là một số nguyên dương x. Với mỗi truy vấn, hãy tìm giá trị lớn nhất trong cây mà nhỏ hơn hẳn x, và giá trị nhỏ nhất trong cây mà lớn hơn hẳn x. Nếu x có mặt trong cây thì bản thân nó không được tính cho cả hai vế. Nếu một giá trị không tồn tại thì thay bằng 0."],"input":["Dòng 1: hai số nguyên n và q.","Dòng 2: n số a_1, ..., a_n theo thứ tự duyệt theo mức.","q dòng tiếp theo, mỗi dòng một số nguyên x."],"output":["In q dòng. Mỗi dòng gồm h
