, hoặc lệch chỉ số giữa a[i-1] và dp[i].","Nhầm xâu con (không liền) với đoạn con liên tiếp. Với liên tiếp, nhánh không khớp phải đặt dp[i][j] = 0 và đáp án là max toàn bảng.","Quên đảo ngược xâu khi truy vết từ cuối về đầu, hoặc truy vết khi đã dùng kỹ thuật hai hàng.","Khai báo bảng lớn trong main gây tràn stack. Khai báo toàn cục hoặc dùng vector.","Bài đếm: giá trị có thể vượt int hoặc cần modulo, nhớ dùng kiểu lớn và cẩn thận khi trừ phần giao.","Đọc xâu có khoảng trắng hoặc dòng rỗng: cin >> chỉ đọc đến khoảng trắng; dùng getline nếu đề cho phép dấu cách."],"practice":["qhd-W","qhd-J","mh7-B","qhd-Z","qhd-N","mh1-B"],"examples":[{"key":"hd15-1","title":"Xoá ít nhất để hai xâu bằng nhau","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nstring a, b;       // a[1..n], b[1..m] (thêm một ký tự đệm ở đầu để đánh số từ 1)\nint n, m;\nstatic int dp[2001][2001];  // dp[i][j] = LCS của a[1..i] và b[1..j]\n\n// Hai phần tử a[i], b[j] có \"khớp\" được với nhau không.\nbool khop(int i, int j) { return a[i] == b[j]; }\n\nvoid dungBang() {\n    for (int i = 1; i <= n; i++)\n        for (int j = 1; j <= m; j++) {\n            if (khop(i, j)) dp[i][j] = dp[i - 1][j - 1] + 1;  // ghép cặp (i, j)\n            else dp[i][j] = max(dp[i - 1][j], dp[i][j - 1]);  // bỏ a[i] hoặc bỏ b[j]\n        }\n}\n\nint main() {\n    cin >> a >> b;\n    n = a.size();\n    m = b.size();\n    a = \" \" + a;\n    b = \" \" + b;\n    dungBang();  // hàng 0 và cột 0 mặc định bằng 0\n    // Phần giữ lại của hai xâu phải là một xâu con chung; giữ dài nhất thì xoá ít nhất.\n    printf(\"%d\\n\", n + m - 2 * dp[n][m]);\n    return 0;\n}\n"}]},{"id":"L16","chapter":5,"chapterName":"Quy hoạch động","title":"Cái túi","intro":"Bài toán cái túi và đổi tiền cùng một khung: có một 'sức chứa' W, mỗi món chiếm một phần sức chứa và đem lại một giá trị, bảng dp[j] nhớ kết quả tốt nhất khi đã dùng đúng j đơn vị. Chỉ cần đổi cách duyệt j và cách cập nhật là ra các biến thể 0/1, không giới hạn, tối thiểu, tối đa.","recognize":["Có một lượng bị chặn (khối lượng, số tiền, tổng cần đạt) mà n món cùng chia sẻ, và mỗi món chỉ có 'lấy hoặc không lấy' (hoặc lấy nhiều lần).","Đề hỏi giá trị lớn nhất, số tờ/số món ít nhất, hoặc đếm số cách để tổng đạt đúng một giá trị. Chữ 'đúng bằng S' và 'đổi tiền' là dấu hiệu rất rõ.","Cận dạng n ≤ 100..5000 và W ≤ 10^4..10^6: n·W vừa đủ để duyệt, còn vét cạn 2^n thì không thể.","Bài hỏi 'có tạo được tổng S không' hoặc 'in mọi tổng có thể' cũng là cái túi, với dp[j] chỉ là đúng/sai.","Bài chọn các phần tử với tài nguyên chung bị giới hạn nhưng đề không nói \"cái túi\" (ví dụ cắt thanh sắt bán lấy nhiều tiền nhất, hay mỗi thao tác tốn một số bước và tổng bước có hạn) thường quy về cái túi: chiều của dp chính là lượng tài nguyên."],"idea":["Xác định tài nguyên bị giới hạn và gọi nó là j. dp[j] = giá trị tốt nhất khi tài nguyên dùng đúng bằng j (hoặc không quá j, tuỳ đề).","Chọn giá trị khởi đầu. Đề đúng j: dp[0] = 0, mọi dp[j] khác là CHUA (chưa đạt được). Đề 'không quá j' và cần lớn nhất: có thể đặt mọi dp[j] = 0.","Xét từng món một. Với cái túi 0/1, duyệt j từ W xuống w để dp[j - w] còn là giá trị trước khi xét món này. Với món dùng không giới hạn, duyệt j từ w lên W để dp[j - w] có thể đã chứa chính món này.","Cập nhật dp[j] = tốt nhất của (dp[j], gop(dp[j - w], v)), bỏ qua nếu dp[j - w] là CHUA. Đây là chỗ đổi theo đề: cộng v (giá trị), cộng 1 (đếm số tờ), cộng dồn (đếm số cách).","Đọc đáp án: dp[W] khi cần đúng W, hoặc tốt nhất trong dp[0..W] khi cần không quá W. Nhớ in -1 khi dp[W] vẫn là CHUA nếu đề yêu cầu.","Đếm số cách: dp[0] = 1, dp[j] += dp[j - w]. Thứ tự vòng lặp quyết định có tính thứ tự hay không: vòng ngoài là món, vòng trong là j thì mỗi tập món chỉ đếm một lần (không tính thứ tự). Vòng ngoài là j, vòng trong là món thì mỗi dãy được đếm riêng (có thứ tự)."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\nconst ll CHUA = LLONG_MIN;   // trạng thái \"chưa thể đạt được\" (không dùng 0 hay -1 vì có thể là đáp án thật)\nint n, W;                    // số món, sức chứa (hoặc số tiền cần trả)\nvector<ll> dp;               // dp[j] = giá trị tốt nhất khi đã dùng ĐÚNG j đơn vị sức chứa\n\n// \"Tốt hơn\" nghĩa là gì? Tìm lớn nhất: a > b. Tìm nhỏ nhất (số tờ ít nhất): đổi thành a < b.\nbool tot(ll a, ll b) { return a > b; }\n\n// Thêm món (khối lượng w, giá trị v) vào trạng thái trước đó thì giá trị mới là gì?\n// Cái túi: truoc + v. Đếm số tờ: truoc + 1. Đếm số cách: cộng dồn (xem ghi chú).\nll gop(ll truoc, ll v) { return truoc + v; }\n\n// Trạng thái ban đầu: chưa chọn gì thì dùng đúng 0 đơn vị, giá trị 0. Mọi j khác chưa đạt được.\nvoid khoiTao() {\n    dp.assign(W + 1, CHUA);\n    dp[0] = 0;\n}\n\n// Cập nhật dp khi xét thêm một món.\n// moiMonMotLan = true : cái túi 0/1, duyệt j GIẢM dần để món không bị dùng hai lần.\n// moiMonMotLan = false: dùng không giới hạn, duyệt j TĂNG dần để món được dùng lại.\nvoid themMon(int w, ll v, bool moiMonMotLan) {\n    if (w > W) return;                       // món quá nặng: không ảnh hưởng, tránh chỉ số âm\n    auto thu = [&](int j) {\n        if (dp[j - w] == CHUA) return;       // trạng thái trước chưa đạt được thì bỏ qua\n        ll moi = gop(dp[j - w], v);\n        if (dp[j] == CHUA || tot(moi, dp[j])) dp[j] = moi;\n    };\n    if (moiMonMotLan) for (int j = W; j >= w; j--) thu(j);\n    else for (int j = w; j <= W; j++) thu(j);\n}\n\n// Lấy đáp án từ bảng dp. Mặc định: đề \"đúng W\", chỉ xét dp[W], còn CHUA thì in -1.\n// Đề \"không quá W\": thay thân hàm bằng vòng for j = 0..W lấy trạng thái tốt nhất (dùng tot) trong các dp[j] khác CHUA.\nll ketQua() {\n    return dp[W] == CHUA ? -1 : dp[W];\n}\n\nint main() {\n    scanf(\"%d %d\", &n, &W);      // sửa theo định dạng nhập của đề\n    khoiTao();\n    for (int i = 0; i < n; i++) {\n        int w; ll v;\n        scanf(\"%d %lld\", &w, &v);\n        themMon(w, v, true);     // true: mỗi món một lần; false: dùng không giới hạn\n    }\n    printf(\"%lld\\n\", ketQua());\n    return 0;\n}\n","skeletonNotes":["CHUA là giá trị đặc biệt cho trạng thái không đạt được. Không dùng -1 hay 0 vì chúng có thể là kết quả thật (ví dụ giá trị tốt nhất có thể bằng 0).","tot(a, b) và gop(truoc, v) là hai hàm duy nhất cần đổi khi đổi 'tối đa giá trị' thành 'tối thiểu số tờ': đổi dấu so sánh và đổi phép cộng.","khoiTao đặt dp[0] = 0 vì dùng 0 tài nguyên thì chưa có gì. Đề đúng W thì để phần còn lại là CHUA. Đề không quá W thì kết quả lấy ở ketQua.","themMon(w, v, moiMonMotLan): tham số cuối chọn chiều duyệt j. true cho cái túi 0/1, false cho dùng không giới hạn. Đây là điểm dễ nhầm nhất của dạng.","ketQua: mặc định đọc dp[W] cho đề \"đúng W\" và in -1 nếu CHUA. Đề \"không quá W\" thì thay bằng vòng for lấy trạng thái tốt nhất trong dp[0..W], như chú thích trong khung.","Khung dùng mảng một chiều dp[j]. Nếu cần truy vết món đã chọn, giữ thêm bảng hai chiều dp[i][j] hoặc mảng trace[i][j], rồi đi ngược từ trạng thái cuối.","Khung chỉ xử lý việc đọc đơn giản n, W rồi n cặp (w, v). Đề khác dạng nhập thì chỉ sửa hàm main."],"complexity":["Thời gian O(n · W), bộ nhớ O(W) với mảng một chiều. Dùng được khi n · W vào khoảng 10^7..10^8.","Với n = 100 và W = 10^5 là 10^7 phép; với n = 50 và W = 10^6 là 5·10^7 phép, vẫn chạy trong giây.","Bài có W lên tới 10^9 nhưng tổng giá trị nhỏ thì đảo vai: dp theo tổng giá trị, lưu khối lượng nhỏ nhất."],"pitfalls":["Duyệt j sai chiều. Cái túi 0/1 mà duyệt j tăng dần thì một món bị dùng nhiều lần. Bài đổi tiền không giới hạn mà duyệt j giảm dần thì mỗi mệnh giá chỉ dùng được một lần.","Dùng giá trị khởi đầu 0 cho cả mảng khi đề yêu cầu 'đúng W'. Khi đó dp[W] báo kết quả của tập có khối lượng nhỏ hơn W. Phải đặt CHUA cho mọi j ≠ 0 và kiểm tra CHUA trước khi cộng.","Dùng -1 hay một số âm nhỏ làm 'vô cực' rồi cộng vào nó: -∞ + v thành giá trị hợp lệ. Luôn kiểm tra CHUA trước khi cập nhật, hoặc dùng INF đủ lớn nhưng vẫn không tràn khi cộng.","Tràn số: tổng giá trị n · max(v_i) dễ vượt 2·10^9 (100 món giá trị 10^9). Dùng long long cho dp và khi đọc v.","Món có khối lượng lớn hơn W: vòng lặp for (j = W; j >= w; ...) tự bỏ qua, nhưng vòng viết kiểu dp[j - w] mà không kiểm tra thì chỉ số âm. Kiểm tra w > W trước.","Đếm cách mà đổi chỗ hai vòng lặp thì ra kết quả khác: hãy đọc kỹ đề có tính thứ tự hay không và thử bằng ví dụ nhỏ, chẳng hạn xu 1 và 2 để tạo tổng 3 (có thứ tự: 3 cách, không thứ tự: 2 cách).","Kết quả đếm cần lấy dư thì phải lấy dư sau mỗi phép cộng, và dùng long long khi cộng hai số đã lấy dư."],"practice":["qhd-H","qhd-Y","qhd-P","mh6-B","qhd-D","qhd-O2","qhd-O1","mh5-B","mh10-B","qhd-U"],"examples":[{"key":"hd16-1","title":"Túi xếp vừa khít","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\nconst ll CHUA = LLONG_MIN;   // trạng thái \"không thể đạt được\"\nint n, W;                    // số món, tổng khối lượng cần đạt\nvector<ll> dp;               // dp[j] = giá trị lớn nhất khi tổng khối lượng ĐÚNG bằng j\n\n// Bài này tìm giá trị lớn nhất nên \"tốt hơn\" nghĩa là lớn hơn.\nbool tot(ll a, ll b) { return a > b; }\n\n// Thêm món giá trị v vào trạng thái trước đó thì giá trị cộng thêm v.\nll gop(ll truoc, ll v) { return truoc + v; }\n\n// Ban đầu chỉ có tổng khối lượng 0 là đạt được (chưa chọn món nào).\nvoid khoiTao() {\n    dp.assign(W + 1, CHUA);\n    dp[0] = 0;\n}\n\n// Cái túi 0/1: mỗi món dùng nhiều nhất một lần nên duyệt j GIẢM dần.\nvoid themMon(int w, ll v, bool moiMonMotLan) {\n    if (w > W) return;                       // món nặng hơn W: không bao giờ chọn được\n    auto thu = [&](int j) {\n        if (dp[j - w] == CHUA) return;       // trạng thái trước không đạt được\n        ll moi = gop(dp[j - w], v);\n        if (dp[j] == CHUA || tot(moi, dp[j])) dp[j] = moi;\n    };\n    if (moiMonMotLan) for (int j = W; j >= w; j--) thu(j);\n    else for (int j = w; j <= W; j++) thu(j);\n}\n\n// Đề yêu cầu tổng khối lượng đúng bằng W nên chỉ xét dp[W].\nll ketQua() {\n    return dp[W] == CHUA ? -1 : dp[W];\n}\n\nint main() {\n    scanf(\"%d %d\", &n, &W);\n    khoiTao();\n    for (int i = 0; i < n; i++) {\n        int w; ll v;\n        scanf(\"%d %lld\", &w, &v);\n        themMon(w, v, true);\n    }\n    printf(\"%lld\\n\", ketQua());\n    return 0;\n}\n"},{"key":"hd16-2","title":"Đổi tiền không giới hạn tờ","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\nconst ll CHUA = LLONG_MIN;   // trạng thái \"không thể đạt được\"\nint n, W;                    // số loại tiền, số tiền cần trả\nvector<ll> dp;               // dp[j] = số tờ ít nhất để trả đúng j\n\n// Bài này tìm số tờ ÍT nhất nên \"tốt hơn\" nghĩa là nhỏ hơn.\nbool tot(ll a, ll b) { return a < b; }\n\n// Thêm một tờ vào cách trả trước đó thì số tờ tăng 1 (v không dùng tới).\nll gop(ll truoc, ll v) { return truoc + 1; }\n\n// Ban đầu chỉ trả được số tiền 0 (bằng 0 tờ).\nvoid khoiTao() {\n    dp.assign(W + 1, CHUA);\n    dp[0] = 0;\n}\n\n// Mỗi loại dùng không giới hạn số tờ nên duyệt j TĂNG dần.\nvoid themMon(int w, ll v, bool moiMonMotLan) {\n    if (w > W) return;                       // tờ lớn hơn số tiền cần trả: bỏ qua\n    auto thu = [&](int j) {\n        if (dp[j - w] == CHUA) return;       // j - w chưa trả được\n        ll moi = gop(dp[j - w], v);\n        if (dp[j] == CHUA || tot(moi, dp[j])) dp[j] = moi;\n    };\n    if (moiMonMotLan) for (int j = W; j >= w; j--) thu(j);\n    else for (int j = w; j <= W; j++) thu(j);\n}\n\n// Cần trả đúng W nên chỉ xét dp[W]; không trả được thì in -1.\nll ketQua() {\n    return dp[W] == CHUA ? -1 : dp[W];\n}\n\nint main() {\n    scanf(\"%d %d\", &n, &W);\n    khoiTao();\n    for (int i = 0; i < n; i++) {\n        int w;\n        scanf(\"%d\", &w);\n        themMon(w, 0, false);\n    }\n    printf(\"%lld\\n\", ketQua());\n    return 0;\n}\n"}]},{"id":"L17","chapter":5,"chapterName":"Quy hoạch động","title":"QHĐ trên lưới","intro":"Bài cho một lưới ô và hỏi về đường đi chỉ sang phải hoặc xuống: số đường, tổng lớn nhất, hay bao nhiêu đường có tính chất nào đó. Mỗi ô chỉ phụ thuộc ô trên và ô trái nên bảng dp điền theo thứ tự hàng, cột.","recognize":["Đề cho lưới n × m, xuất phát một góc, về góc đối diện, mỗi bước chỉ được đi một hai hướng cố định (phải, xuống, đôi khi chéo).","Hỏi tổng lớn nhất/nhỏ nhất của đường đi, số đường đi (có ô bẫy, ô chặn), hoặc số đường thoả điều kiện như tổng chia hết cho k.","Cận n, m ≤ 10^3: bảng n · m ô là 10^6, mỗi ô tính O(1). Nếu được đi 4 hướng và quay lại ô cũ thì không phải dạng này mà là đường đi ngắn nhất trên đồ thị.","Bài hỏi hình vuông lớn nhất toàn số 1 trong ma trận 0/1 cũng dùng bảng dp[i][j] theo ô trên, trái, chéo."],"idea":["Định nghĩa dp[i][j] = kết quả tốt nhất (hoặc số cách) của mọi đường đi từ (0,0) tới ô (i,j).","Ô (i,j) chỉ đến được từ ô trên (i-1,j) và ô trái (i,j-1). Vậy dp[i][j] = gop(tốt nhất của hai ô đó, ô (i,j)).","Điền bảng theo thứ tự i tăng, j tăng: khi tới (i,j) thì cả hai ô nguồn đã có giá trị.","Ô nằm ở hàng 0 hoặc cột 0 chỉ có một nguồn; ô xuất phát có giá trị khởi đầu riêng. Ô bị chặn thì gán CHUA (không tới được) và không được lan sang ô khác.","Đếm đường đi: dp[0][0] = 1, dp[i][j] = dp[i-1][j] + dp[i][j-1] (nếu ô không phải bẫy), lấy dư nếu đề yêu cầu.","Thêm điều kiện về tổng (chia hết cho k, bằng đúng X): thêm một chiều vào trạng thái, ví dụ dp[i][j][r] là số đường tới (i,j) có tổng dư r. Cách chuyển vẫn từ ô trên và ô trái, chỉ khác r được cập nhật theo giá trị ô.","Có thể thu gọn bộ nhớ còn một hàng khi lưới rất lớn, vì dp hàng i chỉ cần hàng i-1 và hàng i."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\nconst ll CHUA = LLONG_MIN;          // ô không thể tới được (khác mọi tổng thật)\nint n, m;\nvector<vector<ll>> a, dp;           // a: dữ liệu của lưới, dp[i][j] = giá trị tốt nhất của đường đi từ (0,0) tới (i,j)\n\n// Ô (i,j) có được bước vào không? Đề có ô chặn/bẫy thì trả về false cho ô đó.\nbool oDuocPhep(int i, int j) { return true; }\n\n// Hai ô nguồn (trên và trái) cùng tới được ô hiện tại: lấy gì từ hai giá trị x, y?\n// Tổng lớn nhất: x > y ? x : y. Tổng nhỏ nhất: x < y ? x : y.\n// Đếm số đường: (x + y) % MOD (khi đó đặt CHUA = 0 để ô không tới được đóng góp 0 đường).\nll hopNguon(ll x, ll y) { return x > y ? x : y; }\n\n// Đi vào ô (i,j) từ trạng thái \"truoc\" thì giá trị mới thế nào? Tổng đường đi: cộng giá trị ô.\nll gop(ll truoc, int i, int j) { return truoc + a[i][j]; }\n\n// Giá trị của đường đi chỉ gồm ô xuất phát (0,0).\nll khoiDau() { return a[0][0]; }\n\n// Tính dp[i][j] từ ô phía trên và ô bên trái (hai ô này luôn được tính trước).\nvoid tinhO(int i, int j) {\n    dp[i][j] = CHUA;\n    if (!oDuocPhep(i, j)) return;\n    if (i == 0 && j == 0) { dp[i][j] = khoiDau(); return; }\n    ll best = CHUA;\n    auto xet = [&](ll truoc) {\n        if (truoc == CHUA) return;                           // nguồn không tới được thì bỏ qua\n        best = (best == CHUA) ? truoc : hopNguon(best, truoc);\n    };\n    if (i > 0) xet(dp[i - 1][j]);   // đến từ ô trên\n    if (j > 0) xet(dp[i][j - 1]);   // đến từ ô trái\n    // Thêm hướng đi (ví dụ đường chéo) thì thêm một dòng xet(...) tương ứng.\n    if (best != CHUA) dp[i][j] = gop(best, i, j);\n}\n\nint main() {\n    scanf(\"%d %d\", &n, &m);          // sửa theo định dạng nhập của đề\n    a.assign(n, vector<ll>(m));\n    dp.assign(n, vector<ll>(m, CHUA));\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < m; j++) scanf(\"%lld\", &a[i][j]);\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < m; j++) tinhO(i, j);\n    // Đề có thể không tới được đích: in -1 hoặc 0 tuỳ đề. Nếu tổng âm hợp lệ thì dùng CHUA để phân biệt.\n    if (dp[n - 1][m - 1] == CHUA) printf(\"-1\\n\");\n    else printf(\"%lld\\n\", dp[n - 1][m - 1]);\n    return 0;\n}\n","skeletonNotes":["oDuocPhep(i,j): chỗ xử lý ô bẫy/ô chặn. Mặc định mọi ô đều đi được. Đề cho ký tự '*' là bẫy thì đọc lưới vào mảng ký tự và trả về a[i][j] != '*'.","hopNguon(x,y) và gop(truoc,i,j) là hai hàm cần đổi khi đổi đề. Từ \"tổng lớn nhất\" sang \"tổng nhỏ nhất\": đổi dấu so sánh trong hopNguon. Sang \"đếm số đường\": hopNguon thành (x + y) % MOD, gop trả về truoc, và đặt CHUA = 0.","khoiDau(): giá trị của đường đi chỉ có ô xuất phát. Với đếm số đường thì đổi thành 1. Khi đếm, in thẳng dp ô đích (0 đường là đáp án 0, không in -1).","tinhO(i,j): gom các ô nguồn trên và trái bằng lambda xet và hopNguon. Có thêm hướng đi (ví dụ chéo từ (i-1,j-1)) chỉ cần thêm một dòng xet.","CHUA đánh dấu ô không tới được. Cuối cùng in -1 nếu dp ô đích còn CHUA. Nếu đề không có ô chặn thì ô đích luôn tới được.","Khung dùng long long cho a và dp vì tổng nhiều ô giá trị lớn dễ vượt int."],"complexity":["Thời gian O(n · m), bộ nhớ O(n · m), có thể thu gọn còn O(m) nếu chỉ cần giá trị cuối.","Với thêm chiều dư k: O(n · m · k) thời gian và bộ nhớ, dùng được khi n · m · k vào khoảng vài chục triệu."],"pitfalls":["Dùng -1 hay 0 làm 'không tới được' trong bài tổng lớn nhất: tổng thật có thể là -1 hoặc 0. Dùng một giá trị đặc biệt như CHUA và kiểm tra trước khi cộng.","Khởi tạo dp bằng 0 cho bài tìm tổng lớn nhất khi có số âm: ô ở hàng 0 và cột 0 sẽ lấy nhầm 'ô ngoài lưới' có giá trị 0 làm nguồn. Hãy chỉ xét nguồn nằm trong lưới.","Tràn số: lưới 1000 × 1000 với giá trị 10^9 cho tổng khoảng 2·10^12. Dùng long long.","Ô xuất phát hoặc ô đích bị chặn: đáp án là 0 đường (hoặc không tới được). Dễ quên khi kiểm tra ô (0,0) trước khi gán dp[0][0] = 1.","Nhầm chỉ số 0-based và 1-based khi đọc lưới, đặc biệt khi dùng viền ngoài bảng. Chọn một cách và giữ nhất quán.","Đếm số đường mà không lấy dư theo từng phép cộng. Số đường trên lưới 1000 × 1000 vượt rất xa long long.","Đi bốn hướng hoặc được đi lại ô cũ thì thứ tự điền bảng không còn đúng. Khi đó dùng BFS hay Dijkstra, không dùng dạng này."],"practice":["qhd-G","qhd-S","mh4-B"],"examples":[{"key":"hd17-1","title":"Đường đi tổng lớn nhất trên lưới","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\ntypedef long long ll;\n\nconst ll CHUA = LLONG_MIN;          // ô không thể tới được\nint n, m;\nvector<vector<ll>> a, dp;           // a: giá trị ô, dp[i][j] = tổng lớn nhất của đường đi (0,0) -> (i,j)\n\nbool oDuocPhep(int i, int j) { return true; }          // đề này không có ô bị chặn\nll hopNguon(ll x, ll y) { return x > y ? x : y; }      // tìm tổng lớn nhất: lấy nguồn lớn hơn\nll gop(ll truoc, int i, int j) { return truoc + a[i][j]; }   // đi vào ô (i,j) thì cộng giá trị ô\nll khoiDau() { return a[0][0]; }                       // đường đi chỉ có ô xuất phát\n\nvoid tinhO(int i, int j) {\n    dp[i][j] = CHUA;\n    if (!oDuocPhep(i, j)) return;\n    if (i == 0 && j == 0) { dp[i][j] = khoiDau(); return; }\n    ll best = CHUA;\n    auto xet = [&](ll truoc) {\n        if (truoc == CHUA) return;                           // nguồn không tới được thì bỏ qua\n        best = (best == CHUA) ? truoc : hopNguon(best, truoc);\n    };\n    if (i > 0) xet(dp[i - 1][j]);   // đến từ ô phía trên\n    if (j > 0) xet(dp[i][j - 1]);   // đến từ ô bên trái\n    if (best != CHUA) dp[i][j] = gop(best, i, j);\n}\n\nint main() {\n    scanf(\"%d %d\", &n, &m);\n    a.assign(n, vector<ll>(m));\n    dp.assign(n, vector<ll>(m, CHUA));\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < m; j++) scanf(\"%lld\", &a[i][j]);\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < m; j++) tinhO(i, j);   // thứ tự này đảm bảo ô trên và ô trái đã tính\n    printf(\"%lld\\n\", dp[n - 1][m - 1]);            // luôn có đường đi; tổng âm vẫn in bình thường\n    return 0;\n}\n"}]},{"id":"L18","chapter":5,"chapterName":"Quy hoạch động","title":"QHĐ trên đoạn","intro":"Dạng này có trạng thái là một đoạn [l, r] của dãy hay xâu. Kết quả của đoạn lớn được suy từ các đoạn nhỏ hơn bên trong hoặc từ các cách chia đôi đoạn, nên bảng được điền theo độ dài đoạn tăng dần.","recognize":["Đề hỏi về các đoạn con liên tiếp hoặc xâu con của một xâu: đoạn có đối xứng không, đoạn đối xứng dài nhất, đếm số đoạn đối xứng, dãy con đối xứng dài nhất (bỏ được ký tự giữa).","Hỏi cách ghép/xoá/đặt ngoặc trên dãy mà kết quả của đoạn lớn phụ thuộc cách chia nó thành hai đoạn, ví dụ nhân dãy ma trận.","Cận n khoảng 10^3..5·10^3: bảng n × n (10^6..2.5·10^7 ô) tính được, nhưng n ~ 10^5 thì không.","Có nhiều truy vấn (l, r) về tính chất của đoạn: tính trước bảng cho mọi đoạn rồi trả lời mỗi truy vấn O(1)."],"idea":["Gọi f[l][r] là kết quả cho đoạn s[l..r]. Cần biết f cho đoạn con của nó trước khi tính f[l][r].","Trường hợp cơ sở: đoạn độ dài 1 (và độ dài 2 nếu cần xử lý riêng). Thường là hằng số.","Có hai kiểu chuyển. Kiểu thu hai đầu: f[l][r] phụ thuộc điều kiện của s[l], s[r] và f[l+1][r-1]. Kiểu chia đôi: f[l][r] = tốt nhất của f[l][k] và f[k+1][r] với mọi k, cộng chi phí ghép.","Điền bảng theo độ dài tăng dần: for len, for l, r = l + len - 1. Khi tới (l,r) thì mọi đoạn ngắn hơn đã xong.","Đáp án nằm ở f[0][n-1] (cả xâu) hoặc là max/đếm trên toàn bảng (đoạn tốt nhất tìm được ở bất kỳ vị trí nào).","Khi f là một con số (độ dài, số cách), suy nghĩ xem hai đầu giống nhau thì đóng góp thêm bao nhiêu, và khi khác nhau thì phải bỏ đầu nào; từ đó viết công thức riêng cho từng đề."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nstring s;\nint n;\nvector<vector<char>> f;   // f[l][r] = 1 nếu đoạn s[l..r] thoả điều kiện của đề\n\n// Điều kiện hai đầu đoạn. Với đoạn đối xứng: hai ký tự đầu và cuối phải bằng nhau.\nbool dieuKienDau(int l, int r) { return s[l] == s[r]; }\n\n// Tính f[l][r] từ đoạn nhỏ hơn bên trong. Chỉ cần các đoạn ngắn hơn đã được tính.\nvoid tinhDoan(int l, int r) {\n    bool trong = (r - l <= 1) ? true : f[l + 1][r - 1];   // đoạn rỗng bên trong coi là thoả\n    f[l][r] = dieuKienDau(l, r) && trong;\n}\n\nint main() {\n    cin >> s;                                  // sửa theo định dạng nhập của đề\n    n = s.size();\n    f.assign(n, vector<char>(n, 0));\n    int kq = 0;\n    for (int len = 1; len <= n; len++) {       // duyệt theo độ dài tăng dần: đoạn con luôn có trước\n        for (int l = 0; l + len - 1 < n; l++) {\n            int r = l + len - 1;\n            if (len == 1) f[l][r] = 1;         // trường hợp cơ sở: đoạn một phần tử\n            else tinhDoan(l, r);\n            if (f[l][r]) kq = max(kq, len);    // cập nhật đáp án (đề khác: đếm, lấy max/min giá trị...)\n        }\n    }\n    printf(\"%d\\n\", kq);\n    return 0;\n}\n","skeletonNotes":["f[l][r] mặc định là chữ 'đoạn s[l..r] có thoả điều kiện không' (0/1). Với bài cần một con số (độ dài, số cách, chi phí), đổi kiểu dữ liệu của f thành int hoặc long long.","dieuKienDau(l, r): điều kiện hai đầu để đoạn có thể thoả. Đối xứng thì s[l] == s[r]. Đổi khi đề có quy tắc khác.","tinhDoan(l, r): dùng đoạn bên trong f[l+1][r-1]. Đoạn bên trong rỗng (độ dài 2) coi là thoả. Với kiểu chia đôi, thay thân hàm bằng một vòng for k từ l tới r-1 lấy tốt nhất của f[l][k] + f[k+1][r] + chi phí ghép.","Vòng lặp theo len, rồi l, là sườn của mọi bài dạng này. Giữ nguyên thứ tự đó, chỉ đổi phần tính và phần cập nhật đáp án.","Dòng cập nhật kq nằm trong vòng lặp để lấy đoạn tốt nhất bất kỳ. Nếu đề chỉ hỏi cả xâu thì bỏ dòng này và in f[0][n-1]."],"complexity":["Kiểu thu hai đầu: O(n^2) thời gian, O(n^2) bộ nhớ. Với n = 5000 bảng char tốn 25 MB.","Kiểu chia đôi: O(n^3) thời gian, dùng được khi n ≤ 400..500.","Bài truy vấn (l, r) tính một lần bảng O(n^2) rồi mỗi truy vấn O(1): nhập xuất phải nhanh."],"pitfalls":["Duyệt l rồi r tăng thông thường mà dùng f[l+1][r-1]: ô đó chưa được tính. Điền theo độ dài tăng dần, hoặc l giảm dần và r tăng dần.","Quên xử lý đoạn độ dài 2: f[l+1][r-1] khi r = l + 1 có l+1 > r-1 (đoạn rỗng) và chỉ số sai. Coi đoạn rỗng là thoả.","Dùng bool hay int cho bảng 5000 × 5000: int tốn 100 MB và dễ hết bộ nhớ. Dùng char/bool hoặc bitset khi chỉ cần đúng/sai.","Nhầm xâu con liên tiếp (substring) với dãy con (subsequence): hai bài có hai công thức khác nhau. Đọc kỹ đề có cho bỏ ký tự giữa hay không.","Nhiều truy vấn (đến 10^6) mà dùng cin/cout không tắt đồng bộ hay endl dễ quá giờ. Tắt sync và in bằng dấu xuống dòng thay cho endl.","Đếm số đoạn con mà quên tính các đoạn độ dài 1, hoặc đếm hai lần cùng một đoạn.","Đoạn dài nhất tìm bằng cách thử mở rộng quanh tâm cũng đúng O(n^2) nhưng phải xét cả tâm là một ký tự và tâm giữa hai ký tự, dễ sót tâm chẵn."],"practice":["qhd-F","qhd-M","qhd-X","mh9-B"],"examples":[{"key":"hd18-1","title":"Đoạn liên tiếp đối xứng dài nhất","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nstring s;\nint n;\nvector<vector<char>> f;   // f[l][r] = 1 nếu đoạn s[l..r] đối xứng\n\n// Hai đầu đoạn phải giống nhau thì đoạn mới có thể đối xứng.\nbool dieuKienDau(int l, int r) { return s[l] == s[r]; }\n\n// Tính f[l][r] khi các đoạn ngắn hơn đã có sẵn.\nvoid tinhDoan(int l, int r) {\n    bool trong = (r - l <= 1) ? true : f[l + 1][r - 1];   // phần bên trong; rỗng thì coi là đúng\n    f[l][r] = dieuKienDau(l, r) && trong;\n}\n\nint main() {\n    cin >> s;\n    n = s.size();\n    f.assign(n, vector<char>(n, 0));\n    int kq = 0;\n    for (int len = 1; len <= n; len++) {          // duyệt theo độ dài tăng dần\n        for (int l = 0; l + len - 1 < n; l++) {\n            int r = l + len - 1;\n            if (len == 1) f[l][r] = 1;            // một ký tự luôn đối xứng\n            else tinhDoan(l, r);\n            if (f[l][r]) kq = max(kq, len);       // ghi nhận đoạn dài nhất tìm được\n        }\n    }\n    printf(\"%d\\n\", kq);\n    return 0;\n}\n"}]},{"id":"L19","chapter":6,"chapterName":"Ngăn xếp và hàng đợi","title":"Ngăn xếp: kiểm tra ngoặc và mô phỏng","intro":"Ngăn xếp (stack) là cấu trúc vào sau ra trước. Mọi bài có các cặp lồng nhau, mở rồi đóng theo thứ tự ngược lại (ngoặc, thẻ, cấu trúc lặp lồng) đều giải gọn bằng một ngăn xếp.","recognize":["Đề cho xâu gồm các ký tự ngoặc ( ) [ ] { } hoặc tương tự và hỏi xâu có đúng không, có bao nhiêu cặp, cặp nào ghép với cặp nào.","Có cấu trúc lồng nhau: biểu thức có ngoặc, công thức hoá học có ngoặc và hệ số, xâu nén dạng k[...], đường dẫn có \"..\" (lên thư mục cha).","Cần biết \"phần tử mở gần nhất chưa được đóng\" tại mỗi thời điểm: đó là đỉnh ngăn xếp.","Cận n lớn (10^5 đến 10^6) nên không dùng được cách xoá lặp các cặp \"()\" bằng cách tìm kiếm và nối xâu, vì mỗi lần xoá tốn O(n).","Đề mô phỏng gõ phím có con trỏ, phím xoá và phím di chuyển trái phải: đây cũng là bài ngăn xếp, dùng hai ngăn xếp nằm hai bên con trỏ."],"idea":["Duyệt xâu từ trái sang phải. Gặp ngoặc mở thì đẩy vào ngăn xếp (nên đẩy chỉ số vị trí, không chỉ ký tự, để biết cặp ở đâu).","Gặp ngoặc đóng thì nhìn đỉnh ngăn xếp. Nếu rỗng thì ngoặc đóng thừa. Nếu đỉnh khác loại thì hai cặp cắt nhau. Hợp lệ thì lấy đỉnh ra, đó là cặp (i, j) vừa ghép xong.","Hết xâu mà ngăn xếp còn phần tử thì còn ngoặc mở thiếu đóng. Xâu đúng khi và chỉ khi không gặp lỗi nào và ngăn xếp rỗng cuối cùng.","Mọi yêu cầu thêm gắn vào hai thời điểm: lúc ghép được một cặp (ghi số thứ tự, tính độ sâu bằng kích thước ngăn xếp, tính độ dài đoạn j-i+1) và lúc gặp lỗi (dừng, bỏ qua ký tự, hoặc đặt lại mốc).","Bài đếm đoạn con đúng: lưu trong ngăn xếp chỉ số của ngoặc mở và một \"mốc\" là vị trí lỗi gần nhất. Khi ghép cặp, đoạn đúng dài nhất kết thúc tại j bắt đầu ngay sau phần tử mới ở đỉnh (hoặc sau mốc nếu ngăn xếp rỗng).","Bài nén dạng k[X] hay công thức có ngoặc: mỗi mức lồng nhau có một \"kết quả đang tích luỹ\". Gặp mở thì đẩy kết quả hiện tại vào ngăn xếp và bắt đầu kết quả mới, gặp đóng thì ghép kết quả mới (nhân hệ số) vào kết quả đã lưu.","Với bài soạn thảo có con trỏ: ngăn xếp trái giữ các ký tự trước con trỏ, ngăn xếp phải giữ các ký tự sau con trỏ. Gõ một ký tự là đẩy vào ngăn trái, xoá là lấy ra khỏi ngăn trái, sang trái là chuyển đỉnh ngăn trái sang ngăn phải, sang phải thì ngược lại. Cuối cùng in ngăn trái từ đáy lên rồi ngăn phải từ đỉnh xuống."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\n// Ký tự c có phải ngoặc mở không? Đề có thêm loại ngoặc (ví dụ '<') thì thêm vào đây.\nbool laMo(char c) { return c == '(' || c == '[' || c == '{'; }\n\n// Ngoặc mở tương ứng với ngoặc đóng c. Thêm loại ngoặc mới thì thêm một dòng ở đây.\nchar capMo(char c) {\n    if (c == ')') return '(';\n    if (c == ']') return '[';\n    return '{';\n}\n\nlong long soCap = 0;                      // dữ liệu đề cần: ở đây chỉ đếm số cặp đã ghép được\n\n// Gọi mỗi khi ngoặc đóng ở vị trí j ghép được với ngoặc mở ở vị trí i.\n// doSau là số ngoặc mở còn nằm ngoài cặp này (cặp ngoài cùng có doSau = 0).\n// Thay bằng việc đề yêu cầu: ghi số thứ tự cặp, cập nhật độ sâu lớn nhất, cộng độ dài j - i + 1...\nvoid xuLyCap(int i, int j, int doSau) {\n    (void)i; (void)j; (void)doSau;\n    soCap++;\n}\n\n// Gọi khi ngoặc đóng ở vị trí j không có ngoặc mở khớp (ngăn xếp rỗng hoặc sai loại).\n// Trả về true: dừng và kết luận xâu sai. Trả về false: bỏ qua ký tự j rồi đi tiếp\n// (dùng cho bài hỏi số lần sửa ít nhất hoặc đếm đoạn con đúng).\nbool xuLyLoi(int j) {\n    (void)j;\n    return true;\n}\n\n// Ghép ngoặc cả xâu s. Trả về true nếu mọi ngoặc đều được ghép.\nbool kiemTra(const string& s) {\n    vector<int> st;                       // chỉ số các ngoặc mở chưa đóng\n    for (int j = 0; j < (int)s.size(); j++) {\n        if (laMo(s[j])) {\n            st.push_back(j);\n            continue;\n        }\n        if (st.empty() || s[st.back()] != capMo(s[j])) {\n            if (xuLyLoi(j)) return false;\n            continue;\n        }\n        int i = st.back();\n        st.pop_back();\n        xuLyCap(i, j, (int)st.size());\n    }\n    return st.empty();                    // còn ngoặc mở chưa đóng thì sai\n}\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    int t;\n    cin >> t;\n    while (t--) {\n        string s;\n        cin >> s;\n        soCap = 0;                        // nhớ đặt lại dữ liệu cho mỗi bộ test\n        bool dung = kiemTra(s);\n        // Thay phần in theo đề. Ở đây in số cặp ghép được và xâu có đúng không.\n        cout << soCap << ' ' << (dung ? \"dung\" : \"sai\") << \"\\n\";\n    }\n}\n","skeletonNotes":["laMo và capMo là chỗ khai báo các loại ngoặc. Thêm loại ngoặc thì sửa đúng hai hàm này.","Ngăn xếp st lưu chỉ số chứ không lưu ký tự. Có chỉ số thì lúc ghép cặp biết được vị trí hai đầu, đủ cho các bài in cặp, tính độ dài, tính độ sâu.","xuLyCap là điểm móc \"vừa ghép xong một cặp\". Hầu hết các biến thể của dạng này (đánh số cặp, đếm cặp bao quanh một vị trí, tổng độ dài) chỉ khác ở thân hàm này.","xuLyLoi quyết định gặp ngoặc đóng không khớp thì làm gì: trả true để kết luận sai ngay, trả false để bỏ qua ký tự đó và đi tiếp.","Biến toàn cục như soCap phải đặt lại ở đầu mỗi bộ test. Phần in trong main viết lại theo đề."],"complexity":["Mỗi ký tự được đẩy vào và lấy ra nhiều nhất một lần: O(n) thời gian, O(n) bộ nhớ cho ngăn xếp. Dùng được với tổng độ dài 10^6."],"pitfalls":["Chỉ đếm số ngoặc mở và đóng rồi so sánh là sai khi có nhiều loại ngoặc. ([)] có đủ số lượng nhưng sai vì các cặp cắt nhau.","Gọi st.back() hoặc st.top() khi ngăn xếp rỗng gây lỗi chạy. Luôn kiểm tra st.empty() trước, kể cả với ngoặc đóng đứng đầu xâu.","Quên kiểm tra ngăn xếp rỗng ở cuối: \"((\" đi hết xâu mà không gặp lỗi nào nhưng vẫn là sai.","Không đặt lại ngăn xếp và các biến đếm giữa các bộ test khi đề có nhiều xâu. Khai báo ngăn xếp bên trong hàm xử lý một xâu là cách an toàn nhất.","Xoá lặp các cặp \"()\" bằng s.erase và tìm lại từ đầu mỗi lần cho đáp án đúng nhưng O(n^2), quá giờ với n = 10^6.","Dùng đệ quy để ghép ngoặc với xâu dài 10^6 lồng sâu dễ tràn ngăn xếp hệ thống. Dùng vector làm ngăn xếp thay cho đệ quy.","Đề hỏi số lượng cặp hoặc tổng độ dài có thể lên tới n^2 hoặc hơn thì dùng long long.","Bài soạn thảo: phải kiểm tra ngăn xếp rỗng trước khi xoá hoặc di chuyển con trỏ, vì phím xoá ở đầu dòng hay phím sang trái ở đầu dòng không làm gì cả."],"practice":["nx-E","mh1-C","mh6-C","mh7-C","nx-Q","mh10-C","nx-I","mh3-C","nx-R","nx-L"],"examples":[{"key":"hd19-1","title":"Kiểm tra dãy ngoặc ba loại","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nbool laMo(char c) { return c == '(' || c == '[' || c == '{'; }\n\n// Ký tự mở tương ứng với ký tự đóng c.\nchar capMo(char c) {\n    if (c == ')') return '(';\n    if (c == ']') return '[';\n    return '{';\n}\n\n// Kiểm tra xâu s có phải dãy ngoặc đúng không.\nbool kiemTra(const string& s) {\n    vector<int> st;                       // ngăn xếp lưu chỉ số các ngoặc mở chưa đóng\n    for (int i = 0; i < (int)s.size(); i++) {\n        if (laMo(s[i])) {\n            st.push_back(i);\n        } else {\n            if (st.empty()) return false;            // ngoặc đóng thừa\n            if (s[st.back()] != capMo(s[i])) return false;  // sai loại\n            st.pop_back();                           // ghép được một cặp\n        }\n    }\n    return st.empty();                    // còn ngoặc mở chưa đóng thì sai\n}\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    int t;\n    cin >> t;\n    while (t--) {\n        string s;\n        cin >> s;\n        cout << (kiemTra(s) ? \"YES\" : \"NO\") << \"\\n\";\n    }\n}\n"}]},{"id":"L20","chapter":6,"chapterName":"Ngăn xếp và hàng đợi","title":"Biểu thức và ký pháp Ba Lan","intro":"Máy tính dễ tính biểu thức hậu tố hơn trung tố vì hậu tố không cần ngoặc và không cần xét ưu tiên. Dạng này gồm tính giá trị biểu thức (tiền tố, hậu tố, trung tố) và đổi qua lại giữa các dạng.","recognize":["Đề cho biểu thức và hỏi giá trị, hoặc yêu cầu chuyển giữa trung tố, tiền tố, hậu tố (ký pháp Ba Lan, Ba Lan ngược).","Biểu thức có nhiều mức ưu tiên (^, * /, + -), có ngoặc, có khi có số âm hoặc số nhiều chữ số.","Đề nhắc tới kết hợp trái hoặc kết hợp phải của các toán tử cùng mức.","Công thức có ngoặc và hệ số (hoá học, xâu nén) cũng là biểu thức lồng nhau, xử lý bằng cùng ý tưởng hai ngăn xếp."],"idea":["Tính hậu tố: duyệt từ trái sang phải. Gặp toán hạng thì đẩy vào ngăn xếp giá trị. Gặp toán tử thì lấy hai giá trị trên đỉnh, phần tử lấy ra sau là toán hạng trái, tính rồi đẩy kết quả vào. Cuối cùng ngăn xếp còn đúng một giá trị.","Tính tiền tố: duyệt từ phải sang trái và làm như hậu tố, nhưng phần tử lấy ra trước là toán hạng trái. Hoặc duyệt từ trái sang phải với ngăn xếp các toán tử đang chờ đủ toán hạng.","Trung tố có ngoặc và độ ưu tiên (thuật toán hai ngăn xếp / shunting-yard): tách token; toán hạng xử lý ngay; ngoặc mở đẩy vào ngăn xếp toán tử; ngoặc đóng chốt toán tử cho tới ngoặc mở rồi bỏ ngoặc. \"Xử lý toán hạng\" và \"chốt toán tử\" là hai móc: ghi ra xâu thì được ký pháp hậu tố, tính trên ngăn xếp giá trị thì được giá trị biểu thức.","Gặp toán tử c: chừng nào đỉnh ngăn xếp là toán tử phải tính trước c thì lấy ra ghi vào kết quả. Đỉnh phải tính trước khi ưu tiên của nó cao hơn c, hoặc bằng nhau và c kết hợp trái. Với toán tử kết hợp phải như ^ thì bằng nhau không lấy ra. Sau đó đẩy c vào.","Hết biểu thức thì chốt hết toán tử còn lại. Tính giá trị: chốt một toán tử nghĩa là lấy hai giá trị trên đỉnh, tính, đẩy kết quả lại; cuối cùng ngăn xếp giá trị còn đúng một số.","Biểu thức có số nhiều chữ số hoặc số âm cần tách ký tự thành token trước. Dấu trừ là một ngôi khi nó đứng đầu biểu thức hoặc ngay sau ngoặc mở hay một toán tử khác."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\n// Một token: loai = 'n' là toán hạng (chu giữ nội dung), còn lại loai là chính ký tự\n// toán tử hoặc ngoặc '(' ')'.\nstruct Tok { char loai; string chu; };\n\n// Tách xâu thành token. Bản này coi mỗi chữ số hoặc chữ cái là một toán hạng riêng và\n// bỏ dấu cách. Đề có số nhiều chữ số, số âm, từ khoá...: viết lại hàm này.\nvector<Tok> tachToken(const string& s) {\n    vector<Tok> v;\n    for (char c : s) {\n        if (c == ' ') continue;\n        v.push_back({isalnum((unsigned char)c) ? 'n' : c, string(1, c)});\n    }\n    return v;\n}\n\n// Độ ưu tiên: càng lớn càng tính trước. Thêm toán tử mới ở đây.\nint uuTien(char op) {\n    if (op == '^') return 3;\n    if (op == '*' || op == '/') return 2;\n    return 1;\n}\n\n// Toán tử kết hợp phải: khi bằng ưu tiên thì không lấy toán tử ở đỉnh ra.\nbool ketHopPhai(char op) { return op == '^'; }\n\n// Hai kết quả có thể xây dựng. Dùng cái đề cần, bỏ cái kia.\nvector<long long> gt;                     // ngăn xếp giá trị (tính giá trị biểu thức)\nstring kq;                                // xâu kết quả (đổi sang ký pháp khác)\n\n// Gặp một toán hạng. Tính giá trị: đẩy số vào gt. Đổi ký pháp: ghi chu vào kq.\nvoid xuLyToanHang(const Tok& t) { gt.push_back(t.chu[0] - '0'); }\n\n// Toán tử op được chốt (đến lượt nó). Tính giá trị: lấy hai giá trị ra, tính, đẩy kết quả.\n// Đổi ký pháp: ghi op vào kq. Thêm các phép còn thiếu theo quy ước của đề.\nvoid apDungToanTu(char op) {\n    long long b = gt.back(); gt.pop_back();   // lấy ra trước là toán hạng phải\n    long long a = gt.back(); gt.pop_back();\n    gt.push_back(op == '+' ? a + b : a - b);\n}\n\nvoid danhGia(const string& s) {\n    gt.clear();\n    kq.clear();\n    vector<char> ops;                     // ngăn xếp toán tử và ngoặc mở\n    for (const Tok& t : tachToken(s)) {\n        if (t.loai == 'n') {\n            xuLyToanHang(t);\n        } else if (t.loai == '(') {\n            ops.push_back('(');\n        } else if (t.loai == ')') {\n            while (ops.back() != '(') {   // chốt hết toán tử tới ngoặc mở gần nhất\n                apDungToanTu(ops.back());\n                ops.pop_back();\n            }\n            ops.pop_back();               // bỏ ngoặc mở\n        } else {\n            int b = uuTien(t.loai);\n            while (!ops.empty() && ops.back() != '(') {\n                int a = uuTien(ops.back());\n                if (a > b || (a == b && !ketHopPhai(t.loai))) {\n                    apDungToanTu(ops.back());\n                    ops.pop_back();\n                } else break;\n            }\n            ops.push_back(t.loai);\n        }\n    }\n    while (!ops.empty()) {                // hết biểu thức: chốt nốt toán tử còn lại\n        apDungToanTu(ops.back());\n        ops.pop_back();\n    }\n}\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    int t;\n    cin >> t;\n    string s;\n    getline(cin, s);                      // bỏ phần còn lại của dòng chứa t\n    while (t--) {\n        getline(cin, s);\n        danhGia(s);\n        cout << gt.back() << \"\\n\";        // đổi ký pháp thì in kq\n    }\n}\n","skeletonNotes":["Khung là bộ máy xử lý token dùng chung cho cả tính giá trị lẫn đổi ký pháp: một ngăn xếp toán tử ops trong danhGia và một nơi chứa kết quả (ngăn xếp giá trị gt, hoặc xâu kq). Vòng lặp trong danhGia giữ nguyên, chỉ thay các hàm bên dưới.","tachToken quyết định thế nào là một token. Bản mẫu chỉ coi mỗi chữ số hoặc chữ cái là một toán hạng. Đề có số nhiều chữ số, số âm hay dấu cách thì viết lại hàm này (nhớ gộp các chữ số liền nhau).","uuTien và ketHopPhai là bảng quy tắc của đề. Điều kiện \"a > b || (a == b && !ketHopPhai(...))\" là chỗ quyết định kết hợp trái hay phải. Đổi dấu hoặc quên vế thứ hai là lỗi hay gặp nhất.","xuLyToanHang và apDungToanTu là hai chỗ duy nhất đổi theo mục tiêu. Tính giá trị: đẩy số vào gt, và toán tử lấy hai giá trị ra tính rồi đẩy lại (bản mẫu mới có + và -, phải thêm các phép còn lại theo đề). Đổi ký pháp: ghi toán hạng và toán tử vào kq.","Biểu thức tiền tố hoặc hậu tố không cần ops: chỉ cần ngăn xếp giá trị (xem phần Ý tưởng). Khung này dành cho biểu thức trung tố có ngoặc và độ ưu tiên."],"complexity":["Mỗi ký tự vào và ra ngăn xếp nhiều nhất một lần: O(n) thời gian và O(n) bộ nhớ, đủ cho n = 10^6."],"pitfalls":["Lấy hai toán hạng sai thứ tự. Phần tử lấy ra trước (b) là toán hạng phải, phần tử lấy ra sau (a) là toán hạng trái. Phép trừ và chia cho kết quả sai nếu đảo: a - b, a / b.","Kết hợp trái và phải: 2^3^2 = 2^9 = 512 chứ không phải 8^2 = 64. Ngược lại 8-3-2 = 3. Điều kiện lấy toán tử ra khi bằng ưu tiên phải khác nhau cho hai trường hợp.","Chia số nguyên âm: C++ làm tròn về 0 (-7/2 = -3), khác với Python (làm tròn xuống). Đọc kỹ đề quy ước rồi mới chọn cách chia.","Giá trị trung gian vượt int. Dùng long long và đọc cận của đề; phép luỹ thừa còn dễ tràn hơn nhân.","Dấu trừ một ngôi (số âm) bị nhầm với phép trừ. Cách thường dùng: nếu \"-\" đứng ở đầu hoặc sau \"(\" hay sau một toán tử thì gộp nó vào số kế tiếp.","Quên lấy hết toán tử còn trong ngăn xếp ở cuối, hoặc không kiểm tra rỗng khi gặp \")\". Với đầu vào đã hợp lệ vẫn nên viết kiểm tra rỗng cho gọn lỗi.","Đọc biểu thức có dấu cách bằng cin >> chỉ lấy một từ. Dùng getline, và nhớ bỏ dòng thừa sau khi đọc số t bằng cin >> t."],"practice":["nx-B","nx-A","nx-C","mh5-C","nx-I","mh2-C"],"examples":[{"key":"hd20-1","title":"Trung tố sang hậu tố","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\n// Một token: loai = 'n' là toán hạng, còn lại loai là ký tự toán tử hoặc ngoặc.\nstruct Tok { char loai; string chu; };\n\n// Mỗi chữ cái là một toán hạng, các ký tự khác là toán tử hoặc ngoặc.\nvector<Tok> tachToken(const string& s) {\n    vector<Tok> v;\n    for (char c : s) v.push_back({isalpha((unsigned char)c) ? 'n' : c, string(1, c)});\n    return v;\n}\n\n// Độ ưu tiên: càng lớn càng tính trước.\nint uuTien(char op) {\n    if (op == '^') return 3;\n    if (op == '*' || op == '/') return 2;\n    return 1;                              // + và -\n}\n\n// Toán tử kết hợp phải (A^B^C = A^(B^C)): khi bằng ưu tiên không lấy toán tử ở đỉnh ra.\nbool ketHopPhai(char op) { return op == '^'; }\n\nstring kq;                                 // xâu hậu tố đang xây\n\n// Toán hạng ghi thẳng ra kết quả. Toán tử được chốt thì ghi vào kết quả.\nvoid xuLyToanHang(const Tok& t) { kq += t.chu; }\nvoid apDungToanTu(char op) { kq += op; }\n\nvoid danhGia(const string& s) {\n    kq.clear();\n    vector<char> ops;                      // ngăn xếp toán tử và ngoặc mở\n    for (const Tok& t : tachToken(s)) {\n        if (t.loai == 'n') {\n            xuLyToanHang(t);\n        } else if (t.loai == '(') {\n            ops.push_back('(');\n        } else if (t.loai == ')') {\n            while (ops.back() != '(') {    // chốt hết toán tử tới ngoặc mở gần nhất\n                apDungToanTu(ops.back());\n                ops.pop_back();\n            }\n            ops.pop_back();                // bỏ ngoặc mở\n        } else {\n            int b = uuTien(t.loai);\n            while (!ops.empty() && ops.back() != '(') {\n                int a = uuTien(ops.back());\n                if (a > b || (a == b && !ketHopPhai(t.loai))) {\n                    apDungToanTu(ops.back());\n                    ops.pop_back();\n                } else break;\n            }\n            ops.push_back(t.loai);\n        }\n    }\n    while (!ops.empty()) {                 // hết biểu thức: chốt nốt toán tử còn lại\n        apDungToanTu(ops.back());\n        ops.pop_back();\n    }\n}\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    int t;\n    cin >> t;\n    while (t--) {\n        string s;\n        cin >> s;\n        danhGia(s);\n        cout << kq << \"\\n\";\n    }\n}\n"}]},{"id":"L21","chapter":6,"chapterName":"Ngăn xếp và hàng đợi","title":"Ngăn xếp đơn điệu","intro":"Ngăn xếp đơn điệu là ngăn xếp mà các giá trị từ đáy lên đỉnh luôn tăng (hoặc giảm). Nó trả lời trong O(n) các câu hỏi \"phần tử gần nhất bên trái hoặc bên phải lớn hơn (nhỏ hơn) tôi là ai\", thay cho hai vòng for O(n^2).","recognize":["Đề hỏi với mỗi phần tử: phần tử đầu tiên bên phải (hoặc bên trái) lớn hơn hoặc nhỏ hơn nó, hoặc khoảng cách tới phần tử đó.","Đề hỏi \"mỗi người nhìn thấy bao nhiêu người\", \"bao nhiêu ngày nữa mới ấm hơn\", \"nhảy tới cột cao hơn gần nhất\".","Bài hình chữ nhật lớn nhất trong biểu đồ cột, hoặc tổng giá trị lớn nhất (nhỏ nhất) trên mọi đoạn con: mỗi phần tử là lớn nhất trên một đoạn mà hai đầu do phần tử lớn hơn gần nhất hai bên quyết định.","Cận n tới 10^5 hoặc 10^6, vòng lặp lồng nhau O(n^2) quá giờ.","Xoá các cặp kề nhau theo một quy tắc (ví dụ cùng tính chẵn lẻ): đẩy từng phần tử, nếu đỉnh và phần tử mới tạo thành cặp xoá được thì lấy đỉnh ra."],"idea":["Duyệt j từ trái sang phải, ngăn xếp giữ các chỉ số chưa tìm được \"phần tử lớn hơn bên phải\". Giá trị của chúng từ đáy lên đỉnh không tăng.","Với mỗi j: chừng nào đỉnh ngăn xếp có giá trị nhỏ hơn a_j thì j chính là phần tử lớn hơn đầu tiên bên phải của đỉnh đó. Ghi kết quả cho đỉnh rồi lấy nó ra.","Sau khi lấy hết các đỉnh nhỏ hơn, đẩy j vào ngăn xếp. Lúc này đỉnh ngăn xếp (trước khi đẩy j) cũng là phần tử gần nhất bên trái của j mà lớn hơn hoặc bằng a_j.","Phần tử còn lại trong ngăn xếp khi hết dãy không có phần tử lớn hơn bên phải: giữ giá trị mặc định (-1 hoặc n).","Mỗi phần tử vào ngăn xếp đúng một lần và ra nhiều nhất một lần nên tổng thời gian là O(n), dù có vòng while lồng trong vòng for.","Đổi loại câu hỏi bằng cách đổi điều kiện lấy ra: nhỏ hơn hẳn thì đổi dấu so sánh; bên trái thì duyệt ngược hoặc dùng đỉnh ngăn xếp lúc đẩy; \"lớn hơn hoặc bằng\" thì đổi < thành <=.","Bài tổng hay đếm trên mọi đoạn con: với mỗi i tìm trai[i] và phai[i] là mốc gần nhất hai bên. Khi hai bên dùng điều kiện lệch nhau (một bên có dấu bằng, một bên không) thì mỗi đoạn được gán cho đúng một phần tử lớn nhất, không đếm trùng khi có giá trị bằng nhau."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n;\nvector<long long> a;\n\n// Phần tử ở đỉnh ngăn xếp (chỉ số top) bị loại khi gặp phần tử j nếu hàm này đúng.\n// a[top] < a[j]: ngăn xếp không tăng từ đáy lên đỉnh, tìm phần tử lớn hơn hẳn.\n// Đổi thành a[top] > a[j] để tìm phần tử nhỏ hơn hẳn, thành <= hoặc >= khi đề cho phép bằng nhau.\nbool boKhoiNgan(int top, int j) { return a[top] < a[j]; }\n\n// Kết quả cho phần tử i, biết mốc gần nhất bên trái là trai (-1 nếu không có)\n// và mốc gần nhất bên phải là phai (n nếu không có). Thay bằng việc đề cần tính.\n// Ở đây chỉ trả về số phần tử nằm giữa hai mốc.\nlong long xuLy(int i, int trai, int phai) {\n    (void)i;\n    return phai - trai - 1;\n}\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    cin >> n;\n    a.resize(n);\n    for (auto& x : a) cin >> x;\n\n    vector<int> trai(n, -1), phai(n, n);  // mặc định khi không có mốc\n    vector<int> st;                       // ngăn xếp chỉ số\n    for (int j = 0; j < n; j++) {\n        while (!st.empty() && boKhoiNgan(st.back(), j)) {\n            phai[st.back()] = j;          // j là mốc bên phải của phần tử vừa bị loại\n            st.pop_back();\n        }\n        if (!st.empty()) trai[j] = st.back();   // đỉnh còn lại là mốc bên trái của j\n        st.push_back(j);\n    }\n\n    for (int i = 0; i < n; i++) {\n        cout << xuLy(i, trai[i], phai[i]) << (i + 1 < n ? ' ' : '\\n');\n    }\n}\n","skeletonNotes":["boKhoiNgan là chỗ duy nhất quyết định bài hỏi gì: lớn hơn hay nhỏ hơn, có tính bằng nhau hay không.","Một lượt duyệt cho ra cả hai mốc: phai[i] khi i bị lấy ra khỏi ngăn xếp, trai[j] là đỉnh còn lại ngay trước khi đẩy j. Bài chỉ cần một bên thì bỏ bên kia.","Mốc mặc định là -1 (trái) và n (phải), nên số phần tử giữa hai mốc là phai - trai - 1. Đề yêu cầu in chính giá trị phần tử mốc hay in -1 thì sửa trong xuLy.","Ngăn xếp lưu chỉ số để còn tính được khoảng cách và dùng a[chỉ số] để so sánh. Lưu giá trị thì mất thông tin vị trí.","Bài xoá cặp kề nhau cũng dùng ngăn xếp này, nhưng điều kiện lấy ra là \"đỉnh và phần tử mới tạo thành cặp xoá được\" chứ không phải so sánh lớn nhỏ; khi đó không đẩy phần tử mới vào."],"complexity":["O(n) thời gian vì mỗi phần tử vào và ra ngăn xếp nhiều nhất một lần, O(n) bộ nhớ. Chạy tốt với n = 10^6."],"pitfalls":["Nhầm \"lớn hơn hẳn\" với \"lớn hơn hoặc bằng\". Dãy 5 5 8: với phần tử đầu, phần tử thứ hai bằng 5 không tính, đáp án là 8. Đọc đề xem có tính bằng nhau không.","Đáp án cần in giá trị hay chỉ số? Ngăn xếp lưu chỉ số, nhưng đề có thể yêu cầu in a[chỉ số], khoảng cách j - i, hay chỉ số tính từ 1.","Quên gán giá trị mặc định cho phần tử còn lại trong ngăn xếp khi hết dãy (không có mốc bên phải), dẫn tới in rác hoặc 0.","Dùng phép so sánh lệch hai bên khi đếm trên mọi đoạn con. Nếu cả hai bên đều dùng điều kiện chặt, đoạn có nhiều giá trị lớn nhất bằng nhau bị đếm nhiều lần; nếu cả hai đều có dấu bằng thì đếm thiếu.","Tổng trên mọi đoạn con có thể lên tới n^2 · max a_i, vượt int, bắt buộc dùng long long.","Duyệt từ phải sang trái cho bài hỏi bên trái (hoặc ngược lại) mà không đổi điều kiện đúng, cho kết quả lệch. Cách an toàn là luôn duyệt trái sang phải và lấy cả hai mốc như trong khung.","Với bài hình chữ nhật lớn nhất, nhớ thêm một cột cao 0 ở cuối (hoặc xử lý riêng ngăn xếp còn lại) để mọi cột đều được lấy ra."],"practice":["mh9-C","nx-F","nx-M","nx-J","nx-O"],"examples":[{"key":"hd21-1","title":"Phần tử lớn hơn đầu tiên bên phải","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n;\nvector<long long> a;\n\n// Phần tử ở đỉnh ngăn xếp (chỉ số top) có được \"giải quyết\" bởi phần tử j không?\n// Bài này: j là phần tử lớn hơn hẳn a[top].\nbool boKhoiNgan(int top, int j) { return a[top] < a[j]; }\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    cin >> n;\n    a.resize(n);\n    for (auto& x : a) cin >> x;\n\n    vector<int> phai(n, -1);              // phai[i] = chỉ số j > i đầu tiên thoả điều kiện, -1 nếu không có\n    vector<int> st;                       // ngăn xếp chỉ số, giá trị từ đáy lên đỉnh không tăng\n    for (int j = 0; j < n; j++) {\n        while (!st.empty() && boKhoiNgan(st.back(), j)) {\n            phai[st.back()] = j;          // j là phần tử lớn hơn đầu tiên bên phải của st.back()\n            st.pop_back();\n        }\n        st.push_back(j);\n    }\n    // Phần tử còn lại trong ngăn xếp không có phần tử lớn hơn bên phải: giữ -1.\n\n    for (int i = 0; i < n; i++) {\n        long long kq = phai[i] == -1 ? -1 : a[phai[i]];\n        cout << kq << (i + 1 < n ? ' ' : '\\n');\n    }\n}\n"}]},{"id":"L22","chapter":6,"chapterName":"Ngăn xếp và hàng đợi","title":"Hàng đợi hai đầu cho cửa sổ trượt","intro":"Hàng đợi hai đầu (deque) cho phép lấy và thêm ở cả hai đầu. Dùng nó để giữ \"ứng viên tốt nhất\" của một cửa sổ trượt, mỗi bước cập nhật trong O(1) tính theo trung bình.","recognize":["Đề hỏi giá trị lớn nhất hoặc nhỏ nhất của mọi đoạn có độ dài đúng k, hoặc độ dài nằm trong [u, v].","Đề hỏi dp[i] = max hoặc min của dp[j] cộng một số, với j nằm trong một đoạn trượt cùng i (ví dụ i - k ≤ j < i).","Cận n tới 10^5 hoặc 10^6, cửa sổ rộng nên không thể quét lại cả cửa sổ cho mỗi vị trí.","Bài đoạn có tổng lớn nhất với độ dài trong khoảng cho trước: viết tổng đoạn bằng hiệu hai tổng tiền tố, khi đó phải tìm tổng tiền tố nhỏ nhất trong một cửa sổ trượt."],"idea":["Giữ deque chứa chỉ số trong cửa sổ hiện tại, sao cho giá trị tương ứng giảm dần từ đầu tới cuối (khi tìm lớn nhất). Phần tử ở đầu deque luôn là lớn nhất của cửa sổ.","Thêm phần tử i: chừng nào phần tử cuối deque không lớn hơn a_i thì bỏ nó đi, vì nó nằm bên trái i, sẽ rời cửa sổ sớm hơn i mà lại không lớn hơn, nên không bao giờ là lớn nhất nữa. Sau đó đẩy i vào cuối.","Loại phần tử hết hạn: nếu chỉ số ở đầu deque nhỏ hơn hoặc bằng i - k thì nó đã rời cửa sổ [i-k+1, i], lấy ra khỏi đầu.","Khi i ≥ k - 1 cửa sổ đã đủ k phần tử, đáp án của cửa sổ là a[đầu deque].","Tìm nhỏ nhất thì đổi chiều so sánh. Cửa sổ có hai đầu [i - v, i - u] thì trước khi lấy đáp án phải thêm phần tử i - u vào deque, rồi bỏ các chỉ số nhỏ hơn i - v.","Mỗi chỉ số vào deque một lần và ra một lần nên tổng thời gian O(n). So sánh với cách dùng multiset hoặc segment tree O(n log n): deque nhanh hơn và ngắn hơn."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n, k;\nvector<long long> a;\n\n// Phần tử x (mới vào) có làm phần tử y (đứng trước x) vô dụng không?\n// Tìm lớn nhất: a[x] >= a[y]. Tìm nhỏ nhất: a[x] <= a[y].\nbool xoaDuoc(int x, int y) { return a[x] >= a[y]; }\n\n// Chỉ số f (đầu deque) đã rời cửa sổ kết thúc tại i chưa? Cửa sổ rộng k: [i-k+1, i].\n// Cửa sổ có hai cận [i-v, i-u] thì đổi điều kiện ở đây.\nbool hetHan(int f, int i) { return f <= i - k; }\n\nlong long tong = 0;\n\n// Gọi khi cửa sổ kết thúc tại i đã đủ phần tử; tot là chỉ số phần tử tốt nhất trong cửa sổ.\n// Thay bằng việc đề cần: in a[tot], cập nhật dp[i], lấy max... Ở đây cộng dồn giá trị tốt nhất.\nvoid xuLyCuaSo(int i, int tot) {\n    (void)i;\n    tong += a[tot];\n}\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    cin >> n >> k;\n    a.resize(n);\n    for (auto& x : a) cin >> x;\n\n    deque<int> dq;                        // chỉ số, giá trị giảm dần từ đầu tới cuối\n    for (int i = 0; i < n; i++) {\n        while (!dq.empty() && xoaDuoc(i, dq.back())) dq.pop_back();  // loại ứng viên không bao giờ tốt nhất\n        dq.push_back(i);\n        while (hetHan(dq.front(), i)) dq.pop_front();                // loại phần tử đã rời cửa sổ\n        if (i >= k - 1) xuLyCuaSo(i, dq.front());                    // cửa sổ đủ phần tử\n    }\n    cout << tong << \"\\n\";\n}\n","skeletonNotes":["xoaDuoc quyết định deque giữ lớn nhất hay nhỏ nhất, có giữ phần tử bằng nhau không. Dấu >= (hoặc <=) loại phần tử cũ khi bằng nhau, đủ vì phần tử mới sống lâu hơn.","hetHan là điều kiện hết hạn theo đầu trái cửa sổ. Bài cửa sổ rộng k cố định dùng f <= i - k; bài có độ dài trong [u, v] thì đổi.","Deque luôn chứa chỉ số chứ không chứa giá trị, vì cần chỉ số để biết khi nào hết hạn.","xuLyCuaSo là chỗ dùng kết quả: in ra, cộng dồn, hoặc gán dp[i] = a[tot] + giá trị khác. Trong bài quy hoạch động, thứ tự thao tác là: loại hết hạn, lấy đáp án từ đầu deque, rồi mới thêm i.","Thứ tự \"thêm i vào cuối\" rồi \"bỏ hết hạn ở đầu\" như trong khung đúng khi cửa sổ có chứa cả i. Nếu cửa sổ chỉ gồm các phần tử trước i thì đổi thứ tự."],"complexity":["O(n) thời gian, O(k) bộ nhớ cho deque (tối đa O(n)). Dùng được với n = 10^6."],"pitfalls":["Lưu giá trị vào deque thay vì chỉ số, không biết khi nào phần tử hết hạn. Luôn lưu chỉ số.","Sai điều kiện hết hạn: cửa sổ [i-k+1, i] có đúng k phần tử, nên chỉ số i-k đã ra ngoài. Dùng f < i - k hay f <= i - k + 1 đều lệch một đơn vị.","In đáp án khi i < k - 1: cửa sổ chưa đủ k phần tử. Số cửa sổ là n - k + 1.","Quên kiểm tra deque rỗng trước khi gọi back() hoặc front(). Trong vòng loại phần tử cuối phải có !dq.empty().","Dùng điều kiện chặt (a[x] > a[y]) để loại phần tử cũ khi tìm lớn nhất vẫn đúng nhưng deque giữ nhiều phần tử bằng nhau; không sai kết quả, chỉ cần nhất quán. Nhầm chiều so sánh mới là lỗi.","Tổng tiền tố và dp có thể vượt int. Dùng long long, và khởi tạo giá trị \"âm vô cùng\" đủ nhỏ khi tìm lớn nhất.","Dùng multiset hoặc priority_queue có xoá lười cho cửa sổ lớn dễ quá giờ khi n = 10^6; deque là lời giải chuẩn."],"practice":["ts-J","nx-P"],"examples":[{"key":"hd22-1","title":"Giá trị lớn nhất của mọi cửa sổ","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n, k;\nvector<long long> a;\n\n// Phần tử x có làm phần tử y (đứng trước x) vô dụng không? Tìm lớn nhất: x >= y.\nbool xoaDuoc(int x, int y) { return a[x] >= a[y]; }\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    cin >> n >> k;\n    a.resize(n);\n    for (auto& x : a) cin >> x;\n\n    deque<int> dq;                        // chỉ số trong cửa sổ, giá trị giảm dần từ đầu tới cuối\n    for (int i = 0; i < n; i++) {\n        while (!dq.empty() && xoaDuoc(i, dq.back())) dq.pop_back();  // bỏ phần tử không bao giờ thành tốt nhất\n        dq.push_back(i);\n        if (dq.front() <= i - k) dq.pop_front();                     // đầu hàng đã rời cửa sổ [i-k+1, i]\n        if (i >= k - 1) {                                            // cửa sổ đã đủ k phần tử\n            cout << a[dq.front()] << (i + 1 < n ? ' ' : '\\n');       // đầu hàng chính là phần tử lớn nhất\n        }\n    }\n}\n"}]},{"id":"L23","chapter":6,"chapterName":"Ngăn xếp và hàng đợi","title":"Hàng đợi và BFS trên trạng thái","intro":"Hàng đợi (queue) vào trước ra trước. Dùng trực tiếp để mô phỏng xếp hàng, và dùng làm trái tim của BFS: duyệt các trạng thái theo từng lớp số bước, nên lần đầu tới một trạng thái là đường ngắn nhất.","recognize":["Đề mô tả một hàng người hoặc công việc: người đầu hàng làm gì đó rồi ra khỏi hàng hoặc xuống cuối hàng. Đó là mô phỏng bằng queue.","Đề hỏi số thao tác ít nhất để biến một số hoặc cấu hình này thành cấu hình kia, mỗi bước có vài lựa chọn (nhân 2, trừ 1, thêm chữ số...).","Đề hỏi số nhỏ nhất hoặc xâu nhỏ nhất thoả một điều kiện về chia hết, tổng chữ số, và không gợi ý được công thức: trạng thái là số dư hoặc tổng chữ số hiện tại.","Số cấu hình có thể là rất lớn (số nhiều chữ số) nhưng số trạng thái đáng kể (số dư mod n) nhỏ, tối đa khoảng 10^5 đến 10^6.","Đề yêu cầu liệt kê các số theo thứ tự tăng dần sinh ra theo quy tắc (thêm một chữ số vào cuối): BFS sinh ra đúng thứ tự tăng."],"idea":["Xác định trạng thái: thông tin tối thiểu để quyết định bước tiếp theo. Ví dụ số dư khi chia cho n, giá trị hiện tại của số, tổng chữ số.","Xác định trạng thái xuất phát, trạng thái đích và các bước chuyển từ một trạng thái sang trạng thái kề.","Đẩy trạng thái xuất phát vào hàng đợi. Lấy trạng thái đầu hàng ra, thử mọi bước chuyển, trạng thái nào chưa gặp thì ghi cha (trạng thái trước nó và nhãn của bước chuyển) rồi đẩy vào hàng.","BFS thăm các trạng thái theo thứ tự số bước tăng dần, nên lần đầu gặp một trạng thái là qua ít bước nhất. Nếu các bước chuyển được thử theo thứ tự nhãn tăng dần thì trong các đường ngắn nhất, đường được ghi nhận là nhỏ nhất theo từ điển.","Với bài số nhỏ nhất: số ít chữ số hơn thì nhỏ hơn, cùng độ dài thì so từng chữ số từ trái sang. Đúng bằng thứ tự \"ít bước hơn, rồi nhãn nhỏ hơn\" của BFS.","Truy vết: từ trạng thái đích đi ngược theo mảng cha, ghi nhãn từng bước rồi đảo lại. Không lưu cả xâu ở mỗi trạng thái vì tốn bộ nhớ và thời gian.","Mô phỏng thuần túy (xếp hàng mua vé, loại người): dùng queue hoặc deque, mỗi lượt lấy đầu, xử lý, đẩy xuống cuối nếu cần. Nếu số lượt có thể rất lớn, tìm quy luật để tính thẳng thay vì mô phỏng từng lượt."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nstruct Canh { int den; char nhan; };      // bước chuyển tới trạng thái den, nhãn nhan để truy vết\n\nint V, batDau, dich;                      // số trạng thái, trạng thái xuất phát và trạng thái đích\n\n// Trạng thái xuất phát. Bài có số bắt đầu bằng một chữ số cố định thì đổi hàm này.\nint xuatPhat() { return batDau; }\n\n// Trạng thái u có phải đích không?\nbool laDich(int u) { return u == dich; }\n\n// Các trạng thái kề của u, liệt kê theo thứ tự nhãn tăng dần.\n// Ví dụ: số dư u, viết thêm chữ số c thì sang trạng thái (u * 10 + c) % V.\n// Ở đây là hai bước mẫu: cộng 1 hoặc nhân 2 (modulo V). Thay bằng bước chuyển của đề.\nvector<Canh> ke(int u) {\n    return {{(u + 1) % V, 'A'}, {(u * 2) % V, 'B'}};\n}\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    cin >> V >> batDau >> dich;\n\n    vector<int> khoangCach(V, -1);        // -1: chưa thăm\n    vector<int> cha(V, -1);\n    vector<char> nhan(V, '?');\n    queue<int> q;\n    int s = xuatPhat();\n    khoangCach[s] = 0;\n    q.push(s);\n    int tim = -1;\n    while (!q.empty()) {\n        int u = q.front();\n        q.pop();\n        if (laDich(u)) { tim = u; break; }\n        for (Canh c : ke(u)) {\n            if (khoangCach[c.den] == -1) {            // lần đầu tới đây là đường ngắn nhất\n                khoangCach[c.den] = khoangCach[u] + 1;\n                cha[c.den] = u;\n                nhan[c.den] = c.nhan;\n                q.push(c.den);\n            }\n        }\n    }\n\n    if (tim == -1) {                      // không tới được đích: in theo quy ước của đề (thường -1)\n        cout << -1 << \"\\n\";\n        return 0;\n    }\n    string duong;                         // truy vết ngược từ đích về xuất phát\n    for (int u = tim; u != s; u = cha[u]) duong += nhan[u];\n    reverse(duong.begin(), duong.end());\n    cout << khoangCach[tim] << \"\\n\" << duong << \"\\n\";\n}\n","skeletonNotes":["Ba hàm xuatPhat, laDich, ke là phần phụ thuộc đề. Số trạng thái V và cách mã hoá trạng thái thành chỉ số 0..V-1 cũng do đề quyết định.","ke trả về các bước chuyển theo thứ tự nhãn tăng dần. Chính thứ tự này làm đường ghi nhận là nhỏ nhất theo từ điển trong các đường ngắn nhất.","Mảng khoangCach vừa là số bước ít nhất vừa là mảng đánh dấu đã thăm. Chỉ đẩy trạng thái vào hàng khi nó chưa thăm, mỗi trạng thái vào hàng tối đa một lần.","Mảng cha và nhan dùng để truy vết. Bài chỉ hỏi số bước thì bỏ hai mảng này, bài hỏi đích đầu tiên thì dừng ngay khi gặp đích như trong khung.","Nhiều trạng thái xuất phát cùng lúc (nhiều nguồn): đẩy hết vào hàng đợi trước khi bắt đầu vòng lặp, khoảng cách đặt bằng 0."],"complexity":["O(V + E) với V là số trạng thái và E là tổng số bước chuyển; mỗi trạng thái có hằng số bước thì O(V). Bộ nhớ O(V).","Trạng thái là số dư modulo n thì V = n; BFS trên số dư chạy O(n) cho n tới 10^6."],"pitfalls":["Không đánh dấu đã thăm khi đẩy vào hàng đợi mà đánh dấu khi lấy ra: một trạng thái bị đẩy nhiều lần, hàng đợi phình to, có thể quá giờ hoặc quá bộ nhớ.","Trạng thái quá rộng: dùng chính giá trị số làm trạng thái trong khi giá trị lên tới 10^18. Hãy rút gọn trạng thái (số dư, tổng chữ số) hoặc giới hạn cận trên của giá trị.","Lưu cả xâu trong từng trạng thái để in kết quả, tốn O(V · độ dài) bộ nhớ. Dùng mảng cha và nhãn rồi truy vết.","Đáp án là số nhiều chữ số (có thể hơn 18 chữ số): lưu bằng string chứ không phải long long.","Thứ tự thử các bước chuyển sai (thử 1 trước 0) cho ra số hợp lệ nhưng không nhỏ nhất. Cũng chú ý chữ số đầu tiên: số không được bắt đầu bằng 0.","Quên trường hợp xuất phát đã là đích (ví dụ n = 1 trong bài bội của n): vòng lặp cần kiểm tra đích cho cả trạng thái xuất phát, như khung làm khi lấy ra khỏi hàng.","Mô phỏng hàng đợi khi số lượt rất lớn (k, n tới 10^9) sẽ quá giờ; tìm cách tính thẳng. Mô phỏng nhỏ thì queue là đủ.","Quên reset hàng đợi và các mảng khoảng cách giữa các bộ test khi đề có nhiều bộ test."],"practice":["mh4-C","mh8-C","nx-D","nx-H","nx-K","nx-N"],"examples":[{"key":"hd23-1","title":"Bội nhỏ nhất gồm chữ số 0 và 1","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n;\n\nstruct Canh { int den; char nhan; };      // chuyển sang trạng thái den, thêm ký tự nhan vào số\n\n// Trạng thái xuất phát: số \"1\" có số dư 1 % n (n = 1 thì dư 0).\nint xuatPhat() { return 1 % n; }\n\n// Trạng thái đích: số dư 0, tức là chia hết cho n.\nbool laDich(int u) { return u == 0; }\n\n// Từ số dư u, viết thêm chữ số 0 hoặc 1 vào cuối. Thử 0 trước để ra số nhỏ nhất.\nvector<Canh> ke(int u) {\n    return {{(u * 10) % n, '0'}, {(u * 10 + 1) % n, '1'}};\n}\n\nstring giai() {\n    vector<int> cha(n, -2);               // -2: chưa thăm, -1: trạng thái xuất phát\n    vector<char> nhan(n, '?');\n    queue<int> q;\n    int s = xuatPhat();\n    cha[s] = -1;\n    nhan[s] = '1';                        // số bắt đầu bằng chữ số 1\n    q.push(s);\n    int dich = -1;\n    while (!q.empty()) {\n        int u = q.front(); q.pop();\n        if (laDich(u)) { dich = u; break; }\n        for (Canh c : ke(u)) {\n            if (cha[c.den] == -2) {       // lần đầu tới trạng thái này là đường ngắn nhất\n                cha[c.den] = u;\n                nhan[c.den] = c.nhan;\n                q.push(c.den);\n            }\n        }\n    }\n    string kq;                            // truy vết ngược từ đích về xuất phát\n    for (int u = dich; u != -1; u = cha[u]) kq += nhan[u];\n    reverse(kq.begin(), kq.end());\n    return kq;\n}\n\nint main() {\n    int t;\n    scanf(\"%d\", &t);\n    while (t--) {\n        scanf(\"%d\", &n);\n        puts(giai().c_str());\n    }\n}\n"}]},{"id":"L24","chapter":7,"chapterName":"Đồ thị","title":"Biểu diễn đồ thị, DFS và BFS, thành phần liên thông","intro":"Mọi bài đồ thị bắt đầu từ hai việc: lưu đồ thị vào bộ nhớ và duyệt qua nó. Dạng này dùng DFS hoặc BFS để chia đồ thị (hoặc lưới ô vuông) thành các thành phần liên thông rồi đếm, đo hoặc kiểm tra từng thành phần.","recognize":["Đề hỏi \"có bao nhiêu nhóm\", \"có mấy khu vực\", \"hai điểm có đi được sang nhau không\" mà không quan tâm độ dài đường đi.","Đề cho danh sách cạnh (n đỉnh, m cạnh) hoặc một lưới ô vuông, và hỏi số thành phần, kích thước thành phần lớn nhất, hoặc một tính chất của từng thành phần (tô hai màu được không, bao quanh bởi hình chữ nhật nào).","Lưới có ô ngập, ô tường, ô đất: các ô chung cạnh cùng loại gộp thành một khu (flood fill). Khi đó mỗi ô là một đỉnh, không cần dựng danh sách kề.","Cận n, m cỡ 10^5 đến 2·10^5 và chỉ cần trả lời \"có/không\" hay đếm: duyệt một lần O(n + m) là đủ."],"idea":["Lưu đồ thị bằng danh sách kề: adj[u] chứa các đỉnh kề u. Cạnh vô hướng thêm vào cả hai danh sách. Ma trận kề n × n chỉ dùng khi n nhỏ (vài trăm).","Giữ mảng comp[u] ghi số hiệu thành phần của u; comp[u] = 0 nghĩa là chưa thăm. Mảng này vừa là mảng đánh dấu vừa là kết quả.","Duyệt u từ 1 đến n. Gặp u chưa thăm thì đây là thành phần mới: tăng bộ đếm, chạy BFS (hoặc DFS) từ u để gán nhãn cho mọi đỉnh tới được.","Trong lúc duyệt, cộng dồn thông tin cần cho đề (số đỉnh, tổng giá trị, min/max toạ độ, màu của đỉnh). Khi duyệt xong một thành phần thì kết luận về thành phần đó.","Đánh dấu đỉnh ngay lúc đẩy vào hàng đợi hoặc ngăn xếp, không đợi tới lúc lấy ra. Như vậy mỗi đỉnh vào đúng một lần và tổng thời gian là O(n + m).","Với lưới, đỉnh là cặp (r, c) và hàng xóm là 4 ô chung cạnh. Dùng mảng dx, dy thay cho danh sách kề."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n, m;\nvector<vector<int>> adj;   // danh sách kề, đỉnh đánh số từ 1\nvector<int> comp;          // comp[u] = số hiệu thành phần chứa u, 0 = chưa thăm\n\nvoid docDoThi() {\n    scanf(\"%d %d\", &n, &m);\n    adj.assign(n + 1, {});\n    comp.assign(n + 1, 0);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        adj[u].push_back(v);\n        adj[v].push_back(u);   // đồ thị có hướng thì bỏ dòng này\n    }\n}\n\n// Cập nhật thông tin thành phần khi thăm đỉnh u (đếm đỉnh, cộng tổng, lấy max...).\n// Thay thân hàm theo đề; mặc định chỉ đếm số đỉnh.\nvoid thamDinh(int u, long long &thongTin) { thongTin++; }\n\n// BFS từ s: gán nhãn id cho cả thành phần, trả về thông tin đã cộng dồn.\nlong long bfs(int s, int id) {\n    long long thongTin = 0;\n    queue<int> q;\n    q.push(s);\n    comp[s] = id;                      // đánh dấu ngay lúc đẩy vào hàng đợi\n    while (!q.empty()) {\n        int u = q.front();\n        q.pop();\n        thamDinh(u, thongTin);\n        for (int v : adj[u])\n            if (!comp[v]) {\n                comp[v] = id;\n                q.push(v);\n            }\n    }\n    return thongTin;\n}\n\n// DFS bằng ngăn xếp tự quản lý (tránh tràn stack khi n lớn). Dùng thay bfs được.\nlong long dfs(int s, int id) {\n    long long thongTin = 0;\n    vector<int> st = {s};\n    comp[s] = id;\n    while (!st.empty()) {\n        int u = st.back();\n        st.pop_back();\n        thamDinh(u, thongTin);\n        for (int v : adj[u])\n            if (!comp[v]) {\n                comp[v] = id;\n                st.push_back(v);\n            }\n    }\n    return thongTin;\n}\n\n// Gọi một lần cho mỗi thành phần vừa duyệt xong. Thay theo đề\n// (so sánh kích thước, kiểm tra điều kiện của thành phần, cộng chi phí...).\nvoid xuLyThanhPhan(int id, long long thongTin) {}\n\nint main() {\n    docDoThi();\n    int soTP = 0;\n    for (int u = 1; u <= n; u++)\n        if (!comp[u]) {                // chưa thuộc thành phần nào: mở thành phần mới\n            long long t = bfs(u, ++soTP);\n            xuLyThanhPhan(soTP, t);\n        }\n    printf(\"%d\\n\", soTP);              // đổi thành thứ đề yêu cầu in\n}\n","skeletonNotes":["docDoThi dựng danh sách kề. Đồ thị có hướng thì chỉ thêm một chiều; đồ thị có trọng số thì lưu cặp (đỉnh, trọng số).","comp vừa đánh dấu đã thăm vừa ghi số hiệu thành phần. Muốn tách riêng thì dùng thêm mảng bool, nhưng thường không cần.","thamDinh là nơi cộng dồn thông tin của từng đỉnh vào thông tin thành phần. Nếu cần nhiều số liệu (min x, max x, min y, max y) thì đổi thongTin thành một struct.","bfs và dfs cùng giao diện, thay nhau được. dfs viết bằng ngăn xếp tự quản lý để không bị tràn stack khi đồ thị là một đường dài 2·10^5 đỉnh.","xuLyThanhPhan được gọi đúng một lần cho mỗi thành phần, sau khi thành phần đã duyệt xong: đặt mọi phép so sánh và kết luận của thành phần ở đây.","Với lưới, thay adj bằng g[r][c], thay vòng lặp for (int v : adj[u]) bằng vòng lặp 4 hướng, còn lại giữ nguyên."],"complexity":["Thời gian O(n + m): mỗi đỉnh vào hàng đợi một lần, mỗi cạnh được xét hai lần.","Bộ nhớ O(n + m) cho danh sách kề. Lưới n × m ô thì O(n·m).","Đệ quy DFS có thể sâu tới n; với n ≥ 10^5 nên dùng BFS hoặc DFS có ngăn xếp tự quản lý."],"pitfalls":["DFS đệ quy trên đồ thị dạng đường dài 2·10^5 đỉnh làm tràn stack và crash ở test lớn. Dùng BFS hoặc ngăn xếp tự quản lý.","Quên đánh dấu ngay lúc đẩy vào hàng đợi: một đỉnh bị đẩy nhiều lần, thời gian có thể nổ lên O(n·m).","Quên đỉnh cô lập. Đỉnh không thuộc cạnh nào vẫn là một thành phần, nên vòng lặp ngoài phải chạy đủ 1..n chứ không chỉ các đỉnh xuất hiện trong cạnh.","Khởi tạo giá trị lớn nhất bằng 0 khi đề cho giá trị âm: nếu mọi thành phần đều âm thì đáp án sai. Khởi tạo bằng LLONG_MIN (hoặc lấy giá trị của thành phần đầu tiên), và dùng long long cho tổng.","Quên thêm cạnh theo chiều ngược lại với đồ thị vô hướng, khiến BFS đi được một chiều và đếm thừa thành phần.","Đề có nhiều bộ test mà không xoá adj và comp giữa các bộ. Hãy assign lại cho đúng cỡ trong docDoThi.","Lưới: nhầm thứ tự (hàng, cột) với (x, y), hoặc quên kiểm tra biên trước khi truy cập g[nr][nc]."],"practice":["dt-F","dt-R","dt-A","mh2-D","mh1-D","dt-C"],"examples":[{"key":"hd24-1","title":"Thành phần liên thông và tổng giá trị lớn nhất","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nint n, m;\nvector<vector<int>> adj;   // danh sách kề, đỉnh đánh số từ 1\nvector<int> comp;          // comp[u] = số hiệu thành phần của u, 0 = chưa thăm\nvector<long long> a;       // a[u] = giá trị của đỉnh u\nlong long tongLonNhat = LLONG_MIN;   // tổng giá trị lớn nhất của một thành phần\n\nvoid docDoThi() {\n    scanf(\"%d %d\", &n, &m);\n    adj.assign(n + 1, {});\n    comp.assign(n + 1, 0);\n    a.assign(n + 1, 0);\n    for (int i = 1; i <= n; i++) scanf(\"%lld\", &a[i]);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        adj[u].push_back(v);\n        adj[v].push_back(u);          // đồ thị vô hướng: thêm cả hai chiều\n    }\n}\n\n// Cộng dồn thông tin của đỉnh u vào thông tin thành phần: ở đây là cộng giá trị.\nvoid thamDinh(int u, long long &thongTin) { thongTin += a[u]; }\n\n// BFS từ s, gán nhãn id cho cả thành phần, trả về thông tin của thành phần.\nlong long bfs(int s, int id) {\n    long long thongTin = 0;\n    queue<int> q;\n    q.push(s);\n    comp[s] = id;                      // đánh dấu ngay lúc đẩy vào hàng đợi\n    while (!q.empty()) {\n        int u = q.front();\n        q.pop();\n        thamDinh(u, thongTin);\n        for (int v : adj[u])\n            if (!comp[v]) {\n                comp[v] = id;\n                q.push(v);\n            }\n    }\n    return thongTin;\n}\n\n// Gọi một lần cho mỗi thành phần vừa duyệt xong: ghi nhận tổng lớn nhất.\nvoid xuLyThanhPhan(int id, long long thongTin) {\n    tongLonNhat = max(tongLonNhat, thongTin);\n}\n\nint main() {\n    docDoThi();\n    int soTP = 0;\n    for (int u = 1; u <= n; u++)\n        if (!comp[u]) {                // đỉnh chưa thuộc thành phần nào: mở thành phần mới\n            long long t = bfs(u, ++soTP);\n            xuLyThanhPhan(soTP, t);\n        }\n    printf(\"%d\\n%lld\\n\", soTP, tongLonNhat);\n}\n"}]},{"id":"L25","chapter":7,"chapterName":"Đồ thị","title":"BFS tìm đường ngắn nhất trên lưới và đồ thị không trọng số","intro":"Khi mọi bước đi tốn như nhau (một bước, một cạnh), BFS cho đường ngắn nhất: nó duyệt theo từng lớp, lớp k gồm các ô cách nguồn đúng k bước. Dạng này gồm mê cung, quân cờ đi tuần, và mọi bài \"ít bước nhất\".","recognize":["Đề hỏi \"số bước ít nhất\", \"thời gian ngắn nhất\" mà mỗi bước có chi phí như nhau (1 bước = 1 đơn vị).","Có lưới ô vuông với tường hoặc ô cấm, đi lên xuống trái phải; hoặc quân cờ có nước đi cố định (quân mã).","Nhiều điểm xuất phát cùng lúc (\"từ mọi phòng đến phòng thoát gần nhất\", lửa lan, nước lan): đặt tất cả vào hàng đợi với khoảng cách 0.","Đồ thị không trọng số mà hỏi độ dài đường ngắn nhất, chu trình ngắn nhất, hay đường đi qua điểm trung gian (BFS từ nhiều đỉnh, hoặc BFS trên đồ thị đảo chiều).","Bước nhảy có quy tắc phức tạp (nhảy xa theo giá trị ô) nhưng mỗi lần nhảy vẫn tính là 1 bước: đỉnh là ô, cạnh là các nước nhảy hợp lệ."],"idea":["Đỉnh là ô (r, c) hoặc một trạng thái. Cạnh là các nước đi hợp lệ. Mỗi nước đi tốn đúng 1.","Giữ mảng dist, khởi tạo -1 (chưa tới). Đặt các ô xuất phát vào hàng đợi với dist = 0.","Lấy ô ở đầu hàng đợi, xét các ô kề hợp lệ. Ô nào chưa có dist thì gán dist = dist của ô hiện tại + 1 và đẩy vào hàng đợi.","Lần đầu một ô được gán dist chính là đường ngắn nhất tới nó, vì hàng đợi luôn lấy ô gần nguồn trước. Không cập nhật lại.","Đọc đáp án từ dist ở ô đích. dist = -1 nghĩa là không tới được, in -1.","Muốn dựng đường đi thì lưu thêm ô cha của mỗi ô rồi lần ngược từ đích về nguồn.","Khi cần khoảng cách từ mọi đỉnh tới một đích trên đồ thị có hướng, đảo chiều cung rồi BFS từ đích."],"skeleton":"#include <bits/stdc++.h>\nusing namespace std;\n\n// ---------- Dạng 1: lưới ----------\nconst int dx[4] = {-1, 1, 0, 0};       // 4 hướng; thêm hướng chéo hoặc nước đi quân cờ nếu đề cần\nconst int dy[4] = {0, 0, -1, 1};\nint n, m;\nvector<string> g;                      // bảng ký tự\nvector<vector<int>> dist;              // dist[r][c] = số bước ngắn nhất, -1 = chưa tới\n\nvoid docBang() {\n    cin >> n >> m;\n    g.resize(n);\n    for (auto &row : g) cin >> row;\n}\n\n// Ô (r, c) có được bước vào không. Thay điều kiện theo đề (tường, ô cấm, ô ngập...).\nbool hopLe(int r, int c) {\n    return r >= 0 && r < n && c >= 0 && c < m && g[r][c] != '#';\n}\n\n// Danh sách ô xuất phát (khoảng cách 0). Một nguồn hoặc nhiều nguồn tuỳ đề.\nvector<pair<int, int>> timNguon() {\n    vector<pair<int, int>> res;\n    for (int r = 0; r < n; r++)\n        for (int c = 0; c < m; c++)\n            if (g[r][c] == 'S') res.push_back({r, c});\n    return res;\n}\n\nvoid bfs(const vector<pair<int, int>> &nguon) {\n    dist.assign(n, vector<int>(m, -1));\n    queue<pair<int, int>> q;\n    for (auto [r, c] : nguon) {\n        dist[r][c] = 0;\n        q.push({r, c});\n    }\n    while (!q.empty()) {\n        auto [r, c] = q.front();\n        q.pop();\n        for (int k = 0; k < 4; k++) {\n            int nr = r + dx[k], nc = c + dy[k];\n            if (hopLe(nr, nc) && dist[nr][nc] == -1) {   // lần đầu tới = ngắn nhất\n                dist[nr][nc] = dist[r][c] + 1;\n                q.push({nr, nc});\n            }\n        }\n    }\n}\n\n// In kết quả từ mảng dist: khoảng cách tới một ô đích, giá trị lớn nhất, số ô tới được...\nvoid xuatKetQua() {\n    int mx = 0;\n    for (int r = 0; r < n; r++)\n        for (int c = 0; c < m; c++) mx = max(mx, dist[r][c]);\n    printf(\"%d\\n\", mx);\n}\n\n// ---------- Dạng 2: đồ thị cho bằng danh sách kề (không trọng số) ----------\n// Dùng thay cho phần lưới khi đề cho đỉnh và cạnh. adj[u] = các đỉnh kề u.\nvector<vector<int>> adj;\nvector<int> d;                         // d[u] = số cạnh ít nhất từ nguồn, -1 = chưa tới\n\nvoid bfsDoThi(const vector<int> &nguon) {\n    d.assign(adj.size(), -1);\n    queue<int> q;\n    for (int s : nguon) {\n        d[s] = 0;\n        q.push(s);\n    }\n    while (!q.empty()) {\n        int u = q.front();\n        q.pop();\n        for (int v : adj[u])\n            if (d[v] == -1) {\n                d[v] = d[u] + 1;\n                q.push(v);\n            }\n    }\n}\n\nint main() {\n    docBang();\n    bfs(timNguon());\n    xuatKetQua();\n}\n","skeletonNotes":["dx, dy liệt kê các nước đi. 4 hướng cho lưới thường; 8 hướng cho đi chéo; 8 cặp (±1, ±2), (±2, ±1) cho quân mã.","hopLe gom mọi điều kiện \"được bước vào ô này\": nằm trong bảng, không phải tường, không phải ô cấm, thoả điều kiện riêng của đề. Đề đổi luật thì chỉ sửa hàm này.","timNguon trả về danh sách ô xuất phát. Một nguồn thì trả một phần tử; nhiều nguồn thì trả tất cả, BFS tự xử lý đúng.","dist đồng thời là mảng đã thăm (-1 là chưa thăm). Không cần mảng visited riêng.","xuatKetQua là chỗ đổi theo đề: in dist ở ô đích, in giá trị lớn nhất, hay đếm số ô tới được. Khung chỉ in khoảng cách lớn nhất làm ví dụ.","Đề cho đỉnh và cạnh (không phải lưới) thì dùng phần \"Dạng 2\": dựng adj như bài đồ thị bình thường rồi gọi bfsDoThi. Đồ thị có hướng thì chỉ thêm cạnh một chiều; muốn hỏi đường từ mọi đỉnh tới một đích thì dựng adj đảo chiều rồi BFS từ đích. Đỉnh là trạng thái bất kỳ (không phải ô lưới) thì thay adj bằng hàm sinh trạng thái kề."],"complexity":["Thời gian O(số đỉnh + số cạnh); lưới n × m ô với 4 hướng là O(n·m).","Bộ nhớ O(n·m) cho dist và hàng đợi. Lưới 1000 × 1000 dùng cỡ vài chục MB, vẫn ổn.","Chạy BFS riêng từ mỗi đỉnh (như tìm chu trình ngắn nhất) tốn O(n·(n + m)), chỉ dùng khi n cỡ vài nghìn."],"pitfalls":["Dùng DFS để tìm đường ngắn nhất: DFS không bảo đảm ngắn nhất. Phải là BFS.","Đánh dấu ô khi lấy ra khỏi hàng đợi thay vì khi đẩy vào: một ô bị đẩy nhiều lần, chậm và dễ sai khoảng cách.","Đọc lưới bằng cin >> row khi dòng có dấu cách (ví dụ ô trống là dấu cách). Với bài chỉ có ký tự liền nhau như . # thì dùng cin >> được; ngược lại dùng getline.","Quên các trường hợp biên: ô xuất phát trùng ô đích (đáp án 0), ô đích bị chặn hoặc không tới được (dist vẫn là -1 thì in -1).","Khởi tạo dist bằng 0 thay vì -1: không phân biệt được ô chưa tới với ô nguồn, BFS quay ngược về nguồn và đáp án sai.","Quên biên của lưới, truy cập g[-1][c] gây lỗi khó thấy. Luôn kiểm tra biên trong hopLe trước khi đọc g[nr][nc].","Bài có nhiều bộ test: dist.assign lại đúng cỡ mỗi bộ, không giữ dữ liệu bộ trước."],"practice":["clc-C","dt-G","mh4-D","mh8-D","dt-N","mh9-D"],"examples":[{"key":"hd25-1","title":"Mê cung ngắn nhất","tl":1,"sol":"#include <bits/stdc++.h>\nusing namespace std;\n\nconst int dx[4] = {-1, 1, 0, 0};   // 4 hướng: lên, xuống, trái, phải\nconst int dy[4] = {0, 0, -1, 1};\nint n, m;\nvector<string> g;                  // bảng ký tự\nvector<vector<int>> dist;          // dist[r][c] = số bước ngắn nhất, -1 = chưa tới\n\nvoid docBang() {\n    cin >> n >> m;\n    g.resize(n);\n    for (auto &row : g) cin >> row;\n}\n\n// Ô (r, c) có được bước vào không: trong bảng và không phải tường.\nbool hopLe(int r, int c) {\n    return r >= 0 && r < n && c >= 0 && c < m && g[r][c] != '#';\n}\n\n// Ô xuất phát: các ô 'S' (ở đây chỉ có một).\nvector<pair<int, int>> timNguon() {\n    vector<pair<int, int>> res;\n    for (int r = 0; r < n; r++)\n        for (int c = 0; c < m; c++)\n            if (g[r][c] == 'S') res.push_back({r, c});\n    return res;\n}\n\n// BFS nhiều nguồn: mọi ô trong nguon có khoảng cách 0.\nvoid bfs(const vector<pair<int, int>> &nguon) {\n    dist.assign(n, vector<int>(m, -1));\n    queue<pair<int, int>> q;\n    for (auto [r, c] : nguon) {\n        dist[r][c] = 0;\n        q.push({r, c});\n    }\n    while (!q.empty()) {\n        auto [r, c] = q.front();\n        q.pop();\n        for (int k = 0; k < 4; k++) {\n            int nr = r + dx[k], nc = c + dy[k];\n            if (hopLe(nr, nc) && dist[nr][nc] == -1) {   // lần đầu tới = ngắn nhất\n                dist[nr][nc] = dist[r][c] + 1;\n                q.push({nr, nc});\n            }\n        }\n    }\n}\n\n// In khoảng cách tới ô 'E'; dist = -1 nghĩa là không tới được.\nvoid xuatKetQua() {\n    for (int r = 0; r < n; r++)\n        for (int c = 0; c < m; c++)\n            if (g[r][c] == 'E') printf(\"%d\\n\", dist[r][c]);\n}\n\nint main() {\n    docBang();\n    bfs(timNguon());\n    xuatKetQua();\n}\n"}]},{"id":"L26","chapter":7,"chapterName":"Đồ thị","title":"Hợp nhất các tập (DSU)","intro":"DSU (Disjoint Set Union, còn gọi union-find) quản lý các nhóm rời nhau và trả lời rất nhanh \"hai phần tử có cùng nhóm không\" cùng \"gộp hai nhóm\". Hợp với các bài thêm cạnh dần và hỏi về liên thông, vì BFS lại từ đầu sau mỗi lần
