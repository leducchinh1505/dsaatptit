lần lượt 4, 1, 0, 1, 4 (tổng 10); theo y, các giá trị -2, 0, 1, 4, 7 cách 1 lần lượt 3, 1, 0, 3, 6 (tổng 13). Dịch a sang bất kỳ giá trị nguyên khác ở mỗi trục đều không giảm được các tổng này, nên 10 + 13 = 23 là nhỏ nhất."]}},"tl-K":{"statement":["Cho số nguyên dương n. Mỗi bước, ta tăng n thêm 1. Hãy tìm số bước ít nhất để tổng các chữ số thập phân của n không vượt quá s, với s cho trước.","Nếu ban đầu tổng các chữ số của n đã không vượt quá s thì đáp án là 0. Có nhiều bộ test, in kết quả mỗi bộ trên một dòng."],"input":["Dòng 1: số bộ test t.","Mỗi bộ test gồm một dòng chứa hai số nguyên n và s."],"output":["Với mỗi bộ test in một số nguyên: số bước tối thiểu."],"constraints":["1 ≤ t ≤ 2·10^4","1 ≤ n ≤ 10^18","1 ≤ s ≤ 162"],"example":{"in":"5\n99 1\n123 3\n50 5\n19 1\n4999 5\n","out":"1\n77\n0\n81\n1\n","explain":["n = 99 có tổng chữ số 18 > 1. Số nhỏ nhất lớn hơn 99 và có tổng ≤ 1 là 100, cần 1 bước.","n = 123, s = 3. Các số 123 đến 199 đều có tổng chữ số ít nhất 4 (nhỏ nhất là 130), còn 200 có tổng 2, nên đích đến là 200, cần 77 bước.","n = 50 có tổng 5 ≤ 5 nên 0 bước.","n = 19, s = 1: các số 20 đến 99 đều có tổng ≥ 2, đến 100 mới được tổng 1, cần 81 bước.","n = 4999 có tổng 31 > 5. Số 5000 có tổng 5 ≤ 5, cần 1 bước."]}},"tl-L":{"statement":["Một con rồng có sức mạnh ban đầu bằng 0 và được luyện trong m phút. Mỗi phút ta chọn đúng một trong n kỹ năng để luyện. Một kỹ năng được phép chọn nhiều lần, ở nhiều phút khác nhau.","Mỗi phút luyện kỹ năng i, sức mạnh tăng e_i. Ngoài ra, ở phút đầu tiên mà kỹ năng i được luyện, sức mạnh còn tăng thêm s_i, tức là phút đó kỹ năng i đem lại s_i + e_i. Những lần luyện kỹ năng i sau đó chỉ cộng e_i.","Hãy chọn kỹ năng cho từng phút để sức mạnh sau m phút là lớn nhất, và in ra sức mạnh đó."],"input":["Dòng 1: hai số nguyên dương n và m.","n dòng tiếp theo: dòng thứ i chứa hai số nguyên dương s_i và e_i."],"output":["In ra một số nguyên: sức mạnh lớn nhất có thể đạt."],"constraints":["1 ≤ n ≤ 10^5","1 ≤ m ≤ 10^9","1 ≤ s_i, e_i ≤ 10^6"],"example":{"in":"3 5\n10 1\n1 4\n3 3\n","out":"30\n","explain":["Có ba kỹ năng (s, e): (10, 1), (1, 4), (3, 3). Phút đầu tiên của từng kỹ năng đem lại 11, 5, 6; các phút sau của nó đem lại 1, 4, 3.","Có 5 phút. Cách tốt nhất là luyện kỹ năng 1 một phút (11), kỹ năng 3 một phút (6), kỹ năng 2 một phút (5), rồi hai phút còn lại luyện tiếp kỹ năng 2 (4 + 4). Tổng 11 + 6 + 5 + 4 + 4 = 30.","So sánh: bỏ kỹ năng 3 và dùng kỹ năng 2 cho cả ba phút còn lại thì được 11 + 5 + 4 + 4 + 4 = 28, kém hơn. Luyện kỹ năng 3 thêm lần nữa chỉ được 3 < 4."]},"note":["Điểm s_i được cộng vào phút đầu tiên luyện kỹ năng i (cộng cùng với e_i của phút đó), không chiếm một phút riêng."]},"tl-M":{"statement":["Cho xâu s chỉ gồm các ký tự 'A', 'B', 'C'. Có hai thao tác, dùng tuỳ ý, số lần và thứ tự tuỳ ý: (1) thay một ký tự 'A' bằng hai ký tự 'BB'; (2) thay hai ký tự 'B' đứng liền nhau bằng một ký tự 'A'.","Ký tự 'C' không bị thao tác nào thay đổi hoặc tạo ra. Hãy in ra xâu nhỏ nhất theo thứ tự từ điển có thể có, với thứ tự A < B < C."],"input":["Dòng 1: số nguyên dương n, độ dài xâu.","Dòng 2: xâu s gồm n ký tự thuộc {A, B, C}."],"output":["In ra xâu nhỏ nhất theo thứ tự từ điển."],"constraints":["1 ≤ n ≤ 2·10^5","s chỉ gồm các ký tự A, B, C"],"example":{"in":"11\nBAACBBBACCB\n","out":"AABCAABCCB\n","explain":["Các ký tự C cố định nên chia xâu thành các đoạn không chứa C: \"BAA\", \"BBBA\", \"\" (giữa hai C liền nhau) và \"B\".","Đoạn \"BAA\": mỗi A đổi thành BB cho BBBBB (5 chữ B), rồi ghép hai cặp BB thành AA, còn B, được \"AAB\". Đoạn \"BBBA\" cũng tương đương 5 chữ B và cho \"AAB\". Đoạn rỗng giữ nguyên. Đoạn \"B\" không đổi.","Ghép lại với các chữ C ở đúng vị trí: AAB C AAB C C B = AABCAABCCB."]}},"tl-N":{"statement":["Một xâu gồm các ký tự A, B, C gọi là đẹp nếu độ dài chia hết cho 3 và có thể cắt thành các khối liên tiếp, mỗi khối dài đúng 3 và chứa mỗi ký tự A, B, C đúng một lần. Ví dụ ABCCAB là xâu đẹp, còn ABCAB và AABCCB thì không.","Cho xâu s. Hãy chia các ký tự của s thành ít dãy con nhất có thể (một dãy con là tập vị trí bất kỳ, không cần liên tiếp, giữ nguyên thứ tự xuất hiện trong s) sao cho mỗi vị trí thuộc đúng một dãy con và mỗi dãy con, đọc theo thứ tự, là một xâu đẹp.","In ra số dãy con tối thiểu."],"input":["Một dòng duy nhất chứa xâu s gồm các ký tự A, B, C."],"output":["In ra một số nguyên: số dãy con ít nhất."],"constraints":["1 ≤ |s| ≤ 3·10^5","|s| chia hết cho 3"],"example":{"in":"AABCBCCAB\n","out":"2\n","explain":["Xâu có 3 chữ A, 3 chữ B và 3 chữ C. Cả xâu không đẹp vì khối đầu tiên AAB có hai chữ A, nên cần ít nhất 2 dãy con.","Chia với 2 dãy: dãy thứ nhất lấy vị trí 1, 3, 4, 7, 8, 9 cho ABCCAB (đẹp: ABC rồi CAB). Dãy thứ hai lấy vị trí 2, 5, 6 cho ABC (đẹp).","Mỗi vị trí thuộc đúng một dãy nên đáp số là 2."]},"note":["Trong mọi bộ test, số lượng ký tự A, B, C trong s luôn bằng nhau, nên luôn có cách chia hợp lệ."]},"tl-O":{"statement":["Có n túi hành lý, túi thứ i nặng a_i. Mỗi người chỉ xách tối đa 2 túi, và nếu xách 2 túi thì tổng trọng lượng hai túi không được vượt quá c. Một người xách một túi thì chỉ cần túi đó nặng không quá c, điều luôn đúng vì a_i ≤ c.","Mỗi túi phải do đúng một người xách. Hãy tìm số người ít nhất để xách hết các túi."],"input":["Dòng 1: hai số nguyên dương n và c.","Dòng 2: n số nguyên dương a_1, ..., a_n."],"output":["In ra một số nguyên: số người ít nhất."],"constraints":["1 ≤ n ≤ 10^5","1 ≤ c ≤ 10^9","1 ≤ a_i ≤ c"],"example":{"in":"6 10\n9 2 8 1 6 5\n","out":"4\n","explain":["Các túi nặng 1, 2, 5, 6, 8, 9 và giới hạn c = 10. Túi 9 chỉ đi chung được với túi 1 (9+1 = 10). Túi 8 đi chung được với 1 hoặc 2.","Ghép (9, 1), (8, 2). Còn 5 và 6 có tổng 11 > 10 nên không đi chung được, mỗi túi một người. Tổng 4 người.","Không thể dùng 3 người vì khi đó 6 túi phải thành 3 cặp: 9 phải đi với 1, 8 phải đi với 2, còn lại 5 với 6 vượt giới hạn."]}},"tl-P":{"statement":["Có n lá bài, lá thứ i ghi số nguyên dương a_i. Hãy chọn đúng 3 lá bài khác nhau (hai lá có cùng số vẫn là hai lá riêng) rồi xếp chúng theo thứ tự tuỳ ý, viết số của chúng nối nhau để tạo thành một số nguyên mới. Ví dụ ba lá 1, 23, 4 có thể tạo 1234 hoặc 2314.","Cần in ra giá trị lớn nhất trong các số có thể ghép được theo cách này."],"input":["Dòng 1: số nguyên dương n.","Dòng 2: n số nguyên dương a_1, ..., a_n."],"output":["In ra số lớn nhất tạo được, dưới dạng chuỗi chữ số, trên một dòng."],"constraints":["3 ≤ n ≤ 2·10^5","1 ≤ a_i ≤ 10^6"],"example":{"in":"5\n12 9 120 5 12\n","out":"1212120\n","explain":["Số có nhiều chữ số hơn thì lớn hơn. Chọn lá 120 và hai lá 12 (hai lá cùng số 12 là hai lá riêng) cho số có 3 + 2 + 2 = 7 chữ số. Bất kỳ bộ ba nào có lá 9 hoặc 5 chỉ có tối đa 6 chữ số, nên không tốt hơn.","Ba cách sắp thứ tự của {120, 12, 12}: 1212120, 1201212, 1212012. Lớn nhất là 1212120."]}},"tl-Q":{"statement":["Có n điểm thu thập xếp theo thứ tự từ 1 đến n, điểm i chứa tinh thể có giá trị a_i. Nếu a_i dương thì nhận thêm năng lượng, nếu âm thì mất năng lượng, nếu bằng 0 thì năng lượng không đổi. Năng lượng ban đầu bằng 0.","Bạn đi từ điểm 1 đến điểm n, gặp từng điểm theo thứ tự và quyết định thu thập hoặc bỏ qua tinh thể ở đó. Sau mỗi lần thu thập, tổng năng lượng hiện có không được âm.","Hãy tìm số tinh thể nhiều nhất có thể thu thập. Tinh thể có giá trị 0 vẫn được tính là một tinh thể."],"input":["Dòng 1: số nguyên dương n.","Dòng 2: n số nguyên a_1, ..., a_n."],"output":["In ra một số nguyên: số tinh thể tối đa."],"constraints":["1 ≤ n ≤ 2·10^5","-10^9 ≤ a_i ≤ 10^9"],"example":{"in":"6\n2 -3 5 -4 1 -6\n","out":"4\n","explain":["Chọn các tinh thể ở vị trí 1, 3, 4, 5 (giá trị 2, 5, -4, 1). Năng lượng sau từng lần thu thập: 2, 7, 3, 4, đều không âm. Vậy thu được 4 tinh thể.","Không thể thu thập 5: nếu bỏ tinh thể -6 thì phải thu -3 ngay sau 2, năng lượng thành -1; nếu bỏ -3 thì thu cả -6 ở cuối khiến năng lượng 4 - 6 = -2. Mọi cách bỏ tinh thể khác cũng giữ lại cả -3 và -6 nên vi phạm. Đáp số là 4."]}},"ts-A":{"statement":["Cho mảng a gồm n số nguyên được sắp theo thứ tự không giảm, và q truy vấn. Mỗi truy vấn có hai số t và x, trong đó t cho biết loại truy vấn.","Loại 1: nếu x có mặt trong a thì trả lời YES.","Loại 2: trả lời chỉ số nhỏ nhất i sao cho a_i = x (đánh số từ 1).","Loại 3: trả lời chỉ số lớn nhất i sao cho a_i = x (đánh số từ 1).","Với cả ba loại, nếu x không nằm trong mảng thì câu trả lời là -1."],"input":["Dòng 1: hai số nguyên dương n và q.","Dòng 2: n số a_1, a_2, ..., a_n, đã sắp không giảm.","q dòng tiếp theo: mỗi dòng gồm hai số t và x."],"output":["In q dòng, dòng thứ j là câu trả lời của truy vấn thứ j: chữ YES, một chỉ số nguyên, hoặc -1."],"constraints":["1 ≤ n, q ≤ 10^5","0 ≤ a_i ≤ 10^9","1 ≤ t ≤ 3","0 ≤ x ≤ 10^9"],"example":{"in":"7 6\n1 2 2 2 5 5 9\n1 5\n1 4\n2 2\n3 2\n2 9\n3 3\n","explain":["Mảng là 1 2 2 2 5 5 9; số 2 nằm ở các vị trí 2, 3, 4; số 5 ở vị trí 5, 6; số 9 ở vị trí 7.","Truy vấn \"1 5\": 5 có trong mảng nên in YES.","Truy vấn \"1 4\": 4 không có nên in -1.","Truy vấn \"2 2\": vị trí đầu của số 2 là 2.","Truy vấn \"3 2\": vị trí cuối của số 2 là 4.","Truy vấn \"2 9\": số 9 chỉ xuất hiện ở vị trí 7 nên in 7.","Truy vấn \"3 3\": 3 không có nên in -1."],"out":"YES\n-1\n2\n4\n7\n-1\n"}},"ts-B":{"statement":["Cho hai mảng a (n phần tử) và b (m phần tử), mỗi mảng đã sắp theo thứ tự không giảm. Hãy ghép chúng thành một mảng c gồm n + m phần tử cũng sắp không giảm.","Khi một phần tử của a và một phần tử của b bằng nhau, phần tử của a phải đứng trước phần tử của b trong c.","Ngoài mảng c, in thêm một xâu s độ dài n + m gồm hai ký tự a và b: s_i = a nếu c_i lấy từ mảng a, s_i = b nếu c_i lấy từ mảng b. Thứ tự tương đối giữa các phần tử cùng mảng được giữ nguyên."],"input":["Dòng 1: số nguyên dương n.","Dòng 2: n số a_1, ..., a_n.","Dòng 3: số nguyên dương m.","Dòng 4: m số b_1, ..., b_m."],"output":["Dòng 1: n + m số của mảng c, cách nhau bởi dấu cách.","Dòng 2: xâu s gồm các ký tự a và b."],"constraints":["1 ≤ n, m ≤ 10^6","1 ≤ a_i, b_i ≤ 10^6","Cả hai mảng đã sắp không giảm"],"example":{"in":"4\n2 4 4 7\n5\n1 4 7 7 9\n","explain":["Ghép theo thứ tự tăng dần: 1 (từ b), 2 (từ a), rồi ba số 4: hai số 4 của a đứng trước số 4 của b.","Tiếp theo là số 7: số 7 của a đứng trước hai số 7 của b, cuối cùng là 9 (từ b).","Dãy nguồn tương ứng là b a a a b a b b b, ghép lại thành xâu baaababbb."],"out":"1 2 4 4 4 7 7 7 9\nbaaababbb\n"}},"ts-C":{"statement":["Cho hai mảng a (n phần tử) và b (m phần tử), cả hai đã sắp theo thứ tự không giảm. Với mỗi i từ 1 đến m, hãy cho biết có bao nhiêu phần tử của a nhỏ hơn b_i, theo nghĩa so sánh chặt (phần tử bằng b_i không được đếm)."],"input":["Dòng 1: hai số nguyên dương n và m.","Dòng 2: n số của mảng a.","Dòng 3: m số của mảng b."],"output":["In m số trên một dòng, số thứ i là số phần tử của a nhỏ hơn b_i, các số cách nhau bởi dấu cách."],"constraints":["1 ≤ n, m ≤ 10^6","1 ≤ a_i ≤ 10^9","1 ≤ b_i ≤ 10^9","Cả hai mảng a và b đã sắp không giảm"],"example":{"in":"5 6\n3 3 5 8 8\n1 3 4 8 9 10\n","explain":["b_1 = 1: không phần tử nào của a nhỏ hơn 1, đáp án 0.","b_2 = 3: hai số 3 trong a bằng chứ không nhỏ hơn, đáp án 0.","b_3 = 4: có hai số 3 nhỏ hơn 4, đáp án 2.","b_4 = 8: các số 3, 3, 5 nhỏ hơn 8 (hai số 8 không tính), đáp án 3.","b_5 = 9: cả 5 phần tử của a đều nhỏ hơn 9, đáp án 5.","b_6 = 10: tương tự, đáp án 5."],"out":"0 0 2 3 5 5\n"}},"ts-D":{"statement":["Cho mảng a gồm n phần tử và mảng b gồm m phần tử, cả hai đã sắp không giảm. Hãy đếm số cặp chỉ số (i, j) thoả a_i = b_j.","Các cặp được xét theo chỉ số: hai phần tử cùng giá trị ở các vị trí khác nhau tạo thành các cặp khác nhau."],"input":["Dòng 1: hai số nguyên dương n và m.","Dòng 2: n số của mảng a.","Dòng 3: m số của mảng b."],"output":["In một số nguyên duy nhất là số cặp tìm được."],"constraints":["1 ≤ n, m ≤ 10^6","1 ≤ a_i ≤ 10^6","1 ≤ b_j ≤ 10^6","Cả hai mảng đã sắp không giảm"],"example":{"in":"6 5\n2 2 3 5 5 5\n2 3 3 5 7\n","explain":["Giá trị 2: a có 2 lần, b có 1 lần, được 2 × 1 = 2 cặp.","Giá trị 3: a có 1 lần, b có 2 lần, được 1 × 2 = 2 cặp.","Giá trị 5: a có 3 lần, b có 1 lần, được 3 × 1 = 3 cặp.","Giá trị 7 chỉ có trong b nên không tạo cặp nào. Tổng 2 + 2 + 3 = 7."],"out":"7\n"}},"ts-E":{"statement":["Cho mảng a gồm n số nguyên dương và một số s. Đoạn con là dãy các phần tử liên tiếp a_l, a_{l+1}, ..., a_r (1 ≤ l ≤ r ≤ n).","Hãy tìm độ dài lớn nhất của một đoạn con có tổng các phần tử không lớn hơn s. Đoạn có tổng đúng bằng s vẫn hợp lệ."],"input":["Dòng 1: hai số nguyên dương n và s.","Dòng 2: n số a_1, ..., a_n."],"output":["In một số nguyên là độ dài lớn nhất tìm được."],"constraints":["1 ≤ n ≤ 10^6","1 ≤ s ≤ 10^15","1 ≤ a_i ≤ 10^9"],"example":{"in":"6 10\n5 1 2 4 3 6\n","explain":["Đoạn 1 2 4 3 (vị trí 2 đến 5) có tổng 10, đúng bằng s nên hợp lệ, độ dài 4.","Các đoạn dài 5 đều quá lớn: 5+1+2+4+3 = 15 và 1+2+4+3+6 = 16.","Các đoạn dài 4 khác cũng vượt s: 5+1+2+4 = 12 và 2+4+3+6 = 15. Vậy đáp án là 4."],"out":"4\n"}},"ts-F":{"statement":["Cho mảng a gồm n số nguyên dương và một số s. Đoạn con là dãy các phần tử liên tiếp a_l, ..., a_r (1 ≤ l ≤ r ≤ n); hai đoạn khác cặp (l, r) được tính là khác nhau.","Hãy đếm số đoạn con có tổng không lớn hơn s (tổng bằng s vẫn được tính)."],"input":["Dòng 1: hai số nguyên dương n và s.","Dòng 2: n số a_1, ..., a_n."],"output":["In một số nguyên là số đoạn con thoả mãn."],"constraints":["1 ≤ n ≤ 10^6","1 ≤ s ≤ 10^15","1 ≤ a_i ≤ 10^9"],"example":{"in":"6 10\n5 1 2 4 3 6\n","explain":["Độ dài 1: cả 6 phần tử đều ≤ 10, được 6 đoạn.","Độ dài 2: các tổng 6, 3, 6, 7, 9 đều ≤ 10, được 5 đoạn.","Độ dài 3: các tổng 8, 7, 9, 13, trong đó 3 đoạn đầu hợp lệ.","Độ dài 4: các tổng 12, 10, 15, chỉ đoạn có tổng 10 hợp lệ. Độ dài 5 trở lên không đoạn nào hợp lệ.","Tổng cộng 6 + 5 + 3 + 1 = 15."],"out":"15\n"}},"ts-G":{"statement":["Cho mảng a gồm n số nguyên dương và một số s. Đoạn con là dãy các phần tử liên tiếp a_l, ..., a_r.","Hãy tìm độ dài nhỏ nhất của một đoạn con có tổng không nhỏ hơn s (tổng bằng s vẫn hợp lệ). Nếu không có đoạn con nào như vậy thì in -1."],"input":["Dòng 1: hai số nguyên dương n và s.","Dòng 2: n số a_1, ..., a_n."],"output":["In một số nguyên: độ dài nhỏ nhất, hoặc -1 nếu không tồn tại."],"constraints":["1 ≤ n ≤ 10^6","1 ≤ s ≤ 10^15","1 ≤ a_i ≤ 10^9"],"example":{"in":"6 15\n3 1 4 1 5 9\n","explain":["Phần tử đơn lớn nhất là 9 < 15, nên độ dài 1 không được.","Độ dài 2 có các tổng 4, 5, 5, 6, 14, đều nhỏ hơn 15.","Độ dài 3 có các tổng 8, 6, 10, 15; đoạn 1 5 9 có tổng 15 ≥ 15. Đáp án là 3."],"out":"3\n"}},"ts-H":{"statement":["Cho mảng a gồm n số nguyên dương và một số s. Đoạn con là dãy các phần tử liên tiếp a_l, ..., a_r; hai đoạn khác cặp (l, r) được tính là khác nhau.","Hãy đếm số đoạn con có tổng không nhỏ hơn s (tổng bằng s vẫn được tính)."],"input":["Dòng 1: hai số nguyên dương n và s.","Dòng 2: n số a_1, ..., a_n."],"output":["In một số nguyên là số đoạn con thoả mãn."],"constraints":["1 ≤ n ≤ 10^6","1 ≤ s ≤ 10^15","1 ≤ a_i ≤ 10^9"],"example":{"in":"6 10\n3 1 4 1 5 9\n","explain":["Độ dài 1: lớn nhất là 9 < 10, không đoạn nào.","Độ dài 2: các tổng 4, 5, 5, 6, 14, chỉ đoạn 5 9 hợp lệ, được 1.","Độ dài 3: các tổng 8, 6, 10, 15, hợp lệ là 10 và 15, được 2.","Độ dài 4: các tổng 9, 11, 19, hợp lệ là 11 và 19, được 2.","Độ dài 5: các tổng 14, 20, cả hai hợp lệ, được 2. Độ dài 6: tổng 23, hợp lệ, được 1.","Tổng cộng 1 + 2 + 2 + 2 + 1 = 8."],"out":"8\n"}},"ts-I":{"statement":["Cho mảng a gồm n phần tử và một số k. Hãy đếm số đoạn con (dãy phần tử liên tiếp a_l, ..., a_r) chứa không quá k giá trị phân biệt.","Hai đoạn khác cặp (l, r) được tính là khác nhau dù nội dung giống nhau. Khi k = 0, mỗi đoạn có ít nhất một phần tử nên không đoạn nào thoả mãn và đáp án là 0."],"input":["Dòng 1: hai số nguyên n và k.","Dòng 2: n số a_1, ..., a_n."],"output":["In một số nguyên là số đoạn con thoả mãn."],"constraints":["1 ≤ n ≤ 10^6","0 ≤ k ≤ n","1 ≤ a_i ≤ 10^6"],"example":{"in":"7 2\n1 2 1 3 3 2 2\n","explain":["Đếm các đoạn kết thúc tại từng vị trí r (đoạn hợp lệ có tối đa 2 giá trị phân biệt).","r = 1: chỉ có đoạn [1], được 1. r = 2: [2] và [1 2], được 2.","r = 3: [1], [2 1], [1 2 1], được 3. r = 4 (giá trị 3): [3] và [1 3], còn [2 1 3] có 3 giá trị, được 2.","r = 5: [3], [3 3], [1 3 3], được 3. r = 6 (giá trị 2): [2], [3 2], [3 3 2], được 3 (thêm số 1 phía trước sẽ có 3 giá trị).","r = 7: [2], [2 2], [3 2 2], [3 3 2 2], được 4.","Tổng cộng 1 + 2 + 3 + 2 + 3 + 3 + 4 = 18."],"out":"18\n"}},"ts-J":{"statement":["Cho mảng a gồm n số nguyên dương và một số k. Đoạn con là dãy các phần tử liên tiếp a_l, ..., a_r. Một đoạn con được gọi là đặc biệt nếu giá trị lớn nhất trừ giá trị nhỏ nhất trong đoạn đó không vượt quá k.","Hãy đếm số đoạn con đặc biệt. Đoạn chỉ có một phần tử luôn đặc biệt vì hiệu bằng 0."],"input":["Dòng 1: hai số nguyên n và k.","Dòng 2: n số a_1, ..., a_n."],"output":["In một số nguyên là số đoạn con đặc biệt."],"constraints":["1 ≤ n ≤ 10^5","0 ≤ k ≤ 10^9","1 ≤ a_i ≤ 10^9"],"example":{"in":"6 2\n5 6 4 8 9 7\n","explain":["Độ dài 1: cả 6 đoạn đều đặc biệt.","Độ dài 2: các hiệu là 1, 2, 4, 1, 2, nên 4 đoạn đặc biệt (trừ đoạn 4 8).","Độ dài 3: đoạn 5 6 4 có hiệu 2 và đoạn 8 9 7 có hiệu 2 là hợp lệ; 6 4 8 có hiệu 4 và 4 8 9 có hiệu 5 thì không, được 2 đoạn.","Độ dài 4 trở lên đều quá lớn: 5 6 4 8 (hiệu 4), 6 4 8 9 (hiệu 5), 4 8 9 7 (hiệu 5). Không đoạn nào.","Tổng cộng 6 + 4 + 2 = 12."],"out":"12\n"}},"ts-K":{"statement":["Có n viên kẹo, viên thứ i chứa a_i đơn vị đường. Với mỗi bộ test có q câu hỏi, mỗi câu cho một số nguyên dương x: cần ăn ít nhất bao nhiêu viên kẹo (chọn tuỳ ý viên nào) để tổng lượng đường đạt ít nhất x?","Nếu ăn hết cả n viên vẫn chưa đạt x thì trả lời -1. Các câu hỏi độc lập, kẹo không bị mất đi sau mỗi câu."],"input":["Dòng 1: số bộ test t.","Với mỗi bộ test:","  Dòng 1: hai số nguyên dương n và q.","  Dòng 2: n số a_1, ..., a_n.","  Dòng 3: q số x_1, ..., x_q."],"output":["Với mỗi bộ test in một dòng gồm q số, số thứ j là đáp án của câu hỏi x_j, cách nhau bởi dấu cách."],"constraints":["1 ≤ t ≤ 10^3","1 ≤ n, q ≤ 2·10^5","1 ≤ a_i ≤ 10^4","1 ≤ x_j ≤ 2·10^9","Tổng n và tổng q trên mọi bộ test đều không vượt quá 2·10^5"],"example":{"in":"2\n5 4\n2 7 1 7 3\n7 8 14 21\n3 3\n5 5 5\n5 6 15\n","explain":["Bộ 1: các viên kẹo có đường 2, 7, 1, 7, 3, tổng cộng 20.","x = 7: ăn một viên 7 là đủ, đáp án 1.","x = 8: một viên không đủ (lớn nhất là 7), hai viên 7 + 7 = 14 đủ, đáp án 2.","x = 14: cần 7 + 7, đáp án 2. x = 21 lớn hơn tổng 20 nên đáp án -1.","Bộ 2: ba viên đều 5. x = 5 cần 1 viên, x = 6 cần 2 viên (5 + 5 = 10), x = 15 cần cả 3 viên."],"out":"1 2 2 -1\n1 2 3\n"}},"ts-L":{"statement":["Nhà máy có n máy chạy song song; máy thứ i làm xong đúng một sản phẩm sau a_i giây, rồi làm tiếp sản phẩm kế ngay lập tức. Nghĩa là sau T giây máy i đã làm được ⌊T / a_i⌋ sản phẩm.","Cần có m sản phẩm. Hãy tìm số giây nhỏ nhất để các máy cùng làm ra tổng cộng ít nhất m sản phẩm."],"input":["Dòng 1: hai số nguyên dương n và m.","Dòng 2: n số a_1, ..., a_n."],"output":["In một số nguyên là thời gian tối thiểu (giây)."],"constraints":["1 ≤ n ≤ 2·10^5","1 ≤ m ≤ 10^9","1 ≤ a_i ≤ 10^9"],"example":{"in":"3 10\n4 6 3\n","explain":["Sau T giây, máy i làm được ⌊T / a_i⌋ sản phẩm.","T = 14: 3 (máy 1) + 2 (máy 2) + 4 (máy 3) = 9 < 10, chưa đủ.","T = 15: 3 + 2 + 5 = 10, vừa đủ.","Vậy đáp án là 15."],"out":"15\n"}},"ts-M":{"statement":["Cho ba số nguyên dương a, b, n. Xét dãy tăng dần các số nguyên dương chia hết cho a hoặc chia hết cho b (số chia hết cho cả hai chỉ xuất hiện một lần). Hãy in phần tử thứ n của dãy.","Ví dụ a = 2, b = 4: dãy là 2, 4, 6, 8, 10, 12, ..., nên n = 6 cho đáp án 12."],"input":["Dòng 1: số bộ test t.","Mỗi bộ test gồm một dòng ba số nguyên dương a, b, n."],"output":["Với mỗi bộ test, in đáp án trên một dòng."],"constraints":["1 ≤ t ≤ 10^5","1 ≤ a, b, n ≤ 10^9"],"example":{"in":"3\n4 6 5\n5 5 3\n1 7 4\n","explain":["Bộ 1: các số chia hết cho 4 hoặc 6 là 4, 6, 8, 12, 16, 18, ... (12 chia hết cho cả hai nhưng chỉ tính một lần). Phần tử thứ 5 là 16.","Bộ 2: a = b = 5 nên dãy là 5, 10, 15, ...; phần tử thứ 3 là 15.","Bộ 3: mọi số đều chia hết cho 1 nên dãy là 1, 2, 3, 4, ...; phần tử thứ 4 là 4."],"out":"16\n15\n4\n"}},"ts-N":{"statement":["Cho số nguyên dương n. Tìm số nguyên x bé nhất (1 ≤ x ≤ n) mà tổng các số lẻ nằm trong [1, x] vượt hẳn tổng các số chẵn nằm trong [x + 1, n].","Nếu đoạn [x + 1, n] rỗng hoặc không có số chẵn thì tổng chẵn bằng 0.","Ví dụ n = 10: x = 8 thoả mãn vì 1 + 3 + 5 + 7 = 16 > 10, trong đó 10 là tổng các số chẵn trong [9, 10]."],"input":["Dòng 1: số bộ test t.","Mỗi bộ test gồm một dòng một số nguyên dương n."],"output":["Với mỗi bộ test, in x trên một dòng."],"constraints":["1 ≤ t ≤ 10^5","1 ≤ n ≤ 10^9"],"example":{"in":"3\n1\n7\n9\n","explain":["n = 1: với x = 1, tổng lẻ trong [1, 1] là 1, đoạn [2, 1] rỗng nên tổng chẵn là 0, và 1 > 0. Đáp án 1.","n = 7: các số chẵn là 2, 4, 6. x = 4: lẻ 1 + 3 = 4, chẵn trong [5, 7] là 6, chưa đạt. x = 5: lẻ 1 + 3 + 5 = 9, chẵn trong [6, 7] là 6, 9 > 6 đạt. Đáp án 5.","n = 9: các số chẵn là 2, 4, 6, 8. x = 5: lẻ 9 nhưng chẵn trong [6, 9] là 6 + 8 = 14, chưa đạt. x = 6: lẻ vẫn 9, chẵn trong [7, 9] là 8, 9 > 8 đạt. Đáp án 6."],"out":"1\n5\n6\n"}},"ts-O":{"statement":["Cho ba số nguyên dương a, b, c. Hãy tìm nghiệm thực x của phương trình a·x^3 + b·x = c.","Vế trái là hàm tăng nghiêm ngặt theo x với x ≥ 0 nên nghiệm dương là duy nhất."],"input":["Dòng 1: số bộ test t.","Mỗi bộ test gồm một dòng ba số nguyên dương a, b, c."],"output":["Với mỗi bộ test in nghiệm x trên một dòng, làm tròn 4 chữ số sau dấu phẩy (ví dụ 1.0000)."],"constraints":["1 ≤ t ≤ 10^3","1 ≤ a, b, c ≤ 10^6"],"example":{"in":"2\n2 3 1\n1 1 2\n","explain":["Bộ 1: x = 0.3128 cho 2·0.3128^3 + 3·0.3128 ≈ 0.99961, còn nhỏ hơn 1; x = 0.3129 cho ≈ 0.99997, vẫn hơi nhỏ hơn 1. Nghiệm thật là x ≈ 0.312908, làm tròn thành 0.3129.","Bộ 2: x = 1 cho 1 + 1 = 2 = c, nên nghiệm đúng là 1.0000."],"out":"0.3129\n1.0000\n"},"note":["Bộ chấm so sánh theo sai số: mỗi nghiệm in ra được chấp nhận nếu lệch đáp án chuẩn không quá khoảng 10^-4. Vẫn nên in đủ 4 chữ số thập phân."]},"ts-P":{"statement":["Có n vị trí xuất phát nằm trên một đường thẳng, vị trí thứ i có toạ độ a_i (các toạ độ cho không theo thứ tự). Cần xếp m xe vào m vị trí khác nhau trong số đó (mỗi vị trí nhiều nhất một xe).","Khoảng cách giữa hai xe là hiệu hai toạ độ. Hãy chọn m vị trí để khoảng cách bé nhất giữa hai xe bất kỳ đạt giá trị cực đại, rồi in giá trị cực đại đó."],"input":["Dòng 1: hai số nguyên dương n và m.","Dòng 2: n toạ độ a_1, ..., a_n."],"output":["In một số nguyên là giá trị khoảng cách nhỏ nhất lớn nhất."],"constraints":["2 ≤ m ≤ n ≤ 10^5","1 ≤ a_i ≤ 10^9"],"example":{"in":"6 3\n10 1 7 4 16 13\n","explain":["Sắp xếp toạ độ: 1 4 7 10 13 16.","Chọn 1, 7, 13 cho các khoảng cách 6 và 6, nhỏ nhất là 6. Chọn 1, 10, 16 cho 9 và 6, nhỏ nhất cũng 6.","Không thể đạt 7: bắt đầu từ 1 thì xe tiếp theo ở toạ độ ≥ 8 (là 10) rồi xe thứ ba ở toạ độ ≥ 17, không có. Bắt đầu từ 4: 4, rồi 11 trở lên (là 13), rồi 20 trở lên, không có. Vậy đáp án là 6."],"out":"6\n"},"note":["Trong các test, mọi toạ độ a_i đều đôi một khác nhau."]},"ts-Q":{"statement":["Cho bảng a có n hàng, m cột gồm các số nguyên không âm, và hai số lẻ r, c. Xét mọi bảng con gồm r hàng liên tiếp và c cột liên tiếp. Trung vị của một bảng con là phần tử đứng thứ (r·c + 1)/2 khi sắp các phần tử của nó tăng dần (r·c là số lẻ nên đó là phần tử đứng giữa).","Hãy tìm giá trị trung vị nhỏ nhất trong tất cả các bảng con."],"input":["Dòng 1: bốn số nguyên dương n, m, r, c.","n dòng tiếp theo: mỗi dòng m số a_{i1}, ..., a_{im} mô tả một hàng."],"output":["In một số nguyên là trung vị nhỏ nhất."],"constraints":["1 ≤ n, m ≤ 10^3","1 ≤ r ≤ n, 1 ≤ c ≤ m, r và c là số lẻ","0 ≤ a_{ij} ≤ 10^9"],"example":{"in":"3 4 3 3\n4 9 2 7\n8 1 6 3\n5 7 0 9\n","explain":["Có hai bảng con 3×3: cột 1 đến 3 và cột 2 đến 4.","Bảng con cột 1 đến 3 gồm 4 9 2 8 1 6 5 7 0; sắp xếp: 0 1 2 4 5 6 7 8 9, phần tử thứ 5 là 5.","Bảng con cột 2 đến 4 gồm 9 2 7 1 6 3 7 0 9; sắp xếp: 0 1 2 3 6 7 7 9 9, phần tử thứ 5 là 6.","Nhỏ nhất trong hai trung vị là 5."],"out":"5\n"}},"ts-R":{"statement":["Cho một bảng vô hạn; hàng đánh số 1, 2, 3, ... từ trên xuống, cột đánh số 1, 2, 3, ... từ trái sang phải. Ô ở hàng i, cột j ký hiệu (i, j).","Các số nguyên liên tiếp 1, 2, 3, ... được điền vào bảng theo từng đường chéo phụ. Đường chéo thứ d gồm các ô (i, j) có i + j - 1 = d, tức d ô. Mỗi đường chéo điền từ ô ở hàng d, cột 1 lên đến ô ở hàng 1, cột d (hàng giảm dần, cột tăng dần), tiếp nối số của đường chéo trước.","Phần đầu của bảng (mỗi dòng là một hàng, nhìn từ trên xuống):","  hàng 1:  1  3  6 10 15 ...","  hàng 2:  2  5  9 14 ...","  hàng 3:  4  8 13 ...","  hàng 4:  7 12 ...","  hàng 5: 11 ...","Yêu cầu 1: cho x và y, in số ghi ở ô (x, y).","Yêu cầu 2: cho z, in hàng và cột của ô chứa số z."],"input":["Dòng 1: hai số nguyên dương x, y (yêu cầu 1).","Dòng 2: số nguyên dương z (yêu cầu 2)."],"output":["Dòng 1: số ghi ở ô (x, y).","Dòng 2: hai số là hàng rồi cột của ô chứa z, cách nhau bởi dấu cách."],"constraints":["1 ≤ x, y ≤ 10^9","1 ≤ z ≤ 10^9"],"example":{"in":"3 4\n14\n","explain":["Đường chéo 1 chứa số 1; đường chéo 2 chứa 2 (hàng 2) và 3 (hàng 1); đường chéo 3 chứa 4, 5, 6; đường chéo 4 chứa 7, 8, 9, 10; đường chéo 5 chứa 11 đến 15; đường chéo 6 chứa 16 đến 21.","Ô (3, 4) có 3 + 4 - 1 = 6 nên nằm trên đường chéo 6. Đường chéo này điền 16 ở (6, 1), 17 ở (5, 2), 18 ở (4, 3), 19 ở (3, 4). Số cần tìm là 19.","Số 14 nằm trên đường chéo 5 (11 đến 15): 11 ở (5, 1), 12 ở (4, 2), 13 ở (3, 3), 14 ở (2, 4). Vậy z = 14 ở hàng 2, cột 4."],"out":"19\n2 4\n"}},"ts-S":{"statement":["Cho xâu s độ dài n gồm các chữ cái tiếng Anh thường. Xâu con liên tiếp s[l..r] = s_l s_{l+1} ... s_r được gọi là đẹp nếu nó chứa đúng k ký tự phân biệt.","Hai xâu con ứng với các cặp (l, r) khác nhau được tính riêng, kể cả khi nội dung giống nhau. Hãy đếm số xâu con đẹp của s.","Ví dụ s = abc, k = 2: có hai xâu con đẹp là ab và bc."],"input":["Dòng 1: số bộ test t.","Mỗi bộ test:","  Dòng 1: hai số nguyên dương n và k.","  Dòng 2: xâu s độ dài n."],"output":["Với mỗi bộ test, in số xâu con đẹp trên một dòng."],"constraints":["1 ≤ t ≤ 10^4","1 ≤ n ≤ 10^6","1 ≤ k ≤ 26","Tổng n trên mọi bộ test không vượt quá 10^6"],"example":{"in":"3\n6 2\naabbab\n4 1\naaba\n4 3\nabca\n","explain":["Bộ 1: s chỉ gồm a và b, nên xâu con có đúng 2 ký tự phân biệt là xâu chứa cả hai. Tổng 21 xâu con; các xâu chỉ một loại chữ nằm trong khối aa (3 xâu), bb (3 xâu), a (1), b (1) tức 8 xâu. Còn 21 - 8 = 13.","Bộ 2: k = 1, đếm xâu con toàn một loại chữ: khối aa cho 3, b cho 1, a cuối cho 1, tổng 5.","Bộ 3: k = 3, các xâu chứa đủ a, b, c là abc, bca, abca, tổng 3."],"out":"13\n5\n3\n"}},"ts-T":{"statement":["Một thành phố là lưới n × m ô, mỗi ô có toạ độ nguyên (x, y) với 1 ≤ x ≤ n, 1 ≤ y ≤ m. Cần đặt k trạm cứu hoả tại các toạ độ nguyên bất kỳ của lưới.","Xe cứu hoả đi được 8 hướng, nên khoảng cách giữa (x1, y1) và (x2, y2) là max(|x1 - x2|, |y1 - y2|).","Hãy tìm số nguyên d nhỏ nhất sao cho với cách đặt k trạm hợp lý, mọi ô của lưới đều cách ít nhất một trạm không quá d."],"input":["Dòng 1: số bộ test t.","Mỗi bộ test gồm một dòng ba số nguyên dương n, m, k."],"output":["Với mỗi bộ test, in d nhỏ nhất trên một dòng."],"constraints":["1 ≤ t ≤ 10^4","1 ≤ n, m ≤ 10^9","1 ≤ k ≤ 10^5"],"example":{"in":"4\n4 4 1\n7 7 9\n1 10 3\n1 1 1\n","explain":["Bộ 1 (lưới 4×4, 1 trạm): với d = 1 một trạm chỉ phủ tối đa vùng 3×3 = 9 ô, nhỏ hơn 16 ô. Với d = 2 đặt trạm ở (2, 2) thì ô xa nhất (4, 4) cách max(2, 2) = 2, đủ. Đáp án 2.","Bộ 2 (lưới 7×7, 9 trạm): d = 0 cần 49 trạm, không đủ. Với d = 1, đặt 9 trạm ở mọi giao điểm giữa hàng 2, 5, 7 và cột 2, 5, 7: mỗi trạm phủ vùng 3×3 quanh nó (các hàng 1 đến 3, 4 đến 6, 6 đến 8 và tương tự với cột), chín vùng này phủ kín lưới. Đáp án 1.","Bộ 3 (lưới 1×10, 3 trạm): d = 1 phủ tối đa 3 ô mỗi trạm, 9 ô < 10, không đủ. Với d = 2 đặt trạm ở cột 2, 5, 8 phủ các cột 1 đến 4, 3 đến 7, 6 đến 10, đủ. Đáp án 2.","Bộ 4 (lưới 1×1): đặt trạm ngay trên ô duy nhất, khoảng cách 0. Đáp án 0."],"out":"2\n1\n2\n0\n"}}};

// Đề viết lại: a_i, a_{i+1}, 10^5 được hiển thị thành chỉ số dưới và trên.
function fmt(s){
  // Chỉ số dưới chỉ áp cho tên biến ngắn (a_i, d_{i-1}, w_A); tên hàm như lower_bound giữ nguyên.
  return esc(s)
    .replace(/(^|[^\p{L}\p{N}_])([\p{L}][\p{L}\p{N}]?)_\{([^}]+)\}/gu,"$1$2<sub>$3</sub>")
    .replace(/(^|[^\p{L}\p{N}_])([\p{L}][\p{L}\p{N}]?)_([\p{L}\p{N}]{1,3})(?![\p{L}\p{N}_])/gu,"$1$2<sub>$3</sub>")
    .replace(/([\p{L}\p{N})\]])\^\{([^}]+)\}/gu,"$1<sup>$2</sup>")
    .replace(/([\p{L}\p{N})\]])\^([\p{L}\p{N}]+)/gu,"$1<sup>$2</sup>");
}
const paras=a=>a.map(x=>`<p${x.includes("\n")?' class="mono"':""}>${x.includes("\n")?esc(x):fmt(x)}</p>`).join("");
function specHtml(p){
  const s=SPEC[p.key];
  if(!s)return `<p class="summary">${fmt(p.sum)}</p>`;
  const pane=(title,id,text)=>`<div><div class="exhead"><h3>${title}</h3><button class="excopy" type="button" data-copy="${id}">Sao chép</button></div><pre id="${id}">${esc(text)}</pre></div>`;
  return `<div class="spec">
    <section><h3>Đề bài</h3>${paras(s.statement)}</section>
    <section><h3>Input</h3>${paras(s.input)}</section>
    <section><h3>Output</h3>${paras(s.output)}</section>
    <section><h3>Ràng buộc</h3><ul>${s.constraints.map(c=>`<li>${fmt(c)}</li>`).join("")}</ul></section>
    <section><h3>Ví dụ</h3><div class="expanes">${pane("Input ví dụ","exIn",s.example.in)}${pane("Output ví dụ","exOut",s.example.out)}</div>${paras(s.example.explain)}</section>
    ${s.note?`<section class="notebox"><h3>Lưu ý</h3>${paras(s.note)}</section>`:""}
  </div>`;
}
document.addEventListener("click",e=>{

    <p class="summary">${fmt(L.intro)}</p>
    <section><h3>Nhận ra dạng này</h3>${ul(L.recognize)}</section>
    <section><h3>Ý tưởng</h3><ol>${L.idea.map(x=>`<li>${fmt(x)}</li>`).join("")}</ol></section>
    <section><div class="exhead"><h3>Khung xương</h3><button class="excopy" type="button" data-copy="skel">Sao chép khung</button></div><pre class="code" id="skel">${esc(L.skeleton)}</pre>${ul(L.skeletonNotes)}</section>
    <section><h3>Độ phức tạp</h3>${ul(L.complexity)}</section>
    <section class="notebox"><h3>Lỗi hay gặp</h3>${ul(L.pitfalls)}</section>
    <section><h3>Bài mẫu</h3><div class="lcards">${ex}</div></section>
    <section><h3>Bài luyện trong kho (${L.practice.length})</h3><p class="saved">Sắp từ dễ đến khó. Làm bài mẫu trước rồi mới sang các bài này.</p><div class="plist">${pr}</div></section>
    <div class="lnav">${prev?`<button class="btn" type="button" data-go="${prev.id}">← ${esc(prev.title)}</button>`:"<span></span>"}${next?`<button class="btn" type="button" data-go="${next.id}">${esc(next.title)} →</button>`:""}</div>
  </div>`;
  const back=$("back");if(back)back.onclick=()=>{document.body.classList.remove("reading");window.scrollTo(0,0)};
}

function renderDetail(){
  if(LESSON[sel])return renderLesson(LESSON[sel]);
  const p=P[sel];
  if(!p){
    const s=SECS.find(x=>x.k===cur);
    $("detail").innerHTML=`<div class="sheet"><p class="crumb">${esc(s.name)}</p><h2>Chọn một bài để bắt đầu</h2><p class="summary">Mỗi phiếu có tóm tắt đề, gợi ý được giấu sẵn và ô để viết code. Đề đầy đủ cùng test mẫu nằm ở nút mở đề gốc.</p></div>`;
    return;
  }
  const l=linkFor(p),st=stOf(p),note=store.get("code:"+p.key,"");
  const also=[];
  if(p.sec.items===undefined&&p.also.length)p.also.forEach(a=>also.push(a.sec.name+" câu "+a.code));
  $("detail").innerHTML=`<div class="sheet">
    <button class="btn back" type="button" id="back">← Danh sách bài</button>
    <p class="crumb">${esc(l.label)} · ${esc(p.group)}</p>
    <h2>${esc(p.title)}</h2>
    <div class="meta"><span>${ICON.clock}${l.tl} s</span><span>${ICON.mem}${MEM[p.key]||256} MB</span><span>${ICON.tag}${LEVEL[p.lv]}</span></div>
    <h3>Trạng thái</h3>
    <div class="seg" id="seg">${Object.keys(STATUS).map(k=>`<button type="button" class="s-${k}" data-st="${k}" aria-pressed="${k===st}">${STATUS[k]}</button>`).join("")}</div>
    ${specHtml(p)}
    ${also.length?`<p class="also">Cũng xuất hiện trong: ${esc(also.join(", "))}.</p>`:""}
    ${l.id?`<div class="actions"><a class="btn" href="${url(l.id,l.code)}" target="_blank" rel="noopener">Xem đề gốc và nộp trên Codeforces ↗</a></div>`:p.guide?"":`<p class="also">Bài tự ra cho đề minh hoạ, chỉ chấm được trên trang này.</p>`}
    ${p.guide
      ?`<p class="also">Bài mẫu của bài học <button class="linkbtn" type="button" data-go="${p.lesson.id}">${esc(p.lesson.id+" · "+p.lesson.title)}</button>. Thử tự viết theo khung xương trước khi xem lời giải.</p>
        <details class="sol"><summary>Xem lời giải mẫu</summary><div class="exhead"><span></span><button class="excopy" type="button" data-copy="solcode">Sao chép</button></div><pre class="code" id="solcode">${esc(p.sol)}</pre></details>`
      :`${LEARN[p.key]?`<p class="also">Học dạng này: ${LEARN[p.key].map(L=>`<button class="linkbtn" type="button" data-go="${L.id}">${esc(L.id+" · "+L.title)}</button>`).join(", ")}</p>`:""}
        <details id="hint"><summary>Xem gợi ý</summary><p>${esc(p.hint)}</p></details>`}
    <div class="codebar"><h3>Code của bạn</h3><div><span class="saved" id="saved"></span><button class="btn" type="button" id="tpl">Chèn khung C++</button><button class="btn" type="button" id="copy">Sao chép</button></div></div>
    <textarea id="code" spellcheck="false" aria-label="Code cho bài ${esc(p.title)}" placeholder="Viết lời giải C++ ở đây.">${esc(note)}</textarea>
    <section class="judge" aria-label="Chấm bài"><div class="codebar"><h3>Chấm 10 test</h3><div><span class="score" id="jScore"></span><button class="btn primary" type="button" id="jRun">Chấm bài</button></div></div><div id="jBody"></div></section>
  </div>`;
  const ta=$("code");
  $("jRun").onclick=()=>runJudge(p,l.tl);
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();runJudge(p,l.tl)}});
  paintJudge();
  ta.addEventListener("input",()=>{store.set("code:"+p.key,ta.value);$("saved").textContent="Đã lưu"});
  ta.addEventListener("keydown",e=>{if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();ta.setRangeText("    ",ta.selectionStart,ta.selectionEnd,"end");ta.dispatchEvent(new Event("input"))}});
  $("tpl").onclick=()=>{if(!ta.value.trim()){ta.value=TEMPLATE;ta.dispatchEvent(new Event("input"))}else{$("saved").textContent="Ô code đang có nội dung nên chưa chèn"}};
  $("copy").onclick=()=>{ta.select();const ok=()=>{$("saved").textContent="Đã sao chép"};try{navigator.clipboard.writeText(ta.value).then(ok,()=>{$("saved").textContent="Hãy nhấn Ctrl+C, code đã được chọn"})}catch(e){$("saved").textContent="Hãy nhấn Ctrl+C, code đã được chọn"}};
  $("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;state[p.key]=b.dataset.st;store.set("status",state);renderDetail();renderList();renderNav()};
  const back=$("back");if(back)back.onclick=()=>{document.body.classList.remove("reading");window.scrollTo(0,0)};
}

// Chấm bài qua judge.js chạy trên máy. Trang mở bằng cách khác thì không gọi được và sẽ hướng dẫn cách mở.
let JUDGE=null,running=null,openCase=null;
const results={};
const VERDICT={WA:"Sai kết quả",TLE:"Quá thời gian",RE:"Lỗi khi chạy",OLE:"In quá nhiều",CHK:"Lỗi checker"};
async function probeJudge(){
  try{const r=await fetch("api/status",{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();JUDGE={compiler:j.compiler,keys:new Set(j.keys)}}
  catch(e){JUDGE=null}
  if(sel&&P[sel])paintJudge();
}
function setPane(parent,title,text){
  const d=document.createElement("div"),h=document.createElement("h3"),pre=document.createElement("pre");
  h.textContent=title;pre.textContent=text===""?"(trống)":text;d.append(h,pre);parent.append(d);
}
function paintJudge(){
  const body=$("jBody"),btn=$("jRun"),score=$("jScore");
  if(!body||!sel)return;
  const key=sel,r=results[key];
  body.textContent="";score.textContent="";
  if(!JUDGE){
    btn.disabled=true;
    body.innerHTML=`<p class="judge-off">Trang này chưa nối với trình chấm. Mở thư mục <code>So-luyen-DSA</code> rồi bấm đúp <code>Mo-so-luyen.bat</code>. Bản mở trực tiếp từ file và bản online không chạy được C++.</p>`;
    return;
  }
  if(!JUDGE.compiler||!JUDGE.keys.has(key)){
    btn.disabled=true;
    const p=document.createElement("p");p.className="judge-off";
    p.textContent=JUDGE.compiler?"Bài này chưa có bộ test.":"Trình chấm không tìm thấy g++ trên máy.";body.append(p);return;
  }
  btn.disabled=!!running;
  btn.textContent=running===key?"Đang chấm…":"Chấm bài";
  if(!r){const p=document.createElement("p");p.className="saved";p.style.margin="0";p.textContent="Nhấn Chấm bài hoặc Ctrl+Enter. Code sẽ được biên dịch bằng g++ và chạy trên máy này.";body.append(p);return}
  if(r.error){const p=document.createElement("p");p.className="jmsg";p.textContent=r.error;body.append(p);return}
  if(r.compile&&!r.compile.ok){
    const p=document.createElement("p");p.className="jmsg";p.textContent="Lỗi biên dịch";p.style.fontWeight="600";
    const pre=document.createElement("pre");pre.className="jlog";pre.textContent=r.compile.log;body.append(p,pre);score.textContent="0/10";return;
  }
  if(!r.compile){const p=document.createElement("p");p.className="saved";p.textContent="Đang biên dịch…";body.append(p);return}
  const pass=r.tests.filter(t=>t.verdict==="AC").length;
  score.textContent=pass+"/"+(r.total||10);
  const grid=document.createElement("div");grid.className="tests";
  r.tests.forEach(t=>{
    const b=document.createElement("button");b.type="button";b.className="tcase v-"+t.verdict;
    if(t.verdict!=="AC")b.setAttribute("aria-pressed",String(openCase===t.n));
    b.innerHTML=`<span>#${t.n}</span><b>${esc(t.verdict)}</b><span>${t.ms} ms</span>`;
    if(t.verdict!=="AC")b.onclick=()=>{openCase=openCase===t.n?null:t.n;paintJudge()};
    grid.append(b);
  });
  for(let i=r.tests.length;i<(r.total||10);i++){const b=document.createElement("div");b.className="tcase";b.innerHTML=`<span>#${i+1}</span><b>…</b>`;grid.append(b)}
  body.append(grid);
  const t=r.tests.find(x=>x.n===openCase);
  if(t){
    const m=document.createElement("p");m.className="jmsg";m.textContent="Test "+t.n+": "+VERDICT[t.verdict]+(t.msg?". "+t.msg:"");body.append(m);
    const panes=document.createElement("div");panes.className="jpanes";
    setPane(panes,"Input",t.input);setPane(panes,"Output của bạn",t.output);setPane(panes,"Đáp án tham chiếu",t.answer);body.append(panes);
  }
  if(r.done&&r.passed===r.total){const m=document.createElement("p");m.className="jmsg";m.textContent="Qua cả "+r.total+" test.";body.append(m)}
}
async function runJudge(p,tl){
  if(running||!JUDGE||!JUDGE.keys.has(p.key))return;
  const code=(store.get("code:"+p.key,"")||"").trim()&&store.get("code:"+p.key,"");
  if(!code){results[p.key]={error:"Ô code đang trống."};paintJudge();return}
  running=p.key;openCase=null;
  const r=results[p.key]={tests:[],total:10};paintJudge();
  try{
    const res=await fetch("api/judge",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({key:p.key,code,tl})});
    if(!res.ok){const j=await res.json().catch(()=>({}));r.error=j.error||"Trình chấm báo lỗi "+res.status+".";return}
    const reader=res.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf("\n"))>=0){
        const ev=JSON.parse(buf.slice(0,i));buf=buf.slice(i+1);
        if(ev.type==="compile")r.compile=ev;
        else if(ev.type==="test"){r.tests.push(ev);if(openCase===null&&ev.verdict!=="AC"&&sel===p.key)openCase=ev.n}
        else if(ev.type==="done"){r.done=true;r.passed=ev.passed;r.total=ev.total}
        else if(ev.type==="error")r.error=ev.msg;
        if(sel===p.key)paintJudge();
      }
    }
    if(!r.done&&!r.error)r.error="Kết nối với trình chấm bị ngắt giữa chừng.";
    if(r.done){
      if(r.passed===r.total)state[p.key]="ac";
      else if(stOf(p)==="none")state[p.key]="try";
      store.set("status",state);renderNav();renderList();
      if(sel===p.key)document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.st===stOf(p))));
    }
  }catch(e){r.error="Không gọi được trình chấm. Hãy kiểm tra cửa sổ Mo-so-luyen.bat còn mở."}
  finally{running=null;if(sel===p.key)paintJudge()}
}

// Đồng hồ đề thi, đếm ngược theo đúng thời lượng của contest.
let tick=null;
function tData(s){return store.get("timer:"+s.k,{left:s.min*60,since:null})}
function tLeft(d){return d.since?d.left-Math.floor((Date.now()-d.since)/1000):d.left}
function renderTimer(){
  const s=SECS.find(x=>x.k===cur);
  clearInterval(tick);
  $("timer").hidden=!s.items;
  if(!s.items)return;
  const paint=()=>{const d=tData(s),t=tLeft(d),a=Math.abs(t);
    $("clock").textContent=(t<0?"-":"")+String(Math.floor(a/3600)).padStart(2,"0")+":"+String(Math.floor(a/60)%60).padStart(2,"0")+":"+String(a%60).padStart(2,"0");
    $("clock").className=t<0?"over":"";
    $("tStart").textContent=d.since?"Tạm dừng":(t<s.min*60?"Tiếp tục":"Bắt đầu làm đề")};
  paint();tick=setInterval(paint,1000);
  $("tStart").onclick=()=>{const d=tData(s);store.set("timer:"+s.k,d.since?{left:tLeft(d),since:null}:{left:d.left,since:Date.now()});paint()};
  $("tReset").onclick=()=>{store.set("timer:"+s.k,{left:s.min*60,since:null});paint()};
}

function hashName(p){return p.key}
function go(secKey,key,push){
  // Màn hình rộng luôn mở sẵn bài đầu tiên; điện thoại ở lại danh sách.
  if(!key&&window.innerWidth>980){const s=SECS.find(x=>x.k===secKey);key=s.guide?s.lessons[0].id:secProblems(s)[0].key}
  cur=secKey;sel=key;store.set("sec",cur);
  renderNav();renderList();renderDetail();
  document.body.classList.toggle("reading",!!key);
  if(push){try{location.hash=key||secKey}catch(e){}}
  if(key){$("detail").scrollTop=0;if(window.innerWidth<=980)window.scrollTo(0,0)}
}
document.addEventListener("click",e=>{
  // Liên kết giữa bài học và bài: chuyển sang đúng mục chứa nó.
  const g=e.target.closest("[data-go]");
  if(g){const k=g.dataset.go;
    if(LESSON[k]){$("q").value="";$("f").value="all";go("hd"+LESSON[k].chapter,k,true)}
    else if(P[k]){$("q").value="";$("f").value="all";go(P[k].sec.k,k,true)}
    return}
  const n=e.target.closest(".navitem");if(n){$("q").value="";$("f").value="all";go(n.dataset.sec,null,true);return}
  const r=e.target.closest(".row");if(r){go(cur,r.dataset.key||r.dataset.lesson,true)}
});
$("q").addEventListener("input",renderList);
$("f").addEventListener("change",renderList);
function fromHash(){
  const h=location.hash.slice(1);
  if(LESSON[h]){go("hd"+LESSON[h].chapter,h,false);return}
  if(P[h]){const s=SECS.find(x=>x.k===cur);const inCur=s&&secProblems(s).includes(P[h]);go(inCur?cur:P[h].sec.k,h,false);return}
  if(SECS.some(s=>s.k===h)){go(h,null,false);return}
  go(SECS.some(s=>s.k===cur)?cur:"dq",null,false);
}
window.addEventListener("hashchange",fromHash);
fromHash();
probeJudge();
</script>
